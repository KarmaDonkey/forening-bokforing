  // Hämtar API-nyckeln från appmappen om den är nyare än den här enhetens.
  function synkaNyckel(inst) {
    var c = inst && inst.claude;
    if (!c) {
      if (lasNyckel() && od.refreshToken) delaNyckel();
      return false;
    }
    if (c.andrad > nyckelAndrad()) {
      try {
        if (c.nyckel) localStorage.setItem(NYCKEL, c.nyckel); else localStorage.removeItem(NYCKEL);
        if (c.utgar) localStorage.setItem(NYCKEL_UTGAR, c.utgar); else localStorage.removeItem(NYCKEL_UTGAR);
        localStorage.setItem(NYCKEL_ANDRAD, String(c.andrad));
      } catch (e) { /* tomt */ }
      nyckelAvvisad = false;
      return true;
    }
    if (c.andrad < nyckelAndrad()) delaNyckel();
    return false;
  }

  function lasInbjudan() { try { return JSON.parse(localStorage.getItem(INBJUDAN) || 'null'); } catch (e) { return null; } }

  // En inbjudningslänk (#revisor=…) sparas tills mottagaren har loggat in.
  function fangaInbjudan() {
    var m = location.hash.match(/#(?:revisor|inbjudan)=([A-Za-z0-9_-]+)/);
    if (!m) return;
    try {
      var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      var bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
      var data = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, function (c) { return c.charCodeAt(0); })));
      if (data && data.d && data.i) localStorage.setItem(INBJUDAN, JSON.stringify(data));
    } catch (e) { /* ogiltig länk */ }
    history.replaceState(null, '', location.pathname + location.search);
  }

  function inbjudningslank() {
    var data = { d: od.mapp.driveId, i: od.mapp.id, n: od.mapp.namn, f: store.forening.namn || '' };
    return omdirigering() + '#inbjudan=' + b64url(new TextEncoder().encode(JSON.stringify(data)).buffer);

  // Efter inloggning på en ny enhet: öppna inbjudan eller den mapp som sparats i appmappen.

    synkaNyckel(inst);
    if (inbjudan) {
      localStorage.removeItem(INBJUDAN);
      var finns = await graf('/drives/' + inbjudan.d + '/items/' + inbjudan.i, { tillat: [403, 404] });
      if (typeof finns === 'number') throw new Error('Mappen i inbjudan går inte att öppna. Be kassören dela mappen med ditt Microsoft-konto (' + (od.konto || '') + ') och skicka länken igen.');
      await valjDeladMapp({ driveId: inbjudan.d, id: inbjudan.i, namn: inbjudan.n || finns.name, agare: '' });
      return 'inbjudan';
    }
    if (!inst.mapp) return null;
    var post = await graf('/drives/' + inst.mapp.driveId + '/items/' + inst.mapp.id, { tillat: [403, 404] });
    if (typeof post === 'number') return null;
    od.mapp = inst.mapp;
    od.rot = inst.lage === 'lasare' ? null : (inst.rot || null);

  async function hanteraInloggningsretur() {
    var q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('error')) return;
    var sparad = null;
    try { sparad = JSON.parse(sessionStorage.getItem('forening-bokforing:inloggning') || 'null'); } catch (e) { /* tomt */ }
    sessionStorage.removeItem('forening-bokforing:inloggning');
    history.replaceState(null, '', omdirigering() + location.hash);
    if (q.has('error')) {
      odNu.inloggningKravs = true;
      if (!(sparad && sparad.tyst)) sattStatus('Inloggningen avbröts: ' + (q.get('error_description') || q.get('error')), true);
      return;
    }
    if (!sparad || sparad.tillstand !== q.get('state')) { sattStatus('Inloggningen kunde inte verifieras. Försök igen.', true); return; }
    await tokenAnrop({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: omdirigering(), code_verifier: sparad.verifierare });
    var jag = await graf('/me');
    od.konto = jag.userPrincipalName || jag.mail || jag.displayName || 'Microsoft-konto';
    sparaOd();
  }

  async function valjEgenMapp(sokvag) {
    sokvag = sokvag.replace(/^\/+|\/+$/g, '');
    if (!sokvag) throw new Error('Skriv sökvägen till mappen, t.ex. Föreningen/Bokföring.');
    var post = await graf('/me/drive/root:/' + enc(sokvag), { tillat: [404] });
    if (post === 404) {
      if (!window.confirm('Det finns ingen mapp ' + sokvag + ' i din OneDrive. Skapa den?')) throw new Error('Hittar ingen mapp som heter ' + sokvag + ' i din OneDrive. Kontrollera stavningen.');
      await skapaSokvag(sokvag);
      post = await graf('/me/drive/root:/' + enc(sokvag));
    }
    if (!post.folder) throw new Error(sokvag + ' är en fil, inte en mapp.');
    var driveId = post.parentReference.driveId;
    // Äldre upplägg: bokföringsfilen ligger direkt i mappen. Annars används (och skapas) appens undermappar.
    var direkt = await graf('/drives/' + driveId + '/items/' + post.id + ':/' + enc(DATAFIL) + ':', { tillat: [404] });
    if (direkt !== 404) {
      od.rot = null;
      od.mapp = { driveId: driveId, id: post.id, namn: post.name, sokvag: sokvag };
    } else {
      var data = await sakerstallUndermapp(driveId, post.id, DATAMAPP);
      od.rot = { driveId: driveId, id: post.id, namn: post.name, sokvag: sokvag };
      od.mapp = { driveId: driveId, id: data.id, namn: DATAMAPP, sokvag: sokvag + '/' + DATAMAPP };
    }
    od.lage = 'agare';
    od.eTag = null; od.senast = null; od.regETag = null; od.regMapp = null; odNu.mappar = {};
    sparaOd();
    sparaAppinstallningar({ mapp: od.mapp, rot: od.rot, lage: 'agare', regMapp: null }).catch(function () { /* frivilligt */ });
    await forstaSynk();
  }

  async function delaMappar() {
    var data = await graf('/me/drive/sharedWithMe');
    return (data.value || []).filter(function (x) { return x.remoteItem && x.remoteItem.folder; }).map(function (x) {
      return { driveId: x.remoteItem.parentReference.driveId, id: x.remoteItem.id, namn: x.remoteItem.name || x.name, agare: x.remoteItem.shared && x.remoteItem.shared.owner && x.remoteItem.shared.owner.user ? x.remoteItem.shared.owner.user.displayName : '' };
    });
  }

  async function valjDeladMapp(m) {
    od.mapp = { driveId: m.driveId, id: m.id, namn: m.namn, sokvag: m.namn + (m.agare ? ' (delad av ' + m.agare + ')' : '') };
    od.lage = 'lasare';
    od.eTag = null; od.senast = null;
    sparaOd();
    sparaAppinstallningar({ mapp: od.mapp, lage: 'lasare' }).catch(function () { /* frivilligt */ });
    await forstaSynk();
  }

  function harLokalData() { return Object.keys(store.ar).length > 0; }

  // Första gången en mapp kopplas: ladda upp det som finns här, eller hämta det som finns i OneDrive.
  async function forstaSynk() {
    var meta = await graf(iMappen(DATAFIL), { tillat: [404] });
    if (meta === 404) {
      if (od.lage !== 'agare') throw new Error('Den delade mappen innehåller ingen bokföring från appen ännu.');
      od.smutsig = true;
      sparaOd();
      await synkaUpp();
      await efterBokforing();
      return 'uppladdat';
    }
    if (harLokalData() && !lasLage()) {
      odNu.konflikt = true;
      odNu.konfliktForsta = true;
      return 'konflikt';
    }
    await hamtaOchTillampa(meta);
    await efterBokforing();
    return 'hamtat';
  }

  async function hamtaOchTillampa(meta) {
    var res = await graf(iMappen(DATAFIL) + '/content', { ra: true });
    var data = await res.json();
    if (!data || data.format !== 1 || !data.ar) throw new Error('Filen ' + DATAFIL + ' i OneDrive har ett okänt format.');
    var fel = [];
    Object.keys(data.ar).forEach(function (id) { K.valideraAr(data.ar[id]).forEach(function (f) { fel.push(id + ': ' + f); }); });
    if (fel.length) throw new Error('Bokföringen i OneDrive har fel och lästes inte in: ' + fel.slice(0, 3).join(' '));
    var aktivtNu = store.aktivt;
    var inbaddat = data.medlemsregister;
    delete data.medlemsregister;
    var reg = store.medlemsregister;
    store = data;
    // Den som bara läser får aldrig medlemsregistret. Ett register från version 1.12 flyttas ut ur bokföringsfilen.
    store.medlemsregister = inbaddat && od.lage === 'agare' && !K.registerHarData(reg) ? K.normaliseraRegister(inbaddat) : reg;
    if (!store.regler) store.regler = [];
    if (!store.motpartsregler) store.motpartsregler = [];
    LISTNYCKLAR.forEach(function (k) { if (!store[k]) store[k] = []; });
    if (aktivtNu && store.ar[aktivtNu]) store.aktivt = aktivtNu;
    if (!store.ar[store.aktivt]) store.aktivt = Object.keys(store.ar).sort().pop() || null;
    od.eTag = meta.eTag;
    od.smutsig = !!inbaddat && od.lage === 'agare' && kanSkriva();
    od.senast = new Date().toISOString();
    sparaOd();
    sparaLokalt();
    if (!lasLage()) sparaRegister();
    if (od.smutsig) schemalaggSynk();
    odNu.konflikt = false;
    odNu.konfliktForsta = false;
    await laddaLogo();
    sattStatus(lasLage() ? 'Endast läsning · hämtat från OneDrive' : 'Synkad med OneDrive');
  }

  // Hämtar senaste versionen om någon annan enhet har sparat. Ändringar här som inte hunnit sparas ger en krock.
  async function hamtaFranOneDrive() {
    await hamtaBokforing();
    await efterBokforing();
  }

  async function hamtaBokforing() {
    if (!odAnslutet() || odNu.konflikt) return;
    odNu.senastHamtat = Date.now();
    var meta = await graf(iMappen(DATAFIL), { tillat: [404] });
    if (meta !== 404) odNu.senastSparat = sparadAv(meta);
    if (meta === 404 && od.lage === 'agare') {
      // Har appens filer flyttats från en annan enhet? Då står den nya mappen i appmappen.
      var inst = await lasAppinstallningar().catch(function () { return {}; });
      if (inst.mapp && inst.mapp.id !== od.mapp.id && inst.lage !== 'lasare') {
        od.mapp = inst.mapp; od.rot = inst.rot || null; od.regMapp = inst.regMapp || null;
        od.eTag = null; od.regETag = null; odNu.mappar = {};
        sparaOd();
        meta = await graf(iMappen(DATAFIL), { tillat: [404] });
        if (meta !== 404) {
          if (od.smutsig) { odNu.konflikt = true; sattStatus('Krock med OneDrive', true); return; }
          await hamtaOchTillampa(meta);
          return;
        }
      }
    }
    if (meta === 404) {
      if (od.lage === 'agare' && kanSkriva()) { od.smutsig = true; sparaOd(); await synkaUpp(); }
      return;
    }
    if (meta.eTag === od.eTag) {
      if (od.smutsig) await synkaUpp();
      else sattStatus(lasLage() ? 'Endast läsning · aktuell' : 'Synkad med OneDrive');
      return;
    }
    if (od.smutsig) { odNu.konflikt = true; sattStatus('Krock med OneDrive', true); return; }
    await hamtaOchTillampa(meta);
  }


  // ---------- Medlemsregistret i OneDrive ----------
  // Registret ligger i en egen mapp bredvid bokföringsmappen. Den som får bokföringsmappen delad med sig
  // (t.ex. revisorn) ser därför inga namn. Bara den som äger bokföringen synkar registret.

  function regAnslutet() { return odAnslutet() && !lasLage(); }
  function iRegMappen() { return '/drives/' + od.regMapp.driveId + '/items/' + od.regMapp.id + ':/' + enc(REGFIL) + ':'; }

  async function sakerstallRegMapp() {
    if (od.lage !== 'agare') {
      // Den som har fått bokföringen delad hittar registret via rollfilen, om det har delats med hen.
      if (odNu.roller && odNu.roller.regMapp) { od.regMapp = Object.assign({}, odNu.roller.regMapp, { for: od.mapp.id }); return; }
      throw new Error('Medlemsregistret är inte delat med dig.');
    }
    if (od.regMapp && od.regMapp.for === od.mapp.id) return;
    var inst = await lasAppinstallningar().catch(function () { return {}; });
    if (inst.regMapp && inst.regMapp.for === od.mapp.id) {
      var finns = await graf('/drives/' + inst.regMapp.driveId + '/items/' + inst.regMapp.id, { tillat: [403, 404] });
      if (typeof finns !== 'number') { od.regMapp = inst.regMapp; sparaOd(); return; }
    }
    var foralder, namn;
    if (od.rot) { foralder = od.rot.id; namn = REGMAPP; }
    else {
      // Äldre upplägg: en mapp bredvid bokföringsmappen.
      var mapp = await graf('/drives/' + od.mapp.driveId + '/items/' + od.mapp.id + '?$select=id,name,parentReference');
      foralder = mapp.parentReference && mapp.parentReference.id;
      if (!foralder) throw new Error('Hittar inte mappen ovanför bokföringsmappen.');
      namn = mapp.name + ' – medlemsregister';
    }
    var ny = await sakerstallUndermapp(od.mapp.driveId, foralder, namn);
    od.regMapp = { driveId: od.mapp.driveId, id: ny.id, namn: od.rot ? od.rot.namn + '/' + namn : namn, for: od.mapp.id };
    od.regETag = null;
    sparaOd();
    sparaAppinstallningar({ regMapp: od.regMapp }).catch(function () { /* frivilligt */ });
  }

  async function synkaRegister() {
    if (!regAnslutet() || odNu.regKonflikt || !od.regSmutsig) return;
    await sakerstallRegMapp();
    var rubriker = { 'Content-Type': 'application/json' };
    if (od.regETag) rubriker['If-Match'] = od.regETag;
    var res = await graf(iRegMappen() + '/content', { method: 'PUT', headers: rubriker, body: JSON.stringify(store.medlemsregister), tillat: [412], ra: true });
    if (res.status === 412) { odNu.regKonflikt = true; return; }
    var post = await res.json();
    od.regETag = post.eTag;
    od.regSmutsig = false;
    sparaOd();
  }

  async function lasRegisterFil() {
    var res = await graf(iRegMappen() + '/content', { ra: true });
    var data = await res.json();
    if (!data || data.format !== 'foreningsbokforing-medlemsregister') throw new Error('Medlemsregistret i OneDrive har ett okänt format.');
    return K.normaliseraRegister(data);
  }

  function tillampaRegister(reg, eTag) {
    store.medlemsregister = reg;
    senastRegJson = JSON.stringify(reg);
    try { localStorage.setItem(REG_LAGRING, senastRegJson); } catch (e) { /* tomt */ }
    od.regETag = eTag;
    od.regSmutsig = false;
    odNu.regKonflikt = false;
    sparaOd();
  }

  async function hamtaRegister() {
    if (!odAnslutet() || odNu.regKonflikt) return;
    // Rollen avgör: utan behörighet till registret läses det inte, och en gammal kopia tas bort.
    if (od.lage !== 'agare' && odNu.roller && !K.behorighet(K.rollerFor(odNu.roller, mig())).reg) {
      odNu.regLas = false;
      if (K.registerHarData(store.medlemsregister)) { store.medlemsregister = K.tomtRegister(); senastRegJson = null; try { localStorage.removeItem(REG_LAGRING); } catch (e) { /* tomt */ } }
      return;
    }
    try { await sakerstallRegMapp(); } catch (e) { odNu.regLas = false; return; }
    var meta = await graf(iRegMappen(), { tillat: [403, 404] });
    if (meta === 403 || (meta === 404 && od.lage !== 'agare')) { odNu.regLas = false; return; }
    odNu.regLas = true;
    if (meta === 404) {
      if (K.registerHarData(store.medlemsregister) && kanSkriva()) { od.regSmutsig = true; od.regETag = null; sparaOd(); await synkaRegister(); }
      return;
    }
    if (meta.eTag === od.regETag) { if (od.regSmutsig && kanSkriva()) await synkaRegister(); return; }
    var fjarr = await lasRegisterFil();
    if (od.regSmutsig && kanSkriva() && K.registerHarData(store.medlemsregister) && JSON.stringify(fjarr) !== JSON.stringify(store.medlemsregister)) {
      odNu.regKonflikt = true;
      return;
    }
    tillampaRegister(fjarr, meta.eTag);
  }

  function regKonfliktBanner() {
    if (!odNu.regKonflikt) return '';
    return '<div class="card fel" role="alert"><strong>Medlemsregistret har ändrats i OneDrive från en annan enhet samtidigt som det ändrats här.</strong>' +
      '<p>Välj vilken version som ska gälla. Den andra försvinner, så spara gärna en kopia av den här versionen först.</p>' +
      '<div class="row"><button class="btn btn-small" data-action="od-reg-onedrive">Använd versionen i OneDrive</button>' +
      '<button class="btn btn-secondary btn-small" data-action="od-reg-behall">Behåll den här webbläsarens version</button>' +
      '<button class="btn btn-secondary btn-small" data-action="exportera-register">Spara en kopia av den här versionen</button></div></div>';
  }

  function schemalaggSynk() {
    clearTimeout(odNu.timer);
    sattStatus('Ej sparat i OneDrive ännu…');
    odNu.timer = setTimeout(function () { synkaUpp().then(render, function () { render(); }); }, 1500);
  }

  async function synkaUpp() {
    if (!odAnslutet() || lasLage() || odNu.konflikt) return;
    if (odNu.synkar) { odNu.igen = true; return; }
    odNu.synkar = true;
    sattStatus('Sparar i OneDrive…');
    try {
      await synkaFiler();
      if (od.smutsig) {
        var rubriker = { 'Content-Type': 'application/json' };
        if (od.eTag) rubriker['If-Match'] = od.eTag;
        var res = await graf(iMappen(DATAFIL) + '/content', { method: 'PUT', headers: rubriker, body: JSON.stringify(bokforingsdata()), tillat: [412], ra: true });
        if (res.status === 412) { odNu.konflikt = true; sattStatus('Krock med OneDrive', true); return; }
        var post = await res.json();
        od.eTag = post.eTag;
        od.smutsig = false;
        od.senast = new Date().toISOString();
        odNu.senastSparat = sparadAv(post);
        sparaOd();
      }
      try { await synkaRegister(); odNu.regFel = null; }
      catch (e) { odNu.regFel = 'Medlemsregistret kunde inte sparas i OneDrive: ' + e.message; }
      sattStatus(odNu.regKonflikt ? 'Krock i medlemsregistret' : 'Synkad med OneDrive', odNu.regKonflikt);
    } catch (err) {
      sattStatus('Kunde inte spara i OneDrive: ' + err.message, true);
      throw err;
    } finally {
      odNu.synkar = false;
      if (odNu.igen) { odNu.igen = false; setTimeout(function () { synkaUpp().then(render, function () { render(); }); }, 200); }
    }
  }

  async function laddaUpp(rel, blob) {
    var post;
    if (blob.size <= 4 * 1024 * 1024) {
      post = await graf(iMappen(rel) + '/content?@microsoft.graph.conflictBehavior=rename', { method: 'PUT', body: blob });
    } else {
      var session = await graf(iMappen(rel) + '/createUploadSession', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'rename' } })
      });
      var res = await fetch(session.uploadUrl, { method: 'PUT', headers: { 'Content-Range': 'bytes 0-' + (blob.size - 1) + '/' + blob.size }, body: blob });
      if (!res.ok) throw new Error('Uppladdningen av en stor fil misslyckades.');
      post = await res.json();
    }
    return post;
  }

  async function sakerstallMapp(rel) {
    if (!rel) return od.mapp.id;
    if (odNu.mappar[rel]) return odNu.mappar[rel];
    var post = await graf(iMappen(rel), { tillat: [404] });
    if (post === 404) {
      var foralder = await sakerstallMapp(katalog(rel));
      post = await graf('/drives/' + od.mapp.driveId + '/items/' + foralder + '/children', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: filnamnAv(rel), folder: {}, '@microsoft.graph.conflictBehavior': 'fail' }), tillat: [409]
      });
      if (post === 409) post = await graf(iMappen(rel));
    }
    odNu.mappar[rel] = post.id;
    return post.id;
  }

  async function flytta(itemId, rel) {
    var foralder = await sakerstallMapp(katalog(rel));
    return graf('/drives/' + od.mapp.driveId + '/items/' + itemId, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: filnamnAv(rel), parentReference: { id: foralder }, '@microsoft.graph.conflictBehavior': 'rename' })
    });
  }

  // Lägger upp nya filer och flyttar bokförda underlag till Verifikationer med V-nummer först.
  async function synkaFiler() {
    var andrat = false;
    var arIds = Object.keys(store.ar);
    for (var i = 0; i < arIds.length; i++) {
      var arId = arIds[i];
      var lista = (store.ar[arId].underlag || []).slice();
      for (var j = 0; j < lista.length; j++) {
        var u = lista[j];
        var mal = K.underlagSokvag(arId, u);
        if (!u.odId) {
          var rec = await hamtaFil(u.id);
          if (!rec) continue;
          var post = await laddaUpp(mal, rec.blob);
          store.ar[arId] = K.andraUnderlag(store.ar[arId], u.id, { odId: post.id, odMal: mal });
          andrat = true;
        } else if (u.odMal !== mal) {
          await flytta(u.odId, mal);
          store.ar[arId] = K.andraUnderlag(store.ar[arId], u.id, { odMal: mal });
          andrat = true;
        }
      }
    }
    for (var k = 0; k < store.dokument.length; k++) {
      var d = store.dokument[k];
      if (d.typ !== 'kvitto' || d.odId || d.makulerad) continue;
      var kvittoBlob = await skapaDokumentPdf(d).catch(function () { return null; });
      if (!kvittoBlob) continue;
      var kvitto = await laddaUpp(K.kvittoSokvag(d), kvittoBlob);
      d.odId = kvitto.id;
      andrat = true;
    }
    if (store.forening.harLogotyp && !store.forening.logoOdId) {
      var logo = await hamtaFil('logotyp');
      if (logo) {
        var lp = await laddaUpp('Föreningsbokföring logotyp.' + ((logo.blob.type || '').split('/')[1] || 'png'), logo.blob);
        store.forening.logoOdId = lp.id;
        await sparaFil('logotyp', logo.blob, lp.id);
        andrat = true;
      }
    }
    if (andrat) sparaLokalt();
  }

  async function hamtaFilFranOneDrive(id) {
    if (revision) return null;
    if (!odAnslutet()) return null;
    var u = null;
    Object.keys(store.ar).some(function (arId) { u = (store.ar[arId].underlag || []).find(function (x) { return x.id === id; }) || null; return !!u; });
    if (!u || !u.odId) return null;
    var res = await graf('/drives/' + od.mapp.driveId + '/items/' + u.odId + '/content', { ra: true });
    var blob = await res.blob();
    await sparaFil(id, blob, u.filnamn).catch(function () { /* cache är frivillig */ });
    return { blob: blob };
  }


  async function sakerstallUndermapp(driveId, foralderId, namn) {
    var ny = await graf('/drives/' + driveId + '/items/' + foralderId + '/children', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: namn, folder: {}, '@microsoft.graph.conflictBehavior': 'fail' }), tillat: [409]
    });
    if (ny === 409) ny = await graf('/drives/' + driveId + '/items/' + foralderId + ':/' + enc(namn) + ':');
    return ny;
  }

  // Mappen på sökvägen i min OneDrive; mappar som saknas skapas.
  async function skapaSokvag(sokvag) {
    var rot = await graf('/me/drive/root');
    var driveId = rot.parentReference && rot.parentReference.driveId ? rot.parentReference.driveId : od.mapp.driveId;
    var id = rot.id;
    var delar = sokvag.split('/').filter(Boolean);
    for (var i = 0; i < delar.length; i++) id = (await sakerstallUndermapp(driveId, id, delar[i])).id;
    return { driveId: driveId, id: id, namn: delar[delar.length - 1] };
  }

  // Flyttar appens egna filer (bokföringen, logotypen, underlagen, kvittona och medlemsregistret) till en ny mapp
  // med undermapparna Bokföring och underlag och Medlemsregister. Andra filer i den gamla mappen rörs inte.
  async function flyttaAppensFiler(sokvag) {
    sokvag = sokvag.replace(/^\/+|\/+$/g, '');
    if (!sokvag) throw new Error('Skriv sökvägen till den nya mappen, t.ex. Föreningen/Föreningsbokföring.');
    if (odNu.konflikt || odNu.regKonflikt) throw new Error('Lös krocken med OneDrive först.');
    var gammalSokvag = (od.mapp.sokvag || '').replace(/\/+$/, '');
    if (gammalSokvag && (sokvag === gammalSokvag || sokvag.indexOf(gammalSokvag + '/') === 0)) throw new Error('Den nya mappen kan inte ligga i bokföringsmappen.');
    if (od.rot && sokvag === od.rot.sokvag) throw new Error('Appens filer ligger redan i ' + sokvag + '.');
    sattStatus('Sparar innan flytten…');
    await synkaUpp();
    if (od.smutsig || od.regSmutsig) throw new Error('Allt kunde inte sparas i OneDrive. Försök igen.');
    sattStatus('Flyttar…');
    var rot = await skapaSokvag(sokvag);
    var finns = await graf('/drives/' + rot.driveId + '/items/' + rot.id + ':/' + enc(DATAMAPP + '/' + DATAFIL) + ':', { tillat: [404] });
    if (finns !== 404) throw new Error('Det finns redan en bokföring från appen i ' + sokvag + '.');
    var data = await sakerstallUndermapp(rot.driveId, rot.id, DATAMAPP);
    var cache = {};
    var dir = function (rel) { return rel.indexOf('/') < 0 ? '' : katalog(rel); };
    var mappI = async function (rel) {
      if (!rel) return data.id;
      if (cache[rel]) return cache[rel];
      var f = await mappI(dir(rel));
      cache[rel] = (await sakerstallUndermapp(rot.driveId, f, filnamnAv(rel))).id;
      return cache[rel];
    };
    var flyttaTill = async function (itemId, rel) {
      var f = await mappI(dir(rel));
      return graf('/drives/' + rot.driveId + '/items/' + itemId, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: filnamnAv(rel), parentReference: { id: f }, '@microsoft.graph.conflictBehavior': 'rename' })
      });
    };
    var antal = 0;
    var arIds = Object.keys(store.ar);
    for (var i = 0; i < arIds.length; i++) {
      var lista = store.ar[arIds[i]].underlag || [];
      for (var j = 0; j < lista.length; j++) {
        if (!lista[j].odId) continue;
        await flyttaTill(lista[j].odId, lista[j].odMal || K.underlagSokvag(arIds[i], lista[j]));
        antal++;
      }
    }
    for (var k = 0; k < store.dokument.length; k++) {
      var d = store.dokument[k];
      if (d.odId) { await flyttaTill(d.odId, K.kvittoSokvag(d)); antal++; }
    }
    if (store.forening.logoOdId) {
      var logo = await graf('/drives/' + od.mapp.driveId + '/items/' + store.forening.logoOdId, { tillat: [404] });
      if (logo !== 404) { await flyttaTill(logo.id, logo.name); antal++; }
    }
    // Medlemsregistret
    var regMal = await sakerstallUndermapp(rot.driveId, rot.id, REGMAPP);
    if (od.regMapp) {
      var regFil = await graf(iRegMappen(), { tillat: [404] });
      if (regFil !== 404) {
        var flyttad = await graf('/drives/' + rot.driveId + '/items/' + regFil.id, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: REGFIL, parentReference: { id: regMal.id } })
        });
        od.regETag = flyttad.eTag;
        // Registret pekas om direkt, så att ett avbrott senare inte gör att det skapas på nytt i den gamla mappen.
        od.regMapp = { driveId: rot.driveId, id: regMal.id, namn: rot.namn + '/' + REGMAPP, for: od.mapp.id };
        sparaOd();
        antal++;
      }
    }
    var rollfil = await graf(iMappen(ROLLFIL), { tillat: [404] });
    if (rollfil !== 404) { var rf = await flyttaTill(rollfil.id, ROLLFIL); odNu.rollerETag = rf.eTag; antal++; }
    // Bokföringsfilen sist, så att den gamla mappen gäller tills allt annat är flyttat.
    var meta = await graf(iMappen(DATAFIL));
    var nyMeta = await flyttaTill(meta.id, DATAFIL);
    antal++;
    var gammal = od.mapp.sokvag || od.mapp.namn;
    od.rot = { driveId: rot.driveId, id: rot.id, namn: rot.namn, sokvag: sokvag };
    od.mapp = { driveId: rot.driveId, id: data.id, namn: DATAMAPP, sokvag: sokvag + '/' + DATAMAPP };
    od.regMapp = { driveId: rot.driveId, id: regMal.id, namn: rot.namn + '/' + REGMAPP, for: data.id };
    od.eTag = nyMeta.eTag;
    odNu.mappar = {};
    sparaOd();
    await sparaAppinstallningar({ mapp: od.mapp, rot: od.rot, lage: 'agare', regMapp: od.regMapp }).catch(function () { /* frivilligt */ });
    sattStatus('Synkad med OneDrive');
    return { antal: antal, gammal: gammal };
  }

  function kopplaFranOneDrive() {
    clearTimeout(odNu.timer);
    od = { clientId: od.clientId, refreshToken: null, konto: null, mapp: null, lage: null, eTag: null, senast: null, smutsig: false };
    odNu.token = null;
    odNu.mappar = {};
    odNu.konflikt = false;
    odNu.regKonflikt = false;
    sparaOd();
    sattStatus('');
  }

  // Gör appen installerbar på hemskärmen när den körs från en webbadress.
  function laggTillManifest() {
    if (location.protocol === 'file:') return;
    var l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'manifest.json';
    document.head.appendChild(l);
  }

  var qrLaddas = null;
  function laddaQr() {
    if (window.qrcode) return Promise.resolve();
    if (!qrLaddas) {
      qrLaddas = new Promise(function (ok, fel) {
        var sk = document.createElement('script');
        sk.src = QR_URL;
        sk.onload = ok;
        sk.onerror = function () { qrLaddas = null; fel(new Error('QR-koden kunde inte laddas. Använd länken i stället.')); };
        document.head.appendChild(sk);
      });
    }
    return qrLaddas;
  }

  function ritaQr() {
    var el = document.getElementById('qrKod');
    if (!el) return;
    laddaQr().then(function () {
      var qr = window.qrcode(0, 'M');
      qr.addData(el.dataset.text);
      qr.make();
      el.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2, scalable: true });
    }).catch(function (err) { el.textContent = err.message; });
  }

  // ---------- Inläsning ----------

  function arForDatum(d) {
    if (!d) return null;
    return Object.keys(store.ar).find(function (id) { return !store.ar[id].grovkopia && store.ar[id].start <= d && d <= store.ar[id].slut; }) || null;
  }

  // Det aktiva året, eller det senaste vanliga året om det aktiva är en arkivkopia.
  function oppetAr() {
    if (store.ar[store.aktivt] && !store.ar[store.aktivt].grovkopia) return store.aktivt;
    return Object.keys(store.ar).filter(function (id) { return !store.ar[id].grovkopia; }).sort().pop() || store.aktivt;
  }

  function logga(text, fel) { logg.unshift({ text: text, fel: !!fel }); logg = logg.slice(0, 12); }

  // Kopplar bankrader till verifikationer som redan bokförts mot banken. Returnerar antalet.
  function kopplaEfterhand() {
    var antalKopplade = 0;
    Object.keys(store.ar).forEach(function (id) {
      if (store.ar[id].grovkopia) return;
      var res = K.kopplaBokforda(store.ar[id]);
      store.ar[id] = res.ar;
      antalKopplade += res.kopplade.length;
    });
    return antalKopplade;
  }

  // Lär in motpart -> konto från en bokförd verifikation med ett underlag, och uppdatera väntande underlag.
  function larAvUnderlag(ar, underlagIds, rader) {
    if (!underlagIds || underlagIds.length !== 1) return;
    var u = (ar.underlag || []).find(function (x) { return x.id === underlagIds[0]; });
    var konto = K.kontoAttLara(rader);
    if (!u || !u.motpart || !konto) return;
    store.motpartsregler = K.larMotpart(store.motpartsregler, u.motpart, konto);
    tillampaRegler();
  }

  function tillampaRegler() {
    Object.keys(store.ar).forEach(function (id) {
      if (id !== store.aktivt) store.ar[id] = K.tillampaMotpartsregler(store.ar[id], store.motpartsregler);
    });
  }

  function kontoKallaText(u) {
    if (u.kontoKalla === 'faktura') return 'från fakturan';
    return u.kontoKalla === 'inlart' ? 'som förra gången' : u.kontoKalla === 'manuell' ? 'ditt val' : u.kontoKalla === 'claude' ? 'Claudes förslag' : '';
  }

  function importeraRader(rader) {
    var nya = 0, dubbletter = 0;
    Object.keys(store.ar).forEach(function (id) {
      if (store.ar[id].grovkopia) return;
      var res = K.importeraBankrader(store.ar[id], rader);
      store.ar[id] = res.ar;
      nya += res.nya;
      dubbletter += res.dubbletter;
    });
    var utanfor = rader.filter(function (r) { return !arForDatum(r.datum); });
    var kopplade = kopplaEfterhand();
    spara();
    var text = antal(nya, 'ny banktransaktion', 'nya banktransaktioner') + (dubbletter ? ', ' + dubbletter + ' fanns redan' : '') + '.';
    if (kopplade) text += ' ' + antal(kopplade, 'av dem var redan bokförd och kopplades', 'av dem var redan bokförda och kopplades') + ' till sin verifikation.';
    if (utanfor.length) {
      var ar = Array.from(new Set(utanfor.map(function (r) { return r.datum.slice(0, 4); }))).join(', ');
      text += ' ' + antal(utanfor.length, 'rad gäller', 'rader gäller') + ' år som inte är upplagda (' + ar + ') och hoppades över.';
    }
    return text;
  }

  function importeraBanktext(text, namn) {
    var res = K.parseBankfil(text);
    if (!res.rader.length) throw new Error((namn ? namn + ': ' : '') + 'hittade inga transaktioner. ' + res.varningar.slice(0, 2).join(' '));
    logga((namn ? namn + ': ' : '') + importeraRader(res.rader));
    res.varningar.slice(0, 5).forEach(function (v) { logga(v, true); });
  }

  function sakertFilnamn(namn) { return String(namn).replace(/[\\/:*?"<>|]+/g, '_').slice(-120) || 'underlag'; }

  async function tolkaFil(fil) {
    var arNu = aktivt();
    var arPdf = fil.type === 'application/pdf' || /\.pdf$/i.test(fil.name);
    var block = arPdf
      ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: await blobTillBase64(fil) } }
      : await bildBlock(fil);
    var t = await tolkaMedClaude(arNu, block);
    var id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var n = K.normaliseraTolkning(t, { id: id, filnamn: sakertFilnamn(fil.name) });
    await sparaFil(id, fil, n.underlag.filnamn);
    if (n.bankrader) {
      setAktivt(K.laggTillUnderlag(aktivt(), n.underlag));
      logga(fil.name + ' (kontoutdrag): ' + importeraRader(n.bankrader));
    } else {
      var u = n.underlag;
      var regel = K.hittaMotpartsregel(store.motpartsregler, u.motpart);
      if (regel) { u.foreslagetKonto = regel.konto; u.kontoKalla = 'inlart'; }
      var arId = arForDatum(u.forfallodatum || u.datum) || oppetAr();
      store.ar[arId] = K.laggTillUnderlag(store.ar[arId], u);
      spara();
      logga(fil.name + ': ' + (u.motpart || 'okänd motpart') + ', ' + kr(u.belopp) + ' kr' +
        (u.foreslagetKonto ? ', konto ' + u.foreslagetKonto + ' ' + K.kontonamn(store.ar[arId], u.foreslagetKonto) + ' (' + kontoKallaText(u) + ')' : ', inget konto föreslaget') +
        (arId !== store.aktivt ? ' (lagt i ' + arId + ')' : '') + '.');
    }
    n.varningar.forEach(function (v) { logga(fil.name + ': ' + v, true); });
  }

  async function lasInFiler(filer) {
    for (var i = 0; i < filer.length; i++) {
      var fil = filer[i];
      arbetar = 'Läser ' + fil.name + (filer.length > 1 ? ' (' + (i + 1) + ' av ' + filer.length + ')' : '') + '…';
      render();
      try {
        if (/\.(csv|txt|tsv|skv)$/i.test(fil.name) || /^text\//.test(fil.type)) importeraBanktext(await lasText(fil), fil.name);
        else if (/\.xlsx?m?$/i.test(fil.name)) throw new Error('Excel-filer kan inte läsas direkt. Exportera kontoutdraget som CSV, eller markera raderna i Excel och klistra in dem här.');
        else if (fil.type === 'application/pdf' || /\.pdf$/i.test(fil.name) || /^image\//.test(fil.type)) await tolkaFil(fil);
        else throw new Error('okänd filtyp.');
      } catch (err) {
        logga(fil.name + ': ' + claudeFel(err), true);
      }
    }
    arbetar = null;
    render();
  }

  // Väntande underlag i andra räkenskapsår, t.ex. en decemberfaktura som betalas i januari.
  function andraArsUnderlag() {
    var ut = [];
    Object.keys(store.ar).forEach(function (id) {
      if (id === store.aktivt) return;
      K.oppnaUnderlag(store.ar[id]).forEach(function (u) { ut.push({ arId: id, underlag: u }); });
    });
    return ut;
  }

  function forslagMedVal(ar, rad) {
    var val = inkorgVal[rad.id] || {};
    var f = K.forslagForBankrad(ar, rad, store.regler, val.underlagIds ? { underlagIds: val.underlagIds, ungefar: !!val.ungefar } : undefined);
    if (val.konto != null && f.rader.length === 2) f.rader[1].konto = val.konto.trim();
    if (val.text != null) f.text = val.text;
    // Inbetalningar och bankavgifter syns i bankutdraget och behöver inget eget underlag.
    if (!f.underlagIds.length && f.rader.length === 2 && (rad.belopp > 0 || f.rader[1].konto === '6570')) f.underlagKommentar = 'Bankutdrag';
    // Terminsavgift: ett känt Swish-nummer med rätt belopp, eller det du valt i panelen.
    var a = val.konto == null && f.kalla !== 'underlag' ? avgiftForRad(rad) : null;
    if (a && a.poster) {
      try {
        if (!K.giltigtTerminId(a.termin)) throw new Error('Terminen ska skrivas som VT-27 eller HT-26.');
        f.rader = K.avgiftsrader(reg(), a.poster, rad.konto, rad.belopp);
        f.text = val.text != null ? val.text : K.avgiftstext(reg(), a.termin, a.poster);
        f.kalla = 'avgift';
        f.underlagIds = [];
        f.underlagKommentar = 'Bankutdrag';
        f.avgift = a;
      } catch (e) { f.avgiftFel = e.fel ? e.fel.join(' ') : e.message; if (a.manuell) f.rader = [f.rader[0], { konto: '', belopp: -rad.belopp }]; }
    }
    f.komplett = f.rader.every(function (r) { return ar.kontoplan.some(function (k) { return k.nr === r.konto; }); });
    return f;
  }

  function larAv(rad, rader) {
    if (rader.length === 2) store.regler = K.larRegel(store.regler, rad.text, rad.belopp, rader[1].konto);
  }

  function bokforBankrad(ar, rad) {
    var f = forslagMedVal(ar, rad);
    if (!f.komplett) throw new Error('Välj konto för ' + rad.datum + ' ' + rad.text + ' först.');
    var res = K.bokforKopplat(ar, {
      datum: f.datum, text: f.text, rader: f.rader, underlagKommentar: f.underlagKommentar, registrerad: new Date().toISOString()
    }, { bankradId: rad.id, underlagIds: f.underlagIds });
    if (f.avgift) {
      var r = K.registreraBetalning(reg(), {
        datum: rad.datum, belopp: rad.belopp, termin: f.avgift.termin, nyckel: f.avgift.betalare.nyckel,
        arId: store.aktivt, ver: res.verifikation.nr, bankradId: rad.id, poster: f.avgift.poster
      });
      if (f.avgift.komIhag) r = K.kopplaBetalare(r, f.avgift.betalare, f.avgift.poster.map(function (p) { return p.medlem; }));
      store.medlemsregister = r;
      delete avgiftUtkast[rad.id];
    } else larAv(rad, f.rader);
    store.ar[store.aktivt] = res.ar;
    larAvUnderlag(res.ar, f.underlagIds, f.rader);
    res.ar = K.tillampaMotpartsregler(res.ar, store.motpartsregler);
    delete inkorgVal[rad.id];
    return res;
  }

  function radTillUtkast(r) {
    return { konto: r.konto, debet: r.belopp > 0 ? K.formatBelopp(r.belopp) : '', kredit: r.belopp < 0 ? K.formatBelopp(-r.belopp) : '' };
  }

  // ---------- Fakturor och kvitton ----------

  function nyttId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function hitta(lista, id) { return (store[lista] || []).find(function (x) { return x.id === id; }) || null; }
  function rader(text) { return String(text || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean); }

  var logoSaknas = false;

  // Logotypen ligger i webbläsaren och, när appen är kopplad, i OneDrive. Den lokala kopian märks
  // med OneDrive-filens id så att en ny logotyp från en annan enhet hämtas igen.
  function laddaLogo() {
    logoSaknas = false;
    if (!store.forening.harLogotyp) { logoUrl = null; return Promise.resolve(); }
    var odId = store.forening.logoOdId;
    return hamtaFil('logotyp').then(function (rec) {
      var inaktuell = rec && odId && rec.namn !== odId && rec.namn !== 'lokal';
      if ((rec && !inaktuell) || !odId || !odAnslutet()) return rec;
      return graf('/drives/' + od.mapp.driveId + '/items/' + odId + '/content', { ra: true })
        .then(function (res) { return res.blob(); })
        .then(function (blob) { return sparaFil('logotyp', blob, odId).then(function () { return { blob: blob }; }); })
        .catch(function () { return rec || null; });
    }).then(function (rec) {
      if (!rec) { logoUrl = null; logoSaknas = true; return; }
      return blobTillBase64(rec.blob).then(function (b64) { logoUrl = 'data:' + (rec.blob.type || 'image/png') + ';base64,' + b64; });
    }).catch(function () { logoUrl = null; });
  }

  // Föreningens logotyp som ikon i webbläsarfliken (och som ikon på hemskärmen), när den finns.
  var IKON_STANDARD = null;
  var ikonForLogo = null;
  function sattIkon() {
    var el = document.getElementById('ikon');
    if (!IKON_STANDARD) IKON_STANDARD = el.href;
    if (ikonForLogo === logoUrl) return;
    ikonForLogo = logoUrl;
    if (!logoUrl) { el.href = IKON_STANDARD; return; }
    var bild = new Image();
    bild.onload = function () {
      // Rund ikon i 128 px med vit bakgrund, så att den syns i både ljusa och mörka flikar.
      var c = document.createElement('canvas');
      c.width = c.height = 128;
      var g = c.getContext('2d');
      g.beginPath(); g.arc(64, 64, 64, 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill(); g.clip();
      var skala = Math.min(120 / bild.width, 120 / bild.height);
      var w = bild.width * skala, h = bild.height * skala;
      g.drawImage(bild, (128 - w) / 2, (128 - h) / 2, w, h);
      el.href = c.toDataURL('image/png');
      var apple = document.getElementById('ikon-apple');
      if (!apple) { apple = document.createElement('link'); apple.rel = 'apple-touch-icon'; apple.id = 'ikon-apple'; document.head.appendChild(apple); }
      apple.href = el.href;
    };
    bild.src = logoUrl;
  }

  function nyttDokUtkast(typ) {
    var d = idag();
    return {
      typ: typ, mottagareId: '', mottagare: { namn: '', foretag: '', adress: '', epost: '', telefon: '' },
      adressId: store.adresser[0] ? store.adresser[0].id : '', kontaktId: store.kontakter[0] ? store.kontakter[0].id : '',
      datum: d, forfallodatum: K.laggTillDagar(d, 30), betaldDatum: typ === 'kvitto' ? d : '', betalsatt: typ === 'kvitto' ? 'Swish' : '',
      rader: [{ artikelId: '', antal: '1', beskrivning: '', pris: '', konto: '' }], verifikation: null
    };
  }

  function utkastTillDokument() {
    var fel = [];
    var radlista = dokUtkast.rader.filter(function (r) { return r.beskrivning || r.pris; }).map(function (r, i) {
      var pris = 0;
      try { pris = K.parseBelopp(r.pris || '0'); } catch (e) { fel.push('Rad ' + (i + 1) + ': ' + e.message); }
      return { antal: Number(String(r.antal).replace(',', '.')), beskrivning: r.beskrivning.trim(), pris: pris, konto: (r.konto || '').trim() };
    });
    var dok = {
      typ: dokUtkast.typ, datum: dokUtkast.datum,
      forfallodatum: dokUtkast.typ === 'faktura' ? dokUtkast.forfallodatum : '',
      mottagare: Object.assign({}, dokUtkast.mottagare), rader: radlista
    };
    if (dokUtkast.typ === 'kvitto') { dok.betaldDatum = dokUtkast.betaldDatum; dok.betalsatt = dokUtkast.betalsatt; }
    return { fel: fel.concat(K.valideraDokument(dok)), dok: dok };
  }

  function dokStatus(d) {
    if (d.makulerad) return { text: 'Makulerad', klass: 'muted' };
    if (d.typ === 'kvitto') return { text: d.verifikation ? 'Utfärdat (ver ' + d.verifikation.nr + ')' : 'Utfärdat', klass: '' };
    var ar = store.ar[d.arId];
    var u = ar && (ar.underlag || []).find(function (x) { return x.id === d.underlagId; });
    if (u && u.verifikation != null) return { text: 'Betald (ver ' + u.verifikation + ')', klass: 'ok' };
    if (d.forfallodatum < idag()) return { text: 'Förfallen', klass: 'fel' };
    return { text: 'Väntar på betalning', klass: '' };
  }

  // Fakturans eller kvittots innehåll, i samma upplägg som föreningens Excelmall.
  function dokumentInnehall(d) {
    var f = d.forening || {};
    var arF = d.typ === 'faktura';
    var meta = arF
      ? [['Fakturadatum', d.datum], ['Fakturanr', d.nummer], ['Förfallodatum', d.forfallodatum]]
      : [['Kvittonr', d.nummer], ['Utskrivningsdatum', d.datum], ['Betaldatum', d.betaldDatum], ['Betalsätt', d.betalsatt], ['Org.nummer', f.orgnr]];
    var m = d.mottagare || {}, ref = d.referens || {};
    var html = '<div class="dok"><div class="dok-huvud"><div>' +
      (d.logo ? '<img class="dok-logo" src="' + esc(d.logo) + '" alt="">' : '') +
      '<div class="dok-forening">' + esc(f.namn) + '</div></div><div>' +
      '<div class="dok-titel">' + (arF ? 'Faktura' : 'Kvitto') + '</div><table class="dok-meta">' +
      meta.filter(function (x) { return x[1]; }).map(function (x) { return '<tr><td>' + x[0] + ':</td><td>' + esc(x[1]) + '</td></tr>'; }).join('') +
      '</table></div></div>';
    html += '<div class="dok-parter"><div><div class="dok-etikett">' + (arF ? 'Fakturamottagare' : 'Mottagare') + '</div>' +
      [m.namn, m.foretag].concat(rader(m.adress), [m.telefon, m.epost]).filter(Boolean).map(esc).join('<br>') + '</div>' +
      (ref.namn ? '<div><div class="dok-etikett">Vår referens</div>' + [ref.namn, ref.epost, ref.mobil].filter(Boolean).map(esc).join('<br>') + '</div>' : '') + '</div>';
    html += '<table class="dok-rader"><thead><tr><th class="num">Kvantitet</th><th>Beskrivning</th><th class="num">á pris</th><th class="num">Total</th></tr></thead><tbody>' +
      d.rader.map(function (r) {
        return '<tr><td class="num">' + esc(String(r.antal).replace('.', ',')) + '</td><td>' + esc(r.beskrivning) + '</td><td class="num">' + kr(r.pris) + ' kr</td><td class="num">' + kr(K.dokumentRadTotal(r)) + ' kr</td></tr>';
      }).join('') + '</tbody></table>';
    var summa = K.dokumentSumma(d);
    html += '<table class="dok-summa"><tr class="total"><td>' + (arF ? 'Att betala' : 'Totalt betalt') + '</td><td class="num">' + kr(summa) + ' kr</td></tr></table>' +
      '<div class="dok-moms">Föreningen är inte momsregistrerad.</div>';
    if (arF) {
      var falt = [['Att betala', kr(summa) + ' kr'], ['Förfallodatum', d.forfallodatum]];
      if (f.bankgiro) falt.push(['Bankgiro', f.bankgiro]);
      if (f.swish) falt.push(['Swish', f.swish]);
      falt.push(['Referens', d.nummer]);
      html += '<div class="dok-betalning">' + falt.map(function (x) {
        return '<div><div class="etikett">' + x[0] + '</div><div class="varde">' + esc(x[1]) + '</div></div>';
      }).join('') + '</div><div class="dok-info">Ange fakturanumret som referens eller meddelande när du betalar.</div>';
    } else {
      html += '<div class="dok-kvittoinfo"><div>Beloppet ovan är betalt till ' + esc(f.namn || 'föreningen') +
        (d.betaldDatum ? ' den ' + esc(d.betaldDatum) : '') + (d.betalsatt ? ' via ' + esc(d.betalsatt === 'Swish' ? d.betalsatt : d.betalsatt.toLowerCase()) : '') + '. Tack!</div>' +
        '<div class="dok-stampel">BETALD</div></div>';
    }
    html += '<div class="dok-fot"><div><strong>Adress</strong><br>' + [f.namn].concat(rader(d.avsandare)).filter(Boolean).map(esc).join('<br>') + '</div>' +
      '<div>' + (f.webb ? '<strong>Webb</strong><br>' + esc(f.webb) + '<br>' : '') + (f.epost ? '<strong>E-post</strong><br>' + esc(f.epost) : '') + '</div>' +
      '<div>' + (f.orgnr ? '<strong>Org.nummer</strong><br>' + esc(f.orgnr) + '<br>' : '') + (f.bankgiro ? '<strong>Bankgiro</strong><br>' + esc(f.bankgiro) : '') + '</div></div>';
    return html + '</div>';
  }

  // En fristående kopia (HTML) som sparas som underlag och kan öppnas och skrivas ut igen.
  function dokumentFil(d) {
    var css = Array.from(document.querySelectorAll('style')).map(function (x) { return x.textContent; }).join('\n');
    return '<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><title>' + esc((d.typ === 'faktura' ? 'Faktura ' : 'Kvitto ') + d.nummer) + '</title>' +
      '<style>' + css + '\nbody{background:#eee}@media print{body{background:#fff}.dok{width:auto;padding:0}}</style></head><body>' + dokumentInnehall(d) + '</body></html>';
  }

  function skrivUt(d) {
    document.getElementById('utskrift').innerHTML = dokumentInnehall(d);
    document.body.classList.add('skriver-dokument');
    var klar = function () { document.body.classList.remove('skriver-dokument'); window.removeEventListener('afterprint', klar); };
    window.addEventListener('afterprint', klar);
    window.print();
    setTimeout(klar, 1000);
  }

  // ---------- PDF ----------
  // Fakturor, kvitton och årsmöteshandlingar ritas som riktiga PDF-filer (A4, sökbar text) med jsPDF.

  var jspdfLaddas = null;
  var jszipLaddas = null;
  function laddaJsZip() {
    if (window.JSZip) return Promise.resolve(window.JSZip);
    if (!jszipLaddas) {
      jszipLaddas = new Promise(function (ok, fel) {
        var sk = document.createElement('script');
        sk.src = JSZIP_URL;
        sk.onload = function () { ok(window.JSZip); };
        sk.onerror = function () { jszipLaddas = null; fel(new Error('Verktyget för zip-filer kunde inte laddas. Kontrollera internetanslutningen.')); };
        document.head.appendChild(sk);
      });
    }
    return jszipLaddas;
  }

  var xlsxLaddas = null;
  function laddaXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxLaddas) {
      xlsxLaddas = new Promise(function (ok, fel) {
        var sk = document.createElement('script');
        sk.src = XLSX_URL;
        sk.onload = function () { ok(window.XLSX); };
        sk.onerror = function () { xlsxLaddas = null; fel(new Error('Verktyget för Excel-filer kunde inte laddas. Kontrollera internetanslutningen.')); };
        document.head.appendChild(sk);
      });
    }
    return xlsxLaddas;
  }

  // Läser en Excel-arbetsbok i webbläsaren. Filen skickas ingenstans.
  async function lasArbetsbok(fil) {
    var X = await laddaXlsx();
    var wb = X.read(await fil.arrayBuffer(), { cellDates: true });
    var flikar = {};
    wb.SheetNames.forEach(function (n) {
      flikar[n] = X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }).map(function (r) {
        return r.map(function (c) { return c instanceof Date ? new Date(c.getTime() - c.getTimezoneOffset() * 60000).toISOString().slice(0, 10) : c; });
      });
    });
    return { flikar: flikar };
  }

  function laddaJsPdf() {
    if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
    if (!jspdfLaddas) {
      jspdfLaddas = new Promise(function (ok, fel) {
        var sk = document.createElement('script');
        sk.src = JSPDF_URL;
        sk.onload = function () { ok(window.jspdf.jsPDF); };
        sk.onerror = function () { jspdfLaddas = null; fel(new Error('PDF-verktyget kunde inte laddas. Kontrollera internetanslutningen.')); };
        document.head.appendChild(sk);
      });
    }
    return jspdfLaddas;
  }

  // PDF:ens standardtypsnitt klarar svenska bokstäver men inte alla specialtecken.
  function pt(t) {
    return String(t == null ? '' : t).replace(/[\u2212\u2013\u2014]/g, '-').replace(/[\u00a0\u202f]/g, ' ').replace(/\u2192/g, '->').replace(/\u2026/g, '...');
  }
  function krPdf(ore) { return pt(kr(ore)) + ' kr'; }

  var SKIFFER = [55, 63, 81], GRA = [85, 85, 85], LINJE = [200, 203, 210];

  function nyPdf(JsPdf) {
    var doc = new JsPdf({ unit: 'mm', format: 'a4' });
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(26, 26, 26);
    return doc;
  }

  function ritaLogo(doc, x, y, maxB, maxH) {
    if (!logoUrl) return 0;
    try {
      var prop = doc.getImageProperties(logoUrl);
      var skala = Math.min(maxB / prop.width, maxH / prop.height);
      var b = prop.width * skala, h = prop.height * skala;
      doc.addImage(logoUrl, prop.fileType || 'JPEG', x, y, b, h);
      return h;
    } catch (e) { return 0; }
  }

  function etikett(doc, text, x, y) {
    doc.setFontSize(7.5); doc.setTextColor.apply(doc, GRA);
    doc.text(pt(text).toUpperCase(), x, y, { charSpace: 0.2 });
    doc.setTextColor(26, 26, 26);
  }

  async function skapaDokumentPdf(d) {
    var doc = nyPdf(await laddaJsPdf());
    var f = d.forening || {};
    var arF = d.typ === 'faktura';
    var V = 15, H = 195;
    // Sidhuvud
    var logoH = ritaLogo(doc, V, 14, 26, 24);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
    doc.text(pt(f.namn), V, 14 + (logoH ? logoH + 6 : 4));
    doc.setFontSize(24); doc.setTextColor.apply(doc, SKIFFER);
    doc.text(arF ? 'Faktura' : 'Kvitto', H, 22, { align: 'right' });
    doc.setTextColor(26, 26, 26);
    var meta = arF
      ? [['Fakturadatum', d.datum], ['Fakturanr', d.nummer], ['Förfallodatum', d.forfallodatum]]
      : [['Kvittonr', d.nummer], ['Utskrivningsdatum', d.datum], ['Betaldatum', d.betaldDatum], ['Betalsätt', d.betalsatt], ['Org.nummer', f.orgnr]];
    var y = 30;
    meta.filter(function (m) { return m[1]; }).forEach(function (m) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor.apply(doc, GRA);
      doc.text(pt(m[0]) + ':', 140, y);
      doc.setTextColor(26, 26, 26);
      doc.text(pt(m[1]), H, y, { align: 'right' });
      y += 5;
    });
    // Mottagare och referens
    y = Math.max(y + 6, 62);
    var m = d.mottagare || {}, ref = d.referens || {};
    etikett(doc, arF ? 'Fakturamottagare' : 'Mottagare', V, y);
    if (ref.namn) etikett(doc, 'Vår referens', 110, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    var mRader = [m.namn, m.foretag].concat(rader(m.adress), [m.telefon, m.epost]).filter(Boolean);
    mRader.forEach(function (r, i) { doc.text(pt(r), V, y + 5 + i * 4.6); });
    var refRader = [ref.namn, ref.epost, ref.mobil].filter(Boolean);
    refRader.forEach(function (r, i) { doc.text(pt(r), 110, y + 5 + i * 4.6); });
    y += 8 + Math.max(mRader.length, refRader.length) * 4.6;
    // Rader
    var kol = { antal: 32, beskr: 37, pris: 160, total: H };
    var rubrik = function () {
      etikett(doc, 'Beskrivning', kol.beskr, y);
      doc.setFontSize(7.5); doc.setTextColor.apply(doc, GRA);
      doc.text('ANTAL', kol.antal, y, { align: 'right' });
      doc.text('Á PRIS', kol.pris, y, { align: 'right' }); doc.text('TOTAL', kol.total, y, { align: 'right' });
      doc.setTextColor(26, 26, 26);
      doc.setDrawColor(26, 26, 26); doc.setLineWidth(0.4); doc.line(V, y + 2, H, y + 2);
      y += 7;
    };
    rubrik();
    doc.setFontSize(10);
    d.rader.forEach(function (r) {
      var text = doc.splitTextToSize(pt(r.beskrivning), 95);
      if (y + text.length * 4.6 > 230) { doc.addPage(); y = 20; rubrik(); doc.setFontSize(10); }
      doc.setFont('helvetica', 'normal');
      doc.text(pt(String(r.antal).replace('.', ',')), kol.antal, y, { align: 'right' });
      doc.text(text, kol.beskr, y);
      doc.text(krPdf(r.pris), kol.pris, y, { align: 'right' });
      doc.text(krPdf(K.dokumentRadTotal(r)), kol.total, y, { align: 'right' });
      y += text.length * 4.6 + 1.5;
      doc.setDrawColor.apply(doc, LINJE); doc.setLineWidth(0.2); doc.line(V, y - 3, H, y - 3);
    });
    // Summa
    var summa = K.dokumentSumma(d);
    y += 3;
    doc.setDrawColor(26, 26, 26); doc.setLineWidth(0.4); doc.line(110, y - 4, H, y - 4);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
    doc.text(arF ? 'Att betala' : 'Totalt betalt', 110, y + 1);
    doc.text(krPdf(summa), H, y + 1, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor.apply(doc, GRA);
    doc.text('Föreningen är inte momsregistrerad.', H, y + 6, { align: 'right' });
    doc.setTextColor(26, 26, 26);
    y += 14;
    if (arF) {
      // Betalningsruta
      var falt = [['Att betala', krPdf(summa)], ['Förfallodatum', d.forfallodatum]];
      if (f.bankgiro) falt.push(['Bankgiro', f.bankgiro]);
      if (f.swish) falt.push(['Swish', f.swish]);
      falt.push(['Referens', d.nummer]);
      var bredd = (H - V) / falt.length;
      doc.setFillColor(244, 244, 244); doc.rect(V, y, bredd, 15, 'F');
      doc.setDrawColor.apply(doc, SKIFFER); doc.setLineWidth(0.5); doc.roundedRect(V, y, H - V, 15, 1.5, 1.5, 'S');
      falt.forEach(function (x, i) {
        var bx = V + i * bredd;
        if (i) { doc.setDrawColor.apply(doc, LINJE); doc.setLineWidth(0.2); doc.line(bx, y, bx, y + 15); }
        etikett(doc, x[0], bx + 3, y + 5);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(i ? 10.5 : 12);
        doc.text(pt(x[1]), bx + 3, y + 11.5);
      });
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
      doc.text('Ange fakturanumret som referens eller meddelande när du betalar.', V, y + 21);
    } else {
      doc.setFontSize(10);
      var tack = doc.splitTextToSize(pt('Beloppet ovan är betalt till ' + (f.namn || 'föreningen') + (d.betaldDatum ? ' den ' + d.betaldDatum : '') +
        (d.betalsatt ? ' via ' + (d.betalsatt === 'Swish' ? d.betalsatt : d.betalsatt.toLowerCase()) : '') + '. Tack!'), 115);
      doc.text(tack, V, y);
      // Stämpel
      doc.setDrawColor(46, 125, 79); doc.setTextColor(46, 125, 79); doc.setLineWidth(0.8);
      doc.roundedRect(150, y - 6, 45, 13, 2, 2, 'S');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
      doc.text('BETALD', 172.5, y + 3, { align: 'center', charSpace: 1.2 });
      doc.setTextColor(26, 26, 26);
    }
    // Sidfot på varje sida
    var sidor = doc.getNumberOfPages();
    for (var s2 = 1; s2 <= sidor; s2++) {
      doc.setPage(s2);
      var fy = 262;
      doc.setDrawColor(187, 187, 187); doc.setLineWidth(0.2); doc.line(V, fy, H, fy);
      doc.setFontSize(8); doc.setFont('helvetica', 'bold');
      doc.text('Adress', V, fy + 5);
      if (f.webb || f.epost) doc.text(f.webb ? 'Webb' : 'E-post', 80, fy + 5);
      if (f.orgnr) doc.text('Org.nummer', 140, fy + 5);
      doc.setFont('helvetica', 'normal');
      [f.namn].concat(rader(d.avsandare)).filter(Boolean).forEach(function (r, i) { doc.text(pt(r), V, fy + 9 + i * 3.8); });
      var mitt = [];
      if (f.webb) mitt.push(f.webb);
      if (f.webb && f.epost) mitt.push('');
      if (f.epost) mitt.push(f.epost);
      mitt.forEach(function (r, i) { doc.text(pt(r), 80, fy + 9 + i * 3.8); });
      if (f.webb && f.epost) { doc.setFont('helvetica', 'bold'); doc.text('E-post', 80, fy + 9 + 3.8); doc.setFont('helvetica', 'normal'); }
      if (f.orgnr) doc.text(pt(f.orgnr), 140, fy + 9);
      if (f.bankgiro) { doc.setFont('helvetica', 'bold'); doc.text('Bankgiro', 140, fy + 9 + 3.8 + 1); doc.setFont('helvetica', 'normal'); doc.text(pt(f.bankgiro), 140, fy + 9 + 7.6 + 1); }
      if (sidor > 1) { doc.setTextColor.apply(doc, GRA); doc.text('Sida ' + s2 + ' av ' + sidor, H, 290, { align: 'right' }); doc.setTextColor(26, 26, 26); }
    }
    doc.setProperties({ title: (arF ? 'Faktura ' : 'Kvitto ') + d.nummer, author: f.namn || '', creator: 'Föreningsbokföring' });
    return doc.output('blob');
  }

  async function skapaArsmotePdf(ar) {
    var doc = nyPdf(await laddaJsPdf());
    var a = arsmoteData(ar);
    var f = store.forening;
    var fg = foregaende(ar);
    var rr = K.resultatrakning(ar, { foregaende: fg });
    var br = K.balansrakning(ar);
    var V = 15, H = 195, NED = 275;
    var y;
    var nySidaOm = function (behov) { if (y + behov > NED) { doc.addPage(); y = 20; } };
    // Sidhuvud
    var logoH = ritaLogo(doc, V, 14, 24, 22);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
    var ny = 14 + (logoH ? logoH + 6 : 4);
    doc.text(pt(f.namn || ''), V, ny);
    if (f.orgnr) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.text('Org.nr ' + pt(f.orgnr), V, ny + 5); }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor.apply(doc, SKIFFER);
    doc.text('Ekonomisk redovisning', H, 22, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(26, 26, 26);
    doc.text('Räkenskapsåret ' + ar.start + ' - ' + ar.slut, H, 28, { align: 'right' });
    y = ny + 14;
    var rubrik = function (text) {
      nySidaOm(16);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor.apply(doc, SKIFFER);
      doc.text(pt(text), V, y);
      doc.setDrawColor.apply(doc, SKIFFER); doc.setLineWidth(0.4); doc.line(V, y + 1.8, H, y + 1.8);
      doc.setTextColor(26, 26, 26);
      y += 8;
    };
    var stycke = function (text) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
      rader(text).forEach(function (r) {
        doc.splitTextToSize(pt(r), H - V).forEach(function (rad) { nySidaOm(5); doc.text(rad, V, y); y += 4.8; });
        y += 1.5;
      });
      y += 3;
    };
    var tabell = function (rubrikNu, rubrikFg, raderna) {
      nySidaOm(12);
      doc.setFontSize(8); doc.setTextColor.apply(doc, GRA);
      doc.text(pt(rubrikNu), 160, y, { align: 'right' }); doc.text(pt(rubrikFg), H, y, { align: 'right' });
      doc.setTextColor(26, 26, 26);
      y += 5;
      raderna.forEach(function (r) {
        nySidaOm(6);
        if (r.typ === 'grupp') { doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.text(pt(r.text), V, y); y += 5; return; }
        if (r.typ === 'summa' || r.typ === 'total') {
          doc.setDrawColor.apply(doc, r.typ === 'total' ? [26, 26, 26] : [150, 150, 150]); doc.setLineWidth(r.typ === 'total' ? 0.4 : 0.2);
          doc.line(V, y - 3.6, H, y - 3.6);
          doc.setFont('helvetica', 'bold');
        } else doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.text(pt(r.text), V + (r.typ ? 0 : 2), y);
        doc.text(pt(r.nu), 160, y, { align: 'right' });
        doc.text(pt(r.fg), H, y, { align: 'right' });
        y += r.typ === 'total' ? 7 : 5;
      });
      y += 4;
    };
    rubrik('Ekonomisk berättelse');
    if (a.berattelse) stycke(a.berattelse); else { doc.setFontSize(10); doc.text('(Ingen berättelse ifylld.)', V, y); y += 8; }
    rubrik('Resultaträkning');
    var rrRader = [];
    rr.grupper.forEach(function (g) {
      rrRader.push({ typ: 'grupp', text: g.namn });
      g.konton.forEach(function (r) { rrRader.push({ text: r.namn, nu: kr(r.belopp), fg: fg ? kr(r.jamforelse) : '' }); });
      rrRader.push({ typ: 'summa', text: 'Summa ' + g.namn.toLowerCase(), nu: kr(g.summa), fg: fg ? kr(g.jamforelse) : '' });
    });
    rrRader.push({ typ: 'total', text: 'Årets resultat', nu: kr(rr.aretsResultat), fg: fg ? kr(rr.jamforelseResultat) : '' });
    tabell(K.arNamn(ar), fg ? K.arNamn(fg) : '', rrRader);
    rubrik('Balansräkning');
    var brRader = [];
    [['Tillgångar', br.tillgangar], ['Eget kapital och skulder', br.egetKapitalOchSkulder]].forEach(function (dd) {
      dd[1].grupper.forEach(function (g) {
        brRader.push({ typ: 'grupp', text: g.namn });
        g.konton.forEach(function (r) { brRader.push({ text: r.namn, nu: kr(r.belopp), fg: kr(r.jamforelse) }); });
      });
      brRader.push({ typ: 'total', text: 'Summa ' + dd[0].toLowerCase(), nu: kr(dd[1].summa), fg: kr(dd[1].ingaende) });
    });
    tabell(ar.slut, K.laggTillDagar(ar.start, -1), brRader);
    var res = rr.aretsResultat;
    rubrik('Förslag till resultatdisposition');
    stycke(a.forslag || ('Styrelsen föreslår att årets resultat, ' + (res < 0 ? 'underskott ' : 'överskott ') + kr(Math.abs(res)) + ' kr, balanseras i ny räkning.'));
    rubrik('Redovisningsprinciper');
    stycke(a.principer);
    var namnLista = rader(a.underskrifter);
    if (!namnLista.length) namnLista = ['', '', ''];
    nySidaOm(30 + Math.ceil(namnLista.length / 2) * 22);
    rubrik('Underskrifter');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text(pt([a.ort, a.datum].filter(Boolean).join(' ') || 'Ort och datum: ______________________'), V, y); y += 16;
    namnLista.forEach(function (n, i) {
      var x = i % 2 ? 110 : V;
      doc.setDrawColor(26, 26, 26); doc.setLineWidth(0.3); doc.line(x, y, x + 80, y);
      doc.setFontSize(9.5); doc.text(pt(n), x, y + 4.5);
      if (i % 2 || i === namnLista.length - 1) y += 22;
    });
    var sidor = doc.getNumberOfPages();
    for (var s3 = 1; s3 <= sidor; s3++) {
      doc.setPage(s3);
      doc.setFontSize(8); doc.setTextColor.apply(doc, GRA);
      doc.text(pt((f.namn || '') + ' · Ekonomisk redovisning ' + K.arNamn(ar)), V, 290);
      doc.text('Sida ' + s3 + ' av ' + sidor, H, 290, { align: 'right' });
      doc.setTextColor(26, 26, 26);
    }
    doc.setProperties({ title: 'Ekonomisk redovisning ' + K.arNamn(ar), author: f.namn || '', creator: 'Föreningsbokföring' });
    return doc.output('blob');
  }

  // Ritar A4-sidan utanför skärmen och gör den till en JPEG i dubbel upplösning.
  async function skapaDokumentBild(d) {
    var h2c = await laddaHtml2canvas();

  // ---------- Rapporter som PDF ----------

  var RAPPORTTITLAR = { rr: 'Resultaträkning', br: 'Balansräkning', sb: 'Saldobalans', gb: 'Grundbok', hb: 'Huvudbok', bank: 'Bankavstämning' };

  async function skapaRapportPdf(ar, typ, konto) {
    var doc = nyPdf(await laddaJsPdf());

    doc.setFontSize(8); doc.setTextColor.apply(doc, GRA);
    doc.text('Utskriven ' + idag(), H, 30.5, { align: 'right' });
    doc.setTextColor(26, 26, 26);
    y = Math.max(ny + 10, 40);

    var kol = null;
    var kolumnrubriker = function () {
      if (!kol) return;

      kolumnrubriker();

    } else if (typ === 'gb') {
      kol = [{ r: 'Datum', x: V }, { r: 'Ver', x: 40, align: R }, { r: 'Konto och text', x: 45, w: 90 }, { r: 'Debet', x: 165, align: R }, { r: 'Kredit', x: H, align: R }];

      K.grundbok(ar).forEach(function (v) {
        rad([v.datum, String(v.nr), v.text, '', ''], 'grupp');

    } else if (typ === 'hb') {
      var hb = K.huvudbok(ar, konto);

      hb.rader.forEach(function (r) { rad([r.datum, String(r.nr), r.text, r.belopp > 0 ? kr(r.belopp) : '', r.belopp < 0 ? kr(-r.belopp) : '', kr(r.saldo)]); });
      rad(['', '', 'Utgående balans', '', '', kr(hb.ub)], 'total');
    } else if (typ === 'dagordning') {
      rader(amData.dagordning).forEach(function (r) { text(r); y += 1.5; });
    } else if (typ === 'rostlangd') {
      var rl = K.rostlangd(reg(), amData.motesdatum || idag(), store.ar, amData.rostlangd).filter(function (x) { return x.rost; });
      kol = [{ r: 'Nr', x: V }, { r: 'Namn', x: V + 12, w: 110 }, { r: 'Närvarande', x: H, align: R }];
      kolumnrubriker();
      rl.forEach(function (x, i) { rad([String(i + 1), x.namn, '[   ]']); });

    } else if (typ === 'medl') {
      var s = K.terminsstatistik(reg(), konto, store.ar);

      kol = null;
      if (!medNamn) {
        avsnitt('Översikt');
        text('Har betalat: ' + s.totalt.antal + '. Har betalat mindre än avgiften: ' + s.forLite.length + '. Betalade ' + K.foregaendeTermin(konto) + ' men inte ' + konto + ': ' + s.slutat.length + '.');
      } else {
      doc.setTextColor(170, 40, 40); text('Innehåller personuppgifter. Bara för kassören, dela inte vidare.'); doc.setTextColor(26, 26, 26);
      avsnitt('Har betalat (' + s.betalande.length + ')');

        kolumnrubriker();
        hist.slice().reverse().forEach(function (h) { rad([h.termin].concat(K.KATEGORIER.map(function (k) { return h[k[0]] ? String(h[k[0]]) : ''; })).concat([kr(h.summa)])); });

    } else if (typ === 'bank') {

      kol = [{ r: 'Månad', x: V, w: 40 }, { r: 'Banken', x: 95, align: R }, { r: 'Bokfört', x: 125, align: R }, { r: 'Skillnad', x: 155, align: R }, { r: 'Status', x: 160, w: 35 }];

          : m.obokforda ? m.obokforda + ' ej bokförd' + (m.obokforda === 1 ? '' : 'a') : 'skiljer';
        rad([manadsnamn(m.manad), m.bankSaldo != null ? kr(m.bankSaldo) : '', m.bokfortSaldo != null ? kr(m.bokfortSaldo) : '', m.skillnad != null ? kr(m.skillnad) : '', status]);
      });
      var a = K.bankavvikelser(ar);
      kol = null;
      avsnitt('Banktransaktioner som inte är bokförda (' + a.obokforda.length + ')');
      if (a.obokforda.length) {

        kolumnrubriker();

      if (a.utanBank.length) {

        kolumnrubriker();
        a.utanBank.forEach(function (v) { rad([v.datum, String(v.nr), v.text, kr(v.belopp)]); });
        kol = null;
      } else text('Inga.');
      avsnitt('Saldot går inte ihop i kontoutdraget (' + a.saldofel.length + ')');
      a.saldofel.length ? a.saldofel.forEach(text) : text('Inga.');
    }

    var sidor = doc.getNumberOfPages();
    for (var i = 1; i <= sidor; i++) {
      doc.setPage(i);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor.apply(doc, GRA);
      doc.text(pt((f.namn || '') + ' · ' + titel + (typ === 'medl' || amData ? '' : ' ' + K.arNamn(ar))), V, 290);
      doc.text('Sida ' + i + ' av ' + sidor, H, 290, { align: 'right' });

  }

  // Liten kontrollsumma över året, så att en ny PDF skapas när bokföringen ändras.
  function datastampel(ar, extra) {
    var t = JSON.stringify(ar) + '|' + (extra || '');
    var h = 5381;
    for (var i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  function rapportPdfKnappar(ar, typ, konto) {
    var fg = foregaende(ar);
    var namn = K.sakertNamn(RAPPORTTITLAR[typ] + (typ === 'hb' ? ' ' + konto : '') + ' ' + K.arNamn(ar).replace('/', '-') + '.pdf');
    var nyckel = 'rapport-' + typ + '-' + store.aktivt + '-' + datastampel(ar, (konto || '') + (fg ? datastampel(fg) : '') + (store.forening.namn || '') + (logoUrl ? logoUrl.length : 0)) + '|' + namn;
    forbered(nyckel, function () { return skapaRapportPdf(ar, typ, konto); });
    return '<div class="row ej-utskrift" style="margin:10px 0">' + pdfKnappar(nyckel, 'skriv-ut') + '</div>';
  }

  function dokumentFilnamn(d) { return K.sakertNamn((d.typ === 'faktura' ? 'Faktura ' : 'Kvitto ') + d.nummer + '.pdf'); }
  function arsmoteFilnamn(ar) { return K.sakertNamn('Ekonomisk redovisning ' + K.arNamn(ar).replace('/', '-') + '.pdf'); }

  // PDF:en skapas i förväg när förhandsvisningen öppnas, så att delningsmenyn kan öppnas direkt
  // när man trycker (Safari kräver att delning startar direkt i samband med trycket).
  var pdfCache = {};
  function forbered(nyckel, skapa) {
    if (pdfCache[nyckel]) return;
    pdfCache[nyckel] = { status: 'skapas' };
    skapa().then(function (blob) { pdfCache[nyckel] = { status: 'klar', blob: blob }; uppdateraPdfKnappar(); },
      function (err) { pdfCache[nyckel] = { status: 'fel', fel: err.message }; uppdateraPdfKnappar(); });
  }
  function uppdateraPdfKnappar() {
    document.querySelectorAll('[data-pdf]').forEach(function (b) {
      var c = pdfCache[b.dataset.pdf];
      b.disabled = !c || c.status !== 'klar';
      if (c && c.status === 'fel') b.title = c.fel;
    });
    document.querySelectorAll('[data-pdf-status]').forEach(function (el) {
      var nycklar = el.dataset.pdfStatus.split(',');
      var cs = nycklar.map(function (n) { return pdfCache[n]; });
      var skapas = cs.some(function (c) { return !c || c.status === 'skapas'; });
      var fel = cs.filter(function (c) { return c && c.status === 'fel'; }).map(function (c) { return c.fel; });
      el.textContent = skapas ? 'Skapar filer…' : fel.join(' ');
      el.className = 'faint' + (fel.length ? ' fel' : '');
    });
  }
  function kanDela() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.pdf', { type: 'application/pdf' })] })); } catch (e) { return false; }
  }
  function arIosHemskarm() { return window.navigator.standalone === true; }
  function arIos() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }

  function pdfKnappar(nyckel, utskriftsAction, id, bildnyckel) {
    var html = '';
    var bild = function (klass) {
      if (!bildnyckel) return '';
      return kanDela() ? '<button class="btn btn-secondary btn-small" data-action="dela-pdf" data-pdf="' + esc(bildnyckel) + '" disabled>Dela som bild</button>'
        : '<button class="btn btn-secondary btn-small" data-action="ladda-ner-pdf" data-pdf="' + esc(bildnyckel) + '" disabled>Ladda ner som bild</button>';
    };
    if (arIos()) {
      // På iPhone och iPad går allt via delningsmenyn: skicka, Spara i Filer eller Skriv ut.
      html += kanDela()
        ? '<button class="btn btn-small" data-action="dela-pdf" data-pdf="' + esc(nyckel) + '" disabled>Dela, spara eller skriv ut</button>' + bild()
        : '<span class="fel">Den här webbläsaren kan inte dela filer. Öppna appen i Safari och försök igen.</span>';
    } else {
      if (kanDela()) html += '<button class="btn btn-small" data-action="dela-pdf" data-pdf="' + esc(nyckel) + '" disabled>Dela / skicka</button>';
      html += '<button class="btn ' + (kanDela() ? 'btn-secondary ' : '') + 'btn-small" data-action="ladda-ner-pdf" data-pdf="' + esc(nyckel) + '" disabled>Ladda ner PDF</button>' + bild();
    }
    if (!arIosHemskarm()) html += '<button class="btn btn-secondary btn-small" data-action="' + utskriftsAction + '"' + (id ? ' data-id="' + esc(id) + '"' : '') + '>Skriv ut</button>';
    return html + '<span data-pdf-status="' + esc(nyckel + (bildnyckel ? ',' + bildnyckel : '')) + '" class="faint">Skapar filer…</span>';
  }

  function filtyp(namn) {
    return /\.jpe?g$/i.test(namn) ? 'image/jpeg' : /\.png$/i.test(namn) ? 'image/png' : /\.zip$/i.test(namn) ? 'application/zip' : /\.se$/i.test(namn) ? 'text/plain' : 'application/pdf';
  }

  function delaEllerLaddaNer(nyckel, dela) {
    var c = pdfCache[nyckel];
    if (!c || c.status !== 'klar') return;
    setTimeout(function () { kvittoAnvant(nyckel); }, 0);
    var namn = nyckel.split('|')[1];
    if (dela) {
      // Bara filen, utan titel eller text: då tar Mail, Messenger och WhatsApp emot den som en bilaga.
      var typ = filtyp(namn);
      var fil = new File([c.blob], namn, { type: typ, lastModified: Date.now() });
      if (!navigator.canShare || !navigator.canShare({ files: [fil] })) {
        visa('Den här webbläsaren kan inte dela filer.' + (arIos() ? ' Öppna appen i Safari och försök igen.' : ' Använd Ladda ner.'), true);
        return;
      }
      navigator.share({ files: [fil] }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        // Ingen tyst reservväg: visa varför delningen inte gick.
        visa('PDF:en kunde inte delas (' + ((err && (err.name + ': ' + err.message)) || 'okänt fel') + ').' +
          (arIosHemskarm() ? ' Prova att öppna appen i Safari i stället för från hemskärmen.' : ''), true);
      });
      return;
    }
    laddaNer(namn, c.blob, filtyp(namn));
  }

  // Förhandsvisningar av A4-sidor skalas så att hela sidan syns, även på telefonen.
  function skalaForhandsvisningar() {
    document.querySelectorAll('.forhandsvisning').forEach(function (ram) {
      var dok = ram.querySelector('.dok');
      if (!dok) return;
      dok.style.transform = '';
      ram.style.height = '';
      var tillganglig = ram.clientWidth - 12;
      var naturlig = dok.offsetWidth;
      var skala = Math.min(1, tillganglig / naturlig);
      if (skala < 1) {
        dok.style.transformOrigin = 'top left';
        dok.style.transform = 'scale(' + skala + ')';
        dok.style.margin = '0';
        ram.style.height = Math.ceil(dok.offsetHeight * skala + 12) + 'px';
      } else {
        dok.style.margin = '';
      }
    });
  }

  function sparaDokument() {
    var res = utkastTillDokument();
    if (res.fel.length) throw new Error(res.fel.join(' '));
    var d = res.dok;
    var adress = hitta('adresser', dokUtkast.adressId);
    var kontakt = hitta('kontakter', dokUtkast.kontaktId);
    d.id = nyttId();
    d.nummer = K.nastaDokumentnummer(store.dokument, d.typ, d.datum);
    d.forening = { namn: store.forening.namn, orgnr: store.forening.orgnr, bankgiro: store.forening.bankgiro, swish: store.forening.swish, webb: store.forening.webb, epost: store.forening.epost };
    d.avsandare = adress ? adress.text : '';
    d.referens = kontakt ? { namn: kontakt.namn, epost: kontakt.epost, mobil: kontakt.mobil } : null;
    d.logo = logoUrl;
    d.skapad = new Date().toISOString();
    if (dokUtkast.verifikation) d.verifikation = dokUtkast.verifikation;

    // Mottagaren sparas för nästa gång.
    var m = d.mottagare;
    var befintlig = hitta('mottagare', dokUtkast.mottagareId) ||
      store.mottagare.find(function (x) { return x.namn.trim().toLowerCase() === m.namn.trim().toLowerCase() && (x.foretag || '') === (m.foretag || ''); });
    if (befintlig) Object.assign(befintlig, m);
    else store.mottagare.push(Object.assign({ id: nyttId() }, m));

    var sparat = Promise.resolve();
    if (d.typ === 'faktura') {
      var filnamn = dokumentFilnamn(d);
      var u = K.fakturaTillUnderlag(d, filnamn);
      var arId = arForDatum(d.forfallodatum) || arForDatum(d.datum) || oppetAr();
      store.ar[arId] = K.laggTillUnderlag(store.ar[arId], u);
      d.underlagId = u.id;
      d.arId = arId;
      sparat = skapaDokumentPdf(d).then(function (blob) {
        pdfCache['dok-' + d.id + '|' + filnamn] = { status: 'klar', blob: blob };
        return sparaFil(u.id, blob, filnamn);
      }).catch(function () {
        // Utan PDF-verktyget (t.ex. utan internet) sparas en HTML-kopia i stället.
        var html = 'Faktura ' + d.nummer.replace(':', '_') + '.html';
        store.ar[arId] = K.andraUnderlag(store.ar[arId], u.id, { filnamn: html });
        sparaLokalt();
        return sparaFil(u.id, new Blob([dokumentFil(d)], { type: 'text/html' }), html);
      });
    }
    store.dokument.push(d);
    spara();
    dokUtkast = null;
    dokVisas = d.id;
    return sparat.then(function () { return d; });
  }
