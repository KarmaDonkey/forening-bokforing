  // Gör appen installerbar på hemskärmen när den körs från en webbadress.
  function laggTillManifest() {
    if (location.protocol === 'file:') return;
    var l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'manifest.json';
    document.head.appendChild(l);
  }

  var qrLaddas = null;
  function laddaQr() {
    if (window.qrcode) return Promise.resolve();
    if (!qrLaddas) {
      qrLaddas = new Promise(function (ok, fel) {
        var sk = document.createElement('script');
        sk.src = QR_URL;
        sk.onload = ok;
        sk.onerror = function () { qrLaddas = null; fel(new Error('QR-koden kunde inte laddas. Använd länken i stället.')); };
        document.head.appendChild(sk);
      });
    }
    return qrLaddas;
  }

  function ritaQr() {
    var el = document.getElementById('qrKod');
    if (!el) return;
    laddaQr().then(function () {
      var qr = window.qrcode(0, 'M');
      qr.addData(el.dataset.text);
      qr.make();
      el.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2, scalable: true });
    }).catch(function (err) { el.textContent = err.message; });
  }

  // ---------- Inläsning ----------

  function arForDatum(d) {
    if (!d) return null;
    return Object.keys(store.ar).find(function (id) { return !store.ar[id].grovkopia && store.ar[id].start <= d && d <= store.ar[id].slut; }) || null;
  }

  // Det aktiva året, eller det senaste vanliga året om det aktiva är en arkivkopia.
  function oppetAr() {
    if (store.ar[store.aktivt] && !store.ar[store.aktivt].grovkopia) return store.aktivt;
    return Object.keys(store.ar).filter(function (id) { return !store.ar[id].grovkopia; }).sort().pop() || store.aktivt;
  }

  function logga(text, fel) { logg.unshift({ text: text, fel: !!fel }); logg = logg.slice(0, 12); }

  // Kopplar bankrader till verifikationer som redan bokförts mot banken. Returnerar antalet.
  function kopplaEfterhand() {
    var antalKopplade = 0;
    Object.keys(store.ar).forEach(function (id) {
      if (store.ar[id].grovkopia) return;
      var res = K.kopplaBokforda(store.ar[id]);
      store.ar[id] = res.ar;
      antalKopplade += res.kopplade.length;
    });
    return antalKopplade;
  }

  // Lär in motpart -> konto från en bokförd verifikation med ett underlag, och uppdatera väntande underlag.
  function larAvUnderlag(ar, underlagIds, rader) {
    if (!underlagIds || underlagIds.length !== 1) return;
    var u = (ar.underlag || []).find(function (x) { return x.id === underlagIds[0]; });
    var konto = K.kontoAttLara(rader);
    if (!u || !u.motpart || !konto) return;
    store.motpartsregler = K.larMotpart(store.motpartsregler, u.motpart, konto);
    tillampaRegler();
  }

  function tillampaRegler() {
    Object.keys(store.ar).forEach(function (id) {
      if (id !== store.aktivt) store.ar[id] = K.tillampaMotpartsregler(store.ar[id], store.motpartsregler);
    });
  }

  function kontoKallaText(u) {
    if (u.kontoKalla === 'faktura') return 'från fakturan';
    return u.kontoKalla === 'inlart' ? 'som förra gången' : u.kontoKalla === 'manuell' ? 'ditt val' : u.kontoKalla === 'claude' ? 'Claudes förslag' : '';
  }

  function importeraRader(rader, konto) {
    var nya = 0, dubbletter = 0;
    konto = konto || huvudbankkonto();
    Object.keys(store.ar).forEach(function (id) {
      if (store.ar[id].grovkopia) return;
      var res = K.importeraBankrader(store.ar[id], rader, { konto: konto });
      store.ar[id] = res.ar;
      nya += res.nya;
      dubbletter += res.dubbletter;
    });
    var utanfor = rader.filter(function (r) { return !arForDatum(r.datum); });
    var kopplade = kopplaEfterhand();
    spara();
    var text = (bankkonton().length > 1 ? banknamn(konto) + ': ' : '') + antal(nya, 'ny banktransaktion', 'nya banktransaktioner') + (dubbletter ? ', ' + dubbletter + ' fanns redan' : '') + '.';
    if (kopplade) text += ' ' + antal(kopplade, 'av dem var redan bokförd och kopplades', 'av dem var redan bokförda och kopplades') + ' till sin verifikation.';
    if (utanfor.length) {
      var ar = Array.from(new Set(utanfor.map(function (r) { return r.datum.slice(0, 4); }))).join(', ');
      text += ' ' + antal(utanfor.length, 'rad gäller', 'rader gäller') + ' år som inte är upplagda (' + ar + ') och hoppades över.';
    }
    return text;
  }

  function importeraBanktext(text, namn) {
    // En Swish-rapport är inget kontoutdrag: raderna sparas i medlemsregistret och kopplas till Swish-raderna på kontoutdraget.
    if (K.arSwishrapport(text)) { importeraSwish(text, namn); return { typ: 'swish' }; }
    if (K.liknarSwishrapport(text)) throw new Error((namn ? namn + ': ' : '') + 'ser ut som en Swish-rapport, men kolumnerna känns inte igen. Den läses inte in som kontoutdrag, eftersom det skulle ge dubbla Swish-rader.');
    var res = K.parseBankfil(text);
    if (!res.rader.length) throw new Error((namn ? namn + ': ' : '') + 'hittade inga transaktioner. ' + res.varningar.slice(0, 2).join(' '));
    logga((namn ? namn + ': ' : '') + importeraRader(res.rader, kontoForInlasning(text, namn)));
    res.varningar.slice(0, 5).forEach(function (v) { logga(v, true); });
    return { typ: 'kontoutdrag', arId: arForDatum(res.rader[res.rader.length - 1].datum) || store.aktivt };
  }

  // Originalfilen (CSV eller Excel) sparas i OneDrive: kontoutdrag bland årets underlag, Swish-rapporten i
  // medlemsregistrets mapp eftersom den innehåller namn. Samma fil inläst igen ersätter den tidigare.
  async function sparaOriginalfil(fil, info) {
    if (!info || !odAnslutet() || lasLage() || OVNING) return;
    try {
      var url;
      if (info.typ === 'swish') {
        await sakerstallRegMapp();
        url = '/drives/' + od.regMapp.driveId + '/items/' + od.regMapp.id + ':/' + enc('Swish-rapporter/' + K.sakertNamn(fil.name)) + ':';
      } else url = iMappen(K.arMapp(info.arId) + '/Bokföringsunderlag/Kontoutdrag/' + K.sakertNamn(fil.name));
      await graf(url + '/content?@microsoft.graph.conflictBehavior=replace', { method: 'PUT', body: fil });
      logga(fil.name + ': sparad i OneDrive' + (info.typ === 'swish' ? ' (Medlemsregister/Swish-rapporter).' : ' (' + info.arId + '/Bokföringsunderlag/Kontoutdrag).'));
    } catch (e) { logga(fil.name + ': kunde inte sparas i OneDrive (' + e.message + '). Lägg gärna filen där själv.', true); }
  }

  function importeraSwish(text, namn) {
    var res = K.parseSwishrapport(text);
    if (!res.rader.length) throw new Error((namn ? namn + ': ' : '') + 'hittade inga Swish-betalningar i rapporten.');
    var ny = K.laggTillSwish(reg(), res.rader, idag());
    sparaReg(ny.reg);
    var ar = aktivt();
    var kopplade = (ar.bankrader || []).filter(function (r) { return K.swishForRad(ny.reg, r); }).length;
    logga((namn ? namn + ' (Swish-rapport): ' : 'Swish-rapport: ') + antal(res.rader.length, 'betalning', 'betalningar') + ', ' + antal(ny.nya, 'ny', 'nya') +
      '. ' + antal(kopplade, 'bankrad', 'bankrader') + ' i ' + store.aktivt + ' har nu avsändare och meddelande. Namnen sparas bara i medlemsregistret.');
    res.varningar.slice(0, 5).forEach(function (v) { logga(v, true); });
  }

  // Excel-filer (kontoutdrag eller Swish-rapport) läses som text, första bladet.
  async function excelTillText(fil) {
    var X = await laddaXlsx();
    var bok = X.read(await fil.arrayBuffer(), { type: 'array', cellDates: true });
    return X.utils.sheet_to_csv(bok.Sheets[bok.SheetNames[0]], { FS: ';', dateNF: 'yyyy-mm-dd' });
  }

  function sakertFilnamn(namn) { return String(namn).replace(/[\\/:*?"<>|]+/g, '_').slice(-120) || 'underlag'; }

  async function tolkaFil(fil) {
    var arNu = aktivt();
    var arPdf = fil.type === 'application/pdf' || /\.pdf$/i.test(fil.name);
    var block = arPdf
      ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: await blobTillBase64(fil) } }
      : await bildBlock(fil);
    var t = await tolkaMedClaude(arNu, block);
    var id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var n = K.normaliseraTolkning(t, { id: id, filnamn: sakertFilnamn(fil.name) });
    await sparaFil(id, fil, n.underlag.filnamn);
    if (n.bankrader) {
      setAktivt(K.laggTillUnderlag(aktivt(), n.underlag));
      logga(fil.name + ' (kontoutdrag): ' + importeraRader(n.bankrader, kontoForInlasning(JSON.stringify(n), fil.name)));
    } else {
      var u = n.underlag;
      var regel = K.hittaMotpartsregel(store.motpartsregler, u.motpart);
      if (regel) { u.foreslagetKonto = regel.konto; u.kontoKalla = 'inlart'; }
      var arId = arForDatum(u.forfallodatum || u.datum) || oppetAr();
      store.ar[arId] = K.laggTillUnderlag(store.ar[arId], u);
      spara();
      logga(fil.name + ': ' + (u.motpart || 'okänd motpart') + ', ' + kr(u.belopp) + ' kr' +
        (u.foreslagetKonto ? ', konto ' + u.foreslagetKonto + ' ' + K.kontonamn(store.ar[arId], u.foreslagetKonto) + ' (' + kontoKallaText(u) + ')' : ', inget konto föreslaget') +
        (arId !== store.aktivt ? ' (lagt i ' + arId + ')' : '') + '.');
    }
    n.varningar.forEach(function (v) { logga(fil.name + ': ' + v, true); });
  }

  async function lasInFiler(filer) {
    for (var i = 0; i < filer.length; i++) {
      var fil = filer[i];
      arbetar = 'Läser ' + fil.name + (filer.length > 1 ? ' (' + (i + 1) + ' av ' + filer.length + ')' : '') + '…';
      render();
      try {
        if (/\.(csv|txt|tsv|skv)$/i.test(fil.name) || /^text\//.test(fil.type)) await sparaOriginalfil(fil, importeraBanktext(await lasText(fil), fil.name));
        else if (/\.xlsx?$/i.test(fil.name)) await sparaOriginalfil(fil, importeraBanktext(await excelTillText(fil), fil.name));
        else if (fil.type === 'application/pdf' || /\.pdf$/i.test(fil.name) || /^image\//.test(fil.type)) await tolkaFil(fil);
        else throw new Error('okänd filtyp.');
      } catch (err) {
        logga(fil.name + ': ' + claudeFel(err), true);
      }
    }
    arbetar = null;
    render();
  }

  // Väntande underlag i andra räkenskapsår, t.ex. en decemberfaktura som betalas i januari.
  function andraArsUnderlag() {
    var ut = [];
    Object.keys(store.ar).forEach(function (id) {
      if (id === store.aktivt) return;
      K.oppnaUnderlag(store.ar[id]).forEach(function (u) { ut.push({ arId: id, underlag: u }); });
    });
    return ut;
  }

  function forslagMedVal(ar, rad) {
    var val = inkorgVal[rad.id] || {};
    var f = K.forslagForBankrad(ar, rad, store.regler, val.underlagIds ? { underlagIds: val.underlagIds, ungefar: !!val.ungefar } : undefined);
    if (val.konto != null && f.rader.length === 2) f.rader[1].konto = val.konto.trim();
    if (f.kalla === 'overforing' && f.rader.length === 2) f.text = 'Överföring ' + (rad.belopp < 0 ? 'till ' : 'från ') + banknamn(f.rader[1].konto, ar);
    if (val.text != null) f.text = val.text;
    // Inbetalningar och bankavgifter syns i bankutdraget och behöver inget eget underlag.
    if (!f.underlagIds.length && f.rader.length === 2 && (rad.belopp > 0 || f.rader[1].konto === '6570')) f.underlagKommentar = 'Bankutdrag';
    // Terminsavgift: ett känt Swish-nummer med rätt belopp, eller det du valt i panelen.
    // Insättningar från Fritidskortet är också avgifter, för de barn som står på insättningsuppgiften.
    var fk = f.kalla === 'underlag' && val.konto == null ? fritidskortFor(rad) : null;
    var a = val.konto == null && (fk || (f.kalla !== 'underlag' && f.kalla !== 'overforing')) ? avgiftForRad(rad, fk) : null;
    if (a && a.poster) {
      try {
        if (!K.giltigtTerminId(a.termin)) throw new Error('Terminen ska skrivas som VT-27 eller HT-26.');
        f.rader = K.avgiftsrader(reg(), a.poster, rad.konto, rad.belopp);
        f.text = val.text != null ? val.text : K.avgiftstext(reg(), a.termin, a.poster) + (fk ? ', Fritidskortet' : '');
        f.kalla = 'avgift';
        if (!fk) { f.underlagIds = []; f.underlagKommentar = 'Bankutdrag'; }
        f.avgift = a;
      } catch (e) { f.avgiftFel = e.fel ? e.fel.join(' ') : e.message; if (a.manuell) f.rader = [f.rader[0], { konto: '', belopp: -rad.belopp }]; }
    }
    f.komplett = f.rader.every(function (r) { return ar.kontoplan.some(function (k) { return k.nr === r.konto; }) || (f.avrundning && r.konto === K.AVRUNDNINGSKONTO.nr); });
    return f;
  }

  function larAv(rad, rader) {
    if (rader.length === 2) store.regler = K.larRegel(store.regler, rad.text, rad.belopp, rader[1].konto, rad.referens);
  }

  function bokforBankrad(ar, rad) {
    var f = forslagMedVal(ar, rad);
    if (!f.komplett) throw new Error('Välj konto för ' + rad.datum + ' ' + rad.text + ' först.');
    var res = K.bokforKopplat(ar, {
      datum: f.datum, text: f.text, rader: f.rader, underlagKommentar: f.underlagKommentar, registrerad: new Date().toISOString()
    }, { bankradId: rad.id, underlagIds: f.underlagIds });
    // En överföring: raden på det andra kontot kopplas till samma verifikation.
    if (f.kalla === 'overforing') res.ar = K.kopplaBokforda(res.ar).ar;
    if (f.avgift) {
      var r = K.registreraBetalning(reg(), {
        datum: rad.datum, belopp: rad.belopp, termin: f.avgift.termin, nyckel: f.avgift.betalare.nyckel,
        arId: store.aktivt, ver: res.verifikation.nr, bankradId: rad.id, poster: f.avgift.poster
      });
      if (f.avgift.komIhag) { r = K.kopplaBetalare(r, f.avgift.betalare, f.avgift.poster.map(function (p) { return p.medlem; })); r = namngeBetalare(r, f.avgift.betalare, rad); }
      store.medlemsregister = r;
      delete avgiftUtkast[rad.id];
    } else larAv(rad, f.rader);
    store.ar[store.aktivt] = res.ar;
    larAvUnderlag(res.ar, f.underlagIds, f.rader);
    res.ar = K.tillampaMotpartsregler(res.ar, store.motpartsregler);
    delete inkorgVal[rad.id];
    return res;
  }

  function radTillUtkast(r) {
    return { konto: r.konto, debet: r.belopp > 0 ? K.formatBelopp(r.belopp) : '', kredit: r.belopp < 0 ? K.formatBelopp(-r.belopp) : '' };
  }

  // ---------- Fakturor och kvitton ----------

  function nyttId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function hitta(lista, id) { return (store[lista] || []).find(function (x) { return x.id === id; }) || null; }
  function rader(text) { return String(text || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean); }

  var logoSaknas = false;

  // Logotypen ligger i webbläsaren och, när appen är kopplad, i OneDrive. Den lokala kopian märks
  // med OneDrive-filens id så att en ny logotyp från en annan enhet hämtas igen.
  function laddaLogo() {
    logoSaknas = false;
    if (!store.forening.harLogotyp) { logoUrl = null; return Promise.resolve(); }
    var odId = store.forening.logoOdId;
    return hamtaFil('logotyp').then(function (rec) {
      var inaktuell = rec && odId && rec.namn !== odId && rec.namn !== 'lokal';
      if ((rec && !inaktuell) || !odId || !odAnslutet()) return rec;
      return graf('/drives/' + od.mapp.driveId + '/items/' + odId + '/content', { ra: true })
        .then(function (res) { return res.blob(); })
        .then(function (blob) { return sparaFil('logotyp', blob, odId).then(function () { return { blob: blob }; }); })
        .catch(function () { return rec || null; });
    }).then(function (rec) {
      if (!rec) { logoUrl = null; logoSaknas = true; return; }
      return blobTillBase64(rec.blob).then(function (b64) { logoUrl = 'data:' + (rec.blob.type || 'image/png') + ';base64,' + b64; });
    }).catch(function () { logoUrl = null; });
  }

  // Föreningens logotyp som ikon i webbläsarfliken (och som ikon på hemskärmen), när den finns.
  var IKON_STANDARD = null;
  var ikonForLogo = null;
  function sattIkon() {
    var el = document.getElementById('ikon');
    if (!IKON_STANDARD) IKON_STANDARD = el.href;
    if (ikonForLogo === logoUrl) return;
    ikonForLogo = logoUrl;
    if (!logoUrl) { el.href = IKON_STANDARD; return; }
    var bild = new Image();
    bild.onload = function () {
      // Rund ikon i 128 px med vit bakgrund, så att den syns i både ljusa och mörka flikar.
      var c = document.createElement('canvas');
      c.width = c.height = 128;
      var g = c.getContext('2d');
      g.beginPath(); g.arc(64, 64, 64, 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill(); g.clip();
      var skala = Math.min(120 / bild.width, 120 / bild.height);
      var w = bild.width * skala, h = bild.height * skala;
      g.drawImage(bild, (128 - w) / 2, (128 - h) / 2, w, h);
      el.href = c.toDataURL('image/png');
      var apple = document.getElementById('ikon-apple');
      if (!apple) { apple = document.createElement('link'); apple.rel = 'apple-touch-icon'; apple.id = 'ikon-apple'; document.head.appendChild(apple); }
      apple.href = el.href;
    };
    bild.src = logoUrl;
  }

  function nyttDokUtkast(typ) {
    var d = idag();
    return {
      typ: typ, mottagareId: '', mottagare: { namn: '', foretag: '', adress: '', epost: '', telefon: '' },
      adressId: store.adresser[0] ? store.adresser[0].id : '', kontaktId: store.kontakter[0] ? store.kontakter[0].id : '',
      datum: d, forfallodatum: K.laggTillDagar(d, 30), betaldDatum: typ === 'kvitto' ? d : '', betalsatt: typ === 'kvitto' ? 'Swish' : '',
      rader: [{ artikelId: '', antal: '1', beskrivning: '', pris: '', konto: '' }], verifikation: null
    };
  }

  function utkastTillDokument() {
    var fel = [];
    var radlista = dokUtkast.rader.filter(function (r) { return r.beskrivning || r.pris; }).map(function (r, i) {
      var pris = 0;
      try { pris = K.parseBelopp(r.pris || '0'); } catch (e) { fel.push('Rad ' + (i + 1) + ': ' + e.message); }
      return { antal: Number(String(r.antal).replace(',', '.')), beskrivning: r.beskrivning.trim(), pris: pris, konto: (r.konto || '').trim() };
    });
    var dok = {
      typ: dokUtkast.typ, datum: dokUtkast.datum,
      forfallodatum: dokUtkast.typ === 'faktura' ? dokUtkast.forfallodatum : '',
      mottagare: Object.assign({}, dokUtkast.mottagare), rader: radlista
    };
    if (dokUtkast.typ === 'kvitto') { dok.betaldDatum = dokUtkast.betaldDatum; dok.betalsatt = dokUtkast.betalsatt; }
    return { fel: fel.concat(K.valideraDokument(dok)), dok: dok };
  }

  function dokStatus(d) {
    if (d.makulerad) return { text: 'Makulerad', klass: 'muted' };
    if (d.typ === 'kvitto') return { text: d.verifikation ? 'Utfärdat (ver ' + d.verifikation.nr + ')' : 'Utfärdat', klass: '' };
    var ar = store.ar[d.arId];
    var u = ar && (ar.underlag || []).find(function (x) { return x.id === d.underlagId; });
    if (u && u.verifikation != null) return { text: 'Betald (ver ' + u.verifikation + ')', klass: 'ok' };
    if (d.forfallodatum < idag()) return { text: 'Förfallen', klass: 'fel' };
    return { text: 'Väntar på betalning', klass: '' };
  }

  // Fakturans eller kvittots innehåll, i samma upplägg som föreningens Excelmall.
  function dokumentInnehall(d) {
    var f = d.forening || {};
    var arF = d.typ === 'faktura';
    var meta = arF
      ? [['Fakturadatum', d.datum], ['Fakturanr', d.nummer], ['Förfallodatum', d.forfallodatum]]
      : [['Kvittonr', d.nummer], ['Utskrivningsdatum', d.datum], ['Betaldatum', d.betaldDatum], ['Betalsätt', d.betalsatt], ['Org.nummer', f.orgnr]];
    var m = d.mottagare || {}, ref = d.referens || {};
    var html = '<div class="dok"><div class="dok-huvud"><div>' +
      (d.logo ? '<img class="dok-logo" src="' + esc(d.logo) + '" alt="">' : '') +
      '<div class="dok-forening">' + esc(f.namn) + '</div></div><div>' +
      '<div class="dok-titel">' + (arF ? 'Faktura' : 'Kvitto') + '</div><table class="dok-meta">' +
      meta.filter(function (x) { return x[1]; }).map(function (x) { return '<tr><td>' + x[0] + ':</td><td>' + esc(x[1]) + '</td></tr>'; }).join('') +
      '</table></div></div>';
    html += '<div class="dok-parter"><div><div class="dok-etikett">' + (arF ? 'Fakturamottagare' : 'Mottagare') + '</div>' +
      [m.namn, m.foretag].concat(rader(m.adress), [m.telefon, m.epost]).filter(Boolean).map(esc).join('<br>') + '</div>' +
      (ref.namn ? '<div><div class="dok-etikett">Vår referens</div>' + [ref.namn, ref.epost, ref.mobil].filter(Boolean).map(esc).join('<br>') + '</div>' : '') + '</div>';
    html += '<table class="dok-rader"><thead><tr><th class="num">Kvantitet</th><th>Beskrivning</th><th class="num">á pris</th><th class="num">Total</th></tr></thead><tbody>' +
      d.rader.map(function (r) {
        return '<tr><td class="num">' + esc(String(r.antal).replace('.', ',')) + '</td><td>' + esc(r.beskrivning) + '</td><td class="num">' + kr(r.pris) + ' kr</td><td class="num">' + kr(K.dokumentRadTotal(r)) + ' kr</td></tr>';
      }).join('') + '</tbody></table>';
    var summa = K.dokumentSumma(d);
    html += '<table class="dok-summa"><tr class="total"><td>' + (arF ? 'Att betala' : 'Totalt betalt') + '</td><td class="num">' + kr(summa) + ' kr</td></tr></table>' +
      '<div class="dok-moms">Föreningen är inte momsregistrerad.</div>';
    if (arF) {
      var falt = [['Att betala', kr(summa) + ' kr'], ['Förfallodatum', d.forfallodatum]];
      if (f.bankgiro) falt.push(['Bankgiro', f.bankgiro]);
      if (f.swish) falt.push(['Swish', f.swish]);
      falt.push(['Referens', d.nummer]);
      html += '<div class="dok-betalning">' + falt.map(function (x) {
        return '<div><div class="etikett">' + x[0] + '</div><div class="varde">' + esc(x[1]) + '</div></div>';
      }).join('') + '</div><div class="dok-info">Ange fakturanumret som referens eller meddelande när du betalar.</div>';
    } else {
      html += '<div class="dok-kvittoinfo"><div>Beloppet ovan är betalt till ' + esc(f.namn || 'föreningen') +
        (d.betaldDatum ? ' den ' + esc(d.betaldDatum) : '') + (d.betalsatt ? ' via ' + esc(d.betalsatt === 'Swish' ? d.betalsatt : d.betalsatt.toLowerCase()) : '') + '. Tack!</div>' +
        '<div class="dok-stampel">BETALD</div></div>';
    }
    html += '<div class="dok-fot"><div><strong>Adress</strong><br>' + [f.namn].concat(rader(d.avsandare)).filter(Boolean).map(esc).join('<br>') + '</div>' +
      '<div>' + (f.webb ? '<strong>Webb</strong><br>' + esc(f.webb) + '<br>' : '') + (f.epost ? '<strong>E-post</strong><br>' + esc(f.epost) : '') + '</div>' +
      '<div>' + (f.orgnr ? '<strong>Org.nummer</strong><br>' + esc(f.orgnr) + '<br>' : '') + (f.bankgiro ? '<strong>Bankgiro</strong><br>' + esc(f.bankgiro) : '') + '</div></div>';
    return html + '</div>';
  }

  // En fristående kopia (HTML) som sparas som underlag och kan öppnas och skrivas ut igen.
  function dokumentFil(d) {
    var css = Array.from(document.querySelectorAll('style')).map(function (x) { return x.textContent; }).join('\n');
    return '<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><title>' + esc((d.typ === 'faktura' ? 'Faktura ' : 'Kvitto ') + d.nummer) + '</title>' +
      '<style>' + css + '\nbody{background:#eee}@media print{body{background:#fff}.dok{width:auto;padding:0}}</style></head><body>' + dokumentInnehall(d) + '</body></html>';
  }

  function skrivUt(d) {
    document.getElementById('utskrift').innerHTML = dokumentInnehall(d);
    document.body.classList.add('skriver-dokument');
    var klar = function () { document.body.classList.remove('skriver-dokument'); window.removeEventListener('afterprint', klar); };
    window.addEventListener('afterprint', klar);
    window.print();
    setTimeout(klar, 1000);
  }

  // ---------- PDF ----------
  // Fakturor, kvitton och årsmöteshandlingar ritas som riktiga PDF-filer (A4, sökbar text) med jsPDF.

  var jspdfLaddas = null;
  var jszipLaddas = null;
  function laddaJsZip() {
    if (window.JSZip) return Promise.resolve(window.JSZip);
    if (!jszipLaddas) {
      jszipLaddas = new Promise(function (ok, fel) {
        var sk = document.createElement('script');
        sk.src = JSZIP_URL;
        sk.onload = function () { ok(window.JSZip); };
        sk.onerror = function () { jszipLaddas = null; fel(new Error('Verktyget för zip-filer kunde inte laddas. Kontrollera internetanslutningen.')); };
        document.head.appendChild(sk);
      });
    }
    return jszipLaddas;
  }

  var xlsxLaddas = null;
  function laddaXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxLaddas) {
      xlsxLaddas = new Promise(function (ok, fel) {
        var sk = document.createElement('script');
        sk.src = XLSX_URL;
        sk.onload = function () { ok(window.XLSX); };
        sk.onerror = function () { xlsxLaddas = null; fel(new Error('Verktyget för Excel-filer kunde inte laddas. Kontrollera internetanslutningen.')); };
        document.head.appendChild(sk);
      });
    }
    return xlsxLaddas;
  }

  // Läser en Excel-arbetsbok i webbläsaren. Filen skickas ingenstans.
  async function lasArbetsbok(fil) {
    var X = await laddaXlsx();
    var wb = X.read(await fil.arrayBuffer(), { cellDates: true });
    var flikar = {};
    wb.SheetNames.forEach(function (n) {
      flikar[n] = X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }).map(function (r) {
        return r.map(function (c) { return c instanceof Date ? new Date(c.getTime() - c.getTimezoneOffset() * 60000).toISOString().slice(0, 10) : c; });
      });
    });
    return { flikar: flikar };
  }

  function laddaJsPdf() {
    if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
    if (!jspdfLaddas) {
      jspdfLaddas = new Promise(function (ok, fel) {
        var sk = document.createElement('script');
        sk.src = JSPDF_URL;
        sk.onload = function () { ok(window.jspdf.jsPDF); };
        sk.onerror = function () { jspdfLaddas = null; fel(new Error('PDF-verktyget kunde inte laddas. Kontrollera internetanslutningen.')); };
        document.head.appendChild(sk);
      });
    }
    return jspdfLaddas;
  }

  // PDF:ens standardtypsnitt klarar svenska bokstäver men inte alla specialtecken.
  function pt(t) {
    return String(t == null ? '' : t).replace(/[\u2212\u2013\u2014]/g, '-').replace(/[\u00a0\u202f]/g, ' ').replace(/\u2192/g, '->').replace(/\u2026/g, '...');
  }
  function krPdf(ore) { return pt(kr(ore)) + ' kr'; }

  var SKIFFER = [55, 63, 81], GRA = [85, 85, 85], LINJE = [200, 203, 210];

  function nyPdf(JsPdf, liggande) {
    var doc = new JsPdf({ unit: 'mm', format: 'a4', orientation: liggande ? 'landscape' : 'portrait' });
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(26, 26, 26);
    return doc;
  }

  function ritaLogo(doc, x, y, maxB, maxH) {
    if (!logoUrl) return 0;
    try {
      var prop = doc.getImageProperties(logoUrl);
      var skala = Math.min(maxB / prop.width, maxH / prop.height);
      var b = prop.width * skala, h = prop.height * skala;
      doc.addImage(logoUrl, prop.fileType || 'JPEG', x, y, b, h);
      return h;
    } catch (e) { return 0; }
  }

  function etikett(doc, text, x, y) {
    doc.setFontSize(7.5); doc.setTextColor.apply(doc, GRA);
    doc.text(pt(text).toUpperCase(), x, y, { charSpace: 0.2 });
    doc.setTextColor(26, 26, 26);
  }

    doc.setTextColor(26, 26, 26);
    var meta = arF
      ? [['Fakturadatum', d.datum], ['Fakturanr', d.nummer], ['Förfallodatum', d.forfallodatum]]

      doc.text(pt(m[0]) + ':', 140, y);

    // Mottagare och referens

    if (ref.namn) etikett(doc, 'Vår referens', 110, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    var mRader = [m.namn, m.foretag].concat(rader(m.adress), [m.telefon, m.epost]).filter(Boolean);

    refRader.forEach(function (r, i) { doc.text(pt(r), 110, y + 5 + i * 4.6); });
    y += 8 + Math.max(mRader.length, refRader.length) * 4.6;
    // Rader
    var kol = { antal: 32, beskr: 37, pris: 160, total: H };
    var rubrik = function () {

      doc.setTextColor(26, 26, 26);

      y += 7;
    };
    rubrik();
    doc.setFontSize(10);
    d.rader.forEach(function (r) {
      var text = doc.splitTextToSize(pt(r.beskrivning), 95);
      if (y + text.length * 4.6 > 230) { doc.addPage(); y = 20; rubrik(); doc.setFontSize(10); }
      doc.setFont('helvetica', 'normal');
      doc.text(pt(String(r.antal).replace('.', ',')), kol.antal, y, { align: 'right' });
      doc.text(text, kol.beskr, y);
      doc.text(krPdf(r.pris), kol.pris, y, { align: 'right' });
      doc.text(krPdf(K.dokumentRadTotal(r)), kol.total, y, { align: 'right' });
      y += text.length * 4.6 + 1.5;
      doc.setDrawColor.apply(doc, LINJE); doc.setLineWidth(0.2); doc.line(V, y - 3, H, y - 3);
    });
    // Summa
    var summa = K.dokumentSumma(d);

    y += 14;
    if (arF) {

      falt.forEach(function (x, i) {

        etikett(doc, x[0], bx + 3, y + 5);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(i ? 10.5 : 12);
        doc.text(pt(x[1]), bx + 3, y + 11.5);
      });
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);

        (d.betalsatt ? ' via ' + (d.betalsatt === 'Swish' ? d.betalsatt : d.betalsatt.toLowerCase()) : '') + '. Tack!'), 115);

    // Sidfot på varje sida
    var sidor = doc.getNumberOfPages();
    for (var s2 = 1; s2 <= sidor; s2++) {

      doc.setFontSize(8); doc.setFont('helvetica', 'bold');

      if (f.orgnr) doc.text('Org.nummer', 140, fy + 5);
      doc.setFont('helvetica', 'normal');
      [f.namn].concat(rader(d.avsandare)).filter(Boolean).forEach(function (r, i) { doc.text(pt(r), V, fy + 9 + i * 3.8); });
      var mitt = [];
      if (f.webb) mitt.push(f.webb);
      if (f.webb && f.epost) mitt.push('');
      if (f.epost) mitt.push(f.epost);
      mitt.forEach(function (r, i) { doc.text(pt(r), 80, fy + 9 + i * 3.8); });
      if (f.webb && f.epost) { doc.setFont('helvetica', 'bold'); doc.text('E-post', 80, fy + 9 + 3.8); doc.setFont('helvetica', 'normal'); }
      if (f.orgnr) doc.text(pt(f.orgnr), 140, fy + 9);
      if (f.bankgiro) { doc.setFont('helvetica', 'bold'); doc.text('Bankgiro', 140, fy + 9 + 3.8 + 1); doc.setFont('helvetica', 'normal'); doc.text(pt(f.bankgiro), 140, fy + 9 + 7.6 + 1); }
      if (sidor > 1) { doc.setTextColor.apply(doc, GRA); doc.text('Sida ' + s2 + ' av ' + sidor, H, 290, { align: 'right' }); doc.setTextColor(26, 26, 26); }
    }
    doc.setProperties({ title: (arF ? 'Faktura ' : 'Kvitto ') + d.nummer, author: f.namn || '', creator: 'Föreningsbokföring' });
    return doc.output('blob');

  async function skapaArsmotePdf(ar) {
    var doc = nyPdf(await laddaJsPdf());
    var a = arsmoteData(ar);
    var f = store.forening;
    var fg = foregaende(ar);
    var rr = K.resultatrakning(ar, { foregaende: fg });
    var br = K.balansrakning(ar);
    var V = 15, H = 195, NED = 275;
    var y;
    var nySidaOm = function (behov) { if (y + behov > NED) { doc.addPage(); y = 20; } };
    // Sidhuvud
    var logoH = ritaLogo(doc, V, 14, 24, 22);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
    var ny = 14 + (logoH ? logoH + 6 : 4);
    doc.text(pt(f.namn || ''), V, ny);
    if (f.orgnr) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.text('Org.nr ' + pt(f.orgnr), V, ny + 5); }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor.apply(doc, SKIFFER);
    doc.text('Ekonomisk redovisning', H, 22, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(26, 26, 26);
    doc.text('Räkenskapsåret ' + ar.start + ' - ' + ar.slut, H, 28, { align: 'right' });
    y = ny + 14;
    var rubrik = function (text) {
      nySidaOm(16);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor.apply(doc, SKIFFER);
      doc.text(pt(text), V, y);
      doc.setDrawColor.apply(doc, SKIFFER); doc.setLineWidth(0.4); doc.line(V, y + 1.8, H, y + 1.8);
      doc.setTextColor(26, 26, 26);
      y += 8;
    };
    var stycke = function (text) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
      rader(text).forEach(function (r) {
        doc.splitTextToSize(pt(r), H - V).forEach(function (rad) { nySidaOm(5); doc.text(rad, V, y); y += 4.8; });
        y += 1.5;
      });
      y += 3;
    };
    var tabell = function (rubrikNu, rubrikFg, raderna) {
      nySidaOm(12);
      doc.setFontSize(8); doc.setTextColor.apply(doc, GRA);
      doc.text(pt(rubrikNu), 160, y, { align: 'right' }); doc.text(pt(rubrikFg), H, y, { align: 'right' });
      doc.setTextColor(26, 26, 26);
      y += 5;
      raderna.forEach(function (r) {
        nySidaOm(6);
        if (r.typ === 'grupp') { doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.text(pt(r.text), V, y); y += 5; return; }
        if (r.typ === 'summa' || r.typ === 'total') {
          doc.setDrawColor.apply(doc, r.typ === 'total' ? [26, 26, 26] : [150, 150, 150]); doc.setLineWidth(r.typ === 'total' ? 0.4 : 0.2);
          doc.line(V, y - 3.6, H, y - 3.6);
          doc.setFont('helvetica', 'bold');
        } else doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.text(pt(r.text), V + (r.typ ? 0 : 2), y);
        doc.text(pt(r.nu), 160, y, { align: 'right' });
        doc.text(pt(r.fg), H, y, { align: 'right' });
        y += r.typ === 'total' ? 7 : 5;
      });
      y += 4;
    };
    rubrik('Ekonomisk berättelse');
    if (a.berattelse) stycke(a.berattelse); else { doc.setFontSize(10); doc.text('(Ingen berättelse ifylld.)', V, y); y += 8; }
    rubrik('Resultaträkning');
    var rrRader = [];
    rr.grupper.forEach(function (g) {
      rrRader.push({ typ: 'grupp', text: g.namn });
      g.konton.forEach(function (r) { rrRader.push({ text: r.namn, nu: kr(r.belopp), fg: fg ? kr(r.jamforelse) : '' }); });
      rrRader.push({ typ: 'summa', text: 'Summa ' + g.namn.toLowerCase(), nu: kr(g.summa), fg: fg ? kr(g.jamforelse) : '' });
    });
    rrRader.push({ typ: 'total', text: 'Årets resultat', nu: kr(rr.aretsResultat), fg: fg ? kr(rr.jamforelseResultat) : '' });
    tabell(K.arNamn(ar), fg ? K.arNamn(fg) : '', rrRader);
    rubrik('Balansräkning');
    var brRader = [];
    [['Tillgångar', br.tillgangar], ['Eget kapital och skulder', br.egetKapitalOchSkulder]].forEach(function (dd) {
      dd[1].grupper.forEach(function (g) {
        brRader.push({ typ: 'grupp', text: g.namn });
        g.konton.forEach(function (r) { brRader.push({ text: r.namn, nu: kr(r.belopp), fg: kr(r.jamforelse) }); });
      });
      brRader.push({ typ: 'total', text: 'Summa ' + dd[0].toLowerCase(), nu: kr(dd[1].summa), fg: kr(dd[1].ingaende) });
    });
    tabell(ar.slut, K.laggTillDagar(ar.start, -1), brRader);
    var res = rr.aretsResultat;
    var noter = arsmoteNoter(ar);
    if (noter.length) {
      rubrik('Noter');
      noter.forEach(function (n, i) {
        nySidaOm(12);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.text(pt('Not ' + (i + 1) + ' ' + n.rubrik), V, y); y += 5;
        stycke(n.text);
      });
    }
    rubrik('Förslag till resultatdisposition');
    stycke(a.forslag || ('Styrelsen föreslår att årets resultat, ' + (res < 0 ? 'underskott ' : 'överskott ') + kr(Math.abs(res)) + ' kr, balanseras i ny räkning.'));
    rubrik('Redovisningsprinciper');
    stycke(a.principer);
    var namnLista = rader(a.underskrifter);
    if (!namnLista.length) namnLista = ['', '', ''];
    nySidaOm(30 + Math.ceil(namnLista.length / 2) * 22);
    rubrik('Underskrifter');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text(pt([a.ort, a.datum].filter(Boolean).join(' ') || 'Ort och datum: ______________________'), V, y); y += 16;
    namnLista.forEach(function (n, i) {
      var x = i % 2 ? 110 : V;
      doc.setDrawColor(26, 26, 26); doc.setLineWidth(0.3); doc.line(x, y, x + 80, y);
      doc.setFontSize(9.5); doc.text(pt(n), x, y + 4.5);
      if (i % 2 || i === namnLista.length - 1) y += 22;
    });
    var sidor = doc.getNumberOfPages();
    for (var s3 = 1; s3 <= sidor; s3++) {
      doc.setPage(s3);
      doc.setFontSize(8); doc.setTextColor.apply(doc, GRA);
      doc.text(pt((f.namn || '') + ' · Ekonomisk redovisning ' + K.arNamn(ar)), V, 290);
      doc.text('Sida ' + s3 + ' av ' + sidor, H, 290, { align: 'right' });
      doc.setTextColor(26, 26, 26);
    }
    doc.setProperties({ title: 'Ekonomisk redovisning ' + K.arNamn(ar), author: f.namn || '', creator: 'Föreningsbokföring' });
    return doc.output('blob');
  }

  // ---------- Bild av fakturor och kvitton (för chattappar som inte tar emot PDF) ----------

  var html2canvasLaddas = null;
  function laddaHtml2canvas() {
    if (window.html2canvas) return Promise.resolve(window.html2canvas);
    if (!html2canvasLaddas) {
      html2canvasLaddas = new Promise(function (ok, fel) {
        var sk = document.createElement('script');
        sk.src = HTML2CANVAS_URL;
        sk.onload = function () { ok(window.html2canvas); };
        sk.onerror = function () { html2canvasLaddas = null; fel(new Error('Bildverktyget kunde inte laddas. Kontrollera internetanslutningen.')); };
        document.head.appendChild(sk);
      });
    }
    return html2canvasLaddas;
  }

  // Ritar A4-sidan utanför skärmen och gör den till en JPEG i dubbel upplösning.
  async function skapaDokumentBild(d) {
    var h2c = await laddaHtml2canvas();
    var ram = document.createElement('div');
    ram.style.cssText = 'position:fixed;left:-10000px;top:0;width:800px;background:#fff;';
    ram.innerHTML = dokumentInnehall(d);
    document.body.appendChild(ram);
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      var canvas = await h2c(ram.querySelector('.dok'), { scale: 2, backgroundColor: '#ffffff', logging: false });
      return await new Promise(function (ok, fel) {
        canvas.toBlob(function (b) { if (b) ok(b); else fel(new Error('Bilden kunde inte skapas.')); }, 'image/jpeg', 0.9);
      });
    } finally {
      ram.remove();
    }
  }

  var RAPPORTTITLAR = { rr: 'Resultaträkning', br: 'Balansräkning', sb: 'Saldobalans', gb: 'Grundbok', hb: 'Huvudbok', hball: 'Huvudbok', bank: 'Bankavstämning' };

  // Sidfot på varje sida: text till vänster och "Sida x av y" till höger. Klarar stående och liggande sidor.
  function sidfot(doc, text, franSida) {
    var sidor = doc.getNumberOfPages();
    for (var i = franSida || 1; i <= sidor; i++) {
      doc.setPage(i);
      var b = doc.internal.pageSize.getWidth(), h = doc.internal.pageSize.getHeight();
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor.apply(doc, GRA);
      doc.text(pt(text), 15, h - 7);
      doc.text('Sida ' + i + ' av ' + sidor, b - 15, h - 7, { align: 'right' });

  // Årsrapporten: försättsida, innehållsförteckning, rapporterna och en sida för underskrifter, i en PDF.
  // opt: { huvudbok, underskrifter (sida för papper), elektroniska (årsrapportposten med underskrifterna) }
  async function skapaArsrapportPdf(ar, opt) {
    opt = opt || {};
    var doc = nyPdf(await laddaJsPdf());
    var f = store.forening, arN = K.arNamn(ar), status = K.arsrapportStatus(ar);
    var mitt = 105;
    // Försättsida
    var logoH = ritaLogo(doc, mitt - 22, 40, 44, 44);
    var y = logoH ? 40 + logoH + 18 : 80;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(24); doc.setTextColor.apply(doc, SKIFFER);
    doc.splitTextToSize(pt(f.namn || 'Föreningen'), 170).forEach(function (r) { doc.text(r, mitt, y, { align: 'center' }); y += 10; });
    doc.setTextColor(26, 26, 26);
    if (f.orgnr) { doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.text('Org.nr ' + pt(f.orgnr), mitt, y, { align: 'center' }); y += 8; }
    y += 22;
    doc.setDrawColor.apply(doc, LINJE); doc.setLineWidth(0.4); doc.line(mitt - 40, y - 12, mitt + 40, y - 12);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(30); doc.text(pt('Årsrapport ' + arN), mitt, y, { align: 'center' });
    y += 12;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(12);
    doc.text('Räkenskapsår ' + ar.start + ' - ' + ar.slut, mitt, y, { align: 'center' });
    y += 8;
    doc.setFontSize(11); doc.setTextColor.apply(doc, status === 'Bokslut' ? [40, 110, 60] : GRA);
    doc.text(pt(status), mitt, y, { align: 'center' });
    doc.setTextColor.apply(doc, GRA); doc.setFontSize(9);
    doc.text('Utskriven ' + idag(), mitt, 272, { align: 'center' });
    doc.setTextColor(26, 26, 26);
    // Innehållsförteckningen ritas sist, när sidnumren är kända.
    doc.addPage('a4', 'p');
    var delar = K.arsrapportInnehall(ar, { huvudbok: opt.huvudbok, underskrifter: opt.underskrifter, elektroniska: !!opt.elektroniska });
    for (var i = 0; i < delar.length; i++) {
      var del = delar[i];
      del.sida = doc.getNumberOfPages() + 1;
      if (del.typ === 'underskrifter') ritaUnderskrifter(doc, ar);
      else if (del.typ === 'esign') ritaElektroniska(doc, opt.elektroniska);
      else await skapaRapportPdf(ar, del.typ, null, { doc: doc });
    }
    doc.setPage(2);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor.apply(doc, SKIFFER);
    doc.text(pt('Innehåll'), 15, 30);
    doc.setTextColor(26, 26, 26); doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
    var ty = 45;
    delar.forEach(function (d) {
      doc.text(pt(d.titel), 15, ty);
      doc.text(String(d.sida), 195, ty, { align: 'right' });
      doc.setDrawColor.apply(doc, LINJE); doc.setLineWidth(0.2); doc.line(15, ty + 2.5, 195, ty + 2.5);

    });

  // Liten kontrollsumma över året, så att en ny PDF skapas när bokföringen ändras.
  function datastampel(ar, extra) {
    var t = JSON.stringify(ar) + '|' + (extra || '');
    var h = 5381;
    for (var i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  var arsrapportOppen = false, arsrapportHuvudbok = false, arsrapportPapper = null;

  function aktuellArsrapport(arId) { return (styrData().rapporter || []).filter(function (r) { return r.arId === arId && !r.ersatt; }).pop() || null; }
  function vyArsrapport(ar) {
    if (!arsrapportOppen) return '<div class="row ej-utskrift" style="margin:4px 0 10px"><button class="btn btn-secondary btn-small" data-action="arsrapport-visa">Årsrapport (PDF)…</button>' +

  // Elektronisk underskrift: skicka, följ upp, registrera papper och skapa den undertecknade versionen.
  // De som kan väljas att skriva under. I övningsläget, utan roller, två påhittade personer.
  function arsrapportPersoner() {
    var personer = styrPersoner();
    if (OVNING && !personer.length) personer = [{ epost: 'ordforande@example.com', namn: 'Ordförande Exempel', roller: ['ordforande'] }, { epost: 'kassor@example.com', namn: 'Kassör Exempel', roller: ['kassor'] }];
    return personer;
  }

  function vyArsrapportUnderskrift(ar) {
    var html = '<h4 style="margin:16px 0 6px">Elektronisk underskrift</h4>';
    var skriv = styrBeh('styr') === 'write';
    if (!odAnslutet() && !OVNING) return html + '<p class="faint" style="margin:0">Koppla appen till OneDrive för att skicka årsrapporten för underskrift.</p>';
    var r = aktuellArsrapport(store.aktivt);
    if (r) {
      var st = K.arsrapportUnderskrifter(r, arsrapportSummor[r.id]);
      if (arsrapportSummor[r.id] == null) sha256(K.arsrapportKontrolltext(ar)).then(function (x) { arsrapportSummor[r.id] = x; render(); });
      html += '<p style="margin:0 0 6px">Skickad ' + esc(String(r.tid || '').slice(0, 10)) + ' som <strong>' + esc((r.fil && r.fil.namn) || '') + '</strong>. ' +
        (st.klar ? '<span class="tag ok">alla har skrivit under</span>' : st.signerade.length + ' av ' + r.undertecknare.length + ' har skrivit under.') + '</p>';
      if (st.andrad) html += '<p class="fel" style="margin:0 0 6px">Bokföringen för året har ändrats efter att rapporten skickades. Skicka en ny version för underskrift.</p>';
      html += '<ul style="margin:0 0 8px">' + r.undertecknare.map(function (u) {
        var sg = st.signerade.find(function (x) { return x.epost === u.epost; });
        return '<li>' + esc(u.namn || u.epost) + (u.roll ? ' <span class="faint">' + esc(u.roll) + '</span>' : '') + ': ' +
          (sg ? '<span class="ok">' + (sg.metod === 'papper' ? 'på papper' : 'elektroniskt') + ' ' + esc(String(sg.tid || '').slice(0, 10)) + '</span>'
            : 'väntar' + (skriv ? ' <button class="btn btn-secondary btn-small" data-action="arsrapport-papper-reg" data-id="' + esc(r.id) + '" data-epost="' + esc(u.epost) + '">Skrev under på papper</button>' : '')) + '</li>';
      }).join('') + '</ul><div class="row">' +
        '<button class="btn btn-secondary btn-small" data-action="arsrapport-oppna" data-id="' + esc(r.id) + '">Öppna filen</button>' +
        (st.signerade.length && !st.andrad ? '<button class="btn btn-small" data-action="arsrapport-undertecknad" data-id="' + esc(r.id) + '">Skapa undertecknad version</button>' : '') +
        (skriv && !st.signerade.length ? '<button class="btn btn-secondary btn-small" data-action="arsrapport-esign-bort" data-id="' + esc(r.id) + '">Ta tillbaka</button>' : '') + '</div>';
      if (!st.andrad) return html;
      html += '<p class="faint" style="margin:10px 0 4px">Ny version:</p>';
    }
    if (!skriv) return html + '<p class="faint" style="margin:0">Du kan inte ändra styrelsens material, så du kan inte skicka rapporten för underskrift.</p>';
    var personer = arsrapportPersoner();
    if (!personer.length) return html + '<p class="faint" style="margin:0">Lägg först in styrelsen under Inställningar, Roller och skrivrätt.</p>';
    html += '<p class="faint" style="margin:0 0 6px">Årsrapporten sparas som PDF i ' + esc(od.styrRot ? STYRARBETE + '/' + MOTEN + '/' : 'styrelsens mapp, ') + esc(K.motesmapp('arsmote', (Number(ar.slut.slice(0, 4)) + 1) + '-01-01')) +
      '. De som ska skriva under ser den under Styrelsen, Möten, och skriver under med sitt Microsoft-konto. Den som inte kan logga in kan skriva under på papper.</p>' +
      personer.map(function (p) {
        var kan = OVNING || kanLoggaIn(p.epost);
        return '<label style="font-weight:normal;display:flex;gap:8px;align-items:center;margin:2px 0"><input type="checkbox" data-arsund="' + esc(p.epost) + '" style="width:auto" checked>' +
          esc(p.namn) + ' <span class="faint">' + esc((p.roller || []).map(rollnamn).join(', ')) + (kan ? '' : ' · kan inte logga in, skriver under på papper') + '</span></label>';
      }).join('') +
      '<div class="row" style="margin-top:6px"><button class="btn btn-small" data-action="arsrapport-skicka">Skicka för underskrift</button></div>';
    return html;
  }

  function rapportPdfKnappar(ar, typ, konto) {
    var fg = foregaende(ar);
    var namn = K.sakertNamn(RAPPORTTITLAR[typ] + (typ === 'hb' ? ' ' + konto : '') + ' ' + K.arNamn(ar).replace('/', '-') + '.pdf');
    var nyckel = 'rapport-' + typ + '-' + store.aktivt + '-' + datastampel(ar, (konto || '') + (fg ? datastampel(fg) : '') + (store.forening.namn || '') + (logoUrl ? logoUrl.length : 0)) + '|' + namn;
    forbered(nyckel, function () { return skapaRapportPdf(ar, typ, konto); });
    return '<div class="row ej-utskrift" style="margin:10px 0">' + pdfKnappar(nyckel, 'skriv-ut') + '</div>';
  }

  function dokumentFilnamn(d) { return K.sakertNamn((d.typ === 'faktura' ? 'Faktura ' : 'Kvitto ') + d.nummer + '.pdf'); }
  function arsmoteFilnamn(ar) { return K.sakertNamn('Ekonomisk redovisning ' + K.arNamn(ar).replace('/', '-') + '.pdf'); }

  // PDF:en skapas i förväg när förhandsvisningen öppnas, så att delningsmenyn kan öppnas direkt
  // när man trycker (Safari kräver att delning startar direkt i samband med trycket).
  var pdfCache = {};
  function forbered(nyckel, skapa) {
    if (pdfCache[nyckel]) return;
    pdfCache[nyckel] = { status: 'skapas' };
    skapa().then(function (blob) { pdfCache[nyckel] = { status: 'klar', blob: blob }; uppdateraPdfKnappar(); },
      function (err) { pdfCache[nyckel] = { status: 'fel', fel: err.message }; uppdateraPdfKnappar(); });
  }
  function uppdateraPdfKnappar() {
    document.querySelectorAll('[data-pdf]').forEach(function (b) {
      var c = pdfCache[b.dataset.pdf];
      b.disabled = !c || c.status !== 'klar';
      if (c && c.status === 'fel') b.title = c.fel;
    });
    document.querySelectorAll('[data-pdf-status]').forEach(function (el) {
      var nycklar = el.dataset.pdfStatus.split(',');
      var cs = nycklar.map(function (n) { return pdfCache[n]; });
      var skapas = cs.some(function (c) { return !c || c.status === 'skapas'; });
      var fel = cs.filter(function (c) { return c && c.status === 'fel'; }).map(function (c) { return c.fel; });
      el.textContent = skapas ? 'Skapar filer…' : fel.join(' ');
      el.className = 'faint' + (fel.length ? ' fel' : '');
    });
  }
  function kanDela() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.pdf', { type: 'application/pdf' })] })); } catch (e) { return false; }
  }
  function arIosHemskarm() { return window.navigator.standalone === true; }
  function arIos() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }

  function pdfKnappar(nyckel, utskriftsAction, id, bildnyckel) {
    var html = '';
    var bild = function (klass) {
      if (!bildnyckel) return '';
      return kanDela() ? '<button class="btn btn-secondary btn-small" data-action="dela-pdf" data-pdf="' + esc(bildnyckel) + '" disabled>Dela som bild</button>'
        : '<button class="btn btn-secondary btn-small" data-action="ladda-ner-pdf" data-pdf="' + esc(bildnyckel) + '" disabled>Ladda ner som bild</button>';
    };
    if (arIos()) {
      // På iPhone och iPad går allt via delningsmenyn: skicka, Spara i Filer eller Skriv ut.
      html += kanDela()
        ? '<button class="btn btn-small" data-action="dela-pdf" data-pdf="' + esc(nyckel) + '" disabled>Dela, spara eller skriv ut</button>' + bild()
        : '<span class="fel">Den här webbläsaren kan inte dela filer. Öppna appen i Safari och försök igen.</span>';
    } else {
      if (kanDela()) html += '<button class="btn btn-small" data-action="dela-pdf" data-pdf="' + esc(nyckel) + '" disabled>Dela / skicka</button>';
      html += '<button class="btn ' + (kanDela() ? 'btn-secondary ' : '') + 'btn-small" data-action="ladda-ner-pdf" data-pdf="' + esc(nyckel) + '" disabled>Ladda ner PDF</button>' + bild();
    }
    if (!arIosHemskarm()) html += '<button class="btn btn-secondary btn-small" data-action="' + utskriftsAction + '"' + (id ? ' data-id="' + esc(id) + '"' : '') + '>Skriv ut</button>';
    return html + '<span data-pdf-status="' + esc(nyckel + (bildnyckel ? ',' + bildnyckel : '')) + '" class="faint">Skapar filer…</span>';
  }

  function filtyp(namn) {
    return /\.jpe?g$/i.test(namn) ? 'image/jpeg' : /\.png$/i.test(namn) ? 'image/png' : /\.zip$/i.test(namn) ? 'application/zip' : /\.se$/i.test(namn) ? 'text/plain' : 'application/pdf';
  }

  function delaEllerLaddaNer(nyckel, dela) {
    var c = pdfCache[nyckel];
    if (!c || c.status !== 'klar') return;
    setTimeout(function () { kvittoAnvant(nyckel); }, 0);
    var namn = nyckel.split('|')[1];
    if (dela) {
      // Bara filen, utan titel eller text: då tar Mail, Messenger och WhatsApp emot den som en bilaga.
      var typ = filtyp(namn);
      var fil = new File([c.blob], namn, { type: typ, lastModified: Date.now() });
      if (!navigator.canShare || !navigator.canShare({ files: [fil] })) {
        visa('Den här webbläsaren kan inte dela filer.' + (arIos() ? ' Öppna appen i Safari och försök igen.' : ' Använd Ladda ner.'), true);
        return;
      }
      navigator.share({ files: [fil] }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        // Ingen tyst reservväg: visa varför delningen inte gick.
        visa('PDF:en kunde inte delas (' + ((err && (err.name + ': ' + err.message)) || 'okänt fel') + ').' +
          (arIosHemskarm() ? ' Prova att öppna appen i Safari i stället för från hemskärmen.' : ''), true);
      });
      return;
    }
    laddaNer(namn, c.blob, filtyp(namn));
  }

  // Förhandsvisningar av A4-sidor skalas så att hela sidan syns, även på telefonen.
  function skalaForhandsvisningar() {
    document.querySelectorAll('.forhandsvisning').forEach(function (ram) {
      var dok = ram.querySelector('.dok');
      if (!dok) return;
      dok.style.transform = '';
      ram.style.height = '';
      var tillganglig = ram.clientWidth - 12;
      var naturlig = dok.offsetWidth;
      var skala = Math.min(1, tillganglig / naturlig);
      if (skala < 1) {
        dok.style.transformOrigin = 'top left';
        dok.style.transform = 'scale(' + skala + ')';
        dok.style.margin = '0';
        ram.style.height = Math.ceil(dok.offsetHeight * skala + 12) + 'px';
      } else {
        dok.style.margin = '';
      }
    });
  }

  function sparaDokument() {
    var res = utkastTillDokument();
    if (res.fel.length) throw new Error(res.fel.join(' '));
    var d = res.dok;
    var adress = hitta('adresser', dokUtkast.adressId);
    var kontakt = hitta('kontakter', dokUtkast.kontaktId);
    d.id = nyttId();
    d.nummer = K.nastaDokumentnummer(store.dokument, d.typ, d.datum);
    d.forening = { namn: store.forening.namn, orgnr: store.forening.orgnr, bankgiro: store.forening.bankgiro, swish: store.forening.swish, webb: store.forening.webb, epost: store.forening.epost };
    d.avsandare = adress ? adress.text : '';
    d.referens = kontakt ? { namn: kontakt.namn, epost: kontakt.epost, mobil: kontakt.mobil } : null;
    d.logo = logoUrl;
    d.skapad = new Date().toISOString();
    if (dokUtkast.verifikation) d.verifikation = dokUtkast.verifikation;

    // Mottagaren sparas för nästa gång.
    var m = d.mottagare;
    var befintlig = hitta('mottagare', dokUtkast.mottagareId) ||
      store.mottagare.find(function (x) { return x.namn.trim().toLowerCase() === m.namn.trim().toLowerCase() && (x.foretag || '') === (m.foretag || ''); });
    if (befintlig) Object.assign(befintlig, m);
    else store.mottagare.push(Object.assign({ id: nyttId() }, m));

    var sparat = Promise.resolve();
    if (d.typ === 'faktura') {
      var filnamn = dokumentFilnamn(d);
      var u = K.fakturaTillUnderlag(d, filnamn);
      var arId = arForDatum(d.forfallodatum) || arForDatum(d.datum) || oppetAr();
      store.ar[arId] = K.laggTillUnderlag(store.ar[arId], u);
      d.underlagId = u.id;
      d.arId = arId;
      sparat = skapaDokumentPdf(d).then(function (blob) {
        pdfCache['dok-' + d.id + '|' + filnamn] = { status: 'klar', blob: blob };
        return sparaFil(u.id, blob, filnamn);
      }).catch(function () {
        // Utan PDF-verktyget (t.ex. utan internet) sparas en HTML-kopia i stället.
        var html = 'Faktura ' + d.nummer.replace(':', '_') + '.html';
        store.ar[arId] = K.andraUnderlag(store.ar[arId], u.id, { filnamn: html });
        sparaLokalt();
        return sparaFil(u.id, new Blob([dokumentFil(d)], { type: 'text/html' }), html);
      });
    }
    store.dokument.push(d);
    spara();
    dokUtkast = null;
    dokVisas = d.id;
    return sparat.then(function () { return d; });
  }

  var senastIGrupp = {};

    if (!ar) {

      main.innerHTML = msg + (arValberedningslage() ? vyValberedning() : vy === 'om' ? '<p><button class="btn btn-secondary btn-small" data-vy="inlasning">Tillbaka</button></p>' + vyOm() : vyStart()) + hjalpPanel();

    if (!regSynligt && vy.indexOf('m-') === 0) vy = 'rapporter';
    if (ar.grovkopia && (vy === 'inlasning' || vy === 'ny')) vy = 'rapporter';
    var tillaten = function (v) {
      if (ar.grovkopia && (v === 'inlasning' || v === 'ny')) return false;
      if (v.indexOf('m-') === 0) return regSynligt;
      if (v === 'st-uppdrag') return !!styrBeh('upp');
      if (v.indexOf('st-') === 0) return !!styrBeh('styr');

    };
    if (!tillaten(vy)) {
      // Första tillåtna fliken i samma del, annars översikten (t.ex. bokföraren under Styrelsen, där styrelsens material inte visas).
      var iGrupp = GRUPPER.find(function (g) { return g[0] === gruppFor(vy); })[2].filter(tillaten);

    document.getElementById('undernav').innerHTML = flikar.length > 1 ? flikar.map(function (v) {

      return '<button type="button" data-vy="' + v + '"' + (vy === v ? ' aria-current="page"' : '') + '>' + (ar.grovkopia && v === 'bokslut' ? 'Arkivkopia' : namn) + '</button>';

      staden: function (a) { return vyStaden(a); },

      verifikationer: vyVerifikationer,
      ny: vyNy,
      dokument: vyDokument,
      'm-statistik': vyMedlemmar, 'm-koppla': vyMedlemmar, 'm-lista': vyMedlemmar, 'm-betalare': vyMedlemmar, 'm-avgifter': vyMedlemmar, 'm-personuppgifter': vyMedlemmar,
      huvudbok: vyHuvudbok,
      rapporter: vyRapporter,
      bokslut: vyBokslut,
      kontoplan: vyKontoplan,

    }[vy](ar);
    main.innerHTML = msg + (vy.indexOf('m-') !== 0 && vy !== 'bokslut' ? grovkopiaRuta(ar) : '') + html + hjalpPanel();
    ritaQr();

  function visaValdFlik() {

      var nav = document.getElementById(id);
      var vald = nav.querySelector('[aria-current="page"]');
      if (vald && nav.scrollWidth > nav.clientWidth) {
        var mitt = vald.offsetLeft - (nav.clientWidth - vald.offsetWidth) / 2;
        nav.scrollLeft = Math.max(0, mitt);
      }
    });
    markeraNavSlut();

  function kopplingsInfo(ar) {
    var k = utkast.koppling;
    if (!k) return '';
    var delar = [];
    if (k.bankradId) {
      var r = (ar.bankrader || []).find(function (x) { return x.id === k.bankradId; });
      if (r) delar.push('banktransaktionen ' + esc(r.datum) + ' ' + esc(r.text) + ' (' + kr(r.belopp) + ' på ' + r.konto + ')');
    }
    (k.underlagIds || []).forEach(function (id) {
      var u = (ar.underlag || []).find(function (x) { return x.id === id; });
      if (u) delar.push(underlagChip(u));
    });
    return '<p class="muted" style="margin-top:0">Kopplas till ' + delar.join(', ') + '.' +
      (k.bankradId ? '' : ' Betalningen är förifylld som 1930 Företagskonto. Ändra till 1910 Kassa vid kontant betalning, eller 2890 Övriga kortfristiga skulder om någon lagt ut och ska få pengarna tillbaka. När betalningen syns i kontoutdraget kopplas den hit automatiskt.') + '</p>';
  }

  function utkastTillVerifikation() {
    var fel = [];
    var rader = [];
    utkast.rader.forEach(function (r, i) {
      var tom = !r.konto && !r.debet && !r.kredit;
      if (tom) return;
      var d = 0, k = 0;
      try { d = r.debet ? K.parseBelopp(r.debet) : 0; } catch (e) { fel.push('Rad ' + (i + 1) + ': ' + e.message); }
      try { k = r.kredit ? K.parseBelopp(r.kredit) : 0; } catch (e) { fel.push('Rad ' + (i + 1) + ': ' + e.message); }
      if (d && k) fel.push('Rad ' + (i + 1) + ': fyll i antingen debet eller kredit.');
      rader.push({ konto: r.konto.trim(), belopp: d - k });
    });
    return {
      fel: fel,
      verifikation: {
        datum: utkast.datum,
        text: utkast.text,
        rader: rader,
        underlag: utkast.underlag.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
        underlagKommentar: utkast.underlagKommentar.trim(),
        registrerad: new Date().toISOString()
      }
    };
  }

  function uppdateraUtkastStatus() {
    var ar = aktivt();
    var res = utkastTillVerifikation();
    var debet = 0, kredit = 0;
    res.verifikation.rader.forEach(function (r) { if (r.belopp > 0) debet += r.belopp; else kredit -= r.belopp; });
    var status = document.getElementById('utkastStatus');
    var diff = debet - kredit;
    status.innerHTML = 'Debet ' + kr(debet) + ' · Kredit ' + kr(kredit) +
      (diff === 0 ? (debet ? ' · <span class="ok">går ihop</span>' : '') : ' · <span class="fel">skillnad ' + kr(diff) + '</span>');
    var fel = res.fel.concat(K.valideraVerifikation(ar, res.verifikation));
    document.getElementById('utkastFel').innerHTML = utkastRort() ? fel.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') : '';
    document.getElementById('bokforKnapp').disabled = fel.length > 0;
    utkast.rader.forEach(function (r, i) {
      var el = document.getElementById('kontonamn-' + i);
      if (el) el.textContent = r.konto ? K.kontonamn(ar, r.konto.trim()) : '';
    });
  }

  function utkastRort() {
    return utkast.text || utkast.rader.some(function (r) { return r.konto || r.debet || r.kredit; });
  }

  var MANADER = ['januari', 'februari', 'mars', 'april', 'maj', 'juni', 'juli', 'augusti', 'september', 'oktober', 'november', 'december'];
  function manadsnamn(m) { return MANADER[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4); }

  function rapportBank(ar) {
    if (!(ar.bankrader || []).length) return '<h2 style="margin-top:0">Bankavstämning</h2><p class="muted">Inga kontoutdrag är inlästa för året ännu. Läs in ett kontoutdrag under Läs in.</p>';
    return K.bankkontonIAr(ar).map(function (konto, i) { return rapportBankKonto(ar, konto, i); }).join('');
  }

  function rapportBankKonto(ar, konto, i) {
    var html = '<h2' + (i ? '' : ' style="margin-top:0"') + '>Bankavstämning, ' + esc(banknamn(konto, ar)) + '</h2>';
    var bankrader = (ar.bankrader || []).filter(function (r) { return r.konto === konto; });
    var sistaMedData = bankrader.reduce(function (m, r) { return r.datum.slice(0, 7) > m ? r.datum.slice(0, 7) : m; }, '');
    var manader = K.bankavstamningPerManad(ar, konto).filter(function (m) { return m.manad <= sistaMedData; });
    html += '<div class="scroll"><table class="kortlista"><thead><tr><th>Månad</th><th class="num">Banken</th><th class="num">Bokfört</th><th class="num">Skillnad</th><th>Status</th></tr></thead><tbody>';
    manader.forEach(function (m) {
      var status;
      if (!m.antal) status = '<span class="faint">inga transaktioner inlästa</span>';
      else if (m.skillnad == null) status = '<span class="faint">' + antal(m.antal, 'transaktion', 'transaktioner') + ', utan saldo</span>';
      else if (m.skillnad === 0 && !m.obokforda) status = '<span class="ok">stämmer</span>';
      else if (m.obokforda) status = '<span class="fel">' + antal(m.obokforda, 'transaktion', 'transaktioner') + ' ej bokförd' + (m.obokforda === 1 ? '' : 'a') + '</span>';
      else status = '<span class="fel">skiljer</span>';
      html += '<tr><td><strong>' + esc(manadsnamn(m.manad)) + '</strong>' + (m.datum ? '<div class="faint">saldo ' + esc(m.datum) + '</div>' : '') + '</td>' +
        '<td class="num"' + (m.bankSaldo != null ? ' data-etikett="Banken">' + kr(m.bankSaldo) : '>') + '</td><td class="num"' + (m.bokfortSaldo != null ? ' data-etikett="Bokfört">' + kr(m.bokfortSaldo) : '>') + '</td>' +
        '<td class="num' + (m.skillnad ? ' fel' : '') + '"' + (m.skillnad != null ? ' data-etikett="Skillnad">' + kr(m.skillnad) : '>') + '</td><td data-etikett="Status">' + status + '</td></tr>';
    });
    html += '</tbody></table></div>';
    var a = K.bankavvikelser(ar, konto);

    html += '<h3>Bokfört på ' + esc(konto) + ' men saknas i kontoutdraget (' + a.utanBank.length + ')</h3>';
    html += a.utanBank.length ? '<p class="faint" style="margin:0">Verifikationer mellan ' + esc(a.period.fran) + ' och ' + esc(a.period.till) + ' som rör bankkontot men inte motsvaras av någon rad i kontoutdraget. Kan vara felbokningar, dubbletter eller transaktioner som saknas i det inlästa utdraget.</p><ul>' +
      a.utanBank.map(function (v) { return '<li><button class="tag knapp-tag" data-action="oppna-ver" data-nr="' + v.nr + '">Ver ' + v.nr + '</button> ' + esc(v.datum) + ' ' + esc(v.text) + ' <strong>' + kr(v.belopp) + '</strong></li>'; }).join('') + '</ul>'
      : '<p class="ok">Inga.</p>';
    html += '<h3>Saldot går inte ihop i kontoutdraget (' + a.saldofel.length + ')</h3>';
    html += a.saldofel.length ? '<p class="faint" style="margin:0">Kan betyda att en rad saknas i det inlästa utdraget.</p><ul>' + a.saldofel.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>' : '<p class="ok">Inga.</p>';
    return html;
  }

  function vyBokslut(ar) {

      balans: '',

      last: '<button class="btn btn-small" data-action="las-aret">Lås året</button>'
    };
    var html = '<h2>Bokslut ' + esc(namn) + hjalp('bokslut') + '</h2><div class="card"><p style="margin-top:0" class="muted">Gå igenom stegen uppifrån och ner. Gröna steg är klara.</p><ol class="checklista">';
    lista.forEach(function (x) {
      html += '<li class="' + (x.klar ? 'klar' : x.varning ? 'varning' : 'kvar') + '"><span class="bock" aria-hidden="true">' + (x.klar ? '✓' : x.varning ? '!' : '○') + '</span>' +

  function arsmoteData(ar) {
    return Object.assign({ berattelse: '', principer: 'Föreningen tillämpar bokföringslagen och god redovisningssed för ideella föreningar.', forslag: '', ort: '', datum: '', underskrifter: '',

  function vyArsmote(ar) {

  function arsmoteInnehall(ar) {
    var a = arsmoteData(ar);

    var fg = foregaende(ar);
    var rr = K.resultatrakning(ar, { foregaende: fg });
    var br = K.balansrakning(ar);
    var namnNu = K.arNamn(ar), namnFg = fg ? K.arNamn(fg) : 'Föregående år';
    var res = rr.aretsResultat;
    var forslag = a.forslag || ('Styrelsen föreslår att årets resultat, ' + (res < 0 ? 'underskott ' : 'överskott ') + kr(Math.abs(res)) + ' kr, balanseras i ny räkning.');
    var stycken = function (t) { return rader(t).map(function (r) { return '<p>' + esc(r) + '</p>'; }).join(''); };
    var tabell = function (rubriker, kropp) {

    };
    var html = '<div class="dok dok-rapport">' +

    html += '<h3 class="dok-rubrik">Ekonomisk berättelse</h3>' + (a.berattelse ? stycken(a.berattelse) : '<p class="faint">(Ingen berättelse ifylld.)</p>');
    html += '<h3 class="dok-rubrik">Resultaträkning</h3>';
    var kropp = '';
    rr.grupper.forEach(function (g) {
      kropp += '<tr><td colspan="3"><strong>' + esc(g.namn) + '</strong></td></tr>';

    });

  // Föreningens bankkonton: vilket bokföringskonto varje bankkonto har, och kontonumret för att känna igen kontoutdragen.

  // Konteringsregler: text i kontoutdraget -> konto. Föreningens egna, förslag från tidigare år och de allmänna.

  function uppdateraDokStatus() {
    var res = utkastTillDokument();
    dokUtkast.rader.forEach(function (r, i) {
      var el = document.getElementById('dokTotal-' + i);
      if (!el) return;
      try { el.textContent = r.pris ? kr(K.dokumentRadTotal({ antal: Number(String(r.antal).replace(',', '.')) || 0, pris: K.parseBelopp(r.pris) })) : ''; }
      catch (e) { el.textContent = ''; }
    });
    var summa = res.dok.rader.reduce(function (s, r) { return s + (isFinite(r.antal) ? K.dokumentRadTotal(r) : 0); }, 0);
    document.getElementById('dokSumma').innerHTML = '<strong>' + (dokUtkast.typ === 'faktura' ? 'Att betala: ' : 'Totalt: ') + kr(summa) + ' kr</strong> <span class="faint">(moms 0,00 kr)</span>';
    var rort = dokUtkast.mottagare.namn || dokUtkast.rader.some(function (r) { return r.beskrivning || r.pris; });
    document.getElementById('dokFel').innerHTML = rort ? res.fel.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') : '';
    document.getElementById('dokSpara').disabled = res.fel.length > 0;

  // ---------- Roller och skrivrätt i OneDrive ----------

  async function efterBokforing() {
    await hamtaRoller().catch(function (err) { odNu.rollFel = 'Rollerna: ' + err.message; });
    await uppdateraSokvagar().catch(function () { /* frivilligt */ });
    await hamtaRegister().catch(function (err) { odNu.regFel = 'Medlemsregistret: ' + err.message; });
    await synkaStyrelsen().catch(function (err) { odNu.styrFel = 'Styrelsen: ' + err.message; });
  }

  async function hamtaRoller() {
    if (!odAnslutet()) return;
    var meta = await graf(iMappen(ROLLFIL), { tillat: [404] });
    if (meta === 404) {
      odNu.roller = null; odNu.rollerETag = null;
      // Den som äger mappen och kopplar den först blir systemadministratör.
      if (od.lage === 'agare' && mig()) {
        var ny = K.nyRollfil(mig());
        if (od.regMapp) ny.regMapp = { driveId: od.regMapp.driveId, id: od.regMapp.id, namn: od.regMapp.namn };
        await sparaRoller(ny);
      }
      return;
    }
    if (meta.eTag !== odNu.rollerETag) {
      var res = await graf(iMappen(ROLLFIL) + '/content', { ra: true });
      odNu.roller = K.lasRollfil(await res.json());
      odNu.rollerETag = meta.eTag;
    }
    if (od.lage !== 'agare') {
      var b = K.behorighet(K.rollerFor(odNu.roller, mig()));
      var lage = b.data === 'write' ? 'medarbetare' : 'lasare';
      if (lage !== od.lage) { od.lage = lage; sparaOd(); sparaAppinstallningar({ lage: lage }).catch(function () { /* frivilligt */ }); }
    } else if (od.regMapp && kanSkriva() && (!odNu.roller.regMapp || odNu.roller.regMapp.id !== od.regMapp.id)) {
      await sparaRoller(Object.assign({}, odNu.roller, { regMapp: { driveId: od.regMapp.driveId, id: od.regMapp.id, namn: od.regMapp.namn } }));
    }
  }

  async function sparaRoller(fil) {
    var rubriker = { 'Content-Type': 'application/json' };
    if (odNu.rollerETag) rubriker['If-Match'] = odNu.rollerETag;
    var res = await graf(iMappen(ROLLFIL) + '/content', { method: 'PUT', headers: rubriker, body: JSON.stringify(fil, null, 1), tillat: [412], ra: true });
    if (res.status === 412) { odNu.rollerETag = null; await hamtaRoller(); throw new Error('Rollerna ändrades samtidigt från en annan enhet. Försök igen.'); }
    var post = await res.json();
    odNu.roller = K.lasRollfil(fil);
    odNu.rollerETag = post.eTag;
  }

  function nu() { return new Date().toISOString().slice(0, 16); }

  async function lamnaSkrivratt(till) {
    await synkaUpp();
    if (od.smutsig || od.regSmutsig) throw new Error('Allt kunde inte sparas i OneDrive. Försök igen innan du lämnar över.');
    await hamtaRoller();
    await sparaRoller(K.flyttaSkrivratt(odNu.roller, mig(), till, nu()));
  }

  async function taSkrivratt() {
    await hamtaRoller();
    await sparaRoller(K.flyttaSkrivratt(odNu.roller, mig(), mig(), nu()));
    await hamtaFranOneDrive();
  }

  // Delningen i OneDrive som en persons roller ska ge: läsa eller ändra i bokföringsmappen och registrets mapp.
  async function delningarFor(item, epost) {
    var data = await graf('/drives/' + item.driveId + '/items/' + item.id + '/permissions');
    return (data.value || []).filter(function (p) {
      var e = (p.invitation && p.invitation.email) || (p.grantedToV2 && p.grantedToV2.user && p.grantedToV2.user.email) || (p.grantedTo && p.grantedTo.user && p.grantedTo.user.email) || '';
      return String(e).toLowerCase() === epost && (p.roles || []).indexOf('owner') < 0 && !p.inheritedFrom;
    });
  }

  async function sattDelning(item, epost, behov, meddelande) {
    var finns = await delningarFor(item, epost);
    var nuvarande = finns.some(function (p) { return (p.roles || []).indexOf('write') >= 0; }) ? 'write' : finns.length ? 'read' : null;
    if (nuvarande === behov) return;
    for (var i = 0; i < finns.length; i++) {
      await graf('/drives/' + item.driveId + '/items/' + item.id + '/permissions/' + encodeURIComponent(finns[i].id), { method: 'DELETE', tillat: [404] });
    }
    if (!behov) return;
    await graf('/drives/' + item.driveId + '/items/' + item.id + '/invite', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recipients: [{ email: epost }], roles: [behov], requireSignIn: true, sendInvitation: !nuvarande, message: meddelande })
    });
  }

  async function andraRoller(epost, roller) {
    epost = String(epost || '').trim().toLowerCase();
    await hamtaRoller();
    var fil = K.sattRoller(odNu.roller, mig(), epost, roller, nu());
    if (epost !== mig()) {
      try { await sakerstallRegMapp(); } catch (e) { /* registret finns inte ännu */ }
      var b = K.behorighet(roller);
      var namn = K.ROLLER.filter(function (r) { return roller.indexOf(r[0]) >= 0; }).map(function (r) { return r[1]; }).join(' och ');
      var text = 'Du har fått rollen ' + namn + ' i Föreningsbokföring för ' + (store.forening.namn || 'föreningen') + '. Öppna appen med den här länken och logga in med ditt Microsoft-konto: ' + inbjudningslank();
      await sattDelning(od.mapp, epost, b.data, text);
      if (od.regMapp) await sattDelning(od.regMapp, epost, b.reg, text);
      // Styrelsens mapp, och förtroendeuppdragen för valberedningen.
      if (b.styr || b.uppdrag || od.styrMapp) {
        await synkaStyrelsen();
        if (od.styrRot || od.styrMapp) await sattDelning(od.styrRot || od.styrMapp, epost, b.styr, text);
        var uf = odNu.roller && odNu.roller.uppdragFil;
        if (uf) {
          var textValb = 'Du har fått rollen ' + namn + ' i Föreningsbokföring för ' + (store.forening.namn || 'föreningen') + '. Öppna förtroendeuppdragen med den här länken och logga in med ditt Microsoft-konto: ' + uppdragslank(uf);
          await sattDelning(uf, epost, b.styr ? null : b.uppdrag, b.data ? text : textValb);
        }
      }
    }
    fil = Object.assign({}, fil, { styrMapp: odNu.roller.styrMapp || fil.styrMapp || null, styrRot: odNu.roller.styrRot || fil.styrRot || null, uppdragFil: odNu.roller.uppdragFil || fil.uppdragFil || null });
    if (!fil.regMapp && od.regMapp) fil.regMapp = { driveId: od.regMapp.driveId, id: od.regMapp.id, namn: od.regMapp.namn };
    await sparaRoller(fil);
  }

  function sparadAv(meta) {
    var u = meta && meta.lastModifiedBy && meta.lastModifiedBy.user;
    return { vem: u ? (u.email || u.displayName || '') : '', tid: (meta && meta.lastModifiedDateTime) || '' };
  }

  function klockslag(iso) {
    if (!iso) return '';
    var d = new Date(iso), n = new Date();

  // för styrelsen som bara läser bokföringen, i styrelsens mapp. Den som bara får läsa (revisorn) kan inte synas.
  async function lasNarvaro(url) {
    var res = await graf(url + '/content', { tillat: [403, 404], ra: true });
    if (res.status === 403 || res.status === 404) return null;
    try { return await res.json(); } catch (e) { return {}; }
  }
  async function skrivInNarvaro(url, lista) {
    lista = lista || {};
    var grans = Date.now() - 24 * 3600 * 1000;
    Object.keys(lista).forEach(function (k) { if (!lista[k] || new Date(lista[k].tid).getTime() < grans) delete lista[k]; });
    lista[mig()] = { tid: new Date().toISOString(), skrivratt: kanSkriva() };
    var bild = minBild();
    if (bild) lista[mig()].bild = bild;
    await graf(url + '/content', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lista), tillat: [403, 412] }).catch(function () { /* frivilligt */ });
    return lista;
  }

    if (mig()) {
      if (od.lage !== 'lasare') data = await skrivInNarvaro(dataUrl, data);

  // En bild förminskas till en liten fyrkant (96 punkter), så att den får plats i närvarofilen.
  function forminskaBild(fil) {
    return new Promise(function (ok, fel) {
      var url = URL.createObjectURL(fil), img = new Image();
      img.onload = function () {
        var sida = 96, c = document.createElement('canvas'), m = Math.min(img.width, img.height);
        c.width = sida; c.height = sida;
        c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, sida, sida);
        URL.revokeObjectURL(url);
        ok(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function () { URL.revokeObjectURL(url); fel(new Error('Bilden kunde inte läsas.')); };
      img.src = url;
    });
