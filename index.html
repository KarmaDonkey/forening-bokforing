      avrundning: kalla === 'underlag' ? avrundning : 0,
      // Avrundningskontot läggs till i kontoplanen när verifikationen bokförs, om det saknas.
      komplett: rader.every(function (r) { return !!giltigt(r.konto) || (avrundning && r.konto === AVRUNDNINGSKONTO.nr); })
    };
  }

  // En obokförd rad på ett annat bankkonto med samma belopp och omvänt tecken, högst tre dagar ifrån.
  function overforingFor(ar, bankrad) {
    if (bankrad.verifikation != null) return null;
    var lista = (ar.bankrader || []).filter(function (r) {
      return r.verifikation == null && r.konto !== bankrad.konto && r.belopp === -bankrad.belopp && Math.abs(dagarMellan(r.datum, bankrad.datum)) <= 3;
    }).sort(function (a, b) { return Math.abs(dagarMellan(a.datum, bankrad.datum)) - Math.abs(dagarMellan(b.datum, bankrad.datum)); });
    return lista[0] || null;
  }

  // Bankkontona som har kontoutdrag inlästa under året, i nummerordning.
  function bankkontonIAr(ar) {
    var k = {};
    (ar.bankrader || []).forEach(function (r) { k[r.konto] = true; });
    return Object.keys(k).sort();
  }

  // Vilket av föreningens bankkonton gäller kontoutdraget? Kontonumret står ofta på varje rad i filen.
  // bankkonton: [{ konto: '1930', nummer: '…' }]. Det nummer som förekommer flest gånger vinner.
  function kontoForUtdrag(bankkonton, text, filnamn) {
    // Siffror som hålls ihop av mellanslag eller bindestreck räknas som ett nummer.
    // Kommatecken skiljer kolumner och slås inte ihop; datum (20260131) räknas inte som kontonummer.
    var siffror = (String((filnamn || '') + '\n' + (text || '')).replace(/(\d)[ \-](?=\d)/g, '$1').match(/\d{8,}/g) || [])
      .filter(function (x) { return !/^(19|20)\d\d(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$/.test(x); });
    var bast = null, flest = 0;
    (bankkonton || []).forEach(function (b) {
      var n = String(b.nummer || '').replace(/\D/g, '');
      if (n.length < 4) return;
      var slut = n.slice(-4);
      var antal = siffror.filter(function (x) { return x.slice(-4) === slut; }).length;
      if (antal > flest) { flest = antal; bast = b.konto; }
    });
    return bast;
  }

  function arkivnamn(nr, filnamn) { return 'V' + String(nr).padStart(3, '0') + '_' + filnamn; }

  // Bokför en verifikation och kopplar den till en bankrad och/eller underlag.
  function bokforKopplat(ar, utkast, koppling) {
    koppling = koppling || {};
    var nr = nastaVerifikationsnummer(ar);
    var bankrad = null;
    if (koppling.bankradId) {
      bankrad = (ar.bankrader || []).find(function (r) { return r.id === koppling.bankradId; });
      if (!bankrad) throw BokforingsFel('Banktransaktionen finns inte.');
      if (bankrad.verifikation != null) throw BokforingsFel('Banktransaktionen är redan bokförd i verifikation ' + bankrad.verifikation + '.');
      var paBank = (utkast.rader || []).reduce(function (s, r) { return r.konto === bankrad.konto ? s + r.belopp : s; }, 0);
      if (paBank !== bankrad.belopp) {
        throw BokforingsFel('Verifikationen måste ha ' + formatBelopp(bankrad.belopp) + ' kr på konto ' + bankrad.konto + ' för att stämma med banken.');
      }
    }
    var us = (koppling.underlagIds || []).map(function (id) {
      var u = (ar.underlag || []).find(function (x) { return x.id === id; });
      if (!u) throw BokforingsFel('Underlaget finns inte.');
      if (u.verifikation != null) throw BokforingsFel('Underlaget ' + u.filnamn + ' hör redan till verifikation ' + u.verifikation + '.');
      return u;
    });
    var namn = us.map(function (u) { return arkivnamn(nr, u.filnamn); });
    if ((utkast.rader || []).some(function (r) { return r.konto === AVRUNDNINGSKONTO.nr; }) && !ar.kontoplan.some(function (k) { return k.nr === AVRUNDNINGSKONTO.nr; })) {
      ar = laggTillKonto(ar, AVRUNDNINGSKONTO.nr, AVRUNDNINGSKONTO.namn);
    }
    var res = bokfor(ar, Object.assign({}, utkast, { underlag: (utkast.underlag || []).concat(namn) }));
    var nyttAr = res.ar;
    if (bankrad) {
      nyttAr = Object.assign({}, nyttAr, {
        bankrader: nyttAr.bankrader.map(function (r) { return r.id === bankrad.id ? Object.assign({}, r, { verifikation: nr }) : r; })
      });
    }
    us.forEach(function (u, i) {
      var andring = { verifikation: nr, arkivnamn: namn[i] };
      // Utländsk valuta utan kronbelopp: bankens belopp blir underlagets belopp i kronor.
      if (bankrad && us.length === 1 && valutaUtanSek(u)) andring.belopp = Math.abs(bankrad.belopp);
      nyttAr = andraUnderlag(nyttAr, u.id, andring);
    });
    return { ar: nyttAr, verifikation: res.verifikation };
  }

  // ---------- Underlag i efterhand ----------

  // Kopplar ett underlag som väntar till en verifikation som redan är bokförd.
  // Beloppen i verifikationen ändras inte; underlaget kompletterar den.
  function kopplaUnderlagTillVerifikation(ar, nr, underlagId, tid) {
    var v = hittaVerifikation(ar, nr);
    if (!v) throw BokforingsFel('Verifikation ' + nr + ' finns inte.');
    var u = (ar.underlag || []).find(function (x) { return x.id === underlagId; });
    if (!u) throw BokforingsFel('Underlaget finns inte.');
    if (u.verifikation != null) throw BokforingsFel('Underlaget hör redan till verifikation ' + u.verifikation + '.');
    return andraUnderlag(ar, underlagId, { verifikation: nr, arkivnamn: arkivnamn(nr, u.filnamn), bifogad: tid || null });
  }

  function bifogaNyttUnderlag(ar, nr, fil) {
    if (!hittaVerifikation(ar, nr)) throw BokforingsFel('Verifikation ' + nr + ' finns inte.');
    if (!fil || !fil.id || !fil.filnamn) throw BokforingsFel('Filen saknas.');
    return laggTillUnderlag(ar, {
      id: fil.id, filnamn: fil.filnamn, dokumenttyp: 'bifogat', motpart: '', belopp: 0, riktning: 'utgift',
      verifikation: nr, arkivnamn: arkivnamn(nr, fil.filnamn), bifogad: fil.tid || null
    });
  }

  // Alla underlag som hör till en verifikation: de som angavs vid bokföringen och de som bifogats efteråt.
  function underlagForVerifikation(ar, nr) {
    var v = hittaVerifikation(ar, nr);
    if (!v) return [];
    var namn = (v.underlag || []).slice();
    (ar.underlag || []).forEach(function (u) {
      if (u.verifikation === nr && u.arkivnamn && namn.indexOf(u.arkivnamn) < 0) namn.push(u.arkivnamn);
    });
    return namn;
  }

  function flyttaUnderlag(franAr, tillAr, id) {
    var u = (franAr.underlag || []).find(function (x) { return x.id === id; });
    if (!u) throw BokforingsFel('Underlaget finns inte.');
    if (u.verifikation != null) throw BokforingsFel('Ett bokfört underlag kan inte flyttas till ett annat år.');
    return {
      fran: Object.assign({}, franAr, { underlag: franAr.underlag.filter(function (x) { return x.id !== id; }) }),
      till: Object.assign({}, tillAr, { underlag: (tillAr.underlag || []).concat([Object.assign({}, u)]) })
    };
  }

  // Underlag som troligen hör till en bankrad trots att belopp eller datum inte stämmer exakt,
  // t.ex. öresavrundning, sen betalning eller en faktura som ligger i ett annat räkenskapsår.
  // extra: väntande underlag från andra år, som [{ arId, underlag }].
  // En inbetalning som inte rimligen hör till underlaget: Swish från ett privat mobilnummer utan fakturans namn
  // eller nummer i texten, eller en betalning som kommer mer än två dagar före fakturadatum.
  function osannoliktUnderlag(u, bankrad) {
    if (u.riktning !== 'intakt' || bankrad.belopp <= 0) return false;
    if (u.datum && dagarMellan(u.datum, bankrad.datum) < -2) return true;
    var text = String(bankrad.text || '') + ' ' + String(bankrad.referens || '');
    if (!hittaMobilnummer(text)) return false;
    var siffror = text.replace(/\D/g, '');
    var nummer = [u.ocr, u.fakturanummer].map(function (x) { return String(x || '').replace(/\D/g, ''); }).filter(function (x) { return x.length >= 3; });
    return !namnIText(u.motpart, text) && !nummer.some(function (x) { return siffror.indexOf(x) >= 0; });
  }

  function trolligaUnderlag(ar, bankrad, extra) {
    var kandidater = oppnaUnderlag(ar).map(function (u) { return { arId: null, u: u }; })
      .concat((extra || []).filter(function (x) { return arBetalbartUnderlag(x.underlag) && x.underlag.verifikation == null; })
        .map(function (x) { return { arId: x.arId, u: x.underlag }; }));
    var ut = [];
    kandidater.forEach(function (k) {
      var u = k.u;
      if ((bankbelopp(u) < 0) !== (bankrad.belopp < 0)) return;
      if (osannoliktUnderlag(u, bankrad)) return;
      var skillnad = Math.abs(bankbelopp(u) - bankrad.belopp);
      var grans = Math.max(5000, Math.round(Math.abs(bankrad.belopp) * 0.02));
      if (skillnad > grans) return;
      var mal = u.forfallodatum || u.datum;
      var dagar = mal ? dagarMellan(mal, bankrad.datum) : 0;
      if (dagar < -30 || dagar > 150) return;
      var exakt = skillnad === 0 && inomFonster(u, bankrad) && !k.arId;
      if (exakt) return;
      var skal = [];
      if (skillnad) skal.push('beloppet skiljer ' + formatBelopp(skillnad) + ' kr');
      if (!inomFonster(u, bankrad)) skal.push('betalningen ligger ' + Math.abs(dagar) + ' dagar ' + (dagar < 0 ? 'före' : 'efter') + ' ' + (u.forfallodatum ? 'förfallodagen' : 'fakturadatum'));
      if (k.arId) skal.push('underlaget ligger i räkenskapsåret ' + k.arId);
      ut.push({ underlag: u, arId: k.arId, skal: skal, poang: skillnad * 10 + Math.abs(dagar) - (matchpoang(u, bankrad) >= 500 ? 100000 : 0) });
    });
    return ut.sort(function (a, b) { return a.poang - b.poang; }).slice(0, 3);
  }

  // ---------- Tolkning av underlag med Claude ----------

  var TOLKNING_SCHEMA = {
    type: 'object',
    additionalProperties: false,
    required: ['dokumenttyp', 'motpart', 'datum', 'forfallodatum', 'belopp', 'valuta', 'belopp_sek', 'moms', 'fakturanummer', 'ocr', 'beskrivning', 'riktning', 'foreslaget_konto', 'stalld_till_foreningen', 'osakerhet', 'transaktioner', 'insattningar'],
    properties: {
      dokumenttyp: { type: 'string', enum: ['faktura', 'kvitto', 'kreditnota', 'kontoutdrag', 'insattningsuppgift', 'annat'] },
      motpart: { type: 'string', description: 'Säljare, avsändare eller bidragsgivare.' },
      datum: { type: 'string', description: 'Fakturadatum, köpdatum eller dokumentets datum som ÅÅÅÅ-MM-DD. Tom sträng om det saknas.' },
      forfallodatum: { type: 'string', description: 'Förfallodatum som ÅÅÅÅ-MM-DD, annars tom sträng.' },
      belopp: { type: 'string', description: 'Totalbelopp att betala eller som betalats, inklusive moms, i dokumentets valuta, med punkt som decimaltecken, t.ex. "1617.79". Alltid positivt.' },
      valuta: { type: 'string', description: 'Valutakod, t.ex. SEK eller EUR.' },
      belopp_sek: { type: 'string', description: 'Beloppet i SEK om dokumentet anger det och valutan inte är SEK, annars tom sträng.' },
      moms: { type: 'string', description: 'Momsbelopp om det anges, annars tom sträng.' },
      fakturanummer: { type: 'string' },
      ocr: { type: 'string', description: 'OCR-nummer eller betalningsreferens, annars tom sträng.' },
      beskrivning: { type: 'string', description: 'Kort svensk text för verifikationen, t.ex. "Lokalhyra november".' },
      riktning: { type: 'string', enum: ['utgift', 'intakt'], description: 'utgift om föreningen betalar, intakt om föreningen får pengar (bidrag, kreditnota, insättning).' },
      foreslaget_konto: { type: 'string', description: 'Fyrsiffrigt konto ur kontoplanen för kostnaden eller intäkten.' },
      stalld_till_foreningen: { type: 'string', enum: ['ja', 'nej', 'oklart'] },
      osakerhet: { type: 'string', description: 'Vad som är oklart eller svårläst, annars tom sträng.' },
      transaktioner: {
        type: 'array',
        description: 'Endast för kontoutdrag: varje transaktion. Annars tom lista.',
        items: {
          type: 'object',
          additionalProperties: false,
          required: ['datum', 'text', 'belopp', 'saldo'],
          properties: {
            datum: { type: 'string' },
            text: { type: 'string' },
            belopp: { type: 'string', description: 'Negativt för uttag, med punkt som decimaltecken.' },
            saldo: { type: 'string', description: 'Saldo efter transaktionen, eller tom sträng.' }
          }
        }
      },
      insattningar: {
        type: 'array',
        description: 'Endast för insättningsuppgifter från bankgirot: varje insättning för sig. Annars tom lista.',
        items: {
          type: 'object',
          additionalProperties: false,
          required: ['avsandare', 'referens', 'belopp'],
          properties: {
            avsandare: { type: 'string' },
            referens: { type: 'string', description: 'Betalningsreferensen, eller meddelandet om referensen saknas (t.ex. ett barns namn). Skriv aldrig ut personnummer.' },
            belopp: { type: 'string', description: 'Med punkt som decimaltecken.' }
          }
        }
      }
    }
  };

  // ---------- Motpartsregler: leverantör -> konto, inlärt från tidigare bokföringar ----------

  function hittaMotpartsregel(regler, motpart) {
    var n = normaliseraText(motpart);
    if (!n) return null;
    var basta = null, bastaPoang = -1;
    (regler || []).forEach(function (r) {
      var poang = r.monster === n ? 1000 + r.monster.length
        : (' ' + n + ' ').indexOf(' ' + r.monster + ' ') >= 0 || (' ' + r.monster + ' ').indexOf(' ' + n + ' ') >= 0 ? r.monster.length : -1;
      if (poang > bastaPoang) { basta = r; bastaPoang = poang; }
    });
    return basta;
  }

  function larMotpart(regler, motpart, konto) {
    var monster = normaliseraText(motpart);
    regler = (regler || []).slice();
    if (!monster || !giltigtKontonummer(konto)) return regler;
    var regel = { monster: monster, namn: String(motpart).trim(), konto: konto };
    var i = regler.findIndex(function (r) { return r.monster === monster; });
    if (i >= 0) regler[i] = regel; else regler.push(regel);
    return regler;
  }

  function arBetalkonto(nr) { return iIntervall(nr, 1900, 1999) || nr === '2440' || nr === '2890'; }

  // Kostnads- eller intäktskontot i en verifikation, om det finns exakt ett.
  function kontoAttLara(rader) {
    var ovriga = (rader || []).filter(function (r) { return !arBetalkonto(r.konto); });
    return ovriga.length === 1 ? ovriga[0].konto : null;
  }

  // Ger obokförda underlag kontot från inlärda regler, utom där användaren själv valt konto.
  function tillampaMotpartsregler(ar, regler) {
    return Object.assign({}, ar, {
      underlag: (ar.underlag || []).map(function (u) {
        if (u.verifikation != null || u.kontoKalla === 'manuell' || !arBetalbartUnderlag(u)) return u;
        var r = hittaMotpartsregel(regler, u.motpart);
        if (!r || r.konto === u.foreslagetKonto || !ar.kontoplan.some(function (k) { return k.nr === r.konto; })) return u;
        return Object.assign({}, u, { foreslagetKonto: r.konto, kontoKalla: 'inlart' });
      })
    });
  }

  // Kopplar obokförda bankrader till verifikationer som redan bokförts mot bankkontot
  // (t.ex. en faktura som bokfördes innan kontoutdraget lästes in), så att inget bokförs två gånger.
  // En överföring mellan egna konton rör två bankkonton: kopplingen gäller därför per verifikation och konto.
  function kopplaBokforda(ar) {
    var lankade = {}, rattade = {};
    (ar.bankrader || []).forEach(function (r) { if (r.verifikation != null) lankade[r.verifikation + ':' + r.konto] = true; });
    ar.verifikationer.forEach(function (v) { if (v.rattar != null) { rattade[v.rattar] = true; rattade[v.nr] = true; } });
    var kopplade = [];
    var bankrader = (ar.bankrader || []).map(function (r) {
      if (r.verifikation != null) return r;
      var kandidater = ar.verifikationer.filter(function (v) {
        if (lankade[v.nr + ':' + r.konto] || rattade[v.nr]) return false;
        var paBank = v.rader.reduce(function (s, x) { return x.konto === r.konto ? s + x.belopp : s; }, 0);
        return paBank === r.belopp && r.datum >= laggTillDagar(v.datum, -10) && r.datum <= laggTillDagar(v.datum, 60);
      }).sort(function (a, b) { return Math.abs(dagarMellan(a.datum, r.datum)) - Math.abs(dagarMellan(b.datum, r.datum)) || a.nr - b.nr; });
      if (!kandidater.length) return r;
      var v = kandidater[0];
      lankade[v.nr + ':' + r.konto] = true;
      kopplade.push({ bankradId: r.id, nr: v.nr });
      return Object.assign({}, r, { verifikation: v.nr, kopplad: 'efterhand' });
    });
    return { ar: Object.assign({}, ar, { bankrader: bankrader }), kopplade: kopplade };
  }

  // ---------- Fakturor och kvitton som föreningen skriver ----------

  // Fakturor: ÅÅÅÅ-MM:NN (löpnummer per månad). Kvitton: KÅÅÅÅ-NNN (löpnummer per år).
  function nastaDokumentnummer(dokument, typ, datum) {
    var max = 0, prefix, m;
    if (typ === 'faktura') {
      prefix = datum.slice(0, 7) + ':';
      (dokument || []).forEach(function (d) {
        if (d.typ === 'faktura' && d.nummer.indexOf(prefix) === 0 && (m = d.nummer.slice(prefix.length).match(/^\d+$/))) max = Math.max(max, Number(m[0]));
      });
      return prefix + String(max + 1).padStart(2, '0');
    }
    prefix = 'K' + datum.slice(0, 4) + '-';
    (dokument || []).forEach(function (d) {
      if (d.typ === 'kvitto' && d.nummer.indexOf(prefix) === 0 && (m = d.nummer.slice(prefix.length).match(/^\d+$/))) max = Math.max(max, Number(m[0]));
    });
    return prefix + String(max + 1).padStart(3, '0');
  }

  // Antal får ha decimaler (t.ex. 1,5 timme); totalen avrundas till hela ören.
  function dokumentRadTotal(rad) { return Math.round(Number(rad.antal) * rad.pris); }

  function dokumentSumma(dok) {
    return (dok.rader || []).reduce(function (s, r) { return s + dokumentRadTotal(r); }, 0);
  }

  function valideraDokument(dok) {
    var fel = [];
    if (dok.typ !== 'faktura' && dok.typ !== 'kvitto') fel.push('Okänd dokumenttyp.');
    if (!dok.mottagare || !String(dok.mottagare.namn || '').trim()) fel.push('Mottagaren behöver ett namn.');
    if (!arGiltigtDatum(dok.datum)) fel.push('Datum saknas eller är ogiltigt.');
    if (dok.typ === 'faktura' && (!arGiltigtDatum(dok.forfallodatum) || dok.forfallodatum < dok.datum)) fel.push('Förfallodatum saknas eller ligger före fakturadatum.');
    if (dok.typ === 'kvitto') {
      if (!arGiltigtDatum(dok.betaldDatum)) fel.push('Ange när beloppet betalades.');
      else if (arGiltigtDatum(dok.datum) && dok.betaldDatum > dok.datum) fel.push('Betaldatum ligger efter utskrivningsdatum.');
      if (!String(dok.betalsatt || '').trim()) fel.push('Ange hur beloppet betalades.');
    }
    var rader = dok.rader || [];
    if (!rader.length) fel.push('Lägg till minst en rad.');
    rader.forEach(function (r, i) {
      if (!String(r.beskrivning || '').trim()) fel.push('Rad ' + (i + 1) + ': beskrivning saknas.');
      if (!(Number(r.antal) > 0) || !isFinite(Number(r.antal))) fel.push('Rad ' + (i + 1) + ': antalet måste vara större än noll.');
      if (!arHeltal(r.pris) || r.pris < 0) fel.push('Rad ' + (i + 1) + ': priset är ogiltigt.');
      if (r.konto && !giltigtKontonummer(r.konto)) fel.push('Rad ' + (i + 1) + ': kontot ' + r.konto + ' är ogiltigt.');
    });
    if (!fel.length && dokumentSumma(dok) <= 0) fel.push('Summan måste vara större än noll.');
    return fel;
  }

  // Kontot som förekommer med störst belopp på fakturans rader.
  function huvudkonto(dok) {
    var per = {};
    (dok.rader || []).forEach(function (r) { if (r.konto) per[r.konto] = (per[r.konto] || 0) + dokumentRadTotal(r); });
    return Object.keys(per).sort(function (a, b) { return per[b] - per[a] || (a < b ? -1 : 1); })[0] || '';
  }

  // En skickad faktura blir ett underlag som väntar på inbetalning.
  function fakturaTillUnderlag(dok, filnamn) {
    return {
      id: 'dok-' + dok.id,
      filnamn: filnamn,
      dokumenttyp: 'utgaende_faktura',
      dokumentId: dok.id,
      motpart: String(dok.mottagare.foretag || dok.mottagare.namn).trim(),
      datum: dok.datum,
      forfallodatum: dok.forfallodatum,
      belopp: dokumentSumma(dok),
      riktning: 'intakt',
      beskrivning: 'Faktura ' + dok.nummer + ': ' + dok.rader[0].beskrivning,
      fakturanummer: dok.nummer,
      ocr: '',
      foreslagetKonto: huvudkonto(dok),
      kontoKalla: 'faktura'
    };
  }

  // Läser in föreningsuppgifter från en fil. Ifyllda uppgifter behålls; poster som redan finns läggs inte till igen.
  var FORENINGSFAELT = ['namn', 'orgnr', 'bankgiro', 'webb', 'epost', 'swish'];

  function slaIhopForening(befintligt, fil, nyttId) {
    if (!fil || fil.format !== 'foreningsbokforing-forening') throw BokforingsFel('Filen innehåller inga föreningsuppgifter för appen.');
    var nyckel = function (t) { return String(t || '').toLowerCase().replace(/\s+/g, ' ').trim(); };
    var ut = { forening: Object.assign({}, befintligt.forening), adresser: (befintligt.adresser || []).slice(), kontakter: (befintligt.kontakter || []).slice(), artiklar: (befintligt.artiklar || []).slice() };
    var antal = { uppgifter: 0, adresser: 0, kontakter: 0, artiklar: 0 };
    FORENINGSFAELT.forEach(function (f) {
      var v = fil.forening && fil.forening[f] ? String(fil.forening[f]).trim() : '';
      if (v && !String(ut.forening[f] || '').trim()) { ut.forening[f] = v; antal.uppgifter++; }
    });
    (fil.adresser || []).forEach(function (a) {
      if (!a.text || ut.adresser.some(function (x) { return nyckel(x.text) === nyckel(a.text); })) return;
      ut.adresser.push({ id: nyttId(), etikett: String(a.etikett || ''), text: String(a.text) });
      antal.adresser++;
    });
    (fil.kontakter || []).forEach(function (k) {
      if (!k.namn || ut.kontakter.some(function (x) { return nyckel(x.namn) === nyckel(k.namn); })) return;
      ut.kontakter.push({ id: nyttId(), namn: String(k.namn), epost: String(k.epost || ''), mobil: String(k.mobil || '') });
      antal.kontakter++;
    });
    (fil.artiklar || []).forEach(function (a, i) {
      if (!a.beskrivning || !arHeltal(a.pris) || a.pris < 0) throw BokforingsFel('Artikel ' + (i + 1) + ' i filen har ogiltig beskrivning eller pris.');
      if (a.konto && !giltigtKontonummer(a.konto)) throw BokforingsFel('Artikel ' + (i + 1) + ' i filen har ett ogiltigt konto.');
      if (ut.artiklar.some(function (x) { return nyckel(x.beskrivning) === nyckel(a.beskrivning); })) return;
      ut.artiklar.push({ id: nyttId(), beskrivning: String(a.beskrivning), pris: a.pris, konto: a.konto || '' });

    // Avgifter för medlemmar: terminer som saknas läggs till, årsavgiften om den inte är angiven.
    if (fil.terminer || fil.arsavgift) {
      var reg = normaliseraRegister(befintligt.medlemsregister);
      antal.terminer = 0;
      (fil.terminer || []).forEach(function (t) {
        if (!t || reg.terminer.some(function (x) { return x.id === t.id; })) return;
        reg = sattTermin(reg, t.id, t.avgifter || {});
        antal.terminer++;
      });
      ['vanlig', 'funktionar'].forEach(function (k) {
        var v = fil.arsavgift && fil.arsavgift[k];
        if (arHeltal(v) && v > 0 && !reg.arsavgift[k]) { reg.arsavgift = Object.assign({}, reg.arsavgift); reg.arsavgift[k] = v; antal.terminer++; }

  // ---------- Medlemmar och terminsavgifter ----------
  // Betalare (ett Swish-nummer, en bankgiroreferens) kopplas till en eller flera medlemmar.
  // Samma barn kan ha flera betalare, och en betalare kan betala för flera.

  var KATEGORIER = [['barn', 'Barn'], ['student', 'Student'], ['vuxen', 'Vuxen'], ['familj', 'Familj'], ['funktionar', 'Funktionär, tränare eller stödmedlem']];
  var KATEGORI_KORT = { barn: 'Barn', student: 'Student', vuxen: 'Vuxen', familj: 'Familj', funktionar: 'Funktionär' };

  function tomtRegister() {
    return { format: 'foreningsbokforing-medlemsregister', medlemmar: [], betalare: [], terminer: [], arsavgift: { vanlig: 0, funktionar: 0 }, konton: { medlemsavgift: '', terminsavgift: '' }, betalningar: [], ignorerade: [], kvitton: [], swish: [], avforEfterAr: 2 };
  }

  function normaliseraRegister(r) {
    var t = tomtRegister();
    r = r && typeof r === 'object' ? r : {};
    Object.keys(t).forEach(function (k) {
      if (Array.isArray(t[k])) t[k] = Array.isArray(r[k]) ? r[k] : [];
      else if (typeof t[k] === 'object') t[k] = Object.assign(t[k], r[k] || {});
      else if (k === 'avforEfterAr') t[k] = Number.isInteger(r[k]) && r[k] > 0 ? r[k] : t[k];
    });
    return t;
  }

  function registerHarData(r) {
    return !!(r && (r.medlemmar.length || r.betalare.length || r.betalningar.length || r.terminer.length || r.konton.medlemsavgift || r.konton.terminsavgift));
  }

  function kategorinamn(k) {
    var x = KATEGORIER.find(function (y) { return y[0] === k; });
    return x ? x[1] : 'Okänd';
  }

  // Svenskt mobilnummer i en banktext, t.ex. "Swish +46701234567" eller "070-123 45 67".
  function hittaMobilnummer(t) {
    t = String(t || '');
    var re = /(\+46|0046|46|0)((?:[\s-]?\d){9})(?!\d)/g;
    var m;
    while ((m = re.exec(t))) {
      if (m.index > 0 && /[\d+]/.test(t[m.index - 1])) { re.lastIndex = m.index + 1; continue; }
      var d = m[2].replace(/\D/g, '');
      if (d.length === 9 && d[0] === '7') return '+46' + d;
      re.lastIndex = m.index + 1;
    }
    return null;
  }

  function visaMobilnummer(n) {
    var d = String(n).replace(/^\+46/, '');
    return '0' + d.slice(0, 2) + '-' + d.slice(2, 5) + ' ' + d.slice(5, 7) + ' ' + d.slice(7, 9);
  }

  // Vem som betalat, utifrån bankraden. Nyckeln används för att känna igen betalaren nästa gång.
  // Föreningens egna nummer (bankgiro, Swish). De står i kontoutdragets referens för egna insättningar
  // och är aldrig någon betalare. Sätts från föreningens uppgifter.
  var egnaNummer = [];
  function sattEgnaNummer(lista) { egnaNummer = (lista || []).map(function (x) { return String(x || '').replace(/\D/g, ''); }).filter(function (x) { return x.length >= 5; }); }
  function egnaNummerFor(forening) { return [forening && forening.bankgiro, forening && forening.swish].filter(Boolean); }
  function arEgetNummer(text) { var d = String(text || '').replace(/\D/g, ''); return !!d && egnaNummer.indexOf(d) >= 0; }

  // Betalare i registret som egentligen är föreningens eget nummer.
  function egnaBetalare(reg) {
    return reg.betalare.filter(function (b) { return /^ref:/.test(b.nyckel) && arEgetNummer(b.nyckel.slice(4)); });
  }

  function tolkaBetalare(bankrad) {
    if (!bankrad) return null;
    var text = String(bankrad.text || ''), ref = String(bankrad.referens || '').trim();
    if (arEgetNummer(ref)) ref = '';
    var mobil = hittaMobilnummer(text + ' ' + ref);
    if (mobil) return { nyckel: mobil, visning: visaMobilnummer(mobil), typ: 'swish' };
    if (ref && /\d/.test(ref)) return { nyckel: 'ref:' + ref.toLowerCase().replace(/\s+/g, ' '), visning: (/bankgiro/i.test(text) ? 'Bankgiro ' : 'Referens ') + ref, typ: 'referens' };
    var n = normaliseraText(text);
    if (n && !/^(swish|bankgiro|insattning|overforing|inbetalning)( |$)/.test(n.replace(/[åä]/g, 'a').replace(/ö/g, 'o'))) return { nyckel: 'text:' + n, visning: text.trim(), typ: 'text' };
    if (n && ref) return { nyckel: 'text:' + n + ' ' + ref.toLowerCase(), visning: text.trim() + ' ' + ref, typ: 'text' };
    return null;
  }

  // Terminer: VT = januari–juni, HT = juli–december. Id som på hemsidor: "HT-26".
  function terminForDatum(datum) {
    return (Number(datum.slice(5, 7)) <= 6 ? 'VT-' : 'HT-') + datum.slice(2, 4);
  }
  function terminSortering(id) { return '20' + id.slice(3, 5) + (id.slice(0, 2) === 'VT' ? '1' : '2'); }
  function terminNamn(id) { return (id.slice(0, 2) === 'VT' ? 'Vårterminen 20' : 'Höstterminen 20') + id.slice(3, 5); }
  function kalenderarForTermin(id) { return '20' + id.slice(3, 5); }
  function foregaendeTermin(id) {
    var ar = Number(id.slice(3, 5));
    return id.slice(0, 2) === 'HT' ? 'VT-' + String(ar).padStart(2, '0') : 'HT-' + String((ar + 99) % 100).padStart(2, '0');
  }
  function nastaTermin(id) {
    var ar = Number(id.slice(3, 5));
    return id.slice(0, 2) === 'VT' ? 'HT-' + String(ar).padStart(2, '0') : 'VT-' + String((ar + 1) % 100).padStart(2, '0');
  }
  function giltigtTerminId(id) { return /^(VT|HT)-\d{2}$/.test(String(id || '')); }

  // Avgifterna för en termin. Saknas terminen gäller den senaste tidigare terminens avgifter.
  function terminsavgifter(reg, id) {
    var t = reg.terminer.find(function (x) { return x.id === id; });
    if (t) return { avgifter: t.avgifter, fran: id };
    var tidigare = reg.terminer.filter(function (x) { return terminSortering(x.id) < terminSortering(id); })
      .sort(function (a, b) { return terminSortering(b.id) < terminSortering(a.id) ? -1 : 1; })[0];
    return tidigare ? { avgifter: tidigare.avgifter, fran: tidigare.id } : { avgifter: {}, fran: null };
  }

  function sattTermin(reg, id, avgifter) {
    if (!giltigtTerminId(id)) throw BokforingsFel('Terminen ska skrivas som VT-27 eller HT-26.');
    var a = {};
    KATEGORIER.forEach(function (k) {
      if (k[0] === 'funktionar') return;
      var v = avgifter && avgifter[k[0]];
      if (v != null && v !== '') { if (!arHeltal(v) || v < 0) throw BokforingsFel('Ogiltig avgift för ' + k[1].toLowerCase() + '.'); a[k[0]] = v; }
    });
    var terminer = reg.terminer.filter(function (t) { return t.id !== id; }).concat([{ id: id, avgifter: a }]);
    terminer.sort(function (x, y) { return terminSortering(x.id) < terminSortering(y.id) ? -1 : 1; });
    return Object.assign({}, reg, { terminer: terminer });
  }

  function taBortTermin(reg, id) {
    return Object.assign({}, reg, { terminer: reg.terminer.filter(function (t) { return t.id !== id; }) });
  }

  function nyttRegisterId(lista, prefix) {
    return prefix + (lista.reduce(function (m, x) { var n = Number(String(x.id).slice(prefix.length)); return n > m ? n : m; }, 0) + 1);
  }

  function laggTillMedlem(reg, uppgifter) {
    var namn = String((uppgifter && uppgifter.namn) || '').trim();
    var kategori = uppgifter && uppgifter.kategori;
    if (!namn) throw BokforingsFel('Medlemmen behöver ett namn.');
    if (!KATEGORIER.some(function (k) { return k[0] === kategori; })) throw BokforingsFel('Välj kategori för medlemmen.');
    var m = { id: nyttRegisterId(reg.medlemmar, 'm'), namn: namn, kategori: kategori };
    if (uppgifter.tillagd) m.tillagd = uppgifter.tillagd;
    if (uppgifter.apelido && String(uppgifter.apelido).trim()) m.apelido = String(uppgifter.apelido).trim();
    return { reg: Object.assign({}, reg, { medlemmar: reg.medlemmar.concat([m]) }), medlem: m };
  }

  // "Information för kvitto": fritext som står under mottagaren, högst 40 tecken per rad och 5 rader.
  var KVITTOINFO = { tecken: 40, rader: 5 };
  function kontrolleraKvittoinfo(text) {
    var rader = String(text || '').replace(/\r/g, '').split('\n');
    while (rader.length && !rader[rader.length - 1].trim()) rader.pop();
    var fel = [];
    if (rader.length > KVITTOINFO.rader) fel.push('Högst ' + KVITTOINFO.rader + ' rader (nu ' + rader.length + ').');
    rader.forEach(function (r, i) { if (r.length > KVITTOINFO.tecken) fel.push('Rad ' + (i + 1) + ' har ' + r.length + ' tecken (högst ' + KVITTOINFO.tecken + ').'); });
    return { text: rader.map(function (r) { return r.replace(/\s+$/, ''); }).join('\n'), fel: fel };
  }

  function andraMedlem(reg, id, andring) {
    if (!reg.medlemmar.some(function (m) { return m.id === id; })) throw BokforingsFel('Medlemmen finns inte.');
    if (andring.info != null) { var ki = kontrolleraKvittoinfo(andring.info); if (ki.fel.length) throw BokforingsFel(ki.fel); andring = Object.assign({}, andring, { info: ki.text }); }
    if (andring.namn != null && !String(andring.namn).trim()) throw BokforingsFel('Medlemmen behöver ett namn.');
    if (andring.kategori != null && !KATEGORIER.some(function (k) { return k[0] === andring.kategori; })) throw BokforingsFel('Okänd kategori.');
    return Object.assign({}, reg, {
      medlemmar: reg.medlemmar.map(function (m) {
        if (m.id !== id) return m;
        var n = Object.assign({}, m);
        if (andring.namn != null) n.namn = String(andring.namn).trim();
        if (andring.kategori != null) n.kategori = andring.kategori;
        if (andring.info != null) { if (andring.info) n.info = andring.info; else delete n.info; }
        if (andring.apelido != null) { var ap = String(andring.apelido).trim(); if (ap) n.apelido = ap; else delete n.apelido; }
        return n;
      })
    });
  }

  // Capoeiranamnet (apelido) först, sedan det riktiga namnet.
  function visaNamn(m) {
    if (!m) return '';
    return m.apelido ? m.apelido + ' – ' + m.namn : m.namn;
  }

  function taBortMedlem(reg, id) {
    if (reg.betalningar.some(function (b) { return b.poster.some(function (p) { return p.medlem === id; }); })) {
      throw BokforingsFel('Medlemmen har registrerade betalningar och kan inte tas bort.');
    }
    return Object.assign({}, reg, {
      medlemmar: reg.medlemmar.filter(function (m) { return m.id !== id; }),
      betalare: reg.betalare.map(function (b) { return Object.assign({}, b, { medlemmar: b.medlemmar.filter(function (x) { return x !== id; }) }); })
    });
  }

  // Slår ihop två medlemmar: betalningar, betalare och kvitton flyttas från "fran" till "till", och "fran" tas bort.
  function slaIhopMedlemmar(reg, fran, till) {
    if (fran === till) throw BokforingsFel('Välj en annan medlem.');
    var a = reg.medlemmar.find(function (m) { return m.id === fran; }), b = reg.medlemmar.find(function (m) { return m.id === till; });
    if (!a || !b) throw BokforingsFel('Medlemmen finns inte.');
    return Object.assign({}, reg, {
      medlemmar: reg.medlemmar.filter(function (m) { return m.id !== fran; }).map(function (m) {
        return m.id === till && !m.info && a.info ? Object.assign({}, m, { info: a.info }) : m;
      }),
      betalningar: reg.betalningar.map(function (x) {
        if (!x.poster.some(function (p) { return p.medlem === fran; })) return x;
        // Poster för samma medlem och typ läggs ihop.
        var poster = [];
        x.poster.forEach(function (p) {
          var q = Object.assign({}, p, { medlem: p.medlem === fran ? till : p.medlem });
          var finns = poster.find(function (y) { return y.medlem === q.medlem && y.typ === q.typ; });
          if (finns) finns.belopp += q.belopp; else poster.push(q);
        });
        return Object.assign({}, x, { poster: poster });
      }),
      betalare: reg.betalare.map(function (x) {
        if (x.medlemmar.indexOf(fran) < 0) return x;
        var ids = x.medlemmar.map(function (id) { return id === fran ? till : id; }).filter(function (id, i, l) { return l.indexOf(id) === i; });
        return Object.assign({}, x, { medlemmar: ids });
      }),
      kvitton: reg.kvitton.map(function (k) { return k.medlem === fran ? Object.assign({}, k, { medlem: till }) : k; })
    });
  }

  // Ny fördelning av en registrerad betalning på medlemmar, t.ex. när en förälder betalat för två barn.
  function andraFordelning(reg, betalningId, poster, termin) {
    var b = reg.betalningar.find(function (x) { return x.id === betalningId; });
    if (!b) throw BokforingsFel('Betalningen finns inte.');
    if (!poster || !poster.length) throw BokforingsFel('Välj minst en medlem.');
    poster.forEach(function (p) {
      if (!reg.medlemmar.some(function (m) { return m.id === p.medlem; })) throw BokforingsFel('Medlemmen finns inte.');
      if (!arHeltal(p.belopp) || p.belopp < 0) throw BokforingsFel('Ogiltigt belopp.');
    });
    if (summaPoster(poster) !== b.belopp) throw BokforingsFel('Fördelningen (' + formatBelopp(summaPoster(poster)) + ' kr) stämmer inte med beloppet ' + formatBelopp(b.belopp) + ' kr.');
    if (termin != null && !giltigtTerminId(termin)) throw BokforingsFel('Terminen ska skrivas som VT-27 eller HT-26.');
    return Object.assign({}, reg, {
      betalningar: reg.betalningar.map(function (x) {
        if (x.id !== betalningId) return x;
        return Object.assign({}, x, { termin: termin || x.termin, poster: poster.map(function (p) { return { medlem: p.medlem, typ: p.typ === 'arsavgift' ? 'arsavgift' : 'termin', belopp: p.belopp }; }) });
      })
    });
  }

  function hittaBetalare(reg, nyckel) {
    return reg.betalare.find(function (b) { return b.nyckel === nyckel; }) || null;
  }

  // Kopplar en betalare till medlemmar. Tidigare kopplingar finns kvar.
  function kopplaBetalare(reg, betalare, medlemIds) {
    if (!betalare || !betalare.nyckel) return reg;
    var finns = hittaBetalare(reg, betalare.nyckel);
    var ids = (finns ? finns.medlemmar : []).slice();
    (medlemIds || []).forEach(function (id) {
      if (!reg.medlemmar.some(function (m) { return m.id === id; })) throw BokforingsFel('Medlemmen finns inte.');
      if (ids.indexOf(id) < 0) ids.push(id);
    });
    var post = Object.assign({ nyckel: betalare.nyckel, visning: betalare.visning || betalare.nyckel, namn: '' }, finns || {}, { medlemmar: ids });
    return Object.assign({}, reg, { betalare: finns ? reg.betalare.map(function (b) { return b.nyckel === post.nyckel ? post : b; }) : reg.betalare.concat([post]) });
  }

  function andraBetalare(reg, nyckel, andring) {
    if (andring.info != null) { var ki = kontrolleraKvittoinfo(andring.info); if (ki.fel.length) throw BokforingsFel(ki.fel); andring = Object.assign({}, andring, { info: ki.text }); }
    return Object.assign({}, reg, {
      betalare: reg.betalare.map(function (b) {
        if (b.nyckel !== nyckel) return b;
        var n = Object.assign({}, b);
        if (andring.namn != null) n.namn = String(andring.namn).trim();
        if (andring.taBortMedlem) n.medlemmar = n.medlemmar.filter(function (x) { return x !== andring.taBortMedlem; });
        if (andring.info != null) { if (andring.info) n.info = andring.info; else delete n.info; }
        return n;
      })
    });
  }

  function taBortBetalare(reg, nyckel) {
    return Object.assign({}, reg, { betalare: reg.betalare.filter(function (b) { return b.nyckel !== nyckel; }) });
  }

  // Betalningar som gäller, dvs. inte bokförda i en verifikation som sedan rättats.
  function giltigaBetalningar(reg, arMap) {
    return reg.betalningar.filter(function (b) {
      if (b.ver == null || !arMap || !arMap[b.arId]) return true;
      return !rattadAv(arMap[b.arId], b.ver);
    });
  }

  function harBetaltArsavgift(reg, medlemId, kalenderar, arMap) {
    return giltigaBetalningar(reg, arMap).some(function (b) {
      return kalenderarForTermin(b.termin) === kalenderar && b.poster.some(function (p) { return p.medlem === medlemId && p.typ === 'arsavgift'; });
    });
  }

  function arsavgiftFor(reg, medlem) {
    return medlem.kategori === 'funktionar' ? (reg.arsavgift.funktionar || 0) : (reg.arsavgift.vanlig || 0);
  }

  // Poster för ett antal medlemmar en viss termin. Familjeavgiften tas en gång, på den första familjemedlemmen.
  // medArsavgift: true = alla som inte betalt i år, 'forsta' = bara den första (t.ex. en familj), false = ingen.
  // Med "årsavgiften ingår i terminsavgiften" (reg.arsavgift.ingar) räknas årsavgiften av från terminsavgiften
  // i stället för att läggas till, så länge medlemmen har en terminsavgift.
  function posterFor(reg, termin, medlemmar, medArsavgift, arMap) {
    var avg = terminsavgifter(reg, termin).avgifter;
    var ingar = !!(reg.arsavgift && reg.arsavgift.ingar);
    var poster = [], familjTagen = false;
    medlemmar.forEach(function (m) {
      var t = 0;
      if (m.kategori === 'familj') { t = familjTagen ? 0 : (avg.familj || 0); familjTagen = true; }
      else if (m.kategori !== 'funktionar') t = avg[m.kategori] || 0;
      // Har Fritidskortet betalat en del av terminsavgiften betalar föräldern resten.
      if (t) t = Math.max(0, t - betaltMedFritidskort(reg, m.id, termin));
      var a = 0;
      if (medArsavgift && (medArsavgift !== 'forsta' || m === medlemmar[0]) && !harBetaltArsavgift(reg, m.id, kalenderarForTermin(termin), arMap)) a = arsavgiftFor(reg, m);
      if (ingar && a && t) { a = Math.min(a, t); t -= a; }
      if (m.kategori !== 'funktionar' || t) poster.push({ medlem: m.id, typ: 'termin', belopp: t });
      if (a) poster.push({ medlem: m.id, typ: 'arsavgift', belopp: a });
    });
    return poster;
  }

  function summaPoster(poster) { return poster.reduce(function (s, p) { return s + p.belopp; }, 0); }

  // Förslag på hur en inbetalning fördelas: vilka medlemmar, vilken termin och årsavgift eller inte.
  // Prövar alla betalarens medlemmar först, sedan färre, med och utan årsavgift.
  function avgiftsforslag(reg, inbetalning, arMap) {
    var termin = inbetalning.termin || terminForDatum(inbetalning.datum);
    var betalare = inbetalning.nyckel ? hittaBetalare(reg, inbetalning.nyckel) : null;
    var ids = inbetalning.medlemIds || (betalare ? betalare.medlemmar : []);
    var medlemmar = ids.map(function (id) { return reg.medlemmar.find(function (m) { return m.id === id; }); }).filter(Boolean);
    var ut = { termin: termin, poster: [], summa: 0, stammer: false, tvetydig: false, kand: !!betalare, medlemIds: medlemmar.map(function (m) { return m.id; }) };
    if (!medlemmar.length) return ut;
    var delmangder = [];
    var n = Math.min(medlemmar.length, 6);
    for (var mask = (1 << n) - 1; mask > 0; mask--) {

      delmangder.push(urval);
    }
    delmangder.sort(function (a, b) { return b.length - a.length; });

    delmangder.forEach(function (urval) {
      (urval.length > 1 ? [true, 'forsta', false] : [true, false]).forEach(function (medArs) {
        var poster = posterFor(reg, termin, urval, medArs, arMap);

          if (!traffar.some(function (t) { return JSON.stringify(t.poster) === JSON.stringify(poster); })) traffar.push({ storlek: urval.length, poster: poster, medArs: medArs });
        }
      });
    });
    if (traffar.length) {
      var basta = traffar.filter(function (t) { return t.storlek === traffar[0].storlek; });
      var medArsTraff = basta.filter(function (t) { return t.medArs === true; });
      if (!medArsTraff.length) medArsTraff = basta.filter(function (t) { return t.medArs === 'forsta'; });
      var val = (medArsTraff.length ? medArsTraff : basta);

      ut.tvetydig = val.length > 1;

  }

  // Texten i verifikationen innehåller inga namn; vilka det gäller finns bara i medlemsregistret.
  function avgiftstext(reg, termin, poster) {
    var ids = [];
    poster.forEach(function (p) { if (ids.indexOf(p.medlem) < 0) ids.push(p.medlem); });
    var harArs = poster.some(function (p) { return p.typ === 'arsavgift' && p.belopp; });
    var harTermin = poster.some(function (p) { return p.typ === 'termin' && p.belopp; });
    var rubrik = harArs && harTermin ? 'Medlems- och terminsavgift ' + termin : harArs ? 'Medlemsavgift ' + kalenderarForTermin(termin) : 'Terminsavgift ' + termin;
    return rubrik + ', ' + ids.length + (ids.length === 1 ? ' medlem' : ' medlemmar');
  }

  // Verifikationsrader för en avgiftsbetalning: bankkontot mot terminsavgift och medlemsavgift.
  function avgiftsrader(reg, poster, bankkonto, belopp) {
    if (summaPoster(poster) !== belopp) throw BokforingsFel('Avgifterna (' + formatBelopp(summaPoster(poster)) + ' kr) stämmer inte med beloppet ' + formatBelopp(belopp) + ' kr.');
    var termin = 0, ars = 0;
    poster.forEach(function (p) { if (p.typ === 'arsavgift') ars += p.belopp; else termin += p.belopp; });
    if ((termin && !reg.konton.terminsavgift) || (ars && !reg.konton.medlemsavgift)) throw BokforingsFel('Välj konton för terminsavgift och medlemsavgift under Medlemsregister, Avgifter.');
    var rader = [{ konto: bankkonto, belopp: belopp }];
    if (termin) rader.push({ konto: reg.konton.terminsavgift, belopp: -termin });
    if (ars) rader.push({ konto: reg.konton.medlemsavgift, belopp: -ars });
    return rader;
  }

  function registreraBetalning(reg, b) {
    if (!giltigtTerminId(b.termin)) throw BokforingsFel('Ogiltig termin.');
    if (!arGiltigtDatum(b.datum)) throw BokforingsFel('Ogiltigt datum.');
    if (!b.poster || !b.poster.length) throw BokforingsFel('Välj minst en medlem.');
    b.poster.forEach(function (p) {
      if (!reg.medlemmar.some(function (m) { return m.id === p.medlem; })) throw BokforingsFel('Medlemmen finns inte.');
      if (!arHeltal(p.belopp) || p.belopp < 0) throw BokforingsFel('Ogiltigt belopp.');
    });
    if (summaPoster(b.poster) !== b.belopp) throw BokforingsFel('Fördelningen (' + formatBelopp(summaPoster(b.poster)) + ' kr) stämmer inte med beloppet ' + formatBelopp(b.belopp) + ' kr.');
    if (b.bankradId && reg.betalningar.some(function (x) { return x.bankradId === b.bankradId && x.arId === b.arId; })) throw BokforingsFel('Betalningen är redan kopplad till medlemmar.');

  // Betalningar som hör till ett år i bokföringen men vars bankrad inte längre är bokförd i samma verifikation,
  // t.ex. efter "Börja om" eller när en verifikation har tagits bort. Dessutom betalningar inlästa från ett års Excel-fil
  // när samma år nu bokförs i appen (inte är en arkivkopia), eftersom de annars räknas två gånger.
  function excelArForBetalning(b) {
    var m = /^excel:(\d{4}):/.exec(b.kalla || '');
    return m ? m[1] : null;
  }

  function foraldradeBetalningar(reg, arMap) {
    return (reg.betalningar || []).filter(function (b) {
      var excelAr = excelArForBetalning(b);
      if (excelAr) return !!(arMap && arMap[excelAr] && !arMap[excelAr].grovkopia);
      var ar = b.arId && arMap ? arMap[b.arId] : null;
      if (!ar) return false;
      if (b.bankradId) {
        var rad = (ar.bankrader || []).find(function (r) { return r.id === b.bankradId; });
        return !rad || rad.verifikation == null || rad.verifikation !== b.ver;
      }
      return b.ver != null && !(ar.verifikationer || []).some(function (v) { return v.nr === b.ver; });
    }).map(function (b) { return b.id; });
  }

  function taBortBetalningar(reg, ids) {
    return Object.assign({}, reg, { betalningar: reg.betalningar.filter(function (b) { return ids.indexOf(b.id) < 0; }) });
  }

  function taBortBetalning(reg, id) {
    return Object.assign({}, reg, { betalningar: reg.betalningar.filter(function (b) { return b.id !== id; }) });
  }

  // Bokförda inbetalningar med en känd sorts betalare som inte är kopplade till någon medlem.
  // ---------- Fritidskortet: barnets avgift betald med barnets fritidskort ----------

  var FRITIDSKORT = { nyckel: 'fritidskort', visning: 'Fritidskortet', typ: 'fritidskort' };

  // Namnet i en betalningsreferens eller ett meddelande, utan siffror (personnummer, avinummer).
  function rensaReferens(text) {
    return String(text || '').replace(/\d[\d\s+\-]*/g, ' ').replace(/(^|\s)[-+](?=\s|$)/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function arFritidskort(u) {
    return !!u && (/fritidskort/i.test(u.motpart || '') || (u.poster || []).some(function (p) { return /fritidskort/i.test(p.avsandare || ''); }));
  }

  // Ord i ett namn för jämförelse: utan prickar och accenter (banker skriver ofta Muller för Müller, Ostrom för Öström).
  function namnOrd(t) {
    return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/ø/g, 'o').replace(/æ/g, 'ae')
      .replace(/[^a-z\s-]/g, ' ').replace(/-/g, ' ').split(/\s+/).filter(Boolean);
  }
  // Alla ord i det kortare namnet finns i det längre, och minst två ord.
  function sammaNamn(a, b) {
    var x = namnOrd(a), y = namnOrd(b);
    var kort = x.length <= y.length ? x : y, lang = x.length <= y.length ? y : x;
    return kort.length >= 2 && kort.every(function (w) { return lang.indexOf(w) >= 0; });
  }

  // Medlemmar som ett namn kan gälla: medlemmar med det namnet, annars barnen till en betalare med det namnet (t.ex. en förälder).
  function kandidaterPaNamn(reg, namn) {
    var aktiva = function (id) { var m = reg.medlemmar.find(function (x) { return x.id === id; }); return m && !m.avford; };
    var direkt = reg.medlemmar.filter(function (m) { return !m.avford && sammaNamn(namn, m.namn); }).map(function (m) { return m.id; });
    if (direkt.length) return { medlemmar: direkt, via: 'medlem' };
    var viaBetalare = [];
    reg.betalare.forEach(function (b) { if (b.namn && sammaNamn(namn, b.namn)) b.medlemmar.forEach(function (id) { if (aktiva(id) && viaBetalare.indexOf(id) < 0) viaBetalare.push(id); }); });
    if (viaBetalare.length) return { medlemmar: viaBetalare, via: 'betalare' };

    var ord = namnOrd(namn);
    var viaApelido = reg.medlemmar.filter(function (m) { var a = namnOrd(m.apelido); return !m.avford && a.length && a.every(function (w) { return ord.indexOf(w) >= 0; }); }).map(function (m) { return m.id; });

  // Medlemmen som namnet gäller, bara om det är entydigt.
  function hittaMedlemPaNamn(reg, namn) {
    var k = kandidaterPaNamn(reg, namn);
    return k.medlemmar.length === 1 ? k.medlemmar[0] : null;
  }

  // Betalningarna på en insättningsuppgift. Inlästa före version 1.49 saknar de: då letas namnet i underlagets text.
  // Saknar betalningen namn (t.ex. när namnet stod i meddelandet) letas det också i texten.
  var FK_ORD = ['fritidskortet', 'fritidskort', 'insattning', 'insattningar', 'insattningsuppgift', 'avgift', 'avgifter', 'terminsavgift', 'deltagaravgift', 'deltagaravgifter',
    'medlemsavgift', 'traningsavgift', 'betalning', 'for', 'fran', 'via', 'av', 'och'];
  function namnUrText(text) {
    // Delar vid komma, kolon och semikolon, och vid "- " som banker ibland skriver i stället för komma.
    return String(text || '').split(/[,:;]|\s*-\s+/).map(function (del) {
      return rensaReferens(del).split(/\s+/).filter(function (w) { return w && FK_ORD.indexOf(namnOrd(w)[0]) < 0; }).join(' ');
    }).filter(function (x) { return namnOrd(x).length >= 2; }).pop() || '';
  }
  function fritidskortPoster(u) {
    var poster = u.poster && u.poster.length ? u.poster : [{ namn: '', belopp: u.belopp }];
    if (poster.length === 1 && !poster[0].namn) return [Object.assign({}, poster[0], { namn: namnUrText(u.beskrivning) })];
    return poster;
  }

  // Fördelningen av Fritidskortets belopp för en medlem: betalar kortet hela avgiften delas den upp som vanligt
  // (årsavgift första gången under året), annars är beloppet terminsavgift och föräldern betalar resten.
  function fritidskortFordelning(reg, medlemId, belopp, termin, arMap) {
    var m = reg.medlemmar.find(function (x) { return x.id === medlemId; });
    if (!m) return [];
    var hela = posterFor(reg, termin, [m], true, arMap);
    return summaPoster(hela) === belopp ? hela : [{ medlem: m.id, typ: 'termin', belopp: belopp }];
  }

  // Det som betalats med Fritidskortet för en medlem en viss termin (räknas av när föräldern betalar resten).
  function betaltMedFritidskort(reg, medlemId, termin) {
    return reg.betalningar.filter(function (b) { return b.nyckel === FRITIDSKORT.nyckel && b.termin === termin; })
      .reduce(function (s, b) { return s + b.poster.filter(function (p) { return p.medlem === medlemId && p.typ === 'termin'; }).reduce(function (x, p) { return x + p.belopp; }, 0); }, 0);
  }

  // Förslag för en insättning från Fritidskortet: en rad per barn. Fritidskortets belopp räknas som terminsavgift;
  // betalar kortet hela avgiften delas den upp som vanligt (med årsavgift första gången under året).
  function fritidskortForslag(reg, u, termin, arMap) {
    var poster = fritidskortPoster(u);
    var rader = poster.map(function (p) {
      var kand = kandidaterPaNamn(reg, p.namn);
      var medlem = kand.medlemmar.length === 1 ? kand.medlemmar[0] : null, m = medlem ? reg.medlemmar.find(function (x) { return x.id === medlem; }) : null;
      var fp = m ? fritidskortFordelning(reg, m.id, p.belopp, termin, arMap) : [];
      return { namn: p.namn, belopp: p.belopp, medlem: medlem, kandidater: kand.medlemmar, via: kand.via, poster: fp };
    });
    return { termin: termin, rader: rader, poster: [].concat.apply([], rader.map(function (r) { return r.poster; })), alla: rader.every(function (r) { return r.medlem; }) };

  function okoppladeInbetalningar(reg, ar, arId) {
    var kopplade = {};

    return (ar.bankrader || []).filter(function (r) {
      if (r.belopp <= 0 || r.verifikation == null || kopplade[r.id] || reg.ignorerade.indexOf(arId + '|' + r.id) >= 0) return false;
      if (rattadAv(ar, r.verifikation)) return false;
      if ((ar.underlag || []).some(function (u) { return u.verifikation === r.verifikation && arFritidskort(u); })) return true;
      var b = tolkaBetalare(r);
      return b && b.typ === 'swish';
    });
  }

  function terminerMedData(reg) {
    var ids = {};
    reg.terminer.forEach(function (t) { ids[t.id] = true; });
    reg.betalningar.forEach(function (b) { ids[b.termin] = true; });
    return Object.keys(ids).sort(function (a, b) { return terminSortering(a) < terminSortering(b) ? -1 : 1; });
  }

  // Statistik för en termin: vilka som betalat, per kategori, och vilka som betalade förra terminen men inte nu.
  function terminsstatistik(reg, termin, arMap) {
    var giltiga = giltigaBetalningar(reg, arMap);
    var perMedlem = function (t) {
      var ut = {};
      giltiga.filter(function (b) { return b.termin === t; }).forEach(function (b) {
        b.poster.forEach(function (p) {
          var x = ut[p.medlem] || (ut[p.medlem] = { termin: 0, arsavgift: 0, datum: [] });
          if (p.typ === 'arsavgift') x.arsavgift += p.belopp; else x.termin += p.belopp;
          if (x.datum.indexOf(b.datum) < 0) x.datum.push(b.datum);

      });
      return ut;
    };
    var nu = perMedlem(termin), fore = perMedlem(foregaendeTermin(termin));
    var medlem = function (id) { return reg.medlemmar.find(function (m) { return m.id === id; }) || { id: id, namn: '(borttagen)', kategori: '' }; };
    var avg = terminsavgifter(reg, termin).avgifter;
    var perKategori = {};
    KATEGORIER.forEach(function (k) { perKategori[k[0]] = { antal: 0, termin: 0, arsavgift: 0 }; });
    var betalande = Object.keys(nu).map(function (id) {
      var m = medlem(id), x = nu[id];
      var k = perKategori[m.kategori] || (perKategori[m.kategori] = { antal: 0, termin: 0, arsavgift: 0 });
      k.antal++; k.termin += x.termin; k.arsavgift += x.arsavgift;
      var forvantat = m.kategori === 'familj' || m.kategori === 'funktionar' ? null : avg[m.kategori];
      return { medlem: m.id, namn: m.namn, kategori: m.kategori, termin: x.termin, arsavgift: x.arsavgift, datum: x.datum.sort(), forvantat: forvantat == null ? null : forvantat };
    }).sort(function (a, b) { return a.namn.localeCompare(b.namn, 'sv'); });
    var totalt = { antal: betalande.length, termin: 0, arsavgift: 0 };
    betalande.forEach(function (b) { totalt.termin += b.termin; totalt.arsavgift += b.arsavgift; });

    return {
      termin: termin,
      avgifter: avg,
      perKategori: perKategori,

      betalande: betalande,

      slutat: Object.keys(fore).filter(function (id) { return !nu[id]; }).map(function (id) { var m = medlem(id); return { medlem: id, namn: m.namn, kategori: m.kategori }; })
        .sort(function (a, b) { return a.namn.localeCompare(b.namn, 'sv'); })
    };
  }

  function terminshistorik(reg, arMap) {
    return terminerMedData(reg).map(function (t) {
      var s = terminsstatistik(reg, t, arMap);
      var rad = { termin: t, antal: s.totalt.antal, summa: s.totalt.summa };
      KATEGORIER.forEach(function (k) { rad[k[0]] = s.perKategori[k[0]].antal; });

    }).filter(function (r) { return r.antal > 0; });
  }



  // ---------- Tidigare år från föreningens Excel-arbetsböcker ----------
  // Arbetsboken lämnas in som { flikar: { namn: [[cell, …], …] } } där datum redan är 'ÅÅÅÅ-MM-DD'.
  // Bokföringen blir en låst arkivkopia; avgifterna i bankfliken blir betalningar i medlemsregistret.

  function flik(bok, namn) {
    var n = Object.keys(bok.flikar || {}).find(function (k) { return k.trim().toLowerCase() === namn.toLowerCase(); });
    return n ? bok.flikar[n] : null;
  }

  function cellText(c) { return c == null ? '' : String(c).trim(); }

  // Rubrikraden: den första raden som innehåller alla rubrikerna. Ger { rad, kol: { rubrik: index } }.
  // Rubriker jämförs utan mellanslag och radbrytningar (i vissa år står "Verifikationsnummer" på flera rader).
  function nyck(t) { return cellText(t).toLowerCase().replace(/[\s\u00ad]+/g, ''); }

  function rubriker(rader, ord) {
    for (var i = 0; i < Math.min(rader.length, 40); i++) {
      var kol = {};
      (rader[i] || []).forEach(function (c, j) { var t = nyck(c); if (t && kol[t] == null) kol[t] = j; });
      if (ord.every(function (o) { return kol[nyck(o)] != null; })) return { rad: i, kol: kol };
    }
    return null;
  }

  function excelDatum(c) {
    var t = cellText(c);
    var m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m && arGiltigtDatum(m[1] + '-' + m[2] + '-' + m[3]) ? m[1] + '-' + m[2] + '-' + m[3] : null;
  }

  function excelBelopp(c) {
    if (typeof c === 'number' && isFinite(c)) return Math.round(c * 100);
    var t = cellText(c);
    return t ? tolkaBankbelopp(t) : null;
  }

  function excelKonto(c) {
    var t = cellText(c).replace(/\.0+$/, '');
    return /^[1-8]\d{3}$/.test(t) ? t : null;
  }

  // Namn skrivs olika: "EFTERNAMN, FÖRNAMN", "FÖRNAMN EFTERNAMN". Nyckeln är oberoende av ordning och versaler.
  function namnNyckel(namn) {
    return cellText(namn).toLowerCase().replace(/[^a-zåäöéèüæøß\s,-]/g, ' ').replace(/[,-]/g, ' ').split(/\s+/).filter(Boolean).sort().join(' ');
  }

  function visningsnamn(namn) {
    var t = cellText(namn).replace(/\s+/g, ' ');
    var m = t.match(/^([^,]+),\s*(.+)$/);
    if (m) t = m[2] + ' ' + m[1];
    if (t === t.toUpperCase()) t = t.toLowerCase().replace(/(^|[\s-])([a-zåäöéü])/g, function (x, a, b) { return a + b.toUpperCase(); });
    return t.trim();
  }

  var AVGIFTSKOMMENTAR = /^\s*(terminsavg\w*|träningsavg\w*|traningsavg\w*|medlemsavg\w*)\b(.*)$/i;

  // Terminen ur en kommentar som "Terminsavgift VT2026 - …" eller "Terminsavgift HT22 - …".
  function terminIText(t) {
    var m = String(t || '').match(/\b(VT|HT)\s*-?\s*(\d{4}|\d{2})\b/i);
    return m ? m[1].toUpperCase() + '-' + m[2].slice(-2) : null;
  }

  // Tar bort namnet i en avgiftstext: "Terminsavgift VT2026 - Namn" -> "Terminsavgift VT2026".
  function avgiftstextUtanNamn(text) {
    var t = String(text || '');
    if (!AVGIFTSKOMMENTAR.test(t)) return t;
    return t.replace(/\s+-\s+.*$/, '').replace(/^(\s*\S+\s+(VT|HT)\s*-?\s*\d{2,4})\b.*$/i, '$1').trim();
  }

  function tolkaArsbok(bok, filnamn) {
    var ut = { filnamn: filnamn || '', ar: null, kontoplan: [], ingaendeBalans: {}, verifikationer: [], swish: [], avgifter: [], avvikelser: [], saknas: [] };
    // Kontoplan: första heltalet 1000–8999 på raden och texten efter det.
    var kp = flik(bok, 'Kontoplan_lookup') || flik(bok, 'Kontoplan');
    var namn = {};
    (kp || []).forEach(function (r) {
      for (var j = 0; j < (r || []).length; j++) {
        var nr = typeof r[j] === 'number' ? excelKonto(r[j]) : null;
        if (nr) {
          var n = (r.slice(j + 1).find(function (c) { return typeof c === 'string' && c.trim(); }) || '').trim();

          return;
        }
      }
    });

  // ---------- Roller ----------

  // Mallar för paragraferna. Årsmötet får föredragningslistan från årsmötessidan.
  function motesmall(typ, opt) {
    opt = opt || {};
    var p = function (rubrik, text) { return { rubrik: rubrik, text: text || '' }; };
    if (typ === 'konstituerande') return [
      p('Mötets öppnande', 'Mötet öppnades.'),
      p('Val av mötesfunktionärer', 'Till ordförande för mötet valdes … Till sekreterare för mötet valdes … Till justerare valdes …'),
      p('Fastställande av styrelsen', 'Styrelsen konstituerade sig i enlighet med beslut på årsmötet:\nOrdförande: …\nVice ordförande: …\nSekreterare: …\nKassör: …\nLedamot: …'),
      p('Firmatecknare', 'Till firmatecknare för föreningen utsågs:\n… (fullständigt personnummer)\n… (fullständigt personnummer)\nFirmatecknarna tecknar föreningen var för sig.'),
      p('Övriga frågor', 'Inga övriga frågor.'),
      p('Nästa styrelsemöte', ''),
      p('Mötets avslutande', 'Mötet avslutades.')
    ];
    if (typ === 'arsmote' || typ === 'extra') {
      var punkter = (opt.dagordning || '').split('\n').map(function (r) { return r.replace(/^\s*\d+[.)]\s*/, '').trim(); }).filter(Boolean);
      return [p('Mötets öppnande', 'Föreningens ordförande hälsade alla välkomna och förklarade mötet öppnat.')]
        .concat(punkter.map(function (x) { return p(x, ''); }))
        .concat([p('Mötets avslutande', 'Mötesordföranden tackade alla närvarande och förklarade mötet avslutat.')]);
    }
    return [
      p('Mötets öppnande', 'Ordföranden öppnade mötet.'),
      p('Val av justerare', ''),
      p('Godkännande av dagordningen', 'Dagordningen godkändes.'),
      p('Föregående protokoll', 'Föregående protokoll lades till handlingarna.'),
      p('Ekonomi', ''),
      p('Verksamheten', ''),
      p('Beslut', ''),
      p('Övriga frågor', ''),
      p('Nästa möte', ''),
      p('Mötets avslutande', 'Mötet avslutades.')
    ];
  }

  // Mötets funktionärer väljs för varje möte och är skilda från rollerna i appen:
  // på årsmötet kan någon annan än styrelsens ordförande och sekreterare leda mötet och föra protokollet.
  // Varje funktionär: { namn, epost }. epost behövs bara för elektronisk underskrift.
  function normFunktionarer(f, behallTomma) {
    f = f || {};
    var en = function (x) { x = x || {}; return { namn: String(x.namn || '').trim(), epost: String(x.epost || '').trim().toLowerCase() }; };
    return { ordforande: en(f.ordforande), sekreterare: en(f.sekreterare), justerare: (f.justerare || []).map(en).filter(function (x) { return behallTomma || x.namn || x.epost; }) };
  }

  // Vilka som ska skriva under: mötesordförande, mötessekreterare och justerare.
  // kanLoggaIn(epost) säger om personen finns i appen. De som inte kan skriva under elektroniskt hamnar i saknas.
  function forslagUndertecknare(m, kanLoggaIn) {
    var f = normFunktionarer(m.funktionarer);
    var lista = [];
    if (f.ordforande.namn || f.ordforande.epost) lista.push(Object.assign({ roll: 'Mötesordförande' }, f.ordforande));
    if (f.sekreterare.namn || f.sekreterare.epost) lista.push(Object.assign({ roll: 'Mötessekreterare' }, f.sekreterare));
    f.justerare.forEach(function (j) { lista.push(Object.assign({ roll: 'Justerare' }, j)); });
    // Samma person i två funktioner skriver under en gång.
    var sedda = {};
    lista = lista.filter(function (x) { var k = x.epost || x.namn; if (sedda[k]) { sedda[k].roll += ' och ' + x.roll.toLowerCase(); return false; } sedda[k] = x; return true; });
    var ok = lista.filter(function (x) { return x.epost && (!kanLoggaIn || kanLoggaIn(x.epost)); });
    var saknas = lista.filter(function (x) { return ok.indexOf(x) < 0; });
    return { undertecknare: ok, saknas: saknas, metod: saknas.length || !ok.length ? 'papper' : 'e' };
  }

  function nyttMote(styr, uppgifter) {
    var typ = uppgifter.typ || 'styrelse';
    if (!MOTESTYPER.some(function (t) { return t[0] === typ; })) throw BokforingsFel('Okänd mötestyp.');
    if (!arGiltigtDatum(uppgifter.datum)) throw BokforingsFel('Ange mötets datum.');
    var m = { id: styrId('mo'), typ: typ, datum: uppgifter.datum, tid: uppgifter.tid || '', plats: uppgifter.plats || '', narvarande: uppgifter.narvarande || '',
      funktionarer: normFunktionarer(uppgifter.funktionarer), paragrafer: motesmall(typ, uppgifter), beslut: [], status: 'utkast', skapad: uppgifter.skapad || null };
    return { styr: Object.assign({}, styr, { moten: styr.moten.concat([m]) }), mote: m };
  }

  function hittaMote(styr, id) {
    var m = styr.moten.find(function (x) { return x.id === id; });
    if (!m) throw BokforingsFel('Mötet finns inte.');
    return m;
  }

  function andraMote(styr, id, andring) {
    var m = hittaMote(styr, id);
    if (m.status !== 'utkast') throw BokforingsFel('Protokollet är låst för underskrift och kan inte ändras.');
    var ok = ['datum', 'tid', 'plats', 'narvarande', 'paragrafer', 'beslut', 'funktionarer'];
    var n = Object.assign({}, m);
    Object.keys(andring).forEach(function (k) { if (ok.indexOf(k) >= 0) n[k] = k === 'funktionarer' ? normFunktionarer(andring[k], true) : andring[k]; });
    return Object.assign({}, styr, { moten: styr.moten.map(function (x) { return x.id === id ? n : x; }) });
  }

  function taBortMote(styr, id) {
    var m = hittaMote(styr, id);
    if (m.status !== 'utkast') throw BokforingsFel('Ett låst protokoll kan inte tas bort.');
    return Object.assign({}, styr, { moten: styr.moten.filter(function (x) { return x.id !== id; }) });
  }

  // Det som skrivs under: allt som står i protokollet, i en bestämd ordning.
  function protokolltext(m) {
    var typ = (MOTESTYPER.find(function (t) { return t[0] === m.typ; }) || ['', ''])[1];
    var f = normFunktionarer(m.funktionarer);
    var rader = [typ, 'Datum: ' + m.datum + (m.tid ? ' ' + m.tid : ''), 'Plats: ' + (m.plats || ''), 'Närvarande: ' + (m.narvarande || ''),
      'Mötesordförande: ' + f.ordforande.namn, 'Mötessekreterare: ' + f.sekreterare.namn, 'Justerare: ' + f.justerare.map(function (j) { return j.namn; }).filter(Boolean).join(', ')];
    m.paragrafer.forEach(function (p, i) { rader.push('§ ' + (i + 1) + ' ' + p.rubrik); if (p.text) rader.push(p.text); });
    if (m.beslut.length) { rader.push('Beslut:'); m.beslut.forEach(function (b, i) { rader.push((i + 1) + '. ' + b.text + (b.belopp ? ' (' + formatBelopp(b.belopp) + ' kr)' : '')); }); }
    return rader.join('\n');
  }

  // Lås protokollet för underskrift. metod: 'e' (elektroniskt i appen) eller 'papper' (bläck, inskannat).
  // undertecknare: [{ epost, roll }] för elektronisk underskrift. kontrollsumma: SHA-256 av protokolltexten.
  function lasForUnderskrift(styr, id, metod, undertecknare, kontrollsumma, tid) {
    var m = hittaMote(styr, id);
    if (m.status !== 'utkast') throw BokforingsFel('Protokollet är redan låst.');
    if (metod !== 'e' && metod !== 'papper') throw BokforingsFel('Välj elektronisk underskrift eller papper.');
    if (metod === 'e' && (!undertecknare || !undertecknare.length)) throw BokforingsFel('Välj vilka som ska skriva under.');
    if (!/^[0-9a-f]{64}$/.test(kontrollsumma || '')) throw BokforingsFel('Kontrollsumman saknas.');
    var n = Object.assign({}, m, { status: 'last', underskrift: { metod: metod, kontrollsumma: kontrollsumma, last: tid || null,
      undertecknare: (undertecknare || []).map(function (u) { return { epost: String(u.epost).toLowerCase(), namn: u.namn || '', roll: u.roll || '' }; }), signaturer: [], fil: null } });
    return Object.assign({}, styr, { moten: styr.moten.map(function (x) { return x.id === id ? n : x; }) });
  }

  // Lås upp, bara om ingen har skrivit under ännu.
  function lasUppProtokoll(styr, id) {
    var m = hittaMote(styr, id);
    if (m.status === 'utkast') return styr;
    if ((m.underskrift.signaturer || []).length || m.underskrift.fil) throw BokforingsFel('Någon har redan skrivit under. Protokollet kan inte ändras.');
    var n = Object.assign({}, m, { status: 'utkast' });
    delete n.underskrift;
    return Object.assign({}, styr, { moten: styr.moten.map(function (x) { return x.id === id ? n : x; }) });
  }

  function signera(styr, id, epost, namn, kontrollsumma, tid) {
    var m = hittaMote(styr, id);
    var u = m.underskrift;
    epost = String(epost || '').toLowerCase();
    if (!u || u.metod !== 'e') throw BokforingsFel('Protokollet är inte låst för elektronisk underskrift.');
    if (kontrollsumma !== u.kontrollsumma) throw BokforingsFel('Protokollet har ändrats sedan det låstes. Underskriften görs inte.');
    if (!u.undertecknare.some(function (x) { return x.epost === epost; })) throw BokforingsFel('Du står inte bland dem som ska skriva under.');
    if (u.signaturer.some(function (x) { return x.epost === epost; })) throw BokforingsFel('Du har redan skrivit under.');
    var nyU = Object.assign({}, u, { signaturer: u.signaturer.concat([{ epost: epost, namn: namn || epost, tid: tid || null, kontrollsumma: kontrollsumma }]) });
    var klar = u.undertecknare.every(function (x) { return nyU.signaturer.some(function (s2) { return s2.epost === x.epost; }); });
    var n = Object.assign({}, m, { underskrift: nyU, status: klar ? 'signerat' : 'last' });
    return Object.assign({}, styr, { moten: styr.moten.map(function (x) { return x.id === id ? n : x; }) });
  }

  // Papper: den inskannade, undertecknade PDF:en har laddats upp.
  function registreraPapper(styr, id, fil, tid) {
    var m = hittaMote(styr, id);
    if (!m.underskrift || m.underskrift.metod !== 'papper') throw BokforingsFel('Protokollet är inte låst för underskrift på papper.');
    if (!fil || !fil.namn) throw BokforingsFel('Välj den inskannade filen.');
    var n = Object.assign({}, m, { status: 'signerat', underskrift: Object.assign({}, m.underskrift, { fil: { namn: fil.namn, odId: fil.odId || null, lokalId: fil.lokalId || null, tid: tid || null } }) });
    return Object.assign({}, styr, { moten: styr.moten.map(function (x) { return x.id === id ? n : x; }) });
  }

  // Kontroll: stämmer protokolltexten med kontrollsumman som skrevs under?
  function kontrolleraUnderskrifter(m, kontrollsumma) {
    if (!m.underskrift) return { ok: false, text: 'Inte låst för underskrift.' };
    if (m.underskrift.metod === 'papper') return { ok: !!m.underskrift.fil, text: m.underskrift.fil ? 'Undertecknat på papper, inskannat.' : 'Väntar på den inskannade filen.' };
    var andrad = kontrollsumma !== m.underskrift.kontrollsumma;
    var felaktiga = m.underskrift.signaturer.filter(function (s2) { return s2.kontrollsumma !== m.underskrift.kontrollsumma; });
    return { ok: !andrad && !felaktiga.length, andrad: andrad, text: andrad ? 'Protokollet har ändrats efter att det låstes.' : felaktiga.length ? 'En underskrift gäller en annan version.' : 'Oförändrat sedan det låstes.' };
  }

  // ---------- Årsrapporten: elektronisk underskrift ----------

  // Text som beskriver årets bokföring. Ändras något i bokföringen ändras texten, och därmed kontrollsumman.
  function arsrapportKontrolltext(ar) {
    var ib = Object.keys(ar.ingaendeBalans || {}).sort().filter(function (k) { return ar.ingaendeBalans[k]; }).map(function (k) { return k + ':' + ar.ingaendeBalans[k]; });
    var ver = grundbok(ar).map(function (v) {
      return v.nr + '|' + v.datum + '|' + v.text + '|' + v.rader.map(function (r) { return r.konto + ':' + r.belopp; }).join(',') + (v.rattar != null ? '|rättar ' + v.rattar : '');
    });
    return ['Räkenskapsår ' + ar.start + ' - ' + ar.slut, 'IB ' + ib.join(' ')].concat(ver).join('\n');
  }

  // Skickar en årsrapport för underskrift. r: { id, arId, titel, fil: { namn, odId, webUrl }, kontrollsumma (SHA-256 av PDF-filen),
  // bokforingSumma (SHA-256 av kontrolltexten), undertecknare: [{ epost, namn, roll }], av, tid }.
  // En tidigare version för samma år som ingen har skrivit under ersätts; annars markeras den som ersatt.
  function skickaArsrapport(styr, r) {
    if (!r || !r.arId) throw BokforingsFel('Räkenskapsåret saknas.');
    if (!r.undertecknare || !r.undertecknare.length) throw BokforingsFel('Välj vilka som ska skriva under.');
    if (!/^[0-9a-f]{64}$/.test(r.kontrollsumma || '') || !/^[0-9a-f]{64}$/.test(r.bokforingSumma || '')) throw BokforingsFel('Kontrollsumman saknas.');
    var ny = { id: r.id || styrId('ars'), arId: String(r.arId), titel: r.titel || 'Årsrapport ' + r.arId, fil: r.fil || null, kontrollsumma: r.kontrollsumma,
      bokforingSumma: r.bokforingSumma, av: r.av || '', tid: r.tid || null, ersatt: false,
      undertecknare: r.undertecknare.map(function (u) { return { epost: String(u.epost || '').toLowerCase(), namn: u.namn || '', roll: u.roll || '' }; }), signaturer: [] };
    var lista = (styr.rapporter || []).filter(function (x) { return !(x.arId === ny.arId && !x.ersatt && !x.signaturer.length); })
      .map(function (x) { return x.arId === ny.arId ? Object.assign({}, x, { ersatt: true }) : x; });
    return Object.assign({}, styr, { rapporter: lista.concat([ny]) });
  }

  function hittaArsrapport(styr, id) {
    var r = (styr.rapporter || []).find(function (x) { return x.id === id; });
    if (!r) throw BokforingsFel('Årsrapporten finns inte.');
    return r;
  }

  function andraArsrapport(styr, id, ny) {
    return Object.assign({}, styr, { rapporter: styr.rapporter.map(function (x) { return x.id === id ? ny : x; }) });
  }

  // Elektronisk underskrift av den sparade PDF-filen. kontrollsumma: SHA-256 av filen som den som skriver under har hämtat.
  function signeraArsrapport(styr, id, epost, namn, kontrollsumma, tid) {
    var r = hittaArsrapport(styr, id);
    epost = String(epost || '').toLowerCase();
    if (r.ersatt) throw BokforingsFel('Det finns en nyare version av årsrapporten. Skriv under den i stället.');
    if (kontrollsumma !== r.kontrollsumma) throw BokforingsFel('Filen har ändrats sedan den skickades för underskrift. Underskriften görs inte.');
    if (!r.undertecknare.some(function (u) { return u.epost === epost; })) throw BokforingsFel('Du står inte bland dem som ska skriva under.');
    if (r.signaturer.some(function (x) { return x.epost === epost; })) throw BokforingsFel('Du har redan skrivit under.');
    return andraArsrapport(styr, id, Object.assign({}, r, { signaturer: r.signaturer.concat([{ epost: epost, namn: namn || epost, tid: tid || null, metod: 'e', kontrollsumma: kontrollsumma }]) }));
  }

  // Någon har skrivit under på papper, till exempel utan Microsoft-konto. Registreras av den som skickade rapporten.
  function papperArsrapport(styr, id, epost, tid) {
    var r = hittaArsrapport(styr, id);
    epost = String(epost || '').toLowerCase();
    var u = r.undertecknare.find(function (x) { return x.epost === epost; });
    if (!u) throw BokforingsFel('Personen står inte bland dem som ska skriva under.');
    if (r.signaturer.some(function (x) { return x.epost === epost; })) throw BokforingsFel('Personen har redan skrivit under.');
    return andraArsrapport(styr, id, Object.assign({}, r, { signaturer: r.signaturer.concat([{ epost: epost, namn: u.namn || epost, tid: tid || null, metod: 'papper' }]) }));
  }

  function taBortArsrapportUnderskrift(styr, id) {
    var r = hittaArsrapport(styr, id);
    if (r.signaturer.length) throw BokforingsFel('Någon har redan skrivit under. Skicka en ny version i stället.');
    return Object.assign({}, styr, { rapporter: styr.rapporter.filter(function (x) { return x.id !== id; }) });
  }

  // Status: vilka som har skrivit under och vilka som är kvar, och om bokföringen har ändrats sedan rapporten skickades.
  function arsrapportUnderskrifter(r, bokforingSumma) {
    var kvar = r.undertecknare.filter(function (u) { return !r.signaturer.some(function (x) { return x.epost === u.epost; }); });
    return { klar: !kvar.length, kvar: kvar, signerade: r.signaturer.slice(), andrad: bokforingSumma != null && bokforingSumma !== r.bokforingSumma };
  }

  // Alla beslut i alla protokoll, nyast först.
  function beslutslogg(styr) {
    var ut = [];
    styr.moten.forEach(function (m) { m.beslut.forEach(function (b, i) { ut.push({ mote: m.id, datum: m.datum, typ: m.typ, nr: i + 1, text: b.text, belopp: b.belopp || 0, verifikation: b.verifikation || null, status: m.status }); }); });
    return ut.sort(function (a, b) { return a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : a.nr - b.nr; });
  }

  // Uppgifter
  function laggTillUppgift(styr, u) {
    if (!String(u.text || '').trim()) throw BokforingsFel('Skriv vad som ska göras.');
    var x = { id: styrId('up'), text: String(u.text).trim(), ansvarig: String(u.ansvarig || '').trim(), datum: arGiltigtDatum(u.datum) ? u.datum : '', klar: false, grupp: u.grupp || '' };
    if (u.handling) x.handling = u.handling;
    return Object.assign({}, styr, { uppgifter: styr.uppgifter.concat([x]) });
  }
  function andraUppgift(styr, id, andring) {
    return Object.assign({}, styr, { uppgifter: styr.uppgifter.map(function (u) { return u.id === id ? Object.assign({}, u, andring) : u; }) });
  }
  function taBortUppgift(styr, id) { return Object.assign({}, styr, { uppgifter: styr.uppgifter.filter(function (u) { return u.id !== id; }) }); }

  // ---------- Mötesmappar (Styrelsearbete/Möten) ----------
  // Föreningens mönster: ÅM 2026, ÅM 2023 extra, SM 2026 (alla styrelsemöten under året), SM 2020 konstituerande.
  function motesmapp(typ, datum) {
    var ar = String(datum || '').slice(0, 4);
    if (typ === 'arsmote') return 'ÅM ' + ar;
    if (typ === 'extra') return 'ÅM ' + ar + ' extra';
    if (typ === 'konstituerande') return 'SM ' + ar + ' konstituerande';
    return 'SM ' + ar;
  }
  // Datum först, så att filerna sorteras i tidsordning i mappen.
  function motesfilnamn(datum, text, andelse) { return sakertNamn(datum + ' ' + text + (andelse || '.pdf')); }

  // Tolkar ett mappnamn under Möten. Årsmappar (2020, 2021 …) går också.
  function tolkaMotesmapp(namn) {
    var t = String(namn || '').trim(), m;
    if ((m = t.match(/^(ÅM|AM|SM)\s+(\d{4})(?:\s+(.+))?$/i))) {
      var am = /^(ÅM|AM)$/i.test(m[1]), till = (m[3] || '').trim();
      var typ = am ? (/extra/i.test(till) ? 'extra' : 'arsmote') : (/konstituerande/i.test(till) ? 'konstituerande' : 'styrelse');
      return { typ: typ, ar: m[2], tillagg: till };
    }
    if ((m = t.match(/^(\d{4})$/))) return { typ: 'ar', ar: m[1], tillagg: '' };
    return null;
  }

  // Sökvägen från OneDrive-roten, ur parentReference.path ("/drive/root:/Kimmy/Capoeira") och namnet.
  function sokvagFranGraf(path, namn) {
    var i = String(path || '').indexOf('root:');
    var bas = i < 0 ? '' : String(path).slice(i + 5);
    try { bas = decodeURIComponent(bas); } catch (e) { /* redan avkodad */ }
    var delar = bas.split('/').filter(Boolean);
    if (namn) delar.push(namn);
    return delar.join('/');
  }

  // Ett namn som inte krockar med de som redan finns i mappen: "Protokoll.pdf" blir "Protokoll (2).pdf".
  function ledigtNamn(befintliga, namn) {
    var finns = (befintliga || []).map(function (x) { return String(x).toLowerCase(); });
    if (finns.indexOf(namn.toLowerCase()) < 0) return namn;
    var m = namn.match(/^(.*?)(\.[^.\s]{1,5})?$/), bas = m[1], ext = m[2] || '';
    for (var n = 2; ; n++) { var f = bas + ' (' + n + ')' + ext; if (finns.indexOf(f.toLowerCase()) < 0) return f; }
  }

  // Handlingar som hör till årsmötet, och ord som känner igen dem i filnamnen i ÅM-mappen.
  var ARSMOTESHANDLINGAR = [
    ['kallelse', 'Kallelse', /kallelse/i],
    ['dagordning', 'Föredragningslista', /föredragningslista|foredragningslista|dagordning/i],
    ['verksamhet', 'Verksamhetsberättelse', /verksamhetsberättelse|verksamhetsberattelse/i],
    ['ekonomi', 'Balans- och resultaträkning', /ekonomisk redovisning|resultaträkning|resultatrakning|balansräkning|balansrakning|(^|[^a-zåäö])bor([^a-zåäö]|$)/i],
    ['revision', 'Revisionsberättelse', /revisionsberättelse|revisionsberattelse/i],
    ['valberedning', 'Valberedningens förslag', /valberedning/i],
    ['rostlangd', 'Röstlängd', /röstlängd|rostlangd/i],
    ['protokoll', 'Protokoll', /protokoll/i]
  ];
  function handlingarStatus(filnamn) {
    return ARSMOTESHANDLINGAR.map(function (h) {
      return { nyckel: h[0], namn: h[1], filer: (filnamn || []).filter(function (f) { return h[2].test(f); }) };
    });
  }
  // Uppgifterna i checklistan bockas av när handlingen finns i mappen.
  function bockaAvHandlingar(styr, grupp, status) {
    var finns = {};

      .map(function (k) { var x = narvaro[k]; return { vem: k, tid: x.tid, skrivratt: !!x.skrivratt, bild: x.bild || null, minuter: Math.max(0, Math.round((nuMs - new Date(x.tid).getTime()) / 60000)) }; })
      .sort(function (a, b) { return a.tid < b.tid ? 1 : a.tid > b.tid ? -1 : 0; });

  var DAGORDNING = [

  // Röstberättigade enligt stadgarna: betald medlemsavgift och fyller minst 18 under året.
