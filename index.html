  // Det appen kan räkna fram av stadens villkor för subventionerad taxa och nolltaxa för räkenskapsåret.
  function stadensKontroll(reg, ar, arMap) {
    var betalande = {}, ars = {}, termin = {};
    giltigaBetalningar(reg, arMap).forEach(function (b) {
      if (b.datum.slice(0, 4) !== ar) return;
      b.poster.forEach(function (p) {

  // Intäkter (konto 3xxx) och kostnader (4xxx–8xxx) för året, som positiva belopp.

  function bidragPerGivare(ar) {

  // Färdiga meningar till verksamhetsberättelsens avsnitt om ekonomin, med siffror direkt från bokföringen.

  // Kontroll av stadens krav mot exporten från RF:s medlemssystem. Inget sparas.

  function rfMedlemskontroll(bok, ar) {
    var y = Number(ar);
    var aktiva = 0, stockholm = 0, unga = 0, ungaStockholm = 0, saknarFodelse = 0, flikarLasta = [];
    Object.keys(bok.flikar || {}).forEach(function (namn) {
      if (/stöd/i.test(namn)) return;
      var rader = bok.flikar[namn];
      var r = rubriker(rader, ['Födelsedat.']) || rubriker(rader, ['Födelsedatum']);
      if (!r) return;
      flikarLasta.push(namn);
      var k = r.kol;
      var kol = function (n) { return k[nyck(n)]; };
      rader.slice(r.rad + 1).forEach(function (rad) {
        var fodd = cellText(rad[kol('Födelsedat.') != null ? kol('Födelsedat.') : kol('Födelsedatum')]);

  }

  // ---------- Revisionspaket ----------

  // ---------- Avförande och kvitton ----------

  // Avför en medlem (utträde eller enligt stadgarna) och tar bort personuppgifterna.
  // Betalningarna finns kvar för statistiken, men utan namn och utan koppling till betalarens nummer.
  function avforMedlem(reg, id, datum, orsak) {
    var m = reg.medlemmar.find(function (x) { return x.id === id; });
    if (!m) throw BokforingsFel('Medlemmen finns inte.');

      medlemmar: reg.medlemmar.map(function (x) { return x.id === id ? { id: x.id, namn: 'Tidigare medlem', kategori: x.kategori, avford: datum, orsak: orsak || '' } : x; }),
      betalare: betalare,

  function arsavgiftsAr(reg, medlemId, arMap) {

    giltigaBetalningar(reg, arMap).forEach(function (b) {
      // Inlästa betalningar från Excel saknar uppdelning; en avgift det året räknas som medlemskap.
      if (b.poster.some(function (p) { return p.medlem === medlemId && ((p.typ === 'arsavgift' && p.belopp > 0) || b.historik); })) ar[kalenderarForTermin(b.termin)] = true;

  function attAvfora(reg, datum, arMap) {

    var iAr = Number(datum.slice(0, 4));
    var ar = [];
    for (var i = n; i >= 1; i--) ar.push(String(iAr - i));
    return reg.medlemmar.filter(function (m) {
      if (m.avford) return false;
      if (m.tillagd && Number(m.tillagd.slice(0, 4)) > iAr - n) return false;
      var betalt = arsavgiftsAr(reg, m.id, arMap);
      // Den som redan betalat i år är medlem, oavsett tidigare år.
      return !betalt[String(iAr)] && ar.every(function (a) { return !betalt[a]; });
    }).map(function (m) {
      var betalt = Object.keys(arsavgiftsAr(reg, m.id, arMap)).sort();
      return { medlem: m.id, namn: m.namn, kategori: m.kategori, senastBetalt: betalt.length ? betalt[betalt.length - 1] : null, ar: ar };
    }).sort(function (a, b) { return a.namn.localeCompare(b.namn, 'sv'); });
  }

  function betalsatt(nyckel) {
    if (/^\+46/.test(nyckel || '')) return 'Swish';

  // Det som en medlem har betalat, rad för rad, för ett kvitto. ar = kalenderår eller tomt för alla.
  function kvittorader(reg, medlemId, arMap, ar) {
    var rader = [];
    giltigaBetalningar(reg, arMap).forEach(function (b) {
      if (ar && b.datum.slice(0, 4) !== ar) return;
      var familj = b.poster.length > 1 && b.poster.some(function (p) { return p.medlem !== medlemId; });
      b.poster.forEach(function (p) {
        if (p.medlem !== medlemId) return;
        if (p.typ === 'termin' && p.belopp === 0 && !familj) return;
        rader.push({
          betalning: b.id, datum: b.datum, typ: p.typ, termin: b.termin, belopp: p.belopp, betalsatt: betalsatt(b.nyckel), nyckel: b.nyckel || '',
          text: (p.typ === 'arsavgift' ? 'Medlemsavgift ' + kalenderarForTermin(b.termin) : 'Terminsavgift ' + b.termin) +
            (p.typ === 'termin' && p.belopp === 0 ? ' (ingår i familjeavgift)' : ''),
          helaBetalningen: familj ? b.belopp : null
        });
      });
    });
    return rader.sort(function (a, b) { return a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : (a.typ === 'arsavgift' ? -1 : 1); });
  }

  function nastaKvittonummer(reg, ar) {
    var prefix = 'M-' + ar + '-';
    var max = reg.kvitton.reduce(function (m, k) { return k.nr.indexOf(prefix) === 0 ? Math.max(m, Number(k.nr.slice(prefix.length)) || 0) : m; }, 0);
    return prefix + String(max + 1).padStart(3, '0');

  // Bara numret, datumet och vem kvittot gällde sparas. Övriga uppgifter på kvittot sparas inte.
  function registreraKvitto(reg, kvitto) {
    if (reg.kvitton.some(function (k) { return k.nr === kvitto.nr; })) return reg;
    return Object.assign({}, reg, { kvitton: reg.kvitton.concat([{ nr: kvitto.nr, datum: kvitto.datum, medlem: kvitto.medlem }]) });
  }

  // Två lediga intäktskonton att föreslå om föreningen inte redan har konton för avgifterna.
  function foreslaAvgiftskonton(ar) {
    var hitta = function (re) { var k = ar.kontoplan.find(function (x) { return Number(x.nr) >= 3000 && Number(x.nr) < 4000 && re.test(x.namn); }); return k ? k.nr : ''; };
    var ledigt = function (fran, upptaget) {
      for (var n = fran; n < 3100; n++) { var nr = String(n); if (nr !== upptaget && !ar.kontoplan.some(function (k) { return k.nr === nr; })) return nr; }
      return '';
    };
    var medl = hitta(/medlemsavgift/i), term = hitta(/termins|tränings|traenings|deltagaravgift|kursavgift/i);
    return {
      medlemsavgift: medl || ledigt(3010, term), terminsavgift: term || ledigt(3020, medl),
      finnsMedlemsavgift: !!medl, finnsTerminsavgift: !!term
    };
  }

  // Tecken som OneDrive inte tillåter i fil- och mappnamn byts mot _.
  function sakertNamn(namn) {
    var n = String(namn || '').replace(/["*:<>?\/\\|#%]/g, '_').replace(/[\u0000-\u001f]/g, '').trim().replace(/[. ]+$/, '');
    return n || 'fil';
  }

  // Årsmappen heter som räkenskapsåret, t.ex. "2026" eller "2025-26".
  function arMapp(arId) { return sakertNamn(String(arId).replace('/', '-')); }

  // Var ett underlag ska ligga: obokförda i Osorterat, bokförda i Verifikationer med V-nummer först,
  // kontoutdrag i Kontoutdrag och föreningens egna fakturor i Fakturor och kvitton tills de är betalda.
  function underlagSokvag(arId, u) {
    var bas = arMapp(arId) + '/Bokföringsunderlag/';
    if (u.verifikation != null && u.arkivnamn) return bas + 'Verifikationer/' + sakertNamn(u.arkivnamn);
    if (u.dokumenttyp === 'kontoutdrag') return bas + 'Kontoutdrag/' + sakertNamn(u.filnamn);
    if (u.dokumenttyp === 'utgaende_faktura') return arMapp(arId) + '/Fakturor och kvitton/' + sakertNamn(u.filnamn);
    return bas + 'Osorterat/' + sakertNamn(u.filnamn);
  }

  function kvittoSokvag(d) {
    return arMapp(d.datum.slice(0, 4)) + '/Fakturor och kvitton/' + sakertNamn('Kvitto ' + d.nummer + '.pdf');

  function namnFranBanktext(text) {
    var t = String(text || '').replace(/swish\s*(från|fran|betalning)?/i, ' ').replace(/[+\d]+/g, ' ').replace(/\s+/g, ' ').trim();
    return t.toLowerCase().replace(/(^|[\s-])([a-zåäöéü])/g, function (m, a, b) { return a + b.toUpperCase(); });
  }

  function tolkningsInstruktion(ar, forening, motpartsregler) {
    var tidigare = (motpartsregler || []).filter(function (r) { return ar.kontoplan.some(function (k) { return k.nr === r.konto; }); }).slice(-50);
    return [
      'Du hjälper kassören i ' + (forening && forening.namn ? 'den ideella föreningen ' + forening.namn : 'en liten svensk ideell förening') + ' att bokföra.',
      'Läs underlaget och fyll i fälten. Hitta inte på uppgifter: lämna tom sträng när något saknas och skriv det i "osakerhet".',
      'Föreningen är inte momsregistrerad, så kostnader bokförs med hela beloppet inklusive moms.',
      'Välj foreslaget_konto ur kontoplanen nedan efter vad underlaget gäller, inte efter vem som skickat det. Bidrag (t.ex. LOK-stöd, aktivitetsstöd, RF-bidrag) bokförs på 3980.',
      'Fritidskortet är inget bidrag till föreningen: det är ett barns avgift som betalas med barnets fritidskort, och bokförs som terminsavgift.',
      'Kontoplan:',
      ar.kontoplan.filter(function (k) { return Number(k.nr) >= 3000 && Number(k.nr) < 8900; }).map(function (k) { return k.nr + ' ' + k.namn; }).join('\n')
    ].concat(tidigare.length ? [
      'Så här har föreningen bokfört underlag tidigare (motpart → konto). Följ samma mönster för samma eller liknande underlag:',
      tidigare.map(function (r) { return r.namn + ' → ' + r.konto + ' ' + kontonamn(ar, r.konto); }).join('\n')
    ] : []).join('\n');
  }

  function normaliseraTolkning(t, opt) {
    opt = opt || {};
    var varningar = [];
    var str = function (v) { return v == null ? '' : String(v).trim(); };
    if (t.osakerhet) varningar.push(str(t.osakerhet));
    if (t.stalld_till_foreningen === 'nej') varningar.push('Underlaget verkar inte vara ställt till föreningen.');
    if (t.dokumenttyp === 'kontoutdrag') {
      var rader = (t.transaktioner || []).map(function (x) {
        return { datum: tolkaDatum(x.datum), text: str(x.text), referens: '', belopp: tolkaBankbelopp(x.belopp), saldo: tolkaBankbelopp(x.saldo) };
      }).filter(function (r) { return r.datum && r.belopp != null && r.belopp !== 0; });
      if (rader.length > 1 && rader[0].datum > rader[rader.length - 1].datum) rader.reverse();
      return {
        underlag: { id: opt.id, filnamn: opt.filnamn, dokumenttyp: 'kontoutdrag', motpart: str(t.motpart), datum: tolkaDatum(t.datum) || '', belopp: 0, riktning: 'utgift', beskrivning: str(t.beskrivning) || 'Kontoutdrag' },
        bankrader: rader,
        varningar: varningar.concat(kontrolleraSaldon(rader))
      };
    }
    var valuta = str(t.valuta).toUpperCase() || 'SEK';
    var belopp = tolkaBankbelopp(t.belopp);
    var underlag = {
      id: opt.id,
      filnamn: opt.filnamn,
      dokumenttyp: t.dokumenttyp || 'annat',
      motpart: str(t.motpart),
      datum: tolkaDatum(t.datum) || '',
      forfallodatum: tolkaDatum(t.forfallodatum) || '',
      belopp: 0,
      riktning: t.riktning === 'intakt' ? 'intakt' : 'utgift',
      beskrivning: str(t.beskrivning),
      fakturanummer: str(t.fakturanummer),
      ocr: str(t.ocr).replace(/\s/g, ''),
      foreslagetKonto: ''
    };
    // Insättningsuppgifter: varje insättning med namn (utan personnummer) och belopp, t.ex. barn som betalats via Fritidskortet.
    if (underlag.dokumenttyp === 'insattningsuppgift' && (t.insattningar || []).length) {
      underlag.poster = t.insattningar.map(function (x) { return { avsandare: str(x.avsandare), namn: rensaReferens(x.referens), belopp: Math.abs(tolkaBankbelopp(x.belopp) || 0) }; })
        .filter(function (x) { return x.belopp; });
    }
    // Godta även "5010 Lokalhyra" och liknande.
    var km = str(t.foreslaget_konto).match(/(?:^|\D)([1-8]\d{3})(?!\d)/);
    if (km) { underlag.foreslagetKonto = km[1]; underlag.kontoKalla = 'claude'; }
    if (valuta !== 'SEK') {
      underlag.valuta = valuta;
      underlag.originalbelopp = belopp == null ? null : Math.abs(belopp);
      var sek = tolkaBankbelopp(t.belopp_sek);
      if (sek != null) underlag.belopp = Math.abs(sek);
      else varningar.push('Beloppet är i ' + valuta + '. Ange beloppet i SEK eller koppla underlaget till banktransaktionen för hand.');
    } else if (belopp != null) {
      underlag.belopp = Math.abs(belopp);
    } else {
      varningar.push('Hittade inget belopp.');
    }
    return { underlag: underlag, bankrader: null, varningar: varningar };
  }

  async function startaInloggning(tyst) {
    var verifierare = slumptext(64);
    var utmaning = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifierare)));
    var tillstand = slumptext(24);
    sessionStorage.setItem('forening-bokforing:inloggning', JSON.stringify({ verifierare: verifierare, tillstand: tillstand, tyst: !!tyst }));
    var p = new URLSearchParams({
      client_id: od.clientId, response_type: 'code', redirect_uri: omdirigering(), response_mode: 'query',
      scope: OD_OMFANG, code_challenge: utmaning, code_challenge_method: 'S256', state: tillstand
    });
    if (tyst) { p.set('prompt', 'none'); try { localStorage.setItem('forening-bokforing:tyst-inloggning', String(Date.now())); } catch (e) { /* tomt */ } }
    location.assign(OD_AUTH + '/oauth2/v2.0/authorize?' + p.toString());
  }

  async function tokenAnrop(param) {
    var kropp = new URLSearchParams(Object.assign({ client_id: od.clientId, scope: OD_OMFANG }, param));
    var res = await fetch(OD_AUTH + '/oauth2/v2.0/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: kropp.toString() });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) { var e = new Error(data.error_description || data.error || 'Inloggningen misslyckades.'); e.kod = data.error; throw e; }
    odNu.token = data.access_token;
    odNu.utgar = Date.now() + (data.expires_in || 3600) * 1000;
    if (data.refresh_token) od.refreshToken = data.refresh_token;
    odNu.inloggningKravs = false;
    sparaOd();
  }

  async function hamtaToken() {
    if (odNu.token && Date.now() < odNu.utgar - 60000) return odNu.token;
    if (!od.refreshToken) { odNu.inloggningKravs = true; throw new Error('Logga in med Microsoft för att synka med OneDrive.'); }
    try {
      await tokenAnrop({ grant_type: 'refresh_token', refresh_token: od.refreshToken });
    } catch (err) {
      if (err.kod === 'invalid_grant' || err.kod === 'interaction_required' || err.kod === 'consent_required' || err.kod === 'invalid_scope') {
        od.refreshToken = null;
        sparaOd();
        odNu.inloggningKravs = true;
        throw new Error('Inloggningen till OneDrive har gått ut. Logga in igen.');
      }
      throw err;
    }
    return odNu.token;
  }

  // Anrop till Microsoft Graph. opt.ra = returnera själva svaret, opt.tillat = statuskoder som inte är fel.
  async function graf(sokvag, opt) {
    opt = opt || {};
    var token = await hamtaToken();
    var res = await fetch(/^https:/.test(sokvag) ? sokvag : GRAF + sokvag, {
      method: opt.method || 'GET',
      headers: Object.assign({ Authorization: 'Bearer ' + token }, opt.headers || {}),
      body: opt.body
    });
    if ((opt.tillat || []).indexOf(res.status) >= 0) return opt.ra ? res : res.status;
    if (!res.ok) {
      var data = await res.json().catch(function () { return {}; });
      throw new Error((data.error && data.error.message) || ('OneDrive svarade med fel ' + res.status + '.'));
    }
    return opt.ra ? res : res.status === 204 ? null : res.json();
  }

  function enc(rel) { return rel.split('/').map(encodeURIComponent).join('/'); }
  function iMappen(rel) { return '/drives/' + od.mapp.driveId + '/items/' + od.mapp.id + ':/' + enc(rel) + ':'; }
  function katalog(rel) { return rel.slice(0, rel.lastIndexOf('/')); }
  function filnamnAv(rel) { return rel.slice(rel.lastIndexOf('/') + 1); }

  // ---------- Inställningar i användarens egen appmapp (OneDrive: Appar/Föreningsbokföring) ----------
  // Här sparas vilken mapp appen ska använda, och API-nyckeln för Claude, så att en ny enhet
  // bara behöver logga in. Appmappen är privat och ligger inte i föreningens delade mapp.

  async function lasAppinstallningar() {
    var res = await graf('/me/drive/special/approot:/' + INSTALLNINGSFIL + ':/content', { tillat: [404], ra: true });
    if (res.status === 404) return {};
    return res.json().catch(function () { return {}; });
  }

  // Skrivningar görs i tur och ordning, så att två ändringar nästan samtidigt inte skriver över varandra.
  var appinstallningsko = Promise.resolve();
  function sparaAppinstallningar(andring) {
    var steg = appinstallningsko.then(async function () {
      var nu = await lasAppinstallningar();
      await graf('/me/drive/special/approot:/' + INSTALLNINGSFIL + ':/content', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({}, nu, andring))
      });
    });
    appinstallningsko = steg.catch(function () { /* nästa ändring försöker igen */ });
    return steg;
  }

  function nyckelAndrad() { try { return Number(localStorage.getItem(NYCKEL_ANDRAD)) || 0; } catch (e) { return 0; } }

  // Skickar en ändrad API-nyckel till appmappen så att dina andra enheter får den.
  function delaNyckel() {
    try { localStorage.setItem(NYCKEL_ANDRAD, String(Date.now())); } catch (e) { /* tomt */ }
    if (!od.refreshToken) return;
    sparaAppinstallningar({ claude: { nyckel: lasNyckel() || null, utgar: nyckelUtgar() || null, andrad: nyckelAndrad() } })
      .catch(function () { /* nästa gång */ });
  }

  // Hämtar API-nyckeln från appmappen om den är nyare än den här enhetens.
  function synkaNyckel(inst) {
    var c = inst && inst.claude;
    if (!c) {
      if (lasNyckel() && od.refreshToken) delaNyckel();
      return false;
    }
    if (c.andrad > nyckelAndrad()) {
      try {
        if (c.nyckel) localStorage.setItem(NYCKEL, c.nyckel); else localStorage.removeItem(NYCKEL);
        if (c.utgar) localStorage.setItem(NYCKEL_UTGAR, c.utgar); else localStorage.removeItem(NYCKEL_UTGAR);
        localStorage.setItem(NYCKEL_ANDRAD, String(c.andrad));
      } catch (e) { /* tomt */ }
      nyckelAvvisad = false;
      return true;
    }
    if (c.andrad < nyckelAndrad()) delaNyckel();
    return false;
  }

  function lasInbjudan() { try { return JSON.parse(localStorage.getItem(INBJUDAN) || 'null'); } catch (e) { return null; } }

  // En inbjudningslänk (#revisor=…) sparas tills mottagaren har loggat in.
  function fangaInbjudan() {
    var m = location.hash.match(/#(revisor|inbjudan|uppdrag)=([A-Za-z0-9_-]+)/);
    if (!m) return;
    try {
      var b64 = m[2].replace(/-/g, '+').replace(/_/g, '/');
      var bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
      var data = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, function (c) { return c.charCodeAt(0); })));
      if (data && m[1] === 'uppdrag') data.t = 'uppdrag';
      if (data && data.d && data.i) localStorage.setItem(INBJUDAN, JSON.stringify(data));
    } catch (e) { /* ogiltig länk */ }
    history.replaceState(null, '', location.pathname + location.search);
  }

  function inbjudningslank() {
    var data = { d: od.mapp.driveId, i: od.mapp.id, n: od.mapp.namn, f: store.forening.namn || '' };
    return omdirigering() + '#inbjudan=' + b64url(new TextEncoder().encode(JSON.stringify(data)).buffer);
  }

  // Efter inloggning på en ny enhet: öppna inbjudan eller den mapp som sparats i appmappen.
  async function aterkoppla() {
    var inbjudan = lasInbjudan();
    var inst = await lasAppinstallningar().catch(function () { return {}; });
    synkaNyckel(inst);
    if (inbjudan && inbjudan.t === 'uppdrag') {
      // Valberedningen: bara filen med förtroendeuppdragen är delad.
      localStorage.removeItem(INBJUDAN);
      var fil = await graf('/drives/' + inbjudan.d + '/items/' + inbjudan.i, { tillat: [403, 404] });
      if (typeof fil === 'number') throw new Error('Förtroendeuppdragen går inte att öppna. Be föreningen dela dem med ditt Microsoft-konto (' + (od.konto || '') + ') och skicka länken igen.');
      od.uppdragLas = { driveId: inbjudan.d, id: inbjudan.i, f: inbjudan.f || '' };
      sparaOd();
      sparaAppinstallningar({ uppdragLas: od.uppdragLas }).catch(function () { /* frivilligt */ });
      await synkaStyrelsen();
      return 'uppdrag';
    }
    if (inbjudan) {
      localStorage.removeItem(INBJUDAN);
      var finns = await graf('/drives/' + inbjudan.d + '/items/' + inbjudan.i, { tillat: [403, 404] });
      if (typeof finns === 'number') throw new Error('Mappen i inbjudan går inte att öppna. Be kassören dela mappen med ditt Microsoft-konto (' + (od.konto || '') + ') och skicka länken igen.');
      await valjDeladMapp({ driveId: inbjudan.d, id: inbjudan.i, namn: inbjudan.n || finns.name, agare: '' });
      return 'inbjudan';
    }
    if (!inst.mapp && inst.uppdragLas) {
      od.uppdragLas = inst.uppdragLas;
      sparaOd();
      await synkaStyrelsen();
      return 'uppdrag';
    }
    if (!inst.mapp) return null;
    var post = await graf('/drives/' + inst.mapp.driveId + '/items/' + inst.mapp.id, { tillat: [403, 404] });
    if (typeof post === 'number') return null;
    od.mapp = inst.mapp;
    od.rot = inst.lage === 'lasare' ? null : (inst.rot || null);
    od.lage = inst.lage === 'lasare' || inst.lage === 'medarbetare' ? inst.lage : 'agare';
    od.eTag = null; od.senast = null; od.regETag = null;
    sparaOd();
    await forstaSynk();
    return 'mapp';
  }

  async function hanteraInloggningsretur() {
    var q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('error')) return;
    var sparad = null;
    try { sparad = JSON.parse(sessionStorage.getItem('forening-bokforing:inloggning') || 'null'); } catch (e) { /* tomt */ }
    sessionStorage.removeItem('forening-bokforing:inloggning');
    history.replaceState(null, '', omdirigering() + location.hash);
    if (q.has('error')) {
      odNu.inloggningKravs = true;
      if (!(sparad && sparad.tyst)) sattStatus('Inloggningen avbröts: ' + (q.get('error_description') || q.get('error')), true);
      return;
    }
    if (!sparad || sparad.tillstand !== q.get('state')) { sattStatus('Inloggningen kunde inte verifieras. Försök igen.', true); return; }
    await tokenAnrop({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: omdirigering(), code_verifier: sparad.verifierare });
    var jag = await graf('/me');
    od.konto = jag.userPrincipalName || jag.mail || jag.displayName || 'Microsoft-konto';
    sparaOd();
  }

  async function valjEgenMapp(sokvag) {
    sokvag = sokvag.replace(/^\/+|\/+$/g, '');
    if (!sokvag) throw new Error('Skriv sökvägen till mappen, t.ex. Föreningen/Bokföring.');
    var post = await graf('/me/drive/root:/' + enc(sokvag), { tillat: [404] });
    if (post === 404) {
      if (!window.confirm('Det finns ingen mapp ' + sokvag + ' i din OneDrive. Skapa den?')) throw new Error('Hittar ingen mapp som heter ' + sokvag + ' i din OneDrive. Kontrollera stavningen.');
      await skapaSokvag(sokvag);
      post = await graf('/me/drive/root:/' + enc(sokvag));
    }
    if (!post.folder) throw new Error(sokvag + ' är en fil, inte en mapp.');
    var driveId = post.parentReference.driveId;
    // Äldre upplägg: bokföringsfilen ligger direkt i mappen. Annars används (och skapas) appens undermappar.
    var direkt = await graf('/drives/' + driveId + '/items/' + post.id + ':/' + enc(DATAFIL) + ':', { tillat: [404] });
    if (direkt !== 404) {
      od.rot = null;
      od.mapp = { driveId: driveId, id: post.id, namn: post.name, sokvag: sokvag };
    } else {
      // Mappar från version 1.14–1.25 heter Bokföring och underlag.
      var gammal = await graf('/drives/' + driveId + '/items/' + post.id + ':/' + enc(GAMMAL_DATAMAPP + '/' + DATAFIL) + ':', { tillat: [404] });
      var dnamn = gammal !== 404 ? GAMMAL_DATAMAPP : DATAMAPP;
      var data = await sakerstallUndermapp(driveId, post.id, dnamn);
      od.rot = { driveId: driveId, id: post.id, namn: post.name, sokvag: sokvag };
      od.mapp = { driveId: driveId, id: data.id, namn: dnamn, sokvag: sokvag + '/' + dnamn };
      skapaGenvag(driveId, post.id);
    }
    od.lage = 'agare';
    od.eTag = null; od.senast = null; od.regETag = null; od.regMapp = null; odNu.mappar = {};
    sparaOd();
    sparaAppinstallningar({ mapp: od.mapp, rot: od.rot, lage: 'agare', regMapp: null }).catch(function () { /* frivilligt */ });
    await forstaSynk();
  }

  async function delaMappar() {
    var data = await graf('/me/drive/sharedWithMe');
    return (data.value || []).filter(function (x) { return x.remoteItem && x.remoteItem.folder; }).map(function (x) {
      return { driveId: x.remoteItem.parentReference.driveId, id: x.remoteItem.id, namn: x.remoteItem.name || x.name, agare: x.remoteItem.shared && x.remoteItem.shared.owner && x.remoteItem.shared.owner.user ? x.remoteItem.shared.owner.user.displayName : '' };
    });
  }

  async function valjDeladMapp(m) {
    od.mapp = { driveId: m.driveId, id: m.id, namn: m.namn, sokvag: m.namn + (m.agare ? ' (delad av ' + m.agare + ')' : '') };
    od.lage = 'lasare';
    od.eTag = null; od.senast = null;
    sparaOd();
    sparaAppinstallningar({ mapp: od.mapp, lage: 'lasare' }).catch(function () { /* frivilligt */ });
    await forstaSynk();
  }

  function harLokalData() { return Object.keys(store.ar).length > 0; }

  // Första gången en mapp kopplas: ladda upp det som finns här, eller hämta det som finns i OneDrive.
  async function forstaSynk() {
    var meta = await graf(iMappen(DATAFIL), { tillat: [404] });
    if (meta === 404) {
      if (od.lage !== 'agare') throw new Error('Den delade mappen innehåller ingen bokföring från appen ännu.');
      od.smutsig = true;
      sparaOd();
      await synkaUpp();
      await efterBokforing();
      return 'uppladdat';
    }
    if (harLokalData() && !lasLage()) {
      odNu.konflikt = true;
      odNu.konfliktForsta = true;
      return 'konflikt';
    }
    await hamtaOchTillampa(meta);
    await efterBokforing();
    return 'hamtat';
  }

  async function hamtaOchTillampa(meta) {
    var res = await graf(iMappen(DATAFIL) + '/content', { ra: true });
    var data = await res.json();
    if (!data || data.format !== 1 || !data.ar) throw new Error('Filen ' + DATAFIL + ' i OneDrive har ett okänt format.');
    var fel = [];
    Object.keys(data.ar).forEach(function (id) { K.valideraAr(data.ar[id]).forEach(function (f) { fel.push(id + ': ' + f); }); });
    if (fel.length) throw new Error('Bokföringen i OneDrive har fel och lästes inte in: ' + fel.slice(0, 3).join(' '));
    var aktivtNu = store.aktivt;
    var inbaddat = data.medlemsregister;
    delete data.medlemsregister;
    var reg = store.medlemsregister;
    store = data;
    // Den som bara läser får aldrig medlemsregistret. Ett register från version 1.12 flyttas ut ur bokföringsfilen.
    store.medlemsregister = inbaddat && od.lage === 'agare' && !K.registerHarData(reg) ? K.normaliseraRegister(inbaddat) : reg;
    if (!store.regler) store.regler = [];
    if (!store.motpartsregler) store.motpartsregler = [];
    LISTNYCKLAR.forEach(function (k) { if (!store[k]) store[k] = []; });
    if (aktivtNu && store.ar[aktivtNu]) store.aktivt = aktivtNu;
    if (!store.ar[store.aktivt]) store.aktivt = Object.keys(store.ar).sort().pop() || null;
    od.eTag = meta.eTag;
    od.smutsig = !!inbaddat && od.lage === 'agare' && kanSkriva();
    od.senast = new Date().toISOString();
    sparaOd();
    sparaLokalt();
    if (!lasLage()) sparaRegister();
    if (od.smutsig) schemalaggSynk();
    odNu.konflikt = false;
    odNu.konfliktForsta = false;
    await laddaLogo();
    sattStatus(lasLage() ? 'Endast läsning · hämtat från OneDrive' : 'Synkad med OneDrive');
  }

  // Hämtar senaste versionen om någon annan enhet har sparat. Ändringar här som inte hunnit sparas ger en krock.
  async function hamtaFranOneDrive() {
    await hamtaBokforing();
    await efterBokforing();
  }

  async function hamtaBokforing() {
    if (!odAnslutet() || odNu.konflikt) return;
    odNu.senastHamtat = Date.now();
    var meta = await graf(iMappen(DATAFIL), { tillat: [404] });
    if (meta !== 404) odNu.senastSparat = sparadAv(meta);
    if (meta === 404 && od.lage === 'agare') {
      // Har appens filer flyttats från en annan enhet? Då står den nya mappen i appmappen.
      var inst = await lasAppinstallningar().catch(function () { return {}; });
      if (inst.mapp && inst.mapp.id !== od.mapp.id && inst.lage !== 'lasare') {
        od.mapp = inst.mapp; od.rot = inst.rot || null; od.regMapp = inst.regMapp || null;
        od.eTag = null; od.regETag = null; odNu.mappar = {};
        sparaOd();
        meta = await graf(iMappen(DATAFIL), { tillat: [404] });
        if (meta !== 404) {
          if (od.smutsig) { odNu.konflikt = true; sattStatus('Krock med OneDrive', true); return; }
          await hamtaOchTillampa(meta);
          return;
        }
      }
    }
    if (meta === 404) {
      if (od.lage === 'agare' && kanSkriva()) { od.smutsig = true; sparaOd(); await synkaUpp(); }
      return;
    }
    if (meta.eTag === od.eTag) {
      if (od.smutsig) await synkaUpp();
      else sattStatus(lasLage() ? 'Endast läsning · aktuell' : 'Synkad med OneDrive');
      return;
    }
    if (od.smutsig) { odNu.konflikt = true; sattStatus('Krock med OneDrive', true); return; }
    await hamtaOchTillampa(meta);
  }


  // ---------- Medlemsregistret i OneDrive ----------
  // Registret ligger i en egen mapp bredvid bokföringsmappen. Den som får bokföringsmappen delad med sig
  // (t.ex. revisorn) ser därför inga namn. Bara den som äger bokföringen synkar registret.

  function regAnslutet() { return odAnslutet() && !lasLage(); }
  function iRegMappen() { return '/drives/' + od.regMapp.driveId + '/items/' + od.regMapp.id + ':/' + enc(REGFIL) + ':'; }

  async function sakerstallRegMapp() {
    if (od.lage !== 'agare') {
      // Den som har fått bokföringen delad hittar registret via rollfilen, om det har delats med hen.
      if (odNu.roller && odNu.roller.regMapp) { od.regMapp = Object.assign({}, odNu.roller.regMapp, { for: od.mapp.id }); return; }
      throw new Error('Medlemsregistret är inte delat med dig.');
    }
    if (od.regMapp && od.regMapp.for === od.mapp.id) return;
    var inst = await lasAppinstallningar().catch(function () { return {}; });
    if (inst.regMapp && inst.regMapp.for === od.mapp.id) {
      var finns = await graf('/drives/' + inst.regMapp.driveId + '/items/' + inst.regMapp.id, { tillat: [403, 404] });
      if (typeof finns !== 'number') { od.regMapp = inst.regMapp; sparaOd(); return; }
    }
    var foralder, namn;
    if (od.rot) { foralder = od.rot.id; namn = REGMAPP; }
    else {
      // Äldre upplägg: en mapp bredvid bokföringsmappen.
      var mapp = await graf('/drives/' + od.mapp.driveId + '/items/' + od.mapp.id + '?$select=id,name,parentReference');
      foralder = mapp.parentReference && mapp.parentReference.id;
      if (!foralder) throw new Error('Hittar inte mappen ovanför bokföringsmappen.');
      namn = mapp.name + ' – medlemsregister';
    }
    var ny = await sakerstallUndermapp(od.mapp.driveId, foralder, namn);
    od.regMapp = { driveId: od.mapp.driveId, id: ny.id, namn: od.rot ? od.rot.namn + '/' + namn : namn, for: od.mapp.id };
    od.regETag = null;
    sparaOd();
    sparaAppinstallningar({ regMapp: od.regMapp }).catch(function () { /* frivilligt */ });
  }

  async function synkaRegister() {
    if (!regAnslutet() || odNu.regKonflikt || !od.regSmutsig) return;
    await sakerstallRegMapp();
    var rubriker = { 'Content-Type': 'application/json' };
    if (od.regETag) rubriker['If-Match'] = od.regETag;
    var res = await graf(iRegMappen() + '/content', { method: 'PUT', headers: rubriker, body: JSON.stringify(store.medlemsregister), tillat: [412], ra: true });
    if (res.status === 412) { odNu.regKonflikt = true; return; }
    var post = await res.json();
    od.regETag = post.eTag;
    od.regSmutsig = false;
    sparaOd();
  }

  async function lasRegisterFil() {
    var res = await graf(iRegMappen() + '/content', { ra: true });
    var data = await res.json();
    if (!data || data.format !== 'foreningsbokforing-medlemsregister') throw new Error('Medlemsregistret i OneDrive har ett okänt format.');
    return K.normaliseraRegister(data);
  }

  function tillampaRegister(reg, eTag) {
    store.medlemsregister = reg;
    senastRegJson = JSON.stringify(reg);
    try { localStorage.setItem(REG_LAGRING, senastRegJson); } catch (e) { /* tomt */ }
    od.regETag = eTag;
    od.regSmutsig = false;
    odNu.regKonflikt = false;
    sparaOd();
  }

  async function hamtaRegister() {
    if (!odAnslutet() || odNu.regKonflikt) return;
    // Rollen avgör: utan behörighet till registret läses det inte, och en gammal kopia tas bort.
    if (od.lage !== 'agare' && odNu.roller && !K.behorighet(K.rollerFor(odNu.roller, mig())).reg) {
      odNu.regLas = false;
      if (K.registerHarData(store.medlemsregister)) { store.medlemsregister = K.tomtRegister(); senastRegJson = null; try { localStorage.removeItem(REG_LAGRING); } catch (e) { /* tomt */ } }
      return;
    }
    try { await sakerstallRegMapp(); } catch (e) { odNu.regLas = false; return; }
    var meta = await graf(iRegMappen(), { tillat: [403, 404] });
    if (meta === 403 || (meta === 404 && od.lage !== 'agare')) { odNu.regLas = false; return; }
    odNu.regLas = true;
    if (meta === 404) {
      if (K.registerHarData(store.medlemsregister) && kanSkriva()) { od.regSmutsig = true; od.regETag = null; sparaOd(); await synkaRegister(); }
      return;
    }
    if (meta.eTag === od.regETag) { if (od.regSmutsig && kanSkriva()) await synkaRegister(); return; }
    var fjarr = await lasRegisterFil();
    if (od.regSmutsig && kanSkriva() && K.registerHarData(store.medlemsregister) && JSON.stringify(fjarr) !== JSON.stringify(store.medlemsregister)) {
      odNu.regKonflikt = true;
      return;
    }
    tillampaRegister(fjarr, meta.eTag);
  }

  function regKonfliktBanner() {
    if (!odNu.regKonflikt) return '';
    return '<div class="card fel" role="alert"><strong>Medlemsregistret har ändrats i OneDrive från en annan enhet samtidigt som det ändrats här.</strong>' +
      '<p>Välj vilken version som ska gälla. Den andra försvinner, så spara gärna en kopia av den här versionen först.</p>' +
      '<div class="row"><button class="btn btn-small" data-action="od-reg-onedrive">Använd versionen i OneDrive</button>' +
      '<button class="btn btn-secondary btn-small" data-action="od-reg-behall">Behåll den här webbläsarens version</button>' +
      '<button class="btn btn-secondary btn-small" data-action="exportera-register">Spara en kopia av den här versionen</button></div></div>';
  }

  // ---------- Styrelsen i OneDrive ----------
  // Styrelsens material ligger i en egen mapp, Styrelsen, bredvid bokföringen och medlemsregistret.
  // Det finns ingen exklusiv skrivrätt: alla i styrelsen kan ändra samtidigt, och ändringarna slås ihop post för post.
  // Förtroendeuppdragen ligger i en egen fil i mappen, så att den kan delas med valberedningen utan resten.

  var STYRFILER = {
    styr: { fil: STYRFIL, tom: K.tomStyrelse, norm: K.normaliseraStyrelse, nycklar: ['moten', 'uppgifter', 'dokument', 'arenden', 'rapporter'] },
    upp: { fil: UPPDRAGFIL, tom: K.tomaUppdrag, norm: K.normaliseraUppdrag, nycklar: ['uppdrag'] }
  };

  function arValberedningslage() { return !!(od.uppdragLas && !od.mapp && !OVNING); }

  // 'write', 'read' eller null. Utan OneDrive (och i övningsläget) är allt ditt eget.
  function styrBeh(k) {
    if (revision) return null;
    if (arValberedningslage()) return k === 'upp' ? 'read' : null;
    if (!odAnslutet()) return 'write';
    if (!odNu.roller) return od.lage === 'agare' ? 'write' : null;
    var b = K.behorighet(K.rollerFor(odNu.roller, mig()));
    return k === 'upp' ? b.uppdrag : b.styr;
  }
  function styrData() { return sty.styr.data; }
  function uppData() { return sty.upp.data; }

  function sparaStyrLokalt() {
    try { localStorage.setItem(STYR_LAGRING, JSON.stringify(sty)); } catch (e) { /* lagringen är full eller avstängd */ }
  }

  // En ändring av styrelsens material sparas direkt i webbläsaren och en kort stund senare i OneDrive.
  function andraStyr(k, ny, ritaOm) {
    if (styrBeh(k) !== 'write') throw new Error('Du kan läsa men inte ändra det här.');
    sty[k].data = ny;
    sty[k].smutsig = true;
    sparaStyrLokalt();
    if (odAnslutet()) schemalaggStyrSynk();
    if (ritaOm !== false) render();
  }

  var styrTimer = null;
  function schemalaggStyrSynk() {
    clearTimeout(styrTimer);
    styrTimer = setTimeout(function () { synkaStyrelsen().then(render, function (err) { odNu.styrFel = err.message; render(); }); }, 1500);
  }

  function iStyrMappen(rel) { return '/drives/' + od.styrMapp.driveId + '/items/' + od.styrMapp.id + ':/' + enc(rel) + ':'; }
  function styrUrl(k) {
    if (k === 'upp' && arValberedningslage()) return '/drives/' + od.uppdragLas.driveId + '/items/' + od.uppdragLas.id;
    return iStyrMappen(STYRFILER[k].fil);
  }

  async function uppdateraRollfilMed(andring) {
    if (od.lage !== 'agare' || !odNu.roller) return;
    var f = odNu.roller;
    if (!Object.keys(andring).some(function (k) { return JSON.stringify(f[k] || null) !== JSON.stringify(andring[k]); })) return;
    await sparaRoller(Object.assign({}, f, andring)).catch(function () { /* nästa gång */ });
  }

  async function sakerstallStyrMapp() {
    if (odNu.roller && odNu.roller.styrRot && (!od.styrRot || od.styrRot.id !== odNu.roller.styrRot.id)) { od.styrRot = Object.assign({}, odNu.roller.styrRot); sparaOd(); }
    if (od.styrMapp && od.styrMapp.for === od.mapp.id) return;
    if (odNu.roller && odNu.roller.styrMapp) { od.styrMapp = Object.assign({}, odNu.roller.styrMapp, { for: od.mapp.id }); sparaOd(); return; }
    if (od.lage !== 'agare') throw new Error('Styrelsens mapp är inte delad med dig.');
    var foralder, namn;
    if (od.rot) {
      // Styrelsearbete med appens filer i en egen undermapp, och Möten för protokoll och handlingar.
      var sa = await sakerstallUndermapp(od.mapp.driveId, od.rot.id, STYRARBETE);
      await sakerstallUndermapp(od.mapp.driveId, sa.id, MOTEN);
      od.styrRot = { driveId: od.mapp.driveId, id: sa.id, namn: od.rot.namn + '/' + STYRARBETE };
      foralder = sa.id; namn = APPFILER;
    }
    else {
      var mapp = await graf('/drives/' + od.mapp.driveId + '/items/' + od.mapp.id + '?$select=id,name,parentReference');
      foralder = mapp.parentReference && mapp.parentReference.id;
      if (!foralder) throw new Error('Hittar inte mappen ovanför bokföringsmappen.');
      namn = mapp.name + ' – styrelsen';
    }
    var ny = await sakerstallUndermapp(od.mapp.driveId, foralder, namn);
    od.styrMapp = { driveId: od.mapp.driveId, id: ny.id, namn: od.rot ? od.rot.namn + '/' + STYRARBETE + '/' + namn : namn, for: od.mapp.id };
    sparaOd();
    var andr = { styrMapp: { driveId: od.styrMapp.driveId, id: od.styrMapp.id, namn: od.styrMapp.namn } };
    if (od.styrRot) andr.styrRot = { driveId: od.styrRot.driveId, id: od.styrRot.id, namn: od.styrRot.namn };
    await uppdateraRollfilMed(andr);
  }

  async function hamtaStyrFil(k, forsok) {
    var s = sty[k], d = STYRFILER[k];
    if (!styrBeh(k)) {
      // Utan behörighet: ta bort en gammal kopia i webbläsaren.
      if (s.eTag || s.bas) { sty[k] = tomSty()[k]; sparaStyrLokalt(); }
      return;
    }
    if (!arValberedningslage()) await sakerstallStyrMapp();
    var meta = await graf(styrUrl(k), { tillat: [403, 404] });
    if (meta === 403) return;
    if (meta === 404) { if (styrBeh(k) === 'write') await sparaStyrFil(k, forsok); return; }
    if (k === 'upp' && !arValberedningslage()) await uppdateraRollfilMed({ uppdragFil: { driveId: meta.parentReference.driveId, id: meta.id } });
    if (meta.eTag === s.eTag) { if (s.smutsig && styrBeh(k) === 'write') await sparaStyrFil(k, forsok); return; }
    var fjarr = d.norm(await (await graf(styrUrl(k) + '/content', { ra: true })).json());
    if (s.smutsig && styrBeh(k) === 'write') {
      var r = K.slaIhopPoster(s.bas || d.tom(), s.data, fjarr, d.nycklar);
      s.data = d.norm(r.data);
      r.krockar.forEach(function (x) { styrKrockar.push(Object.assign({ fil: k }, x)); });
    } else { s.data = fjarr; s.smutsig = false; }
    s.bas = fjarr;
    s.eTag = meta.eTag;
    sparaStyrLokalt();
    if (s.smutsig) await sparaStyrFil(k, forsok);
  }

  async function sparaStyrFil(k, forsok) {
    var s = sty[k];
    var rubriker = { 'Content-Type': 'application/json' };
    if (s.eTag) rubriker['If-Match'] = s.eTag; else rubriker['If-None-Match'] = '*';
    var skickat = JSON.stringify(s.data);
    var res = await graf(styrUrl(k) + '/content', { method: 'PUT', headers: rubriker, body: skickat, tillat: [412], ra: true });
    if (res.status === 412) {
      if ((forsok || 0) >= 3) throw new Error('Styrelsens material ändras av någon annan just nu. Försök igen om en stund.');
      return hamtaStyrFil(k, (forsok || 0) + 1);
    }
    var post = await res.json();
    s.eTag = post.eTag;
    s.bas = JSON.parse(skickat);
    if (JSON.stringify(s.data) === skickat) s.smutsig = false;
    sparaStyrLokalt();
    if (k === 'upp' && post.id) await uppdateraRollfilMed({ uppdragFil: { driveId: (post.parentReference && post.parentReference.driveId) || od.styrMapp.driveId, id: post.id } });
    if (s.smutsig) schemalaggStyrSynk();
  }

  var styrKo = Promise.resolve();
  function synkaStyrelsen() {
    var steg = styrKo.then(async function () {
      if (!odAnslutet() && !(arValberedningslage() && od.refreshToken)) return;
      odNu.styrFel = null;
      var filer = ['styr', 'upp'];
      for (var i = 0; i < filer.length; i++) await hamtaStyrFil(filer[i]);
    });
    styrKo = steg.catch(function () { /* nästa gång */ });
    return steg;
  }

  // Låsning och underskrift görs mot den senaste versionen i OneDrive, så att två som skriver under samtidigt inte krockar.
  async function styrOperation(op) {
    if (styrBeh('styr') !== 'write') throw new Error('Du kan inte ändra styrelsens material.');
    if (!odAnslutet()) { andraStyr('styr', op(styrData())); return; }
    await synkaStyrelsen();
    var steg = styrKo.then(async function () {
      var s = sty.styr;
      for (var i = 0; i < 4; i++) {
        var ny = op(s.data);
        var rubriker = { 'Content-Type': 'application/json' };
        if (s.eTag) rubriker['If-Match'] = s.eTag; else rubriker['If-None-Match'] = '*';
        var res = await graf(styrUrl('styr') + '/content', { method: 'PUT', headers: rubriker, body: JSON.stringify(ny), tillat: [412], ra: true });
        if (res.status !== 412) {
          var post = await res.json();
          s.data = ny; s.bas = JSON.parse(JSON.stringify(ny)); s.eTag = post.eTag; s.smutsig = false;
          sparaStyrLokalt();
          return;
        }
        var meta = await graf(styrUrl('styr'));
        s.data = K.normaliseraStyrelse(await (await graf(styrUrl('styr') + '/content', { ra: true })).json());
        s.bas = JSON.parse(JSON.stringify(s.data)); s.eTag = meta.eTag; s.smutsig = false;
      }
      throw new Error('Styrelsens material ändras av någon annan just nu. Försök igen.');
    });
    styrKo = steg.catch(function () { /* nästa gång */ });
    await steg;
    render();
  }

  function krockNamn(x) {
    var m = x.min || {};
    if (x.typ === 'moten') return 'Protokoll ' + (m.datum || '');
    if (x.typ === 'uppgifter') return 'Uppgift: ' + (m.text || '');
    if (x.typ === 'uppdrag') return 'Förtroendeuppdrag: ' + (m.roll || '') + ' ' + (m.namn || '');
    return 'Ärende: ' + (m.text || '');
  }
  function styrKrockBanner() {
    if (!styrKrockar.length) return '';
    return '<div class="card fel" role="alert"><strong>Någon annan ändrade samma sak i styrelsens material samtidigt som du.</strong> ' +
      '<p>Den andras version gäller. Din version finns här, så att du kan föra in det som saknas:</p>' +
      styrKrockar.map(function (x) {
        return '<details><summary>' + esc(krockNamn(x)) + '</summary><pre style="white-space:pre-wrap">' +
          esc(!x.min ? 'Du tog bort den.' : x.typ === 'moten' ? K.protokolltext(x.min) : x.typ === 'uppdrag' ? x.min.roll + ': ' + x.min.namn + ' ' + (x.min.vald || '') + ' – ' + (x.min.till || '') : x.min.text) + '</pre></details>';
      }).join('') + '<div class="row"><button class="btn btn-secondary btn-small" data-action="styr-krock-stang">Stäng</button></div></div>';
  }

  function uppdragslank(uf) {
    var data = { d: uf.driveId, i: uf.id, f: store.forening.namn || '' };
    return omdirigering() + '#uppdrag=' + b64url(new TextEncoder().encode(JSON.stringify(data)).buffer);
  }

  function schemalaggSynk() {
    clearTimeout(odNu.timer);
    sattStatus('Ej sparat i OneDrive ännu…');
    odNu.timer = setTimeout(function () { synkaUpp().then(render, function () { render(); }); }, 1500);
  }

  async function synkaUpp() {
    if (!odAnslutet() || lasLage() || odNu.konflikt) return;
    if (odNu.synkar) { odNu.igen = true; return; }
    odNu.synkar = true;
    sattStatus('Sparar i OneDrive…');
    try {
      await synkaFiler();
      if (od.smutsig) {
        var rubriker = { 'Content-Type': 'application/json' };
        if (od.eTag) rubriker['If-Match'] = od.eTag;
        var res = await graf(iMappen(DATAFIL) + '/content', { method: 'PUT', headers: rubriker, body: JSON.stringify(bokforingsdata()), tillat: [412], ra: true });
        if (res.status === 412) { odNu.konflikt = true; sattStatus('Krock med OneDrive', true); return; }
        var post = await res.json();
        od.eTag = post.eTag;
        od.smutsig = false;
        od.senast = new Date().toISOString();
        odNu.senastSparat = sparadAv(post);
        sparaOd();
      }
      try { await synkaRegister(); odNu.regFel = null; }
      catch (e) { odNu.regFel = 'Medlemsregistret kunde inte sparas i OneDrive: ' + e.message; }
      sattStatus(odNu.regKonflikt ? 'Krock i medlemsregistret' : 'Synkad med OneDrive', odNu.regKonflikt);
    } catch (err) {
      sattStatus('Kunde inte spara i OneDrive: ' + err.message, true);
      throw err;
    } finally {
      odNu.synkar = false;
      if (odNu.igen) { odNu.igen = false; setTimeout(function () { synkaUpp().then(render, function () { render(); }); }, 200); }
    }
  }

  async function laddaUpp(rel, blob) {
    var post;
    if (blob.size <= 4 * 1024 * 1024) {
      post = await graf(iMappen(rel) + '/content?@microsoft.graph.conflictBehavior=rename', { method: 'PUT', body: blob });
    } else {
      var session = await graf(iMappen(rel) + '/createUploadSession', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'rename' } })
      });
      var res = await fetch(session.uploadUrl, { method: 'PUT', headers: { 'Content-Range': 'bytes 0-' + (blob.size - 1) + '/' + blob.size }, body: blob });
      if (!res.ok) throw new Error('Uppladdningen av en stor fil misslyckades.');
      post = await res.json();
    }
    return post;
  }

  async function sakerstallMapp(rel) {
    if (!rel) return od.mapp.id;
    if (odNu.mappar[rel]) return odNu.mappar[rel];
    var post = await graf(iMappen(rel), { tillat: [404] });
    if (post === 404) {
      var foralder = await sakerstallMapp(katalog(rel));
      post = await graf('/drives/' + od.mapp.driveId + '/items/' + foralder + '/children', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: filnamnAv(rel), folder: {}, '@microsoft.graph.conflictBehavior': 'fail' }), tillat: [409]
      });
      if (post === 409) post = await graf(iMappen(rel));
    }
    odNu.mappar[rel] = post.id;
    return post.id;
  }

  async function flytta(itemId, rel) {
    var foralder = await sakerstallMapp(katalog(rel));
    return graf('/drives/' + od.mapp.driveId + '/items/' + itemId, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: filnamnAv(rel), parentReference: { id: foralder }, '@microsoft.graph.conflictBehavior': 'rename' })
    });
  }

  // Lägger upp nya filer och flyttar bokförda underlag till Verifikationer med V-nummer först.
  async function synkaFiler() {
    var andrat = false;
    var arIds = Object.keys(store.ar);
    for (var i = 0; i < arIds.length; i++) {
      var arId = arIds[i];
      var lista = (store.ar[arId].underlag || []).slice();
      for (var j = 0; j < lista.length; j++) {
        var u = lista[j];
        var mal = K.underlagSokvag(arId, u);
        if (!u.odId) {
          var rec = await hamtaFil(u.id);
          if (!rec) continue;
          var post = await laddaUpp(mal, rec.blob);
          store.ar[arId] = K.andraUnderlag(store.ar[arId], u.id, { odId: post.id, odMal: mal });
          andrat = true;
        } else if (u.odMal !== mal) {
          await flytta(u.odId, mal);
          store.ar[arId] = K.andraUnderlag(store.ar[arId], u.id, { odMal: mal });
          andrat = true;
        }
      }
    }
    for (var k = 0; k < store.dokument.length; k++) {
      var d = store.dokument[k];
      if (d.typ !== 'kvitto' || d.odId || d.makulerad) continue;
      var kvittoBlob = await skapaDokumentPdf(d).catch(function () { return null; });
      if (!kvittoBlob) continue;
      var kvitto = await laddaUpp(K.kvittoSokvag(d), kvittoBlob);
      d.odId = kvitto.id;
      andrat = true;
    }
    if (store.forening.harLogotyp && !store.forening.logoOdId) {
      var logo = await hamtaFil('logotyp');
      if (logo) {
        var lp = await laddaUpp('Föreningsbokföring logotyp.' + ((logo.blob.type || '').split('/')[1] || 'png'), logo.blob);
        store.forening.logoOdId = lp.id;
        await sparaFil('logotyp', logo.blob, lp.id);
        andrat = true;
      }
    }
    if (andrat) sparaLokalt();
  }

  async function hamtaFilFranOneDrive(id) {
    if (revision) return null;
    if (!odAnslutet()) return null;
    var u = null;
    Object.keys(store.ar).some(function (arId) { u = (store.ar[arId].underlag || []).find(function (x) { return x.id === id; }) || null; return !!u; });
    if (!u || !u.odId) return null;
    var res = await graf('/drives/' + od.mapp.driveId + '/items/' + u.odId + '/content', { ra: true });
    var blob = await res.blob();
    await sparaFil(id, blob, u.filnamn).catch(function () { /* cache är frivillig */ });
    return { blob: blob };
  }


  async function sakerstallUndermapp(driveId, foralderId, namn) {
    var ny = await graf('/drives/' + driveId + '/items/' + foralderId + '/children', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: namn, folder: {}, '@microsoft.graph.conflictBehavior': 'fail' }), tillat: [409]
    });
    if (ny === 409) ny = await graf('/drives/' + driveId + '/items/' + foralderId + ':/' + enc(namn) + ':');
    return ny;
  }

  // Mappen på sökvägen i min OneDrive; mappar som saknas skapas.
  async function skapaSokvag(sokvag) {
    var rot = await graf('/me/drive/root');
    var driveId = rot.parentReference && rot.parentReference.driveId ? rot.parentReference.driveId : od.mapp.driveId;
    var id = rot.id;
    var delar = sokvag.split('/').filter(Boolean);
    for (var i = 0; i < delar.length; i++) id = (await sakerstallUndermapp(driveId, id, delar[i])).id;
    return { driveId: driveId, id: id, namn: delar[delar.length - 1] };
  }

  async function flyttaMapp(driveId, itemId, foralderId, namn) {
    return graf('/drives/' + driveId + '/items/' + itemId, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: namn, parentReference: { id: foralderId } })
    });
  }
  async function barnMedNamn(driveId, foralderId, namn) {
    var x = await graf('/drives/' + driveId + '/items/' + foralderId + ':/' + enc(namn) + ':', { tillat: [404] });
    return x === 404 ? null : x;
  }
  // En genväg till appen i den samlade mappen.
  function skapaGenvag(driveId, mappId) {
    return graf('/drives/' + driveId + '/items/' + mappId + ':/' + enc(GENVAG) + ':/content', {
      method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: '[InternetShortcut]\r\nURL=' + omdirigering() + '\r\n', tillat: [403, 409]
    }).catch(function () { /* frivilligt */ });
  }

  // Den verkliga platsen i OneDrive. Äldre versioner sparade ibland bara mappens namn som sökväg.
  async function uppdateraSokvagar() {
    if (!odAnslutet() || od.lage !== 'agare') return;
    var bas = od.rot || od.mapp;
    var meta = await graf('/drives/' + bas.driveId + '/items/' + bas.id + '?$select=id,name,parentReference');
    var sok = K.sokvagFranGraf(meta.parentReference && meta.parentReference.path, meta.name);
    if (od.rot) { od.rot.sokvag = sok; od.rot.namn = meta.name; od.mapp.sokvag = sok + '/' + od.mapp.namn; }
    else od.mapp.sokvag = sok;
    sparaOd();
    // Finns föreningens Styrelsearbete kvar utanför den samlade mappen? Då föreslås att mappen flyttas dit.
    odNu.syskonForslag = null;
    if (od.rot && od.styrRot) {
      var tr = await graf("/me/drive/root/search(q='" + encodeURIComponent(STYRARBETE) + "')?$select=id,name,folder", { tillat: [400, 403, 404] });
      var traffar = (tr && tr.value || []).filter(function (x) { return x.folder && x.name === STYRARBETE && x.id !== od.styrRot.id; });
      for (var i = 0; i < traffar.length && !odNu.syskonForslag; i++) {
        var t = await graf('/drives/' + bas.driveId + '/items/' + traffar[i].id + '?$select=id,name,parentReference', { tillat: [403, 404] });
        if (typeof t === 'number') continue;
        var foralder = K.sokvagFranGraf(t.parentReference && t.parentReference.path, '');
        var rotForalder = sok.split('/').slice(0, -1).join('/');
        if (foralder !== rotForalder) {
          odNu.syskonForslag = { styrelsearbete: foralder ? foralder + '/' + STYRARBETE : STYRARBETE, sokvag: (foralder ? foralder + '/' : '') + od.rot.namn };
        }
      }
    }
  }

  function forslagAdministration() {
    var bas = od.rot ? od.rot.sokvag : (od.mapp.sokvag || '');
    var foralder = bas.indexOf('/') >= 0 ? bas.slice(0, bas.lastIndexOf('/')) : '';
    return (foralder ? foralder + '/' : '') + ADMMAPP;
  }

  // Samlar appens mappar i en mapp: Bokföring, Medlemsregister och Styrelsearbete (med Möten och Appens filer).
  // Hela mappar flyttas inom OneDrive, så id, innehåll och delningar följer med. Inget tas bort.
  async function samlaIAdministration(sokvag, opt) {
    sokvag = String(sokvag || '').replace(/^\/+|\/+$/g, '');
    if (!sokvag) throw new Error('Skriv sökvägen till den nya mappen, t.ex. ' + forslagAdministration() + '.');
    if (od.lage !== 'agare') throw new Error('Bara den som äger mapparna kan flytta dem.');
    if (odNu.konflikt || odNu.regKonflikt) throw new Error('Lös krocken med OneDrive först.');
    var gammalSokvag = (od.mapp.sokvag || '').replace(/\/+$/, '');
    if (gammalSokvag && (sokvag === gammalSokvag || sokvag.indexOf(gammalSokvag + '/') === 0)) throw new Error('Den nya mappen kan inte ligga i bokföringsmappen.');
    sattStatus('Sparar innan flytten…');
    laddaNer('sakerhetskopia-fore-flytten-' + idag() + '.json', JSON.stringify({ bokforing: bokforingsdata(), styrelsen: { styrelse: sty.styr.data, uppdrag: sty.upp.data } }, null, 1), 'application/json');
    await synkaUpp();
    await synkaStyrelsen().catch(function () { /* sparas igen efteråt */ });
    if (od.smutsig || od.regSmutsig) throw new Error('Allt kunde inte sparas i OneDrive. Försök igen.');
    try { await sakerstallRegMapp(); } catch (e) { /* skapas nedan */ }
    try { await sakerstallStyrMapp(); } catch (e) { /* skapas nedan */ }
    sattStatus('Flyttar…');
    var d = od.mapp.driveId;
    var rot = await skapaSokvag(sokvag);
    if (rot.id === od.mapp.id) throw new Error('Välj en ny mapp, inte bokföringsmappen.');
    var rotMeta = await graf('/drives/' + d + '/items/' + rot.id + '?$select=id,name,parentReference');
    var foralder = rotMeta.parentReference && rotMeta.parentReference.id;
    // Kontrollera först, så att inget flyttas om något krockar.
    var bok = await barnMedNamn(d, rot.id, DATAMAPP);
    if (bok && bok.id !== od.mapp.id) throw new Error('Det finns redan en mapp ' + DATAMAPP + ' i ' + sokvag + '. Byt namn på den eller välj en annan mapp.');
    var reg = await barnMedNamn(d, rot.id, REGMAPP);
    if (reg && od.regMapp && reg.id !== od.regMapp.id) throw new Error('Det finns redan en mapp ' + REGMAPP + ' i ' + sokvag + '. Byt namn på den eller välj en annan mapp.');
    var gjort = [];
    if (!bok) { await flyttaMapp(d, od.mapp.id, rot.id, DATAMAPP); gjort.push((od.mapp.sokvag || od.mapp.namn) + ' → ' + sokvag + '/' + DATAMAPP); }
    var regId;
    if (od.regMapp) { if (!reg) { await flyttaMapp(d, od.regMapp.id, rot.id, REGMAPP); gjort.push(od.regMapp.namn + ' → ' + sokvag + '/' + REGMAPP); } regId = od.regMapp.id; }
    else regId = (reg || await sakerstallUndermapp(d, rot.id, REGMAPP)).id;
    if (opt.aldre && foralder) {
      var gml = await barnMedNamn(d, foralder, REGMAPP);
      if (gml && gml.folder && gml.id !== regId && gml.id !== rot.id) { await flyttaMapp(d, gml.id, regId, 'Äldre medlemsregister'); gjort.push(REGMAPP + ' → ' + sokvag + '/' + REGMAPP + '/Äldre medlemsregister'); }
    }
    var sa = await barnMedNamn(d, rot.id, STYRARBETE);
    if (!sa && opt.styrelsearbete && foralder) {
      var syskon = await barnMedNamn(d, foralder, STYRARBETE);
      if (syskon && syskon.folder && syskon.id !== rot.id) { await flyttaMapp(d, syskon.id, rot.id, STYRARBETE); sa = syskon; gjort.push(STYRARBETE + ' → ' + sokvag + '/' + STYRARBETE); }
    }
    if (!sa) sa = await sakerstallUndermapp(d, rot.id, STYRARBETE);
    var styrId = od.styrMapp ? od.styrMapp.id : null;
    var af = await barnMedNamn(d, sa.id, APPFILER);
    if (styrId && (!af || af.id !== styrId)) { await flyttaMapp(d, styrId, sa.id, af ? APPFILER + ' (appen)' : APPFILER); gjort.push('Styrelsens filer från appen → ' + sokvag + '/' + STYRARBETE + '/' + APPFILER); }
    if (!styrId) styrId = (af || await sakerstallUndermapp(d, sa.id, APPFILER)).id;
    await sakerstallUndermapp(d, sa.id, MOTEN);
    await skapaGenvag(d, rot.id);
    // Appen pekar om till den nya strukturen. Id:n är desamma; bara namnen ändras.
    od.rot = { driveId: d, id: rot.id, namn: rot.namn, sokvag: sokvag };
    od.mapp = Object.assign({}, od.mapp, { namn: DATAMAPP, sokvag: sokvag + '/' + DATAMAPP });
    od.regMapp = { driveId: d, id: regId, namn: rot.namn + '/' + REGMAPP, for: od.mapp.id };
    od.styrMapp = { driveId: d, id: styrId, namn: rot.namn + '/' + STYRARBETE + '/' + APPFILER, for: od.mapp.id };
    od.styrRot = { driveId: d, id: sa.id, namn: rot.namn + '/' + STYRARBETE };
    odNu.mappar = {}; odNu.motesHistorik = null; odNu.amHandlingar = {};
    sparaOd();
    await sparaAppinstallningar({ mapp: od.mapp, rot: od.rot, lage: 'agare', regMapp: od.regMapp }).catch(function () { /* frivilligt */ });
    var delat = 0;
    if (odNu.roller) {
      await hamtaRoller();
      var ref = function (x) { return { driveId: x.driveId, id: x.id, namn: x.namn }; };
      await sparaRoller(Object.assign({}, odNu.roller, { regMapp: ref(od.regMapp), styrMapp: ref(od.styrMapp), styrRot: ref(od.styrRot) }));
      // Styrelsen och revisorn får hela Styrelsearbete; den gamla delningen av appens filer behövs inte längre.
      var text = 'Mappen ' + STYRARBETE + ' för ' + (store.forening.namn || 'föreningen') + ' är delad med dig. Öppna appen med den här länken och logga in med ditt Microsoft-konto: ' + inbjudningslank();
      var personer = odNu.roller.personer.filter(function (x) { return x.epost !== mig(); });
      for (var i = 0; i < personer.length; i++) {
        var b = K.behorighet(personer[i].roller);
        if (!b.styr) continue;
        await sattDelning(od.styrRot, personer[i].epost, b.styr, text);
        await sattDelning(od.styrMapp, personer[i].epost, null);
        delat++;
      }
    }
    sattStatus('Synkad med OneDrive');
    return { gjort: gjort, delat: delat };
  }

  // Flyttar allt innehåll i en mapp till en annan. Undermappar med samma namn slås ihop; filer som krockar får ett nytt namn.
  async function slaIhopMapp(d, franId, tillId) {
    var fran = await allaBarn(d, franId), till = await allaBarn(d, tillId), antal0 = 0;
    var namn = till.map(function (x) { return x.name; });
    for (var i = 0; i < fran.length; i++) {
      var c = fran[i];
      var finns = till.find(function (x) { return x.name.toLowerCase() === c.name.toLowerCase(); });
      if (finns && finns.folder && c.folder) { antal0 += await slaIhopMapp(d, c.id, finns.id); await taBortOmTom(d, c.id); continue; }
      var nytt = K.ledigtNamn(namn, c.name);
      namn.push(nytt);
      await flyttaMapp(d, c.id, tillId, nytt);
      antal0++;
    }
    return antal0;
  }
  async function taBortOmTom(d, id) {
    if ((await allaBarn(d, id)).length) return false;
    await graf('/drives/' + d + '/items/' + id, { method: 'DELETE', tillat: [404] });
    return true;
  }

  // Flyttar den samlade mappen till en ny plats, och slår ihop Styrelsearbete och ett äldre Medlemsregister som ligger där.
  async function flyttaSamladMapp(sokvag, opt) {
    sokvag = String(sokvag || '').replace(/^\/+|\/+$/g, '');
    if (!od.rot || !od.styrRot) throw new Error('Samla mapparna först.');
    if (od.lage !== 'agare') throw new Error('Bara den som äger mapparna kan flytta dem.');
    if (!sokvag) throw new Error('Skriv vart mappen ska flyttas, t.ex. Föreningen/' + ADMMAPP + '.');
    if (sokvag === od.rot.sokvag) throw new Error('Mappen ligger redan i ' + sokvag + '.');
    if (sokvag.indexOf(od.rot.sokvag + '/') === 0) throw new Error('Mappen kan inte flyttas in i sig själv.');
    sattStatus('Sparar innan flytten…');
    await synkaUpp();
    await synkaStyrelsen().catch(function () { /* sparas igen efteråt */ });
    sattStatus('Flyttar…');
    var d = od.rot.driveId;
    var namn = sokvag.split('/').pop(), foralderSok = sokvag.split('/').slice(0, -1).join('/');
    var foralder = foralderSok ? await skapaSokvag(foralderSok) : await graf('/me/drive/root');
    var krock = await barnMedNamn(d, foralder.id, namn);
    if (krock && krock.id !== od.rot.id) throw new Error('Det finns redan en mapp ' + namn + ' i ' + (foralderSok || 'roten') + '.');
    var gjort = [];
    await flyttaMapp(d, od.rot.id, foralder.id, namn);
    gjort.push((od.rot.sokvag || od.rot.namn) + ' → ' + sokvag);
    if (opt.styrelsearbete) {
      var sa = await barnMedNamn(d, foralder.id, STYRARBETE);
      if (sa && sa.folder && sa.id !== od.styrRot.id) {
        var n = await slaIhopMapp(d, sa.id, od.styrRot.id);
        var borta = await taBortOmTom(d, sa.id);
        gjort.push(antal(n, 'sak', 'saker') + ' från ' + (foralderSok ? foralderSok + '/' : '') + STYRARBETE + ' → ' + sokvag + '/' + STYRARBETE + (borta ? ' (den tomma mappen är borttagen)' : ''));
      }
    }
    if (opt.aldre && od.regMapp) {
      var gml = await barnMedNamn(d, foralder.id, REGMAPP);
      if (gml && gml.folder && gml.id !== od.regMapp.id) {
        var regBarn = (await allaBarn(d, od.regMapp.id)).map(function (x) { return x.name; });
        var nyttNamn = K.ledigtNamn(regBarn, 'Äldre medlemsregister');
        await flyttaMapp(d, gml.id, od.regMapp.id, nyttNamn);
        gjort.push(REGMAPP + ' → ' + sokvag + '/' + REGMAPP + '/' + nyttNamn);
      }
    }
    od.rot = Object.assign({}, od.rot, { namn: namn, sokvag: sokvag });
    od.mapp = Object.assign({}, od.mapp, { sokvag: sokvag + '/' + od.mapp.namn });
    od.regMapp = Object.assign({}, od.regMapp, { namn: namn + '/' + REGMAPP });
    od.styrMapp = Object.assign({}, od.styrMapp, { namn: namn + '/' + STYRARBETE + '/' + APPFILER });
    od.styrRot = Object.assign({}, od.styrRot, { namn: namn + '/' + STYRARBETE });
    odNu.mappar = {}; odNu.motesHistorik = null; odNu.amHandlingar = {}; odNu.syskonForslag = null;
    sparaOd();
    await sparaAppinstallningar({ mapp: od.mapp, rot: od.rot, lage: 'agare', regMapp: od.regMapp }).catch(function () { /* frivilligt */ });
    if (odNu.roller) {
      await hamtaRoller();
      var ref = function (x) { return { driveId: x.driveId, id: x.id, namn: x.namn }; };
      await sparaRoller(Object.assign({}, odNu.roller, { regMapp: ref(od.regMapp), styrMapp: ref(od.styrMapp), styrRot: ref(od.styrRot) }));
    }
    sattStatus('Synkad med OneDrive');
    return { gjort: gjort };
  }

  // ---------- Mötesmappar ----------

  async function allaBarn(driveId, id) {
    var url = '/drives/' + driveId + '/items/' + id + '/children?$select=id,name,folder,file,webUrl,size&$top=200', ut = [];
    while (url) { var dd = await graf(url); ut = ut.concat(dd.value || []); url = dd['@odata.nextLink'] || null; }
    return ut;
  }

  async function motesmappId(namn) {
    await sakerstallStyrMapp();
    if (!od.styrRot) return (await sakerstallUndermapp(od.styrMapp.driveId, od.styrMapp.id, PROTOKOLLMAPP)).id;
    var moten = await sakerstallUndermapp(od.styrRot.driveId, od.styrRot.id, MOTEN);
    return (await sakerstallUndermapp(od.styrRot.driveId, moten.id, namn)).id;
  }

  // Sparar en fil i mötets mapp (Styrelsearbete/Möten/ÅM 2027 …). ersatt: skriv över en äldre version (OneDrive sparar versionerna).
  async function sparaIMotesmapp(mappnamn, filnamn, blob, ersatt) {
    var id = await motesmappId(mappnamn);
    var bas = '/drives/' + od.styrMapp.driveId + '/items/' + id + ':/' + enc(filnamn) + ':';
    var post;
    if (blob.size <= 4 * 1024 * 1024) post = await graf(bas + '/content?@microsoft.graph.conflictBehavior=' + (ersatt ? 'replace' : 'rename'), { method: 'PUT', body: blob });
    else {
      var session = await graf(bas + '/createUploadSession', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': ersatt ? 'replace' : 'rename' } }) });
      var res = await fetch(session.uploadUrl, { method: 'PUT', headers: { 'Content-Range': 'bytes 0-' + (blob.size - 1) + '/' + blob.size }, body: blob });
      if (!res.ok) throw new Error('Uppladdningen misslyckades.');
      post = await res.json();
    }
    odNu.motesHistorik = null; odNu.amHandlingar = {};
    return post;
  }

  async function hamtaMotesHistorik() {
    odNu.motesHistorik = { status: 'hamtar', mappar: [] };
    await sakerstallStyrMapp();
    if (!od.styrRot) { odNu.motesHistorik = { status: 'saknas', mappar: [] }; return; }
    var moten = await barnMedNamn(od.styrRot.driveId, od.styrRot.id, MOTEN);
    if (!moten) { odNu.motesHistorik = { status: 'klar', mappar: [] }; return; }
    var mappar = (await allaBarn(od.styrRot.driveId, moten.id)).filter(function (x) { return x.folder; });
    var filer = await Promise.all(mappar.map(function (m) { return allaBarn(od.styrRot.driveId, m.id); }));
    odNu.motesHistorik = { status: 'klar', webUrl: moten.webUrl || null, mappar: mappar.map(function (m, i) {
      return { namn: m.name, webUrl: m.webUrl || null, tolkat: K.tolkaMotesmapp(m.name), filer: filer[i].map(function (f) { return { namn: f.name, webUrl: f.webUrl || null, mapp: !!f.folder }; }).sort(function (a, b) { return a.namn < b.namn ? -1 : 1; }) };
    }) };
  }

  async function hamtaAmHandlingar(mapp, datum) {
    odNu.amHandlingar = odNu.amHandlingar || {};
    odNu.amHandlingar[mapp] = { status: 'hamtar' };
    await sakerstallStyrMapp();
    var moten = await barnMedNamn(od.styrRot.driveId, od.styrRot.id, MOTEN);
    var item = moten ? await barnMedNamn(od.styrRot.driveId, moten.id, mapp) : null;
    var filer = item ? (await allaBarn(od.styrRot.driveId, item.id)).filter(function (x) { return !x.folder; }) : [];
    var status = K.handlingarStatus(filer.map(function (f) { return f.name; }));
    odNu.amHandlingar[mapp] = { status: 'klar', handlingar: status, webUrl: item ? item.webUrl || null : null, filer: filer.map(function (f) { return { namn: f.name, webUrl: f.webUrl || null }; }) };
    if (styrBeh('styr') === 'write') {
      var ny = K.bockaAvHandlingar(styrData(), 'arsmote-' + datum, status);
      if (ny !== styrData()) andraStyr('styr', ny, false);
    }
  }

  function kopplaFranOneDrive() {
    clearTimeout(odNu.timer);
    clearTimeout(styrTimer);
    // Valberedningens kopia tas bort; styrelsens material finns kvar i webbläsaren, som bokföringen.

    sparaStyrLokalt();
