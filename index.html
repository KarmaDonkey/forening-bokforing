    varningar.forEach(function (w) { if (w.typ === 'saknarUnderlag') utanUnderlag[w.nr] = true; });
    var lista = ar.verifikationer.slice().reverse();
    var html = '<div class="row" style="justify-content:space-between"><h2>Verifikationer ' + esc(K.arNamn(ar)) + '</h2>' +
      '<button class="btn" data-vy="ny">Ny verifikation</button></div>';
    if (ar.lastTom) html += '<p class="faint">Låst till och med ' + esc(ar.lastTom) + '.</p>';
    if (!lista.length) return html + '<p class="muted">Inga verifikationer ännu.</p>';
    html += '<div class="scroll"><table><thead><tr><th>Nr</th><th>Datum</th><th>Text</th><th class="num">Belopp</th></tr></thead><tbody>';
    lista.forEach(function (v) {
      var taggar = '';
      if (v.rattar != null) taggar += '<span class="tag">rättar ' + v.rattar + '</span>';
      var rattning = K.rattadAv(ar, v.nr);
      if (rattning) taggar += '<span class="tag">rättad av ' + rattning.nr + '</span>';
      if (utanUnderlag[v.nr]) taggar += '<span class="tag varning">underlag saknas</span>';
      html += '<tr class="klickbar" data-ver="' + v.nr + '"><td>' + v.nr + '</td><td class="nowrap">' + esc(v.datum) + '</td><td>' + esc(v.text) + taggar + '</td><td class="num">' + kr(verSumma(v)) + '</td></tr>';
      if (oppenVer === v.nr) html += detaljRad(ar, v, rattning);
    });
    return html + '</tbody></table></div>';
  }

  function detaljRad(ar, v, rattning) {
    var html = '<tr class="detalj"><td></td><td colspan="3"><table><tbody>';
    v.rader.forEach(function (r) {
      html += '<tr><td>' + esc(r.konto) + ' ' + esc(K.kontonamn(ar, r.konto)) + '</td>' +
        '<td class="num">' + (r.belopp > 0 ? kr(r.belopp) : '') + '</td><td class="num">' + (r.belopp < 0 ? kr(-r.belopp) : '') + '</td></tr>';
    });
    html += '</tbody></table>';
    var allaUnderlag = K.underlagForVerifikation(ar, v.nr);
    if (allaUnderlag.length) {
      html += '<p class="faint">Underlag: ' + allaUnderlag.map(function (namn) {
        var u = (ar.underlag || []).find(function (x) { return x.arkivnamn === namn; });
        return (u ? '<button class="tag knapp-tag" data-action="visa-fil" data-id="' + esc(u.id) + '">' + esc(namn) + '</button>' : esc(namn)) +
          (u && u.bifogad ? ' <span class="faint">(bifogat ' + esc(u.bifogad.slice(0, 10)) + ')</span>' : '');
      }).join(' ') + '</p>';
    }
    if (!lasLage() && v.rattar == null) {
      var vantande = K.oppnaUnderlag(ar);
      html += '<div class="row ej-utskrift" style="margin:6px 0"><button class="btn btn-secondary btn-small" data-action="bifoga-fil" data-nr="' + v.nr + '">Bifoga fil</button>' +
        (vantande.length ? '<select data-action-change="koppla-ver" data-nr="' + v.nr + '" style="width:auto;max-width:100%"><option value="">Koppla väntande underlag…</option>' +
          vantande.map(function (u) { return '<option value="' + esc(u.id) + '">' + esc((u.datum || '') + ' ' + (u.motpart || u.filnamn)) + ' ' + kr(u.belopp) + '</option>'; }).join('') + '</select>' : '') + '</div>';
    }
    if (v.underlagKommentar) html += '<p class="faint">' + esc(v.underlagKommentar) + '</p>';
    if (v.registrerad) html += '<p class="faint">Registrerad ' + esc(v.registrerad.slice(0, 16).replace('T', ' ')) + '</p>';
    var kanRattas = v.rattar == null && !rattning && !(ar.lastTom && ar.lastTom >= ar.slut);
    var kvitton = store.dokument.filter(function (d) { return d.verifikation && d.verifikation.ar === store.aktivt && d.verifikation.nr === v.nr && !d.makulerad; });
    if (kvitton.length) html += '<p class="faint">Kvitto: ' + kvitton.map(function (d) { return '<button class="tag knapp-tag" data-action="visa-dok" data-id="' + esc(d.id) + '">' + esc(d.nummer) + '</button>'; }).join(' ') + '</p>';
    var inbetalning = v.rattar == null && !rattning && v.rader.some(function (r) { return Number(r.konto) >= 1900 && Number(r.konto) <= 1999 && r.belopp > 0; });
    if (inbetalning) html += '<button class="btn btn-secondary btn-small ej-utskrift" data-action="kvitto-fran-ver" data-nr="' + v.nr + '">Skriv kvitto</button> ';
    if (kanRattas) html += '<button class="btn btn-secondary btn-small ej-utskrift" data-action="ratta" data-nr="' + v.nr + '">Rätta (bokför omvänd verifikation)</button>' + hjalp('rattelse');
    return html + '</td></tr>';
  }

  function vyNy(ar) {
    if (!utkast.datum) utkast.datum = standardDatum(ar);
    var html = '<h2>Ny verifikation' + hjalp('verifikation') + '</h2><div class="card">' + kopplingsInfo(ar) +
      (ar.lastTom ? '<p class="faint" style="margin-top:0">Perioden till och med ' + esc(ar.lastTom) + ' är låst. Den kan låsas upp under År och arkiv.</p>' : '') +
      '<div class="grid2"><div><label for="uDatum">Datum</label><input id="uDatum" type="date" data-u="datum" value="' + esc(utkast.datum) + '" min="' + ar.start + '" max="' + ar.slut + '"></div>' +

      '<div><label for="uKommentar">Eller: varför inget underlag behövs</label><input id="uKommentar" data-u="underlagKommentar" value="' + esc(utkast.underlagKommentar) + '" placeholder="t.ex. Swish, syns i bankutdraget"></div></div>' +
      '<h3>Rader' + hjalp('debetkredit') + '</h3><div class="scroll"><table class="rader-tabell"><thead><tr><th>Konto</th><th class="num">Debet</th><th class="num">Kredit</th><th></th></tr></thead><tbody>';
    utkast.rader.forEach(function (r, i) {

        '<td><input class="num" inputmode="decimal" data-rad="' + i + '" data-f="debet" value="' + esc(r.debet) + '" aria-label="Debet rad ' + (i + 1) + '"></td>' +
        '<td><input class="num" inputmode="decimal" data-rad="' + i + '" data-f="kredit" value="' + esc(r.kredit) + '" aria-label="Kredit rad ' + (i + 1) + '"></td>' +
        '<td>' + (utkast.rader.length > 2 ? '<button class="btn btn-secondary btn-small" data-action="ta-bort-rad" data-rad="' + i + '" aria-label="Ta bort rad">×</button>' : '') + '</td></tr>';
    });
    html += '</tbody></table></div><datalist id="kontolista">' + ar.kontoplan.map(function (k) {

      '<div class="row" style="margin-top:8px"><button class="btn btn-secondary btn-small" data-action="ny-rad">Lägg till rad</button></div>' +

  function kopplingsInfo(ar) {
    var k = utkast.koppling;
    if (!k) return '';
    var delar = [];
    if (k.bankradId) {
      var r = (ar.bankrader || []).find(function (x) { return x.id === k.bankradId; });
      if (r) delar.push('banktransaktionen ' + esc(r.datum) + ' ' + esc(r.text) + ' (' + kr(r.belopp) + ' på ' + r.konto + ')');
    }
    (k.underlagIds || []).forEach(function (id) {
      var u = (ar.underlag || []).find(function (x) { return x.id === id; });
      if (u) delar.push(underlagChip(u));
    });
    return '<p class="muted" style="margin-top:0">Kopplas till ' + delar.join(', ') + '.' +
      (k.bankradId ? '' : ' Betalningen är förifylld som 1930 Företagskonto. Ändra till 1910 Kassa vid kontant betalning, eller 2890 Övriga kortfristiga skulder om någon lagt ut och ska få pengarna tillbaka. När betalningen syns i kontoutdraget kopplas den hit automatiskt.') + '</p>';
  }

  function utkastTillVerifikation() {
    var fel = [];
    var rader = [];
    utkast.rader.forEach(function (r, i) {
      var tom = !r.konto && !r.debet && !r.kredit;
      if (tom) return;
      var d = 0, k = 0;
      try { d = r.debet ? K.parseBelopp(r.debet) : 0; } catch (e) { fel.push('Rad ' + (i + 1) + ': ' + e.message); }
      try { k = r.kredit ? K.parseBelopp(r.kredit) : 0; } catch (e) { fel.push('Rad ' + (i + 1) + ': ' + e.message); }
      if (d && k) fel.push('Rad ' + (i + 1) + ': fyll i antingen debet eller kredit.');
      rader.push({ konto: r.konto.trim(), belopp: d - k });
    });
    return {
      fel: fel,
      verifikation: {
        datum: utkast.datum,
        text: utkast.text,
        rader: rader,
        underlag: utkast.underlag.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
        underlagKommentar: utkast.underlagKommentar.trim(),
        registrerad: new Date().toISOString()
      }
    };
  }

  function uppdateraUtkastStatus() {
    var ar = aktivt();
    var res = utkastTillVerifikation();
    var debet = 0, kredit = 0;
    res.verifikation.rader.forEach(function (r) { if (r.belopp > 0) debet += r.belopp; else kredit -= r.belopp; });
    var status = document.getElementById('utkastStatus');
    var diff = debet - kredit;
    status.innerHTML = 'Debet ' + kr(debet) + ' · Kredit ' + kr(kredit) +
      (diff === 0 ? (debet ? ' · <span class="ok">går ihop</span>' : '') : ' · <span class="fel">skillnad ' + kr(diff) + '</span>');
    var fel = res.fel.concat(K.valideraVerifikation(ar, res.verifikation));
    document.getElementById('utkastFel').innerHTML = utkastRort() ? fel.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') : '';
    document.getElementById('bokforKnapp').disabled = fel.length > 0;
    utkast.rader.forEach(function (r, i) {
      var el = document.getElementById('kontonamn-' + i);
      if (el) el.textContent = r.konto ? K.kontonamn(ar, r.konto.trim()) : '';
    });
  }

  function utkastRort() {
    return utkast.text || utkast.rader.some(function (r) { return r.konto || r.debet || r.kredit; });
  }

      }).join('') + '</select>' + rapportPdfKnappar(ar, 'hb', valtKonto);

      '<tr><td class="nowrap" data-etikett="Datum">' + esc(ar.start) + '</td><td></td><td><strong>Ingående balans</strong></td><td></td><td></td><td class="num" data-etikett="Saldo">' + kr(hb.ib) + '</td></tr>';
    hb.rader.forEach(function (r) {
      html += '<tr><td class="nowrap" data-etikett="Datum">' + esc(r.datum) + '</td><td data-etikett="Verifikation">' + r.nr + '</td><td>' + esc(r.text) + '</td>' +

  var RAPPORTER = [['rr', 'Resultaträkning'], ['br', 'Balansräkning'], ['sb', 'Saldobalans'], ['gb', 'Grundbok'], ['bank', 'Bankavstämning']];

  function vyRapporter(ar) {
    var html = '<div class="row ej-utskrift" style="margin-top:12px">' + RAPPORTER.map(function (r) {
      return '<button class="btn ' + (rapportVy === r[0] ? '' : 'btn-secondary') + ' btn-small" data-rapport="' + r[0] + '">' + r[1] + '</button>';
    }).join('') + '</div>' + rapportPdfKnappar(ar, rapportVy);
    var rubrik = (store.forening.namn ? esc(store.forening.namn) + ' · ' : '') + 'Räkenskapsår ' + esc(ar.start) + ' – ' + esc(ar.slut);
    html += '<div class="card"><p class="faint">' + rubrik + (ar.grovkopia ? ' · arkivkopia från Excel' : ar.lastTom === ar.slut ? '' : ' · preliminär') + '</p>';
    if (rapportVy === 'rr') html += rapportRR(ar);
    if (rapportVy === 'br') html += rapportBR(ar);
    if (rapportVy === 'sb') html += rapportSB(ar);
    if (rapportVy === 'gb') html += rapportGB(ar);
    if (rapportVy === 'bank') html += rapportBank(ar);

  function rapportRR(ar) {
    var fg = foregaende(ar);
    var rr = K.resultatrakning(ar, { foregaende: fg });
    var jmf = !!fg;
    var kol = function (r, f) { return jmf ? '<td class="num">' + kr(r[f]) + '</td>' : ''; };
    var html = '<h2 style="margin-top:0">Resultaträkning' + hjalp('resultatrakning') + '</h2><div class="scroll"><table><thead><tr><th>Konto</th><th class="num">' + esc(K.arNamn(ar)) + '</th>' +
      (jmf ? '<th class="num">' + esc(K.arNamn(fg)) + '</th>' : '') + '</tr></thead><tbody>';
    rr.grupper.forEach(function (g) {
      html += '<tr><td colspan="3"><h3>' + esc(g.namn) + '</h3></td></tr>';

      html += '<tr class="summa"><td>Summa ' + esc(g.namn.toLowerCase()) + '</td><td class="num">' + kr(g.summa) + '</td>' + kol(g, 'jamforelse') + '</tr>';
    });

    var del = function (titel, d) {

        html += '<tr class="summa"><td>Summa ' + esc(g.namn.toLowerCase()) + '</td><td class="num">' + kr(g.jamforelse) + '</td><td class="num">' + kr(g.summa) + '</td></tr>';

  function rapportSB(ar) {

    K.grundbok(ar).forEach(function (v) {

      });

    return html + '</tbody></table></div>';

  var MANADER = ['januari', 'februari', 'mars', 'april', 'maj', 'juni', 'juli', 'augusti', 'september', 'oktober', 'november', 'december'];
  function manadsnamn(m) { return MANADER[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4); }

  function rapportBank(ar) {
    var html = '<h2 style="margin-top:0">Bankavstämning, konto 1930</h2>';
    if (!(ar.bankrader || []).length) return html + '<p class="muted">Inga kontoutdrag är inlästa för året ännu. Läs in ett kontoutdrag under Läs in.</p>';
    var sistaMedData = (ar.bankrader || []).reduce(function (m, r) { return r.datum.slice(0, 7) > m ? r.datum.slice(0, 7) : m; }, '');
    var manader = K.bankavstamningPerManad(ar).filter(function (m) { return m.manad <= sistaMedData; });
    html += '<div class="scroll"><table class="kortlista"><thead><tr><th>Månad</th><th class="num">Banken</th><th class="num">Bokfört</th><th class="num">Skillnad</th><th>Status</th></tr></thead><tbody>';
    manader.forEach(function (m) {
      var status;
      if (!m.antal) status = '<span class="faint">inga transaktioner inlästa</span>';
      else if (m.skillnad == null) status = '<span class="faint">' + antal(m.antal, 'transaktion', 'transaktioner') + ', utan saldo</span>';
      else if (m.skillnad === 0 && !m.obokforda) status = '<span class="ok">stämmer</span>';
      else if (m.obokforda) status = '<span class="fel">' + antal(m.obokforda, 'transaktion', 'transaktioner') + ' ej bokförd' + (m.obokforda === 1 ? '' : 'a') + '</span>';
      else status = '<span class="fel">skiljer</span>';
      html += '<tr><td><strong>' + esc(manadsnamn(m.manad)) + '</strong>' + (m.datum ? '<div class="faint">saldo ' + esc(m.datum) + '</div>' : '') + '</td>' +
        '<td class="num"' + (m.bankSaldo != null ? ' data-etikett="Banken">' + kr(m.bankSaldo) : '>') + '</td><td class="num"' + (m.bokfortSaldo != null ? ' data-etikett="Bokfört">' + kr(m.bokfortSaldo) : '>') + '</td>' +
        '<td class="num' + (m.skillnad ? ' fel' : '') + '"' + (m.skillnad != null ? ' data-etikett="Skillnad">' + kr(m.skillnad) : '>') + '</td><td data-etikett="Status">' + status + '</td></tr>';
    });
    html += '</tbody></table></div>';
    var a = K.bankavvikelser(ar);
    html += '<h3>Banktransaktioner som inte är bokförda (' + a.obokforda.length + ')</h3>';
    html += a.obokforda.length ? '<ul>' + a.obokforda.map(function (r) { return '<li>' + esc(r.datum) + ' ' + esc(r.text) + ' <strong>' + kr(r.belopp) + '</strong></li>'; }).join('') + '</ul>' +
      (lasLage() ? '' : '<button class="btn btn-secondary btn-small ej-utskrift" data-vy="inlasning">Bokför under Läs in</button>') : '<p class="ok">Alla är bokförda.</p>';
    html += '<h3>Bokfört på 1930 men saknas i kontoutdraget (' + a.utanBank.length + ')</h3>';
    html += a.utanBank.length ? '<p class="faint" style="margin:0">Verifikationer mellan ' + esc(a.period.fran) + ' och ' + esc(a.period.till) + ' som rör bankkontot men inte motsvaras av någon rad i kontoutdraget. Kan vara felbokningar, dubbletter eller transaktioner som saknas i det inlästa utdraget.</p><ul>' +

  var HJALP_NYCKEL = 'forening-bokforing:visa-hjalp';

  function visaHjalp() { try { return localStorage.getItem(HJALP_NYCKEL) !== '0'; } catch (e) { return true; } }

  // Ett litet frågetecken bredvid en rubrik. Syns inte om förklaringarna är avstängda.
  function hjalp(nyckel) {
    if (!visaHjalp() || !HJALP[nyckel]) return '';
    return ' <button type="button" class="hjalp-knapp ej-utskrift" data-action="hjalp" data-nyckel="' + nyckel + '" aria-label="Förklaring: ' + esc(HJALP[nyckel].rubrik) + '">?</button>';
  }

  function hjalpInnehall(h) {
    return '<p><strong>Vad:</strong> ' + esc(h.vad) + '</p><p><strong>Varför:</strong> ' + esc(h.varfor) + '</p>' +
      (h.lista ? '<ul>' + h.lista.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
      (h.gor ? '<p><strong>' + (h.lista ? 'Bra att veta' : 'Så gör du') + ':</strong> ' + esc(h.gor) + '</p>' : '') +
      (h.las && h.las.length ? '<p class="faint" style="margin-bottom:0">Läs mer: ' + h.las.map(function (k) { return '<a href="' + KALLOR[k][1] + '" target="_blank" rel="noopener">' + esc(KALLOR[k][0]) + '</a>'; }).join(' · ') + '</p>' : '');
  }

  function hjalpPanel() {
    var h = hjalpOppen && HJALP[hjalpOppen];
    if (!h) return '';
    return '<div class="hjalp-bakgrund" data-action="stang-hjalp"></div><div class="hjalp-panel card" role="dialog" aria-label="' + esc(h.rubrik) + '">' +
      '<div class="row" style="justify-content:space-between"><h2 style="margin:0">' + esc(h.rubrik) + '</h2><button class="btn btn-secondary btn-small" data-action="stang-hjalp" aria-label="Stäng">Stäng</button></div>' +
      hjalpInnehall(h) +

  // ---------- Roller och skrivrätt i OneDrive ----------

  async function efterBokforing() {
    await hamtaRoller().catch(function (err) { odNu.rollFel = 'Rollerna: ' + err.message; });
    await hamtaRegister().catch(function (err) { odNu.regFel = 'Medlemsregistret: ' + err.message; });
  }

  async function hamtaRoller() {
    if (!odAnslutet()) return;
    var meta = await graf(iMappen(ROLLFIL), { tillat: [404] });
    if (meta === 404) {
      odNu.roller = null; odNu.rollerETag = null;
      // Den som äger mappen och kopplar den först blir systemadministratör.
      if (od.lage === 'agare' && mig()) {
        var ny = K.nyRollfil(mig());
        if (od.regMapp) ny.regMapp = { driveId: od.regMapp.driveId, id: od.regMapp.id, namn: od.regMapp.namn };
        await sparaRoller(ny);
      }
      return;
    }
    if (meta.eTag !== odNu.rollerETag) {
      var res = await graf(iMappen(ROLLFIL) + '/content', { ra: true });
      odNu.roller = K.lasRollfil(await res.json());
      odNu.rollerETag = meta.eTag;
    }
    if (od.lage !== 'agare') {
      var b = K.behorighet(K.rollerFor(odNu.roller, mig()));
      var lage = b.data === 'write' ? 'medarbetare' : 'lasare';
      if (lage !== od.lage) { od.lage = lage; sparaOd(); sparaAppinstallningar({ lage: lage }).catch(function () { /* frivilligt */ }); }
    } else if (od.regMapp && kanSkriva() && (!odNu.roller.regMapp || odNu.roller.regMapp.id !== od.regMapp.id)) {
      await sparaRoller(Object.assign({}, odNu.roller, { regMapp: { driveId: od.regMapp.driveId, id: od.regMapp.id, namn: od.regMapp.namn } }));
    }
  }

  async function sparaRoller(fil) {
    var rubriker = { 'Content-Type': 'application/json' };
    if (odNu.rollerETag) rubriker['If-Match'] = odNu.rollerETag;
    var res = await graf(iMappen(ROLLFIL) + '/content', { method: 'PUT', headers: rubriker, body: JSON.stringify(fil, null, 1), tillat: [412], ra: true });
    if (res.status === 412) { odNu.rollerETag = null; await hamtaRoller(); throw new Error('Rollerna ändrades samtidigt från en annan enhet. Försök igen.'); }
    var post = await res.json();
    odNu.roller = K.lasRollfil(fil);
    odNu.rollerETag = post.eTag;
  }

  function nu() { return new Date().toISOString().slice(0, 16); }

  async function lamnaSkrivratt(till) {
    await synkaUpp();
    if (od.smutsig || od.regSmutsig) throw new Error('Allt kunde inte sparas i OneDrive. Försök igen innan du lämnar över.');
    await hamtaRoller();
    await sparaRoller(K.flyttaSkrivratt(odNu.roller, mig(), till, nu()));
  }

  async function taSkrivratt() {
    await hamtaRoller();
    await sparaRoller(K.flyttaSkrivratt(odNu.roller, mig(), mig(), nu()));
    await hamtaFranOneDrive();
  }

  // Delningen i OneDrive som en persons roller ska ge: läsa eller ändra i bokföringsmappen och registrets mapp.
  async function delningarFor(item, epost) {
    var data = await graf('/drives/' + item.driveId + '/items/' + item.id + '/permissions');
    return (data.value || []).filter(function (p) {
      var e = (p.invitation && p.invitation.email) || (p.grantedToV2 && p.grantedToV2.user && p.grantedToV2.user.email) || (p.grantedTo && p.grantedTo.user && p.grantedTo.user.email) || '';
      return String(e).toLowerCase() === epost && (p.roles || []).indexOf('owner') < 0;
    });
  }

  async function sattDelning(item, epost, behov, meddelande) {
    var finns = await delningarFor(item, epost);
    var nuvarande = finns.some(function (p) { return (p.roles || []).indexOf('write') >= 0; }) ? 'write' : finns.length ? 'read' : null;
    if (nuvarande === behov) return;
    for (var i = 0; i < finns.length; i++) {
      await graf('/drives/' + item.driveId + '/items/' + item.id + '/permissions/' + encodeURIComponent(finns[i].id), { method: 'DELETE', tillat: [404] });
    }
    if (!behov) return;
    await graf('/drives/' + item.driveId + '/items/' + item.id + '/invite', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recipients: [{ email: epost }], roles: [behov], requireSignIn: true, sendInvitation: !nuvarande, message: meddelande })
    });
  }

  async function andraRoller(epost, roller) {
    epost = String(epost || '').trim().toLowerCase();
    await hamtaRoller();
    var fil = K.sattRoller(odNu.roller, mig(), epost, roller, nu());
    if (epost !== mig()) {
      try { await sakerstallRegMapp(); } catch (e) { /* registret finns inte ännu */ }
      var b = K.behorighet(roller);
      var namn = K.ROLLER.filter(function (r) { return roller.indexOf(r[0]) >= 0; }).map(function (r) { return r[1]; }).join(' och ');
      var text = 'Du har fått rollen ' + namn + ' i Föreningsbokföring för ' + (store.forening.namn || 'föreningen') + '. Öppna appen med den här länken och logga in med ditt Microsoft-konto: ' + inbjudningslank();
      await sattDelning(od.mapp, epost, b.data, text);
      if (od.regMapp) await sattDelning(od.regMapp, epost, b.reg, text);
    }
    if (!fil.regMapp && od.regMapp) fil.regMapp = { driveId: od.regMapp.driveId, id: od.regMapp.id, namn: od.regMapp.namn };
    await sparaRoller(fil);
  }

      'Skrivrätten har <strong>' + esc(f.skrivratt || 'ingen') + '</strong>. Bara den som har skrivrätten kan ändra något; alla andra ser bokföringen i läsläge.</p>';

    if (f.skrivratt === jag && mottagare.length) {

  function sparadAv(meta) {

  function klockslag(iso) {
    if (!iso) return '';
    var d = new Date(iso), n = new Date();
    var tid = String(d.getHours()).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0');
    return d.toDateString() === n.toDateString() ? 'kl. ' + tid : d.toISOString().slice(0, 10) + ' kl. ' + tid;
  }

  var NARVAROFIL = 'narvaro.json';

  // Medan appen är öppen skriver den in sig i narvaro.json ungefär varannan minut. Den som bara får läsa kan inte synas.
  async function uppdateraNarvaro() {
    if (!odAnslutet() || document.visibilityState !== 'visible') return;
    var lista = {};
    var res = await graf(iMappen(NARVAROFIL) + '/content', { tillat: [404], ra: true });
    if (res.status !== 404) { try { lista = await res.json(); } catch (e) { lista = {}; } }
    if (od.lage !== 'lasare' && mig()) {
      var grans = Date.now() - 24 * 3600 * 1000;
      Object.keys(lista).forEach(function (k) { if (!lista[k] || new Date(lista[k].tid).getTime() < grans) delete lista[k]; });
      lista[mig()] = { tid: new Date().toISOString(), skrivratt: kanSkriva() };
      await graf(iMappen(NARVAROFIL) + '/content', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lista), tillat: [403, 412] }).catch(function () { /* frivilligt */ });
    }
    odNu.narvaro = lista;
  }

  // De som varit aktiva de senaste fem minuterna, utom jag själv.
  function inneNu() {
    var lista = odNu.narvaro || {}, grans = Date.now() - 5 * 60 * 1000;
    return Object.keys(lista).filter(function (k) { return k !== mig() && lista[k] && new Date(lista[k].tid).getTime() > grans; })
      .map(function (k) { return { vem: k, minuter: Math.max(0, Math.round((Date.now() - new Date(lista[k].tid).getTime()) / 60000)) }; });
  }

  function narvaroText() {
    if (!odAnslutet()) return '';
    var inne = inneNu();
    var s = odNu.senastSparat;
    return (s && s.vem ? '<p class="faint" style="margin:4px 0">Senast sparat av ' + esc(s.vem) + (s.tid ? ', ' + esc(klockslag(s.tid)) : '') + '.</p>' : '') +

  // ---------- Revisionspaket och delning med revisorn ----------

  async function skapaRevisionspaket(arId) {
    var JSZip = await laddaJsZip();
    var zip = new JSZip();
    var ar = store.ar[arId];
    var namn = K.arNamn(ar);
    var data = K.revisionspaketData(bokforingsdata(), arId, { skapad: idag(), version: VERSIONER[0].version });
    var steg = function (t) { paketStatus = t; var el = document.getElementById('paketStatus'); if (el) el.textContent = t; };
    zip.file('bokforing.json', JSON.stringify(data));
    var saknas = [];
    for (var i = 0; i < RAPPORTER.length; i++) {
      steg('Skapar ' + RAPPORTER[i][1].toLowerCase() + '…');
      zip.file('Rapporter/' + K.sakertNamn(RAPPORTTITLAR[RAPPORTER[i][0]] + ' ' + namn.replace('/', '-') + '.pdf'), await skapaRapportPdf(ar, RAPPORTER[i][0]));
    }
    if (!ar.grovkopia) {
      try { zip.file('Rapporter/' + arsmoteFilnamn(ar), await skapaArsmotePdf(ar)); } catch (e) { /* årsmöteshandlingarna är frivilliga */ }
      zip.file(K.sakertNamn('Bokföring ' + namn.replace('/', '-') + '.se'), K.tillCp437(K.sieExport(ar, { forening: store.forening, genererad: idag() })));
    }
    var lista = ar.underlag || [];
    for (var j = 0; j < lista.length; j++) {
      steg('Hämtar underlag ' + (j + 1) + ' av ' + lista.length + '…');
      var rec = await hamtaFil(lista[j].id).catch(function () { return null; });
      if (!rec) rec = await hamtaFilFranOneDrive(lista[j].id).catch(function () { return null; });
      if (rec) zip.file(data.filer[lista[j].id], rec.blob); else saknas.push(lista[j].filnamn);
    }
    if (logoUrl) { try { zip.file('logotyp', await (await fetch(logoUrl)).blob()); } catch (e) { /* frivilligt */ } }
    var adress = omdirigering();
    zip.file('Läs mig.txt', [
      'Revisionspaket för ' + (store.forening.namn || 'föreningen') + ', räkenskapsår ' + namn + '.',
      'Skapat ' + idag() + ' med Föreningsbokföring ' + VERSIONER[0].version + '.',
      '',
      'Så öppnar du paketet (inget konto behövs, och inget sparas):',
      '1. Gå till ' + adress,
      '2. Tryck på "Öppna revisionspaket" och välj den här zip-filen.',
      '3. Läs verifikationer, huvudbok och rapporter, och öppna underlagen genom att trycka på dem.',
      '',
      'Rapporterna finns också som PDF i mappen Rapporter, och underlagen i mappen Underlag.',
      ar.grovkopia ? '' : 'Filen med ändelsen .se är bokföringen i SIE-format, för den som har ett eget redovisningsprogram.',
      saknas.length ? '\nUnderlag som saknas i paketet: ' + saknas.join(', ') : '',
      '',
      revisorsguideText()
    ].join('\r\n'));
    steg('Packar…');
    var blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    paketStatus = null;
    return { blob: blob, saknas: saknas };
  }

    input.type = 'file';
    input.accept = '.zip,application/zip';
    input.onchange = async function () {
      var fil = input.files[0];
      if (!fil) return;
      try {
        var JSZip = await laddaJsZip();
        var zip = await JSZip.loadAsync(fil);
        var j = zip.file('bokforing.json');
        if (!j) throw new Error('Zip-filen är inget revisionspaket från Föreningsbokföring.');
        var p = K.lasRevisionspaket(JSON.parse(await j.async('string')));
        revision = { zip: zip, filer: p.filer, skapad: p.skapad, version: p.version };
        clearTimeout(odNu.timer);
        store = { format: 1, forening: p.forening, ar: p.ar, aktivt: p.aktivt, regler: [], motpartsregler: [], medlemsregister: K.tomtRegister() };
        LISTNYCKLAR.forEach(function (k) { store[k] = []; });
        var logo = zip.file('logotyp');
        logoUrl = logo ? URL.createObjectURL(await logo.async('blob')) : null;
        vy = 'rapporter';
        visa('Revisionspaketet är öppnat.');
      } catch (err) { visa(err.fel ? err.fel.join(' ') : 'Paketet kunde inte öppnas: ' + err.message, true); }
    };
    input.click();
  }

  // Delning av mappen Bokföring och underlag med revisorn, via Microsoft. Revisorn loggar in med sitt Microsoft-konto.
  async function delaMedRevisor(epost) {
    epost = String(epost || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(epost)) throw new Error('Skriv revisorns e-postadress.');
    await graf('/drives/' + od.mapp.driveId + '/items/' + od.mapp.id + '/invite', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        recipients: [{ email: epost }], roles: ['read'], requireSignIn: true, sendInvitation: true,
        message: 'Du har fått läsbehörighet till bokföringen för ' + (store.forening.namn || 'föreningen') + '. Öppna den i appen med den här länken och logga in med ditt Microsoft-konto: ' + inbjudningslank()
      })
    });
    await hamtaDelningar();
  }

  async function hamtaDelningar() {
    var data = await graf('/drives/' + od.mapp.driveId + '/items/' + od.mapp.id + '/permissions');
    odNu.delningar = (data.value || []).filter(function (p) { return (p.roles || []).indexOf('owner') < 0; }).map(function (p) {
      var vem = (p.invitation && p.invitation.email) || (p.grantedToV2 && p.grantedToV2.user && (p.grantedToV2.user.email || p.grantedToV2.user.displayName)) ||
        (p.grantedTo && p.grantedTo.user && p.grantedTo.user.displayName) || (p.link ? 'Länk' + (p.link.scope === 'anonymous' ? ' för vem som helst' : '') : 'Okänd');
      return { id: p.id, vem: vem, roller: (p.roles || []).join(', '), lank: !!p.link };
    });
  }

  // ---------- Medlemmar och terminsavgifter ----------

  function reg() { return store.medlemsregister || (store.medlemsregister = K.tomtRegister()); }
  function sparaReg(r) { store.medlemsregister = r; sparaRegister(); }
  function medlemAv(id) { return reg().medlemmar.find(function (m) { return m.id === id; }) || null; }
  // Aktiva medlemmar; avförda är anonymiserade och kan inte väljas.
  function sorteradeMedlemmar() { return reg().medlemmar.filter(function (m) { return !m.avford; }).sort(function (a, b) { return a.namn.localeCompare(b.namn, 'sv'); }); }
  function arsavgiftFor(m) { return m.kategori === 'funktionar' ? (reg().arsavgift.funktionar || 0) : (reg().arsavgift.vanlig || 0); }

  // Avgiften för en bankrad: det du valt i panelen, eller förslaget för en känd betalare när beloppet stämmer.
  function avgiftForRad(rad) {
    if (rad.belopp <= 0 || (inkorgVal[rad.id] || {}).ejAvgift) return null;
    var betalare = K.tolkaBetalare(rad);
    var u = avgiftUtkast[rad.id];
    if (u) {
      var poster = posterFranUtkast(u);
      return { betalare: betalare || { nyckel: '', visning: '' }, termin: u.termin, poster: poster, manuell: true, komIhag: u.komIhag && !!betalare };
    }
    if (!betalare) return null;
    var f = K.avgiftsforslag(reg(), { datum: rad.datum, belopp: rad.belopp, nyckel: betalare.nyckel }, store.ar);
    if (f.stammer && !f.tvetydig) return { betalare: betalare, termin: f.termin, poster: f.poster, forslag: f };
    return null;
  }

  function posterFranUtkast(u) {
    var poster = [];
    u.rader.forEach(function (r) {
      var t = 0, a = 0;
      try { t = r.termin.trim() ? Math.abs(K.parseBelopp(r.termin)) : 0; } catch (e) { t = NaN; }
      try { a = r.ars.trim() ? Math.abs(K.parseBelopp(r.ars)) : 0; } catch (e) { a = NaN; }
      var m = medlemAv(r.medlem);
      if (!m) return;
      if (t || m.kategori !== 'funktionar') poster.push({ medlem: r.medlem, typ: 'termin', belopp: t });
      if (a) poster.push({ medlem: r.medlem, typ: 'arsavgift', belopp: a });
    });
    return poster;
  }

  function oppnaAvgift(rad) {
    var betalare = K.tolkaBetalare(rad);
    var f = K.avgiftsforslag(reg(), { datum: rad.datum, belopp: rad.belopp, nyckel: betalare ? betalare.nyckel : '' }, store.ar);
    avgiftUtkast[rad.id] = {
      termin: f.termin, komIhag: true,
      rader: f.medlemIds.filter(function (id) { return f.poster.some(function (p) { return p.medlem === id; }); }).map(function (id) {
        var t = 0, a = 0;
        f.poster.forEach(function (p) { if (p.medlem === id) { if (p.typ === 'arsavgift') a += p.belopp; else t += p.belopp; } });
        return { medlem: id, termin: t ? K.formatBelopp(t) : '', ars: a ? K.formatBelopp(a) : '' };
      })
    };
  }

  function standardRad(medlemId, termin) {
    var m = medlemAv(medlemId);
    var u = { medlem: medlemId, termin: '', ars: '' };
    if (!m) return u;
    var avg = K.terminsavgifter(reg(), termin).avgifter;
    if (m.kategori !== 'funktionar' && avg[m.kategori]) u.termin = K.formatBelopp(avg[m.kategori]);
    if (!K.harBetaltArsavgift(reg(), m.id, '20' + termin.slice(3, 5), store.ar) && arsavgiftFor(m)) u.ars = K.formatBelopp(arsavgiftFor(m));
    return u;
  }

  function kontonSaknas() { return !reg().konton.medlemsavgift || !reg().konton.terminsavgift; }

    if (u.rader.length) {
      html += '<div class="scroll"><table><thead><tr><th>Medlem</th><th class="num">Terminsavgift</th><th class="num">Årsavgift</th><th></th></tr></thead><tbody>' +
        u.rader.map(function (r, i) {
          var m = medlemAv(r.medlem) || { namn: '?', kategori: '' };
          return '<tr><td>' + esc(m.namn) + ' <span class="faint">' + esc(K.KATEGORI_KORT[m.kategori] || '') + '</span></td>' +
            '<td class="num"><input class="num" inputmode="decimal" data-avg="tb" data-i="' + i + '" data-id="' + id + '" value="' + esc(r.termin) + '" aria-label="Terminsavgift"></td>' +
            '<td class="num"><input class="num" inputmode="decimal" data-avg="ab" data-i="' + i + '" data-id="' + id + '" value="' + esc(r.ars) + '" aria-label="Årsavgift"></td>' +
            '<td><button class="btn btn-secondary btn-small" data-action="avg-ta-bort" data-i="' + i + '" data-id="' + id + '" aria-label="Ta bort">×</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    } else html += '<p class="faint" style="margin:6px 0">Välj en eller flera medlemmar, eller lägg till en ny.</p>';
    var valda = u.rader.map(function (r) { return r.medlem; });
    var kvar = sorteradeMedlemmar().filter(function (m) { return valda.indexOf(m.id) < 0; });
    html += '<div class="row" style="margin-top:6px">';
    if (kvar.length) html += '<select data-avg="lagg-till" data-id="' + id + '" style="width:auto;max-width:100%"><option value="">Lägg till medlem…</option>' +
      kvar.map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.namn) + ' (' + esc(K.KATEGORI_KORT[m.kategori]) + ')</option>'; }).join('') + '</select>';
    html += '<input data-avg="nynamn" data-id="' + id + '" placeholder="Ny medlem: namn" style="width:auto;flex:1 1 140px" value="' + esc(u.nyNamn || '') + '">' +
      '<select data-avg="nykategori" data-id="' + id + '" style="width:auto">' + K.KATEGORIER.map(function (k) { return '<option value="' + k[0] + '"' + ((u.nyKategori || 'barn') === k[0] ? ' selected' : '') + '>' + esc(K.KATEGORI_KORT[k[0]]) + '</option>'; }).join('') + '</select>' +
      '<button class="btn btn-secondary btn-small" data-action="avg-ny-medlem" data-id="' + id + '">Lägg till ny</button></div>';
    var stammer = summa === rad.belopp && poster.length > 0 && !isNaN(summa);
    html += '<p style="margin:8px 0 4px" data-avgsumma="' + id + '">' + summaText(summa, rad.belopp) + '</p>';
    if (betalare) html += '<label style="font-weight:normal;display:flex;gap:6px;align-items:center"><input type="checkbox" data-avg="komihag" data-id="' + id + '"' + (u.komIhag ? ' checked' : '') + ' style="width:auto"> Kom ihåg att ' + esc(betalare.visning) + ' betalar för ' + (u.rader.length === 1 ? 'den här medlemmen' : 'de här medlemmarna') + '</label>';
    if (laege === 'bokfor' && kontonSaknas()) html += '<p class="fel">Välj konton för medlemsavgift och terminsavgift först. <button class="btn btn-secondary btn-small" data-action="medl-vy" data-mvy="avgifter">Gå till Avgifter</button></p>';
    html += '<div class="row" style="margin-top:6px">' +
      (laege === 'koppla' ? '<button class="btn btn-small" data-action="avg-koppla" data-id="' + id + '"' + (stammer ? '' : ' disabled') + '>Koppla till medlemmarna</button>' : '') +
      '<button class="btn btn-secondary btn-small" data-action="avg-avbryt" data-id="' + id + '">' + (laege === 'koppla' ? 'Avbryt' : 'Inte en medlemsavgift') + '</button></div></div>';
    return html;
  }

  function summaText(summa, belopp) {
    var stammer = summa === belopp && !isNaN(summa);
    return 'Summa <strong>' + (isNaN(summa) ? '?' : kr(summa)) + '</strong> av ' + kr(belopp) + ' kr ' + (stammer ? '<span class="ok">stämmer</span>' : '<span class="fel">stämmer inte</span>');
  }

  // Uppdaterar summan och knapparna medan man skriver, utan att rita om sidan (då tappas klicket på knappen).
  function uppdateraAvgiftSumma(id) {
    var ar = aktivt();
    var rad = ar.bankrader.find(function (r) { return r.id === id; });
    var u = avgiftUtkast[id];
    if (!rad || !u) return;
    var poster = posterFranUtkast(u);
    var summa = poster.reduce(function (s, p) { return s + p.belopp; }, 0);
    var ok = summa === rad.belopp && poster.length > 0 && K.giltigtTerminId(u.termin);
    document.querySelectorAll('[data-avgsumma]').forEach(function (el) { if (el.dataset.avgsumma === id) el.innerHTML = summaText(summa, rad.belopp); });
    document.querySelectorAll('[data-action="avg-koppla"]').forEach(function (b) { if (b.dataset.id === id) b.disabled = !ok; });
    document.querySelectorAll('[data-action="bokfor-rad"]').forEach(function (b) { if (b.dataset.id === id) b.disabled = !forslagMedVal(ar, rad).komplett; });
  }

  function avgiftIInkorg(r, f) {
    if (r.belopp <= 0) return '';
    if (avgiftUtkast[r.id]) return avgiftPanel(r, 'bokfor') + (f.avgiftFel ? '<p class="fel" style="margin:4px 0 0">' + esc(f.avgiftFel) + '</p>' : '');
    var namn = function (poster) {
      var ut = [];
      poster.forEach(function (p) { var m = medlemAv(p.medlem); if (m && ut.indexOf(m.namn) < 0) ut.push(m.namn); });
      return ut.join(', ');
    };
    if (f.kalla === 'avgift') {
      var t = 0, a = 0;
      f.avgift.poster.forEach(function (p) { if (p.typ === 'arsavgift') a += p.belopp; else t += p.belopp; });
      return '<div class="row trolig" style="margin-top:8px"><span><strong>' + esc(f.avgift.termin) + ':</strong> ' + esc(namn(f.avgift.poster)) +
        ' <span class="faint">(' + (t ? 'terminsavgift ' + kr(t) : '') + (t && a ? ' + ' : '') + (a ? 'årsavgift ' + kr(a) : '') + ')</span></span>' +
        '<span><button class="btn btn-secondary btn-small" data-action="avg-oppna" data-id="' + esc(r.id) + '">Ändra…</button> ' +
        '<button class="btn btn-secondary btn-small" data-action="inte-avgift" data-id="' + esc(r.id) + '">Inte en avgift</button></span></div>';
    }
    if ((inkorgVal[r.id] || {}).ejAvgift) return '';
    var b = K.tolkaBetalare(r);
    if (!b && !/swish|bankgiro/i.test(r.text)) return '';
    var kand = b ? K.hittaBetalare(reg(), b.nyckel) : null;
    var tips = kand && kand.medlemmar.length ? 'Betalar för ' + kand.medlemmar.map(function (id) { var m = medlemAv(id); return m ? m.namn : '?'; }).join(', ') + '. Beloppet stämmer inte, eller så är det oklart vem.' : '';
    return '<div class="row" style="margin-top:8px"><button class="btn btn-secondary btn-small" data-action="avg-oppna" data-id="' + esc(r.id) + '">Terminsavgift…</button>' +
      (tips ? '<span class="faint">' + esc(tips) + '</span>' : '') + '</div>';
  }


  // Ett textfält för "Information för kvitto" med kontroll av radlängd medan man skriver.
  function infoFalt(attr, varde, platshallare) {
    return '<textarea class="info-falt" rows="5" ' + attr + ' placeholder="' + esc(platshallare || 'Adress, e-post, telefon …') + '" spellcheck="false">' + esc(varde || '') + '</textarea>' +
      '<div class="faint" data-infostatus>' + infoStatus(varde) + '</div>';
  }
  function infoStatus(text) {
    var k = K.kontrolleraKvittoinfo(text);
    return k.fel.length ? '<span class="fel">' + esc(k.fel.join(' ')) + '</span>' : 'Högst ' + K.KVITTOINFO.tecken + ' tecken per rad och ' + K.KVITTOINFO.rader + ' rader, så att kvittot ser ordentligt ut.';
  }

  function vyMedlem(m) {
    var r = reg();
    var id = esc(m.id);
    var betalare = r.betalare.filter(function (b) { return b.medlemmar.indexOf(m.id) >= 0; });
    var betalningar = K.giltigaBetalningar(r, store.ar).filter(function (b) { return b.poster.some(function (p) { return p.medlem === m.id; }); })
      .sort(function (a, b) { return a.datum < b.datum ? 1 : -1; });
    var html = '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">' + esc(m.namn) + '</h2>' +
      '<button class="btn btn-secondary btn-small" data-action="medl-vy" data-mvy="lista">Tillbaka till listan</button></div>' +
      '<div class="grid2"><div><label>Namn</label><input data-medl="namn" data-id="' + id + '" value="' + esc(m.namn) + '"></div>' +
      '<div><label>Kategori</label><select data-medl="kategori" data-id="' + id + '">' + K.KATEGORIER.map(function (k) { return '<option value="' + k[0] + '"' + (k[0] === m.kategori ? ' selected' : '') + '>' + esc(k[1]) + '</option>'; }).join('') + '</select></div></div>' +
      '<label>Information för kvitto</label>' + infoFalt('data-medlinfo="' + id + '"', m.info) +
      '<div class="row" style="margin-top:10px"><button class="btn btn-small" data-action="kvitto-ny" data-id="' + id + '">Kvitto</button>' +
      '<button class="btn btn-secondary btn-small" data-action="medlem-uttrade" data-id="' + id + '">Utträde</button>' +
      (betalningar.length ? '' : '<button class="btn btn-secondary btn-small" data-action="medlem-ta-bort" data-id="' + id + '">Ta bort</button>') + '</div></div>';
    html += '<h2>Betalare</h2><div class="card">' + (betalare.length ? '<ul style="margin:0">' + betalare.map(function (b) {
      return '<li>' + esc(b.namn ? b.namn + ' (' + b.visning + ')' : b.visning) + (b.medlemmar.length > 1 ? ' <span class="faint">betalar också för ' + esc(b.medlemmar.filter(function (x) { return x !== m.id; }).map(function (x) { var y = medlemAv(x); return y ? y.namn : '?'; }).join(', ')) + '</span>' : '') + '</li>';
    }).join('') + '</ul><p class="faint">Namn och information för kvitto på betalarna ändrar du under Betalare.</p>' : '<p class="faint" style="margin:0">Ingen betalare är kopplad.</p>') + '</div>';
    html += '<h2>Betalningar (' + betalningar.length + ')</h2>';
    if (!betalningar.length) html += '<p class="muted">Inga registrerade betalningar.</p>';
    betalningar.forEach(function (b) {
      var egen = b.poster.filter(function (p) { return p.medlem === m.id; }).reduce(function (s, p) { return s + p.belopp; }, 0);
      var andra = b.poster.filter(function (p) { return p.medlem !== m.id; }).map(function (p) { var y = medlemAv(p.medlem); return y ? y.namn : '?'; }).filter(function (x, i, l) { return l.indexOf(x) === i; });
      var bet = K.hittaBetalare(r, b.nyckel);
      html += '<div class="card"><div class="row" style="justify-content:space-between"><div><strong>' + esc(b.datum) + '</strong> · ' + esc(b.termin) +
        (bet ? ' · från ' + esc(bet.namn || bet.visning) : '') + (b.historik ? ' <span class="tag">från Excel</span>' : '') + '</div>' +
        '<div class="belopp">' + kr(egen) + (egen !== b.belopp ? ' <span class="faint">av ' + kr(b.belopp) + '</span>' : '') + '</div></div>' +
        (b.meddelande ? '<p class="faint" style="margin:4px 0">Meddelande: ' + esc(b.meddelande) + '</p>' : '') +
        (andra.length ? '<p class="faint" style="margin:4px 0">Betalningen gäller också ' + esc(andra.join(', ')) + '.</p>' : '');
      if (fordelning && fordelning.betalning === b.id) html += fordelningPanel(b);
      else html += '<div class="row" style="margin-top:6px"><button class="btn btn-secondary btn-small" data-action="fordelning-oppna" data-id="' + esc(b.id) + '">Ändra fördelning</button></div>';
      html += '</div>';
    });
    var andraMedlemmar = sorteradeMedlemmar().filter(function (x) { return x.id !== m.id; });
    if (andraMedlemmar.length) {
      html += '<h2>Slå ihop</h2><div class="card"><p class="faint" style="margin-top:0">Finns samma person två gånger, eller är det här en förälder och inte en medlem? Flytta allt till en annan medlem: betalningar, betalare och kvitton flyttas, och ' + esc(m.namn) + ' tas bort.</p>' +
        '<div class="row"><select id="slaIhopMed" style="width:auto;max-width:100%"><option value="">Välj medlem…</option>' + andraMedlemmar.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.namn) + '</option>'; }).join('') + '</select>' +
        '<button class="btn btn-secondary btn-small" data-action="medlem-sla-ihop" data-id="' + id + '">Slå ihop</button></div></div>';
    }
    return html;
  }

  function fordelningSumma() {
    try { return fordelningPoster().reduce(function (s, p) { return s + p.belopp; }, 0); } catch (e) { return NaN; }
  }

  function fordelningPanel(b) {
    var u = fordelning;
    var valda = u.rader.map(function (x) { return x.medlem; });
    return '<div class="avgift-panel"><div class="row"><strong>Fördelning</strong><label style="margin:0 0 0 auto">Termin <input data-ford="termin" value="' + esc(u.termin) + '" style="width:80px;display:inline-block"></label></div>' +
      '<div class="scroll"><table><thead><tr><th>Medlem</th><th class="num">Terminsavgift</th><th class="num">Årsavgift</th><th></th></tr></thead><tbody>' + u.rader.map(function (x, i) {
        var y = medlemAv(x.medlem) || { namn: '?' };
        return '<tr><td>' + esc(y.namn) + '</td><td class="num"><input class="num" inputmode="decimal" data-ford="tb" data-i="' + i + '" value="' + esc(x.termin) + '"></td>' +
          '<td class="num"><input class="num" inputmode="decimal" data-ford="ab" data-i="' + i + '" value="' + esc(x.ars) + '"></td>' +
          '<td><button class="btn btn-secondary btn-small" data-action="fordelning-ta-bort" data-i="' + i + '">×</button></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="row" style="margin-top:6px"><select data-ford="lagg-till" style="width:auto;max-width:100%"><option value="">Lägg till medlem…</option>' +
      sorteradeMedlemmar().filter(function (x) { return valda.indexOf(x.id) < 0; }).map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.namn) + '</option>'; }).join('') + '</select>' +
      '<input data-ford="nynamn" placeholder="Ny medlem: namn" style="width:auto;flex:1 1 140px" value="' + esc(u.nyNamn || '') + '">' +
      '<select data-ford="nykategori" style="width:auto">' + K.KATEGORIER.map(function (k) { return '<option value="' + k[0] + '"' + ((u.nyKategori || 'barn') === k[0] ? ' selected' : '') + '>' + esc(K.KATEGORI_KORT[k[0]]) + '</option>'; }).join('') + '</select>' +
      '<button class="btn btn-secondary btn-small" data-action="fordelning-ny-medlem">Lägg till ny</button></div>' +
      '<p style="margin:8px 0 4px" data-fordsumma>' + summaText(fordelningSumma(), b.belopp) + '</p>' +
      '<div class="row"><button class="btn btn-small" data-action="fordelning-spara">Spara fördelningen</button><button class="btn btn-secondary btn-small" data-action="fordelning-avbryt">Avbryt</button></div></div>';
  }

  function fordelningPoster() {
    var poster = [];
    fordelning.rader.forEach(function (x) {
      var t = x.termin.trim() ? Math.abs(K.parseBelopp(x.termin)) : 0, a = x.ars.trim() ? Math.abs(K.parseBelopp(x.ars)) : 0;
      var m = medlemAv(x.medlem);
      if (t || (m && m.kategori !== 'funktionar')) poster.push({ medlem: x.medlem, typ: 'termin', belopp: t });
      if (a) poster.push({ medlem: x.medlem, typ: 'arsavgift', belopp: a });
    });
    return poster;
  }

  var MEDLEMVYER = [['statistik', 'Statistik'], ['koppla', 'Att koppla'], ['lista', 'Medlemmar'], ['betalare', 'Betalare'], ['avgifter', 'Avgifter'], ['personuppgifter', 'Personuppgifter']];
  var kvittoUtkast = null;
  var valdMedlem = null;
  var fordelning = null;

  function vyMedlemmar(ar) {
    var r = reg();
    var okopplade = K.okoppladeInbetalningar(r, ar, store.aktivt);
    var avforas = K.attAvfora(r, idag(), store.ar);
    var html = '<div class="row" style="margin-top:12px">' + MEDLEMVYER.map(function (v) {
      var n = v[0] === 'koppla' && okopplade.length ? ' (' + okopplade.length + ')' : v[0] === 'lista' && avforas.length ? ' (' + avforas.length + ' att avföra)' : '';
      return '<button class="btn ' + (medlemVy === v[0] ? '' : 'btn-secondary') + ' btn-small" data-action="medl-vy" data-mvy="' + v[0] + '">' + v[1] + n + '</button>';
    }).join('') + '</div>';
    if (medlemVy === 'koppla') return html + vyMedlemKoppla(ar, okopplade);
    if (medlemVy === 'lista') return html + vyMedlemLista();
    if (medlemVy === 'betalare') return html + vyBetalare();
    if (medlemVy === 'avgifter') return html + vyAvgifter(ar);
    if (medlemVy === 'personuppgifter') return html + vyPersonuppgifter();
    if (medlemVy === 'kvitto' && kvittoUtkast) return html + vyKvitto();
    if (medlemVy === 'medlem' && medlemAv(valdMedlem)) return html + vyMedlem(medlemAv(valdMedlem));
    return html + vyMedlemStatistik(ar);
  }

  function aktuellTermin(ar) {
    var t = K.terminForDatum(idag() >= ar.start && idag() <= ar.slut ? idag() : ar.slut);
    return t;
  }

  function vyMedlemStatistik(ar) {
    var r = reg();
    var terminer = K.terminerMedData(r);
    var nu = aktuellTermin(ar);
    if (terminer.indexOf(nu) < 0) terminer.push(nu);
    terminer.sort(function (a, b) { return K.terminSortering(a) < K.terminSortering(b) ? -1 : 1; });
    if (!valdTermin || terminer.indexOf(valdTermin) < 0) valdTermin = nu;
    var s = K.terminsstatistik(r, valdTermin, store.ar);
    var html = '<div class="card"><div class="row"><label for="mTermin" style="margin:0">Termin</label><select id="mTermin" style="width:auto">' +
      terminer.slice().reverse().map(function (t) { return '<option value="' + t + '"' + (t === valdTermin ? ' selected' : '') + '>' + esc(K.terminNamn(t)) + ' (' + t + ')</option>'; }).join('') + '</select></div>' +
      medlPdfKnappar(valdTermin);
    if (!r.medlemmar.length) {
      html += '<p class="muted">Inga medlemmar ännu. När du bokför en Swish-inbetalning under Läs in kan du välja <strong>Terminsavgift…</strong> och lägga till medlemmen där. ' +
        'Betalningar som redan är bokförda kopplar du under <strong>Att koppla</strong>. Ange först avgifterna under <strong>Avgifter</strong>. ' +
        'Historik från tidigare år läser du in från föreningens Excel-filer under <strong>År och arkiv</strong>.</p>';
    }
    html += '<div class="nyckeltal"><div><span class="faint">Betalande</span><strong>' + s.totalt.antal + '</strong></div>' +
      '<div><span class="faint">Terminsavgifter</span><strong>' + kr(s.totalt.termin) + '</strong></div>' +
      '<div><span class="faint">Årsavgifter</span><strong>' + kr(s.totalt.arsavgift) + '</strong></div>' +
      '<div><span class="faint">Slutat sedan förra terminen</span><strong>' + s.slutat.length + '</strong></div></div>';
    html += '<div class="scroll"><table class="kortlista"><thead><tr><th>Kategori</th><th class="num">Antal</th><th class="num">Avgift</th><th class="num">Terminsavgifter</th><th class="num">Årsavgifter</th></tr></thead><tbody>' +
      K.KATEGORIER.filter(function (k) { return s.perKategori[k[0]].antal; }).map(function (k) {
        var x = s.perKategori[k[0]];
        return '<tr><td><strong>' + esc(K.KATEGORI_KORT[k[0]]) + '</strong></td><td class="num" data-etikett="Antal">' + x.antal + '</td>' +
          '<td class="num"' + (s.avgifter[k[0]] ? ' data-etikett="Avgift">' + kr(s.avgifter[k[0]]) : '>') + '</td>' +
          '<td class="num" data-etikett="Terminsavgifter">' + kr(x.termin) + '</td><td class="num" data-etikett="Årsavgifter">' + kr(x.arsavgift) + '</td></tr>';
      }).join('') +
      '<tr class="total"><td>Totalt</td><td class="num" data-etikett="Antal">' + s.totalt.antal + '</td><td></td><td class="num" data-etikett="Terminsavgifter">' + kr(s.totalt.termin) + '</td><td class="num" data-etikett="Årsavgifter">' + kr(s.totalt.arsavgift) + '</td></tr></tbody></table></div></div>';
    html += '<h2>Har betalat (' + s.betalande.length + ')</h2>';
    html += s.betalande.length ? '<div class="scroll"><table class="kortlista"><thead><tr><th>Namn</th><th>Kategori</th><th>Datum</th><th class="num">Terminsavgift</th><th class="num">Årsavgift</th></tr></thead><tbody>' +
      s.betalande.map(function (b) {
        var lite = b.forvantat != null && b.termin < b.forvantat;
        return '<tr><td><strong>' + esc(b.namn) + '</strong></td><td data-etikett="Kategori">' + esc(K.KATEGORI_KORT[b.kategori] || '') + '</td><td data-etikett="Datum">' + esc(b.datum.join(', ')) + '</td>' +
          '<td class="num' + (lite ? ' fel' : '') + '" data-etikett="Terminsavgift">' + kr(b.termin) + '</td><td class="num"' + (b.arsavgift ? ' data-etikett="Årsavgift">' + kr(b.arsavgift) : '>') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<p class="muted">Inga registrerade betalningar för terminen.</p>';
    if (s.forLite.length) html += '<h2>Har betalat mindre än avgiften (' + s.forLite.length + ')</h2><ul>' + s.forLite.map(function (b) { return '<li>' + esc(b.namn) + ': ' + kr(b.termin) + ' av ' + kr(b.forvantat) + ' kr</li>'; }).join('') + '</ul>';
    html += '<h2>Betalade ' + esc(K.foregaendeTermin(valdTermin)) + ' men inte ' + esc(valdTermin) + ' (' + s.slutat.length + ')</h2>';
    html += s.slutat.length ? '<ul>' + s.slutat.map(function (m) { return '<li>' + esc(m.namn) + ' <span class="faint">' + esc(K.KATEGORI_KORT[m.kategori] || '') + '</span></li>'; }).join('') + '</ul>' : '<p class="muted">Inga.</p>';
    var h = K.terminshistorik(r, store.ar);
    if (h.length) {
      html += '<h2>Utveckling</h2><div class="scroll"><table class="kortlista"><thead><tr><th>Termin</th>' + K.KATEGORIER.map(function (k) { return '<th class="num">' + esc(K.KATEGORI_KORT[k[0]]) + '</th>'; }).join('') + '<th class="num">Totalt</th><th class="num">Summa</th></tr></thead><tbody>' +
        h.slice().reverse().map(function (x) {
          return '<tr><td><strong>' + esc(x.termin) + '</strong></td>' + K.KATEGORIER.map(function (k) { return '<td class="num"' + (x[k[0]] ? ' data-etikett="' + esc(K.KATEGORI_KORT[k[0]]) + '">' + x[k[0]] : '>') + '</td>'; }).join('') +
            '<td class="num" data-etikett="Totalt">' + x.antal + '</td><td class="num" data-etikett="Summa">' + kr(x.summa) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    return html;
  }

  function vyMedlemKoppla(ar, okopplade) {
    var html = '<p class="muted">Swish-inbetalningar i ' + esc(store.aktivt) + ' som redan är bokförda men inte kopplade till någon medlem. Kopplingen ändrar inte bokföringen, den används bara för statistiken.</p>';
    if (!okopplade.length) return html + '<p class="ok">Alla är kopplade.</p>';
    okopplade.forEach(function (rad) {
      var b = K.tolkaBetalare(rad);
      var f = K.avgiftsforslag(reg(), { datum: rad.datum, belopp: rad.belopp, nyckel: b.nyckel }, store.ar);
      html += '<div class="card bankrad"><div class="row" style="justify-content:space-between"><div><strong>' + esc(rad.datum) + '</strong> ' + esc(b.visning) +
        ' <button class="tag knapp-tag" data-action="oppna-ver" data-nr="' + rad.verifikation + '">Ver ' + rad.verifikation + '</button></div><div class="belopp ok">' + kr(rad.belopp) + '</div></div>';
      if (avgiftUtkast[rad.id]) html += avgiftPanel(rad, 'koppla');
      else {
        html += '<div class="row" style="margin-top:8px">';
        if (f.stammer && !f.tvetydig) {
          var namn = [];
          f.poster.forEach(function (p) { var m = medlemAv(p.medlem); if (m && namn.indexOf(m.namn) < 0) namn.push(m.namn); });
          html += '<span><strong>' + esc(f.termin) + ':</strong> ' + esc(namn.join(', ')) + '</span><button class="btn btn-small" data-action="avg-koppla-forslag" data-id="' + esc(rad.id) + '">Koppla</button>';
        }

  function kontoNamnIAr(nr) {
    var namn = '';
    Object.keys(store.ar).forEach(function (id) { var k = store.ar[id].kontoplan.find(function (x) { return x.nr === nr; }); if (k && !namn) namn = k.namn; });
    return namn;
  }

  // Lägger in kontot i alla öppna år där det saknas, så att avgifterna kan bokföras där.
  function sakerstallKonto(nr, standardnamn) {
    var namn = kontoNamnIAr(nr) || standardnamn;
    Object.keys(store.ar).forEach(function (id) {
      var a = store.ar[id];
      if (a.lastTom === a.slut || a.kontoplan.some(function (k) { return k.nr === nr; })) return;
      store.ar[id] = K.laggTillKonto(a, nr, namn);
    });
  }

    };
    var html = '<div class="card"><h2 style="margin-top:0">Konton</h2><datalist id="intaktskonton">' + ar.kontoplan.filter(function (k) { return k.nr[0] === '3'; }).map(function (k) { return '<option value="' + k.nr + '">' + esc(k.namn) + '</option>'; }).join('') + '</datalist>' +
      '<div class="grid2">' + kontoFalt('medlemsavgift', 'Medlemsavgifter (årsavgiften)', 'Medlemsavgifter') + kontoFalt('terminsavgift', 'Terminsavgifter', 'Terminsavgifter') + '</div>' +

    html += '<div class="card"><h2 style="margin-top:0">Årsavgift' + hjalp('avgifter') + '</h2><p class="faint" style="margin-top:0">Tas ut första gången under kalenderåret som en medlem betalar terminsavgift.</p><div class="grid2">' +
      '<div><label>Aktiv medlem</label><input class="num" inputmode="decimal" data-mars="vanlig" value="' + (r.arsavgift.vanlig ? kr(r.arsavgift.vanlig) : '') + '" placeholder="0,00"></div>' +
      '<div><label>Funktionär, tränare eller stödmedlem</label><input class="num" inputmode="decimal" data-mars="funktionar" value="' + (r.arsavgift.funktionar ? kr(r.arsavgift.funktionar) : '') + '" placeholder="0,00"></div></div></div>';
    var kats = K.KATEGORIER.filter(function (k) { return k[0] !== 'funktionar'; });
    html += '<div class="card"><h2 style="margin-top:0">Terminsavgifter</h2>';
    if (r.terminer.length) {
      html += '<div class="scroll"><table class="kortlista"><thead><tr><th>Termin</th>' + kats.map(function (k) { return '<th class="num">' + esc(k[1]) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>' +
        r.terminer.slice().reverse().map(function (t) {

            var v = t.avgifter[k[0]];
            return '<td class="num" data-etikett="' + esc(k[1]) + '"><input class="num" style="width:100px" inputmode="decimal" data-mtermin="' + esc(t.id) + '" data-kat="' + k[0] + '" value="' + (v != null ? kr(v) : '') + '" aria-label="' + esc(k[1]) + ' ' + esc(t.id) + '"></td>';
          }).join('') + '<td><button class="btn btn-secondary btn-small" data-action="termin-ta-bort" data-id="' + esc(t.id) + '" aria-label="Ta bort ' + esc(t.id) + '">×</button></td></tr>';

    html += '<div class="card"><h2 style="margin-top:0">Säkerhetskopia av medlemsregistret</h2><p class="faint" style="margin-top:0">Registret har en egen säkerhetskopia, skild från bokföringens. Spara den på ett ställe som bara du kommer åt.</p>' +
      '<div class="row"><button class="btn btn-secondary btn-small" data-action="exportera-register">Spara säkerhetskopia</button>' +

    html += '<div class="card"><h2 style="margin-top:0">Rensa medlemsregistret</h2><p class="faint" style="margin-top:0">Tar bort alla medlemmar, betalare och kopplade betalningar. Bokföringen påverkas inte. Avgifter och konton finns kvar.</p>' +
      '<button class="btn btn-secondary btn-small" data-action="register-rensa">Rensa medlemsregistret</button></div>';

  function nyTerminForslag(ar) {
    var r = reg();
    if (!r.terminer.length) return aktuellTermin(ar);
    return K.nastaTermin(r.terminer[r.terminer.length - 1].id);
  }

  // Kopplar en redan bokförd inbetalning till medlemmar, utan att ändra bokföringen.
  function kopplaBokford(radId, termin, poster, komIhag) {
    var rad = aktivt().bankrader.find(function (r) { return r.id === radId; });
    var b = K.tolkaBetalare(rad);
    var r = K.registreraBetalning(reg(), { datum: rad.datum, belopp: rad.belopp, termin: termin, nyckel: b ? b.nyckel : '', arId: store.aktivt, ver: rad.verifikation, bankradId: rad.id, poster: poster });
    if (komIhag && b) r = K.kopplaBetalare(r, b, poster.map(function (p) { return p.medlem; }));
    sparaReg(r);
    visa('Betalningen ' + rad.datum + ' är kopplad.');
  }

  function medlPdfKnappar(termin) {
    var stampel = datastampel(reg(), JSON.stringify(Object.keys(store.ar).map(function (id) { return store.ar[id].verifikationer.length; })) + (store.forening.namn || '') + (logoUrl ? logoUrl.length : 0));
    var nyckel = function (typ, namn) {
      var n = typ + '-' + termin + '-' + stampel + '|' + K.sakertNamn(namn);
      forbered(n, function () { return skapaRapportPdf(aktivt(), typ, termin); });
      return n;
    };
    var utan = nyckel('medl', 'Terminsavgifter ' + termin + '.pdf');
    var med = nyckel('medln', 'Terminsavgifter ' + termin + ' med namn.pdf');
    return '<p class="faint" style="margin:10px 0 0">Sammanställning utan namn, för styrelsen och årsmötet:</p>' +
      '<div class="row ej-utskrift" style="margin:4px 0 6px">' + pdfKnappar(utan, 'kvitto-skriv-ut') + '</div>' +
      '<details><summary>Lista med namn (innehåller personuppgifter)</summary><p class="faint">Bara för kassören. Dela den inte vidare.</p>' +
      '<div class="row ej-utskrift" style="margin:4px 0">' + pdfKnappar(med, 'kvitto-skriv-ut') + '</div></details>';
  }

  // Kvitto på betalda avgifter till en medlem som begär det. Övriga uppgifter (t.ex. personnummer) sparas inte.
  function nyttKvitto(medlemId) {
    var m = medlemAv(medlemId);
    var rader = K.kvittorader(reg(), medlemId, store.ar);
    var ar = rader.length ? rader[rader.length - 1].datum.slice(0, 4) : idag().slice(0, 4);
    kvittoUtkast = {
      medlem: medlemId, ar: ar, mottagare: m.namn, info: m.info || '', ovrigt: '', val: 'medlem',
      adressId: store.adresser[0] ? store.adresser[0].id : '', kontaktId: store.kontakter[0] ? store.kontakter[0].id : '',
      valda: null, skapat: null
    };
    // Betalade någon annan, t.ex. en förälder, föreslås den som mottagare.
    var senaste = rader.length ? K.hittaBetalare(reg(), rader[rader.length - 1].nyckel) : null;
    if (senaste && senaste.namn && K.namnNyckel(senaste.namn) !== K.namnNyckel(m.namn)) valjKvittomottagare('b:' + senaste.nyckel);
  }

  // Radens text på kvittot: det du skrivit, annars ett kort förslag med medlemmens namn om mottagaren är någon annan.
  function kvittoRadtext(r) {
    var u = kvittoUtkast;
    var nyckel = r.betalning + r.typ;
    if (u.texter && u.texter[nyckel] != null) return u.texter[nyckel];
    var namn = (medlemAv(u.medlem) || {}).namn || '';
    return r.text + (namn && K.namnNyckel(u.mottagare) !== K.namnNyckel(namn) ? ' – ' + namn : '');
  }

  function kvittomottagare(medlemId) {
    var m = medlemAv(medlemId);
    var lista = [{ val: 'medlem', namn: m.namn, info: m.info || '', text: m.namn + ' (medlemmen)' }];
    reg().betalare.filter(function (b) { return b.medlemmar.indexOf(medlemId) >= 0; }).forEach(function (b) {
      lista.push({ val: 'b:' + b.nyckel, namn: b.namn || '', info: b.info || '', text: (b.namn || b.visning) + ' (betalare)' });
    });
    lista.push({ val: 'annan', namn: '', info: '', text: 'Någon annan' });
    return lista;
  }

  function valjKvittomottagare(val) {
    var u = kvittoUtkast;
    var x = kvittomottagare(u.medlem).find(function (y) { return y.val === val; });
    if (!x) return;
    u.val = val; u.mottagare = x.namn; u.info = x.info;
  }

  function kvittoValdaRader() {
    var u = kvittoUtkast;
    var rader = K.kvittorader(reg(), u.medlem, store.ar, u.ar === 'alla' ? null : u.ar);
    return rader.filter(function (r, i) { return !u.valda || u.valda[r.betalning + r.typ] !== false; });
  }

    var rader = K.kvittorader(reg(), u.medlem, store.ar, u.ar === 'alla' ? null : u.ar);
    html += '<p class="faint" style="margin:10px 0 0">Texten på varje rad kan du skriva om. Ändringen gäller bara det här kvittot.</p>' +
      '<div class="scroll"><table class="kortlista"><thead><tr><th></th><th>Datum</th><th>Text på kvittot</th><th>Betalsätt</th><th class="num">Belopp</th></tr></thead><tbody>' +
      rader.map(function (r) {

        return '<tr><td><input type="checkbox" style="width:auto" data-kvitto="rad" data-rad="' + esc(nyckel) + '"' + (u.valda && u.valda[nyckel] === false ? '' : ' checked') + ' aria-label="Ta med"></td>' +
          '<td data-etikett="Datum">' + esc(r.datum) + '</td><td data-etikett="Text"><input data-kvitto="text" data-rad="' + esc(nyckel) + '" maxlength="80" value="' + esc(kvittoRadtext(r)) + '" aria-label="Text på kvittot">' +
          (r.helaBetalningen ? '<div class="faint">Del av en betalning på ' + kr(r.helaBetalningen) + ' kr</div>' : '') + '</td>' +

    if (!aktivt() || lasLage() || aktivt().grovkopia || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;

    if (cd.files && cd.files.length) {
      e.preventDefault();
      vy = 'inlasning';
      lasInFiler(Array.from(cd.files));
      return;
    }
    var text = cd.getData('text/plain');
    if (text && /\n/.test(text.trim()) || /\t/.test(text || '')) {
      e.preventDefault();
      vy = 'inlasning';

  var HANDLINGAR = {
    'skapa-forsta': function () {
      store.forening = Object.assign({}, store.forening, { namn: varde('forNamn'), orgnr: varde('forOrgnr') });
      laggTillAr(K.skapaAr({ start: varde('nyStart'), slut: varde('nySlut') }));
      vy = 'verifikationer';
      visa('Räkenskapsåret är skapat.');
    },
    'ny-rad': function () { utkast.rader.push(tomRad()); render(); },
    'ta-bort-rad': function (t) { utkast.rader.splice(Number(t.dataset.rad), 1); render(); },
    'rensa-utkast': function () { utkast = nyttUtkast(); render(); },
    'bokfor': function () {
      var res = utkastTillVerifikation();
      if (res.fel.length) throw new Error(res.fel.join(' '));
      var ut;
      if (utkast.koppling) {
        ut = K.bokforKopplat(aktivt(), res.verifikation, utkast.koppling);
        var bank = utkast.koppling.bankradId && aktivt().bankrader.find(function (x) { return x.id === utkast.koppling.bankradId; });
        if (bank) larAv(bank, res.verifikation.rader);
        store.ar[store.aktivt] = ut.ar;
        larAvUnderlag(ut.ar, utkast.koppling.underlagIds, res.verifikation.rader);
        ut.ar = K.tillampaMotpartsregler(ut.ar, store.motpartsregler);
      } else {
        ut = K.bokfor(aktivt(), res.verifikation);
      }
      setAktivt(ut.ar);

    'od-anvand-onedrive': function () {
      if (!window.confirm('Ersätta bokföringen i den här webbläsaren med versionen i OneDrive?')) return;
      graf(iMappen(DATAFIL)).then(hamtaOchTillampa).then(function () { visa('Bokföringen från OneDrive används nu.'); }).catch(function (err) { visa(err.message, true); });
    },
    'od-behall-har': function () {
      if (!window.confirm('Skriva över bokföringen i OneDrive med den här webbläsarens version?')) return;
      graf(iMappen(DATAFIL), { tillat: [404] }).then(function (meta) {
        od.eTag = meta === 404 ? null : meta.eTag;
        od.smutsig = true;
        odNu.konflikt = false;
        odNu.konfliktForsta = false;
        sparaOd();
        return synkaUpp();
      }).then(function () { visa('Den här webbläsarens version är sparad i OneDrive.'); }).catch(function (err) { visa(err.message, true); });
    },
    'od-byt-mapp': function () {
      if (od.smutsig && !window.confirm('Det finns ändringar som inte sparats i OneDrive. Byta mapp ändå?')) return;
      sparaAppinstallningar({ mapp: null, rot: null, lage: null, regMapp: null }).catch(function () { /* frivilligt */ });
      od.rot = null;
      od.mapp = null; od.lage = null; od.eTag = null; od.senast = null; od.smutsig = false; odNu.mappar = {}; odNu.konflikt = false; odNu.delade = null;
      od.regMapp = null; od.regETag = null; odNu.regKonflikt = false;
      sparaOd();
      sattStatus('');
      render();
    },
    'od-logga-ut': function () {
      if (od.smutsig && !window.confirm('Det finns ändringar som inte sparats i OneDrive. Logga ut ändå?')) return;
      kopplaFranOneDrive();
      visa('Du är utloggad från OneDrive. Bokföringen finns kvar i den här webbläsaren.');
    },
    'las-in-forening': function () {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = function () {
        var fil = input.files[0];
        if (!fil) return;
        fil.text().then(function (txt) {
          var data = JSON.parse(txt);
          var res = K.slaIhopForening(store, data, nyttId);
          Object.assign(store, res.data);
          // Logotypen återställs när den saknas på enheten, oavsett vad en säkerhetskopia säger.
          var logo = Promise.resolve(false);
          if (data.logotyp && data.logotyp.data && !logoUrl) {
            var bin = atob(data.logotyp.data);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            logo = sparaFil('logotyp', new Blob([bytes], { type: data.logotyp.typ || 'image/png' }), 'lokal').then(function () {
              store.forening.harLogotyp = true;
              store.forening.logoOdId = null;
              return laddaLogo().then(function () { return true; });
            });
          }
          return logo.then(function (medLogo) {
            spara();
            var a = res.antal;
            visa('Inläst: ' + a.uppgifter + ' uppgifter, ' + a.adresser + ' adresser, ' + a.kontakter + ' kontaktpersoner och ' + a.artiklar + ' artiklar' + (a.terminer ? ', ' + a.terminer + ' avgifter för medlemmar' : '') + (medLogo ? ' samt logotypen' : '') + '. Uppgifter som redan var ifyllda har behållits.');
          });
        }).catch(function (err) { visa(err.fel ? err.fel.join(' ') : 'Filen kunde inte läsas: ' + err.message, true); });
      };
      input.click();
    },
    'ta-bort-logo': function () {
      taBortFil('logotyp');
      store.forening.harLogotyp = false;
      store.forening.logoOdId = null;
      logoUrl = null;
      spara();
      visa('Logotypen är borttagen.');
    },
    'exportera': function () {
      laddaNer('foreningsbokforing-' + idag() + '.json', JSON.stringify(bokforingsdata(), null, 2), 'application/json');
    },
    'sie': function () {
      var ar = aktivt();
      var text = K.sieExport(ar, { forening: store.forening, genererad: idag() });
      laddaNer('bokforing-' + K.arNamn(ar).replace('/', '-') + '.se', K.tillCp437(text), 'application/octet-stream');
    },
    'importera': function () {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = function () {
        var fil = input.files[0];
        if (!fil) return;
        fil.text().then(function (txt) {
          var d = JSON.parse(txt);
          if (!d || d.format !== 1 || !d.ar) throw new Error('Filen är ingen säkerhetskopia från Föreningsbokföring.');
          var fel = [];
          Object.keys(d.ar).forEach(function (id) { K.valideraAr(d.ar[id]).forEach(function (f) { fel.push(id + ': ' + f); }); });
          if (fel.length) throw new Error('Säkerhetskopian har fel: ' + fel.slice(0, 5).join(' '));
          if (Object.keys(store.ar).length && !window.confirm('Ersätta all bokföring i webbläsaren med säkerhetskopian?')) return;
          var regNu = store.medlemsregister;
          var regI = d.medlemsregister;
          delete d.medlemsregister;
          store = d;
          // Säkerhetskopior från version 1.12 innehåller registret; det används bara om registret här är tomt.
          store.medlemsregister = regI && !K.registerHarData(regNu) ? K.normaliseraRegister(regI) : regNu;
          if (!store.regler) store.regler = [];
          if (!store.motpartsregler) store.motpartsregler = [];
          LISTNYCKLAR.forEach(function (k) { if (!store[k]) store[k] = []; });
          if (!store.ar[store.aktivt]) store.aktivt = Object.keys(store.ar).sort().pop() || null;
          spara();
          vy = 'verifikationer';
          visa('Säkerhetskopian är inläst.');
        }).catch(function (err) { visa(err.message, true); });
      };
      input.click();
    }
  };

  ladda();
  if (!OVNING) laddaOd();
  else document.title = 'Övning – ' + document.title;
  fangaInbjudan();
  laggTillManifest();
  LISTNYCKLAR.forEach(function (k) { if (!store[k]) store[k] = []; });
  if (lasLage()) vy = 'rapporter';
  render();
  laddaLogo().then(render);

  // Inloggning, och därefter senaste versionen från OneDrive.
  (OVNING ? Promise.resolve() : hanteraInloggningsretur()).then(function () {
    if (OVNING) return;
    if (od.clientId && od.refreshToken && !od.mapp) {
      sattStatus('Letar efter föreningens mapp…');
      return aterkoppla().then(function (res) {
        if (!res) sattStatus('');
        if (res === 'inbjudan') { vy = 'rapporter'; visa('Bokföringen är öppnad för läsning. Du kan se rapporter, verifikationer och underlag men inte ändra något.'); }
        else if (res === 'mapp') visa(odNu.konflikt ? 'Mappen är kopplad. Välj vilken version av bokföringen som ska gälla.' : 'Klart! Den här enheten är kopplad till ' + (od.mapp.sokvag || od.mapp.namn) + '.');
      });
    }
    if (!od.clientId || !od.mapp) return;
    if (!od.refreshToken) { odNu.inloggningKravs = true; sattStatus('Inte inloggad i OneDrive', true); return; }
    sattStatus('Hämtar från OneDrive…');
    return hamtaFranOneDrive().then(function () {
      return lasAppinstallningar().then(function (inst) {
        synkaNyckel(inst);
        // Enheter som kopplades innan appmappen fanns (version 1.0) sparar mappen nu,
        // så att nya enheter hittar den när de loggar in.
        if (od.mapp && (!inst.mapp || inst.mapp.id !== od.mapp.id || inst.lage !== od.lage)) {
          return sparaAppinstallningar({ mapp: od.mapp, lage: od.lage });
        }
      }).catch(function () { /* frivilligt */ });
    });
  }).catch(function (err) {
    sattStatus(err.message, true);
    // Försök logga in tyst i bakgrunden högst en gång i timmen; annars visas en knapp.
    var senast = 0;
    try { senast = Number(localStorage.getItem('forening-bokforing:tyst-inloggning')) || 0; } catch (e) { /* tomt */ }
    if (odNu.inloggningKravs && od.clientId && od.mapp && Date.now() - senast > 3600000) startaInloggning(true);
  }).then(render);

  // En inbjudningslänk som öppnas i en flik där appen redan är öppen.
  window.addEventListener('hashchange', function () {
    if (!/#revisor=/.test(location.hash)) return;
    fangaInbjudan();
    if (od.refreshToken && !od.mapp) {
      aterkoppla().then(function (res) { if (res === 'inbjudan') { vy = 'rapporter'; visa('Bokföringen är öppnad för läsning.'); } }, function (err) { visa(err.message, true); });
    } else if (od.mapp) {
      localStorage.removeItem(INBJUDAN);
      visa('Den här webbläsaren är redan kopplad till en mapp. Logga ut under År och arkiv → OneDrive och öppna länken igen för att använda inbjudan.', true);
    } else render();
  });

  document.getElementById('nav').addEventListener('scroll', markeraNavSlut, { passive: true });
  window.addEventListener('resize', function () { skalaForhandsvisningar(); markeraNavSlut(); });

  // Hämta igen när appen kommer tillbaka i fokus, så att ändringar från en annan enhet syns.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !odAnslutet() || Date.now() - odNu.senastHamtat < 60000) return;
    hamtaFranOneDrive().then(render, function () { render(); });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && hjalpOppen) { hjalpOppen = null; render(); } });
  setInterval(function () { if (odAnslutet() && !OVNING) uppdateraNarvaro().then(function () { if (vy === 'arkiv') render(); }, function () { /* frivilligt */ }); }, 120000);
  setTimeout(function () { if (odAnslutet() && !OVNING) uppdateraNarvaro().then(render, function () { /* frivilligt */ }); }, 4000);
  window.addEventListener('beforeunload', function (e) {
    if (odAnslutet() && od.smutsig && !lasLage()) { e.preventDefault(); e.returnValue = ''; }
  });
})();
</script>
</body>
</html>
