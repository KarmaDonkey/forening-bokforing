  // ---------- Medlemmar och terminsavgifter ----------

  function reg() { return store.medlemsregister || (store.medlemsregister = K.tomtRegister()); }

  // Föreningens bankkonton: bokföringskonto, namn och kontonumret hos banken (för att känna igen kontoutdragen).
  // Sparas i bokföringsfilen i OneDrive, aldrig i appens kod.
  function bankkonton() { return Array.isArray(store.bankkonton) && store.bankkonton.length ? store.bankkonton : [{ konto: '1930', namn: '', nummer: '' }]; }
  function huvudbankkonto() { return bankkonton()[0].konto; }
  function banknamn(konto, ar) {
    var b = bankkonton().find(function (x) { return x.konto === konto; });
    return konto + ' ' + ((b && b.namn) || K.kontonamn(ar || aktivt(), konto) || '');
  }
  var valtInlasKonto = 'auto';
  // Kontot för ett kontoutdrag: det valda, det enda, eller det som känns igen på kontonumret i filen.
  function kontoForInlasning(text, namn) {
    if (valtInlasKonto !== 'auto') return valtInlasKonto;
    if (bankkonton().length === 1) return huvudbankkonto();
    var k = K.kontoForUtdrag(bankkonton(), text || '', namn || '');
    if (!k) throw new Error('Appen kunde inte se vilket bankkonto kontoutdraget gäller. Välj konto vid "Kontoutdraget gäller" och läs in igen.');
    return k;
  }
  function sparaReg(r) { store.medlemsregister = r; sparaRegister(); }
  function medlemAv(id) { return reg().medlemmar.find(function (m) { return m.id === id; }) || null; }
  // Aktiva medlemmar; avförda är anonymiserade och kan inte väljas.
  function sorteradeMedlemmar() { return reg().medlemmar.filter(function (m) { return !m.avford; }).sort(function (a, b) { return K.visaNamn(a).localeCompare(K.visaNamn(b), 'sv'); }); }
  function arsavgiftFor(m) { return m.kategori === 'funktionar' ? (reg().arsavgift.funktionar || 0) : (reg().arsavgift.vanlig || 0); }

  // Avgiften för en bankrad: det du valt i panelen, eller förslaget för en känd betalare när beloppet stämmer.
  // Insättningsuppgiften från Fritidskortet som en bankrad hör till (kopplad eller föreslagen), med en post per barn.
  function fritidskortFor(rad) {
    var ar = aktivt(), us;
    if (rad.verifikation != null) us = (ar.underlag || []).filter(function (u) { return u.verifikation === rad.verifikation; });
    else {
      var val = inkorgVal[rad.id] || {};
      var f = K.forslagForBankrad(ar, rad, store.regler, val.underlagIds ? { underlagIds: val.underlagIds, ungefar: !!val.ungefar } : undefined);
      if (f.kalla !== 'underlag') return null;
      us = f.underlagIds.map(function (id) { return (ar.underlag || []).find(function (u) { return u.id === id; }); }).filter(Boolean);
    }
    if (!us.length || !us.every(K.arFritidskort)) return null;
    return { motpart: 'Fritidskortet', belopp: us.reduce(function (x, u) { return x + u.belopp; }, 0),
      poster: [].concat.apply([], us.map(K.fritidskortPoster)) };
  }
  function betalareForRad(rad) { return fritidskortFor(rad) ? K.FRITIDSKORT : K.tolkaBetalare(rad); }
  // Förslag på medlemmar för en bokförd eller obokförd inbetalning: Fritidskortet eller en känd betalare.
  function avgiftsforslagForRad(rad) {
    var fk = fritidskortFor(rad);
    if (fk) {
      var ff = K.fritidskortForslag(reg(), fk, K.terminForDatum(rad.datum), store.ar);
      var summa = ff.poster.reduce(function (x, p) { return x + p.belopp; }, 0);
      return { termin: ff.termin, poster: ff.poster, stammer: ff.alla && summa === rad.belopp, tvetydig: false, fritidskort: ff };
    }
    var b = K.tolkaBetalare(rad);
    return K.avgiftsforslag(reg(), { datum: rad.datum, belopp: rad.belopp, nyckel: b ? b.nyckel : '' }, store.ar);
  }

  // Avsändare och meddelande från Swish-rapporten, och vilket barn meddelandet kan gälla.
  function swishInfo(rad) { return K.swishForRad(reg(), rad); }
  function swishNamnForslag(sw) {
    if (!sw || !sw.meddelande) return null;
    var namn = K.namnUrText(sw.meddelande) || sw.meddelande;
    var k = K.kandidaterPaNamn(reg(), namn);
    if (!k.medlemmar.length && namn !== sw.meddelande) k = K.kandidaterPaNamn(reg(), sw.meddelande);
    return { namn: namn, kandidater: k.medlemmar };
  }
  function swishText(sw) {
    return sw ? '<p class="faint" style="margin:4px 0">Swish från ' + esc(sw.namn ? K.visningsnamn(sw.namn) : sw.nummer) + (sw.meddelande ? ' · Meddelande: ' + esc(sw.meddelande) : '') + '</p>' : '';
  }

  function avgiftForRad(rad, fk) {
    if (rad.belopp <= 0 || (inkorgVal[rad.id] || {}).ejAvgift) return null;
    var betalare = fk ? K.FRITIDSKORT : K.tolkaBetalare(rad);
    var u = avgiftUtkast[rad.id];
    if (u) {
      var poster = posterFranUtkast(u);
      return { betalare: betalare || { nyckel: '', visning: '' }, termin: u.termin, poster: poster, manuell: true, komIhag: u.komIhag && !!betalare && !fk };
    }
    if (fk) {
      var ff = avgiftsforslagForRad(rad);
      return ff.stammer ? { betalare: betalare, termin: ff.termin, poster: ff.poster, forslag: ff } : null;
    }
    if (!betalare) return null;
    // Meddelandet i Swish-rapporten säger att det gäller något annat, t.ex. byxor eller en workshop: inget avgiftsförslag.
    var swm = swishInfo(rad);
    if (swm && K.interAvgiftText(swm.meddelande)) return null;
    var f = K.avgiftsforslag(reg(), { datum: rad.datum, belopp: rad.belopp, nyckel: betalare.nyckel }, store.ar);
    if (f.stammer && !f.tvetydig) return { betalare: betalare, termin: f.termin, poster: f.poster, forslag: f };
    // Okänd betalare: meddelandet i Swish-rapporten kan peka ut barnet. Betalaren kopplas då när du bokför.
    if (!f.kand) {
      var nf = swishNamnForslag(swishInfo(rad));
      if (nf && nf.kandidater.length === 1) {
        var g = K.avgiftsforslag(reg(), { datum: rad.datum, belopp: rad.belopp, medlemIds: nf.kandidater }, store.ar);
        if (g.stammer && !g.tvetydig) return { betalare: betalare, termin: g.termin, poster: g.poster, forslag: g, komIhag: true, viaSwish: true };
      }
    }
    return null;
  }

  function posterFranUtkast(u) {
    var poster = [];
    u.rader.forEach(function (r) {
      var t = 0, a = 0;
      try { t = r.termin.trim() ? Math.abs(K.parseBelopp(r.termin)) : 0; } catch (e) { t = NaN; }
      try { a = r.ars.trim() ? Math.abs(K.parseBelopp(r.ars)) : 0; } catch (e) { a = NaN; }
      var m = medlemAv(r.medlem);
      if (!m) return;
      if (t || m.kategori !== 'funktionar') poster.push({ medlem: r.medlem, typ: 'termin', belopp: t });
      if (a) poster.push({ medlem: r.medlem, typ: 'arsavgift', belopp: a });
    });
    return poster;
  }

  function oppnaAvgift(rad) {
    var fk = fritidskortFor(rad);
    if (fk) {
      var ff = K.fritidskortForslag(reg(), fk, K.terminForDatum(rad.datum), store.ar);
      // Barn som inte hittades: deras belopp används när du väljer eller lägger till barnet i panelen.
      var okanda = ff.rader.filter(function (r) { return !r.medlem; }).map(function (r) { return { namn: r.namn, belopp: r.belopp, kandidater: r.kandidater || [] }; });
      avgiftUtkast[rad.id] = { termin: ff.termin, komIhag: false, nyNamn: okanda[0] && okanda[0].namn ? K.visningsnamn(okanda[0].namn) : '', nyKategori: 'barn', fkOkanda: okanda,
        rader: ff.rader.filter(function (r) { return r.medlem; }).map(function (r) {
          var t = 0, a = 0;
          r.poster.forEach(function (p) { if (p.typ === 'arsavgift') a += p.belopp; else t += p.belopp; });
          return { medlem: r.medlem, termin: t ? K.formatBelopp(t) : '', ars: a ? K.formatBelopp(a) : '' };
        }) };
      return;
    }
    var betalare = K.tolkaBetalare(rad);
    var f = K.avgiftsforslag(reg(), { datum: rad.datum, belopp: rad.belopp, nyckel: betalare ? betalare.nyckel : '' }, store.ar);
    // Okänd betalare: barnet enligt meddelandet i Swish-rapporten.
    var nf = !f.medlemIds.length ? swishNamnForslag(swishInfo(rad)) : null;
    if (nf && nf.kandidater.length === 1) f = K.avgiftsforslag(reg(), { datum: rad.datum, belopp: rad.belopp, medlemIds: nf.kandidater }, store.ar);
    avgiftUtkast[rad.id] = {
      namnForslag: nf && nf.kandidater.length > 1 ? nf : null, nyNamn: nf && !nf.kandidater.length ? K.visningsnamn(nf.namn) : '',
      termin: f.termin, komIhag: true,
      rader: f.medlemIds.filter(function (id) { return f.poster.some(function (p) { return p.medlem === id; }); }).map(function (id) {
        var t = 0, a = 0;
        f.poster.forEach(function (p) { if (p.medlem === id) { if (p.typ === 'arsavgift') a += p.belopp; else t += p.belopp; } });
        return { medlem: id, termin: t ? K.formatBelopp(t) : '', ars: a ? K.formatBelopp(a) : '' };
      })
    };
    // Barnet enligt meddelandet, men beloppet stämmer inte med avgiften: välj barnet med avgiften som utgångspunkt.
    if (nf && nf.kandidater.length === 1 && !avgiftUtkast[rad.id].rader.length) avgiftUtkast[rad.id].rader.push(standardRad(nf.kandidater[0], f.termin));
  }

  // Raden för en medlem som läggs till i panelen. För Fritidskortet: beloppet för nästa barn som inte hittades, som terminsavgift.
  function nyAvgiftsrad(u, medlemId, termin) {
    if (u.fkOkanda && u.fkOkanda.length) {
      var p = u.fkOkanda.shift();
      u.nyNamn = u.fkOkanda[0] && u.fkOkanda[0].namn ? K.visningsnamn(u.fkOkanda[0].namn) : '';
      // Samma regel som när appen hittar barnet själv: hela avgiften delas upp, en del är terminsavgift.
      var t = 0, a = 0;
      K.fritidskortFordelning(reg(), medlemId, p.belopp, K.giltigtTerminId(termin) ? termin : K.terminForDatum(idag()), store.ar)
        .forEach(function (x) { if (x.typ === 'arsavgift') a += x.belopp; else t += x.belopp; });
      return { medlem: medlemId, termin: t ? K.formatBelopp(t) : '', ars: a ? K.formatBelopp(a) : '' };
    }
    return standardRad(medlemId, termin);
  }

  function standardRad(medlemId, termin) {
    var m = medlemAv(medlemId);
    var u = { medlem: medlemId, termin: '', ars: '' };
    if (!m) return u;
    var avg = K.terminsavgifter(reg(), termin).avgifter;
    var t = m.kategori !== 'funktionar' ? (avg[m.kategori] || 0) : 0;
    var a = !K.harBetaltArsavgift(reg(), m.id, '20' + termin.slice(3, 5), store.ar) ? arsavgiftFor(m) : 0;
    if (reg().arsavgift.ingar && a && t) { a = Math.min(a, t); t -= a; }
    if (t) u.termin = K.formatBelopp(t);
    if (a) u.ars = K.formatBelopp(a);
    return u;
  }

  function kontonSaknas() { return !reg().konton.medlemsavgift || !reg().konton.terminsavgift; }

  // Panelen där man väljer vem en betalning gäller. laege: 'bokfor' (inläsning) eller 'koppla' (redan bokförd).
  function avgiftPanel(rad, laege) {
    var u = avgiftUtkast[rad.id];
    var id = esc(rad.id);
    var fk = fritidskortFor(rad);
    // Fritidskortet betalar för många barn och kopplas aldrig som fast betalare.
    var betalare = fk ? null : K.tolkaBetalare(rad);
    var poster = posterFranUtkast(u);
    var summa = poster.reduce(function (s, p) { return s + p.belopp; }, 0);
    var html = '<div class="avgift-panel"><div class="row"><strong>Vem gäller betalningen?</strong>' +
      '<label style="margin:0 0 0 auto">Termin <input data-avg="termin" data-id="' + id + '" value="' + esc(u.termin) + '" style="width:80px;display:inline-block" aria-label="Termin, t.ex. HT-26"></label></div>' +
      (fk ? '<p class="faint" style="margin:4px 0">Fritidskortet enligt insättningsuppgiften: ' + esc(fk.poster.map(function (p) { return (p.namn ? K.visningsnamn(p.namn) : 'namn saknas') + ' ' + kr(p.belopp) + ' kr'; }).join(', ')) +
        '. Fritidskortets belopp räknas som terminsavgift; årsavgiften tas när föräldern betalar resten.</p>' : '') +
      (fk ? '' : swishText(swishInfo(rad))) +
      ((u.fkOkanda && u.fkOkanda[0] && u.fkOkanda[0].kandidater.length) || (u.namnForslag && u.namnForslag.kandidater.length) ? '<div class="row" style="margin:4px 0"><span>Förslag för ' + esc(K.visningsnamn((u.fkOkanda && u.fkOkanda[0] ? u.fkOkanda[0] : u.namnForslag).namn)) + ':</span>' +
        (u.fkOkanda && u.fkOkanda[0] ? u.fkOkanda[0] : u.namnForslag).kandidater.filter(function (mid) { return medlemAv(mid) && u.rader.every(function (r) { return r.medlem !== mid; }); }).map(function (mid) {
          return '<button class="btn btn-secondary btn-small" data-action="avg-valj" data-id="' + id + '" data-m="' + esc(mid) + '">' + esc(K.visaNamn(medlemAv(mid))) + '</button>';
        }).join('') + '</div>' : '');
    if (u.rader.length) {
      html += '<div class="scroll"><table><thead><tr><th>Medlem</th><th class="num">Terminsavgift</th><th class="num">Årsavgift</th><th></th></tr></thead><tbody>' +
        u.rader.map(function (r, i) {
          var m = medlemAv(r.medlem) || { namn: '?', kategori: '' };
          return '<tr><td>' + esc(K.visaNamn(m)) + ' <span class="faint">' + esc(K.KATEGORI_KORT[m.kategori] || '') + '</span></td>' +
            '<td class="num"><input class="num" inputmode="decimal" data-avg="tb" data-i="' + i + '" data-id="' + id + '" value="' + esc(r.termin) + '" aria-label="Terminsavgift"></td>' +
            '<td class="num"><input class="num" inputmode="decimal" data-avg="ab" data-i="' + i + '" data-id="' + id + '" value="' + esc(r.ars) + '" aria-label="Årsavgift"></td>' +
            '<td><button class="btn btn-secondary btn-small" data-action="avg-ta-bort" data-i="' + i + '" data-id="' + id + '" aria-label="Ta bort">×</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    } else html += '<p class="faint" style="margin:6px 0">Välj en eller flera medlemmar, eller lägg till en ny.</p>';
    var valda = u.rader.map(function (r) { return r.medlem; });
    var kvar = sorteradeMedlemmar().filter(function (m) { return valda.indexOf(m.id) < 0; });
    html += '<div class="row" style="margin-top:6px">';
    if (kvar.length) html += '<select data-avg="lagg-till" data-id="' + id + '" style="width:auto;max-width:100%"><option value="">Lägg till medlem…</option>' +
      kvar.map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(K.visaNamn(m)) + ' (' + esc(K.KATEGORI_KORT[m.kategori]) + ')</option>'; }).join('') + '</select>';
    html += '<input data-avg="nynamn" data-id="' + id + '" placeholder="Ny medlem: namn" style="width:auto;flex:1 1 140px" value="' + esc(u.nyNamn || '') + '">' +
      '<select data-avg="nykategori" data-id="' + id + '" style="width:auto">' + K.KATEGORIER.map(function (k) { return '<option value="' + k[0] + '"' + ((u.nyKategori || 'barn') === k[0] ? ' selected' : '') + '>' + esc(K.KATEGORI_KORT[k[0]]) + '</option>'; }).join('') + '</select>' +
      '<button class="btn btn-secondary btn-small" data-action="avg-ny-medlem" data-id="' + id + '">Lägg till ny</button></div>';
    var stammer = summa === rad.belopp && poster.length > 0 && !isNaN(summa);
    html += '<p style="margin:8px 0 4px" data-avgsumma="' + id + '">' + summaText(summa, rad.belopp) + '</p>';
    if (betalare) html += '<label style="font-weight:normal;display:flex;gap:6px;align-items:center"><input type="checkbox" data-avg="komihag" data-id="' + id + '"' + (u.komIhag ? ' checked' : '') + ' style="width:auto"> Kom ihåg att ' + esc(betalare.visning) + ' betalar för ' + (u.rader.length === 1 ? 'den här medlemmen' : 'de här medlemmarna') + '</label>';
    if (laege === 'bokfor' && kontonSaknas()) html += '<p class="fel">Välj konton för medlemsavgift och terminsavgift först. <button class="btn btn-secondary btn-small" data-action="medl-vy" data-mvy="avgifter">Gå till Avgifter</button></p>';
    html += '<div class="row" style="margin-top:6px">' +
      (laege === 'koppla' ? '<button class="btn btn-small" data-action="avg-koppla" data-id="' + id + '"' + (stammer ? '' : ' disabled') + '>Koppla till medlemmarna</button>' : '') +
      '<button class="btn btn-secondary btn-small" data-action="avg-avbryt" data-id="' + id + '">' + (laege === 'koppla' ? 'Avbryt' : 'Inte en medlemsavgift') + '</button></div></div>';
    return html;
  }

  function summaText(summa, belopp) {
    var stammer = summa === belopp && !isNaN(summa);
    return 'Summa <strong>' + (isNaN(summa) ? '?' : kr(summa)) + '</strong> av ' + kr(belopp) + ' kr ' + (stammer ? '<span class="ok">stämmer</span>' : '<span class="fel">stämmer inte</span>');
  }

  // Uppdaterar summan och knapparna medan man skriver, utan att rita om sidan (då tappas klicket på knappen).
  function uppdateraAvgiftSumma(id) {
    var ar = aktivt();
    var rad = ar.bankrader.find(function (r) { return r.id === id; });
    var u = avgiftUtkast[id];
    if (!rad || !u) return;
    var poster = posterFranUtkast(u);
    var summa = poster.reduce(function (s, p) { return s + p.belopp; }, 0);
    var ok = summa === rad.belopp && poster.length > 0 && K.giltigtTerminId(u.termin);
    document.querySelectorAll('[data-avgsumma]').forEach(function (el) { if (el.dataset.avgsumma === id) el.innerHTML = summaText(summa, rad.belopp); });
    document.querySelectorAll('[data-action="avg-koppla"]').forEach(function (b) { if (b.dataset.id === id) b.disabled = !ok; });
    // Bokför-knappen och felmeddelandet under panelen följer det du skriver, så att inget gammalt fel står kvar.
    var f = forslagMedVal(ar, rad);
    document.querySelectorAll('[data-action="bokfor-rad"]').forEach(function (b) { if (b.dataset.id === id) b.disabled = !f.komplett; });
    document.querySelectorAll('[data-avgfel]').forEach(function (el) { if (el.dataset.avgfel === id) { el.textContent = f.avgiftFel || ''; el.hidden = !f.avgiftFel; } });
  }

  function avgiftIInkorg(r, f) {
    if (r.belopp <= 0) return '';
    if (avgiftUtkast[r.id]) return avgiftPanel(r, 'bokfor') + '<p class="fel" style="margin:4px 0 0" data-avgfel="' + esc(r.id) + '"' + (f.avgiftFel ? '' : ' hidden') + '>' + esc(f.avgiftFel || '') + '</p>';
    var namn = function (poster) {
      var ut = [];
      poster.forEach(function (p) { var m = medlemAv(p.medlem); if (m && ut.indexOf(m.namn) < 0) ut.push(m.namn); });
      return ut.join(', ');
    };
    var swRad = f.kalla === 'avgift' ? swishInfo(r) : null;
    if (f.kalla === 'avgift') {
      var t = 0, a = 0;
      f.avgift.poster.forEach(function (p) { if (p.typ === 'arsavgift') a += p.belopp; else t += p.belopp; });
      return swishText(swRad) + '<div class="row trolig" style="margin-top:8px"><span><strong>' + esc(f.avgift.termin) + ':</strong> ' + esc(namn(f.avgift.poster)) +
        ' <span class="faint">(' + (t ? 'terminsavgift ' + kr(t) : '') + (t && a ? ' + ' : '') + (a ? 'årsavgift ' + kr(a) : '') + ')</span></span>' +
        '<span><button class="btn btn-secondary btn-small" data-action="avg-oppna" data-id="' + esc(r.id) + '">Ändra…</button> ' +
        '<button class="btn btn-secondary btn-small" data-action="inte-avgift" data-id="' + esc(r.id) + '">Inte en avgift</button></span></div>';
    }
    if ((inkorgVal[r.id] || {}).ejAvgift) return '';
    var fk = f.kalla === 'underlag' ? fritidskortFor(r) : null;
    if (fk) {
      return '<div class="row trolig" style="margin-top:8px"><span><strong>Fritidskortet:</strong> ' + esc(fk.poster.map(function (p) { return (p.namn ? K.visningsnamn(p.namn) : 'namn saknas') + ' ' + kr(p.belopp) + ' kr'; }).join(', ')) +
        ' <span class="faint">(alla barn hittades inte i medlemsregistret)</span></span>' +
        '<span><button class="btn btn-secondary btn-small" data-action="avg-oppna" data-id="' + esc(r.id) + '">Välj barn…</button> ' +
        '<button class="btn btn-secondary btn-small" data-action="inte-avgift" data-id="' + esc(r.id) + '">Inte en avgift</button></span></div>';
    }
    var b = K.tolkaBetalare(r);
    if (!b && !/swish|bankgiro/i.test(r.text)) return '';
    var kand = b ? K.hittaBetalare(reg(), b.nyckel) : null;
    var sw = swishInfo(r);
    if (sw && K.interAvgiftText(sw.meddelande)) return swishText(sw) + '<div class="row" style="margin-top:4px"><span class="faint">Meddelandet tyder på något annat än en avgift. Välj konto ovan.</span>' +
      '<button class="btn btn-secondary btn-small" data-action="avg-oppna" data-id="' + esc(r.id) + '">Terminsavgift ändå…</button></div>';
    if (sw && !(kand && kand.medlemmar.length)) return swishText(sw) + '<div class="row" style="margin-top:4px"><button class="btn btn-secondary btn-small" data-action="avg-oppna" data-id="' + esc(r.id) + '">Terminsavgift…</button></div>';
    if (sw) return swishText(sw) + '<div class="row" style="margin-top:4px"><button class="btn btn-secondary btn-small" data-action="avg-oppna" data-id="' + esc(r.id) + '">Terminsavgift…</button>' +
      '<span class="faint">Betalar för ' + esc(kand.medlemmar.map(function (id) { var m = medlemAv(id); return m ? m.namn : '?'; }).join(', ')) + '. Beloppet stämmer inte med avgiften.</span></div>';
    var tips = kand && kand.medlemmar.length ? 'Betalar för ' + kand.medlemmar.map(function (id) { var m = medlemAv(id); return m ? m.namn : '?'; }).join(', ') + '. Beloppet stämmer inte, eller så är det oklart vem.' : '';
    return '<div class="row" style="margin-top:8px"><button class="btn btn-secondary btn-small" data-action="avg-oppna" data-id="' + esc(r.id) + '">Terminsavgift…</button>' +
      (tips ? '<span class="faint">' + esc(tips) + '</span>' : '') + '</div>';
  }


  // Ett textfält för "Information för kvitto" med kontroll av radlängd medan man skriver.
  function infoFalt(attr, varde, platshallare) {
    return '<textarea class="info-falt" rows="5" ' + attr + ' placeholder="' + esc(platshallare || 'Adress, e-post, telefon …') + '" spellcheck="false">' + esc(varde || '') + '</textarea>' +
      '<div class="faint" data-infostatus>' + infoStatus(varde) + '</div>';
  }
  function infoStatus(text) {
    var k = K.kontrolleraKvittoinfo(text);
    return k.fel.length ? '<span class="fel">' + esc(k.fel.join(' ')) + '</span>' : 'Högst ' + K.KVITTOINFO.tecken + ' tecken per rad och ' + K.KVITTOINFO.rader + ' rader, så att kvittot ser ordentligt ut.';
  }

  function vyMedlem(m) {
    var r = reg();
    var id = esc(m.id);
    var betalare = r.betalare.filter(function (b) { return b.medlemmar.indexOf(m.id) >= 0; });
    var betalningar = K.giltigaBetalningar(r, store.ar).filter(function (b) { return b.poster.some(function (p) { return p.medlem === m.id; }); })
      .sort(function (a, b) { return a.datum < b.datum ? 1 : -1; });
    var html = '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">' + esc(K.visaNamn(m)) + '</h2>' +
      '<button class="btn btn-secondary btn-small" data-action="medl-vy" data-mvy="lista">Tillbaka till listan</button></div>' +
      '<div class="grid2"><div><label>Namn</label><input data-medl="namn" data-id="' + id + '" value="' + esc(m.namn) + '"></div>' +
      '<div><label>Apelido</label><input data-medl="apelido" data-id="' + id + '" value="' + esc(m.apelido || '') + '" placeholder="Capoeiranamn"></div>' +
      '<div><label>Kategori</label><select data-medl="kategori" data-id="' + id + '">' + K.KATEGORIER.map(function (k) { return '<option value="' + k[0] + '"' + (k[0] === m.kategori ? ' selected' : '') + '>' + esc(k[1]) + '</option>'; }).join('') + '</select></div></div>' +
      '<label>Information för kvitto</label>' + infoFalt('data-medlinfo="' + id + '"', m.info) +
      '<div class="row" style="margin-top:10px"><button class="btn btn-small" data-action="kvitto-ny" data-id="' + id + '">Kvitto</button>' +
      '<button class="btn btn-secondary btn-small" data-action="medlem-uttrade" data-id="' + id + '">Utträde</button>' +
      (betalningar.length ? '' : '<button class="btn btn-secondary btn-small" data-action="medlem-ta-bort" data-id="' + id + '">Ta bort</button>') + '</div></div>';
    html += '<h2>Betalare</h2><div class="card">' + (betalare.length ? '<ul style="margin:0">' + betalare.map(function (b) {
      return '<li>' + esc(b.namn ? b.namn + ' (' + b.visning + ')' : b.visning) + (b.medlemmar.length > 1 ? ' <span class="faint">betalar också för ' + esc(b.medlemmar.filter(function (x) { return x !== m.id; }).map(function (x) { var y = medlemAv(x); return y ? y.namn : '?'; }).join(', ')) + '</span>' : '') + '</li>';
    }).join('') + '</ul><p class="faint">Namn och information för kvitto på betalarna ändrar du under Betalare.</p>' : '<p class="faint" style="margin:0">Ingen betalare är kopplad.</p>') + '</div>';
    html += '<h2>Betalningar (' + betalningar.length + ')</h2>';
    if (!betalningar.length) html += '<p class="muted">Inga registrerade betalningar.</p>';
    betalningar.forEach(function (b) {
      var egen = b.poster.filter(function (p) { return p.medlem === m.id; }).reduce(function (s, p) { return s + p.belopp; }, 0);
      var andra = b.poster.filter(function (p) { return p.medlem !== m.id; }).map(function (p) { var y = medlemAv(p.medlem); return y ? y.namn : '?'; }).filter(function (x, i, l) { return l.indexOf(x) === i; });
      var bet = K.hittaBetalare(r, b.nyckel);
      html += '<div class="card"><div class="row" style="justify-content:space-between"><div><strong>' + esc(b.datum) + '</strong> · ' + esc(b.termin) +
        (bet ? ' · från ' + esc(bet.namn || bet.visning) : '') + (b.historik ? ' <span class="tag">från Excel</span>' : '') + '</div>' +
        '<div class="belopp">' + kr(egen) + (egen !== b.belopp ? ' <span class="faint">av ' + kr(b.belopp) + '</span>' : '') + '</div></div>' +
        (b.meddelande ? '<p class="faint" style="margin:4px 0">Meddelande: ' + esc(b.meddelande) + '</p>' : '') +
        (andra.length ? '<p class="faint" style="margin:4px 0">Betalningen gäller också ' + esc(andra.join(', ')) + '.</p>' : '');
      if (fordelning && fordelning.betalning === b.id) html += fordelningPanel(b);
      else html += '<div class="row" style="margin-top:6px"><button class="btn btn-secondary btn-small" data-action="fordelning-oppna" data-id="' + esc(b.id) + '">Ändra fördelning</button></div>';
      html += '</div>';
    });
    var andraMedlemmar = sorteradeMedlemmar().filter(function (x) { return x.id !== m.id; });
    if (andraMedlemmar.length) {
      html += '<h2>Slå ihop</h2><div class="card"><p class="faint" style="margin-top:0">Finns samma person två gånger, eller är det här en förälder och inte en medlem? Flytta allt till en annan medlem: betalningar, betalare och kvitton flyttas, och ' + esc(m.namn) + ' tas bort.</p>' +
        '<div class="row"><select id="slaIhopMed" style="width:auto;max-width:100%"><option value="">Välj medlem…</option>' + andraMedlemmar.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(K.visaNamn(x)) + '</option>'; }).join('') + '</select>' +
        '<button class="btn btn-secondary btn-small" data-action="medlem-sla-ihop" data-id="' + id + '">Slå ihop</button></div></div>';
    }
    return html;
  }

  function fordelningSumma() {
    try { return fordelningPoster().reduce(function (s, p) { return s + p.belopp; }, 0); } catch (e) { return NaN; }
  }

  function fordelningPanel(b) {
    var u = fordelning;
    var valda = u.rader.map(function (x) { return x.medlem; });
    return '<div class="avgift-panel"><div class="row"><strong>Fördelning</strong><label style="margin:0 0 0 auto">Termin <input data-ford="termin" value="' + esc(u.termin) + '" style="width:80px;display:inline-block"></label></div>' +
      '<div class="scroll"><table><thead><tr><th>Medlem</th><th class="num">Terminsavgift</th><th class="num">Årsavgift</th><th></th></tr></thead><tbody>' + u.rader.map(function (x, i) {
        var y = medlemAv(x.medlem) || { namn: '?' };
        return '<tr><td>' + esc(K.visaNamn(y)) + '</td><td class="num"><input class="num" inputmode="decimal" data-ford="tb" data-i="' + i + '" value="' + esc(x.termin) + '"></td>' +
          '<td class="num"><input class="num" inputmode="decimal" data-ford="ab" data-i="' + i + '" value="' + esc(x.ars) + '"></td>' +
          '<td><button class="btn btn-secondary btn-small" data-action="fordelning-ta-bort" data-i="' + i + '">×</button></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="row" style="margin-top:6px"><select data-ford="lagg-till" style="width:auto;max-width:100%"><option value="">Lägg till medlem…</option>' +
      sorteradeMedlemmar().filter(function (x) { return valda.indexOf(x.id) < 0; }).map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(K.visaNamn(x)) + '</option>'; }).join('') + '</select>' +
      '<input data-ford="nynamn" placeholder="Ny medlem: namn" style="width:auto;flex:1 1 140px" value="' + esc(u.nyNamn || '') + '">' +
      '<select data-ford="nykategori" style="width:auto">' + K.KATEGORIER.map(function (k) { return '<option value="' + k[0] + '"' + ((u.nyKategori || 'barn') === k[0] ? ' selected' : '') + '>' + esc(K.KATEGORI_KORT[k[0]]) + '</option>'; }).join('') + '</select>' +
      '<button class="btn btn-secondary btn-small" data-action="fordelning-ny-medlem">Lägg till ny</button></div>' +
      '<p style="margin:8px 0 4px" data-fordsumma>' + summaText(fordelningSumma(), b.belopp) + '</p>' +
      '<div class="row"><button class="btn btn-small" data-action="fordelning-spara">Spara fördelningen</button><button class="btn btn-secondary btn-small" data-action="fordelning-avbryt">Avbryt</button></div></div>';
  }

  function fordelningPoster() {
    var poster = [];
    fordelning.rader.forEach(function (x) {
      var t = x.termin.trim() ? Math.abs(K.parseBelopp(x.termin)) : 0, a = x.ars.trim() ? Math.abs(K.parseBelopp(x.ars)) : 0;
      var m = medlemAv(x.medlem);
      if (t || (m && m.kategori !== 'funktionar')) poster.push({ medlem: x.medlem, typ: 'termin', belopp: t });
      if (a) poster.push({ medlem: x.medlem, typ: 'arsavgift', belopp: a });
    });
    return poster;
  }

  var kvittoUtkast = null;
  var valdMedlem = null;
  var fordelning = null;

  function vyMedlemmar(ar) {
    var r = reg();
    var okopplade = K.okoppladeInbetalningar(r, ar, store.aktivt);
    // Flikarna ligger i undermenyn (m-statistik, m-lista …). En enskild medlem och kvittot hör till fliken Medlemmar.
    var flik = vy.slice(2);
    if (!(flik === 'lista' && (medlemVy === 'medlem' || medlemVy === 'kvitto'))) medlemVy = flik;
    var html = '';
    var egna = lasLage() ? [] : K.egnaBetalare(r);
    if (egna.length) {
      html += '<div class="card" role="status"><strong>Föreningens eget nummer står som betalare</strong>' +
        '<p style="margin:6px 0">' + esc(egna.map(function (b) { return b.visning; }).join(', ')) + ' är föreningens eget nummer, inte någon som betalar. Det kopplades till ' +
        antal(egna.reduce(function (x, b) { return x + b.medlemmar.length; }, 0), 'medlem', 'medlemmar') + ' när betalningar via bankgiro lästes in. Betalningarna och medlemmarna finns kvar.</p>' +
        '<button class="btn btn-small" data-action="rensa-egna-betalare">Ta bort som betalare</button></div>';
    } else if (!lasLage() && !store.forening.bankgiro && r.betalare.some(function (b) { return /^ref:/.test(b.nyckel) && b.medlemmar.length >= 3; })) {
      html += '<div class="card" role="status">Fyll i föreningens bankgironummer under föreningens uppgifter, så att appen inte tar det för en betalare. ' +
        '<button class="btn btn-secondary btn-small" data-action="till-forening">Föreningens uppgifter</button></div>';
    }
    var gamla = lasLage() ? [] : K.foraldradeBetalningar(r, store.ar);
    if (gamla.length) {
      var gamlaB = r.betalningar.filter(function (b) { return gamla.indexOf(b.id) >= 0; });
      var arIds = gamlaB.map(function (b) { return K.excelArForBetalning(b) || b.arId; }).filter(function (x, i, l) { return l.indexOf(x) === i; }).sort();
      var franExcel = gamlaB.filter(function (b) { return K.excelArForBetalning(b); }).length, franVer = gamlaB.length - franExcel;
      html += '<div class="card" role="status"><strong>' + antal(gamla.length, 'betalning', 'betalningar') + ' för ' + esc(arIds.join(', ')) + ' behöver tas bort</strong>' +
        '<ul style="margin:6px 0">' +
        (franExcel ? '<li>' + antal(franExcel, 'betalning', 'betalningar') + ' från Excel-filen. Året bokförs nu i appen, så de skulle annars räknas två gånger.</li>' : '') +
        (franVer ? '<li>' + antal(franVer, 'betalning', 'betalningar') + ' som hör till verifikationer som inte finns längre, till exempel från testbokföringen före "Börja om". Så länge de finns kan samma Swish-betalningar inte kopplas till medlemmar igen.</li>' : '') +
        '</ul><p class="faint" style="margin:6px 0">Medlemmar, Swish-nummer och betalningar för år som är arkivkopior påverkas inte.</p>' +
        '<button class="btn btn-small" data-action="rensa-gamla-betalningar">Ta bort ' + antal(gamla.length, 'betalning', 'betalningar') + '</button></div>';
    }
    if (medlemVy === 'koppla') return html + vyMedlemKoppla(ar, okopplade);
    if (medlemVy === 'lista') return html + vyMedlemLista();
    if (medlemVy === 'betalare') return html + vyBetalare();
    if (medlemVy === 'avgifter') return html + vyAvgifter(ar);
    if (medlemVy === 'personuppgifter') return html + vyPersonuppgifter();
    if (medlemVy === 'kvitto' && kvittoUtkast) return html + vyKvitto();
    if (medlemVy === 'medlem' && medlemAv(valdMedlem)) return html + vyMedlem(medlemAv(valdMedlem));
    return html + vyMedlemStatistik(ar);
  }

  function aktuellTermin(ar) {
    var t = K.terminForDatum(idag() >= ar.start && idag() <= ar.slut ? idag() : ar.slut);
    return t;
  }

  function vyMedlemStatistik(ar) {
    var r = reg();
    var terminer = K.terminerMedData(r);
    var nu = aktuellTermin(ar);
    if (terminer.indexOf(nu) < 0) terminer.push(nu);
    terminer.sort(function (a, b) { return K.terminSortering(a) < K.terminSortering(b) ? -1 : 1; });
    if (!valdTermin || terminer.indexOf(valdTermin) < 0) valdTermin = nu;
    var s = K.terminsstatistik(r, valdTermin, store.ar);
    var html = '<div class="card"><div class="row"><label for="mTermin" style="margin:0">Termin</label><select id="mTermin" style="width:auto">' +
      terminer.slice().reverse().map(function (t) { return '<option value="' + t + '"' + (t === valdTermin ? ' selected' : '') + '>' + esc(K.terminNamn(t)) + ' (' + t + ')</option>'; }).join('') + '</select></div>' +
      medlPdfKnappar(valdTermin);
    if (!r.medlemmar.length) {
      html += '<p class="muted">Inga medlemmar ännu. När du bokför en Swish-inbetalning under Läs in kan du välja <strong>Terminsavgift…</strong> och lägga till medlemmen där. ' +
        'Betalningar som redan är bokförda kopplar du under <strong>Att koppla</strong>. Ange först avgifterna under <strong>Avgifter</strong>. ' +
        'Historik från tidigare år läser du in från föreningens Excel-filer under <strong>År och arkiv</strong>.</p>';
    }
    html += '<div class="nyckeltal"><div><span class="faint">Betalande</span><strong>' + s.totalt.antal + '</strong></div>' +
      '<div><span class="faint">Terminsavgifter</span><strong>' + kr(s.totalt.termin) + '</strong></div>' +
      '<div><span class="faint">Årsavgifter</span><strong>' + kr(s.totalt.arsavgift) + '</strong></div>' +
      '<div><span class="faint">Slutat sedan förra terminen</span><strong>' + s.slutat.length + '</strong></div></div>';
    html += '<div class="scroll"><table class="kortlista"><thead><tr><th>Kategori</th><th class="num">Antal</th><th class="num">Avgift</th><th class="num">Terminsavgifter</th><th class="num">Årsavgifter</th></tr></thead><tbody>' +
      K.KATEGORIER.filter(function (k) { return s.perKategori[k[0]].antal; }).map(function (k) {
        var x = s.perKategori[k[0]];
        return '<tr><td><strong>' + esc(K.KATEGORI_KORT[k[0]]) + '</strong></td><td class="num" data-etikett="Antal">' + x.antal + '</td>' +
          '<td class="num"' + (s.avgifter[k[0]] ? ' data-etikett="Avgift">' + kr(s.avgifter[k[0]]) : '>') + '</td>' +
          '<td class="num" data-etikett="Terminsavgifter">' + kr(x.termin) + '</td><td class="num" data-etikett="Årsavgifter">' + kr(x.arsavgift) + '</td></tr>';
      }).join('') +
      '<tr class="total"><td>Totalt</td><td class="num" data-etikett="Antal">' + s.totalt.antal + '</td><td></td><td class="num" data-etikett="Terminsavgifter">' + kr(s.totalt.termin) + '</td><td class="num" data-etikett="Årsavgifter">' + kr(s.totalt.arsavgift) + '</td></tr></tbody></table></div></div>';
    html += '<h2>Har betalat (' + s.betalande.length + ')</h2>';
    html += s.betalande.length ? '<div class="scroll"><table class="kortlista"><thead><tr><th>Namn</th><th>Kategori</th><th>Datum</th><th class="num">Terminsavgift</th><th class="num">Årsavgift</th></tr></thead><tbody>' +
      s.betalande.map(function (b) {
        var lite = b.forvantat != null && b.termin < b.forvantat;
        return '<tr><td><strong>' + esc(K.visaNamn(medlemAv(b.medlem)) || b.namn) + '</strong></td><td data-etikett="Kategori">' + esc(K.KATEGORI_KORT[b.kategori] || '') + '</td><td data-etikett="Datum">' + esc(b.datum.join(', ')) + '</td>' +
          '<td class="num' + (lite ? ' fel' : '') + '" data-etikett="Terminsavgift">' + kr(b.termin) + '</td><td class="num"' + (b.arsavgift ? ' data-etikett="Årsavgift">' + kr(b.arsavgift) : '>') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<p class="muted">Inga registrerade betalningar för terminen.</p>';
    if (s.forLite.length) html += '<h2>Har betalat mindre än avgiften (' + s.forLite.length + ')</h2><ul>' + s.forLite.map(function (b) { return '<li>' + esc(K.visaNamn(medlemAv(b.medlem)) || b.namn) + ': ' + kr(b.termin) + ' av ' + kr(b.forvantat) + ' kr</li>'; }).join('') + '</ul>';
    html += '<h2>Betalade ' + esc(K.foregaendeTermin(valdTermin)) + ' men inte ' + esc(valdTermin) + ' (' + s.slutat.length + ')</h2>';
    html += s.slutat.length ? '<ul>' + s.slutat.map(function (m) { return '<li>' + esc(K.visaNamn(medlemAv(m.medlem)) || m.namn) + ' <span class="faint">' + esc(K.KATEGORI_KORT[m.kategori] || '') + '</span></li>'; }).join('') + '</ul>' : '<p class="muted">Inga.</p>';
    var h = K.terminshistorik(r, store.ar);
    if (h.length) {
      html += '<h2>Utveckling</h2><div class="scroll"><table class="kortlista"><thead><tr><th>Termin</th>' + K.KATEGORIER.map(function (k) { return '<th class="num">' + esc(K.KATEGORI_KORT[k[0]]) + '</th>'; }).join('') + '<th class="num">Totalt</th><th class="num">Summa</th></tr></thead><tbody>' +
        h.slice().reverse().map(function (x) {
          return '<tr><td><strong>' + esc(x.termin) + '</strong></td>' + K.KATEGORIER.map(function (k) { return '<td class="num"' + (x[k[0]] ? ' data-etikett="' + esc(K.KATEGORI_KORT[k[0]]) + '">' + x[k[0]] : '>') + '</td>'; }).join('') +
            '<td class="num" data-etikett="Totalt">' + x.antal + '</td><td class="num" data-etikett="Summa">' + kr(x.summa) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    return html;
  }

  function vyMedlemKoppla(ar, okopplade) {
    var html = '<p class="muted">Inbetalningar via Swish och Fritidskortet i ' + esc(store.aktivt) + ' som redan är bokförda men inte kopplade till någon medlem. Kopplingen ändrar inte bokföringen, den används bara för statistiken.</p>';
    if (!okopplade.length) return html + '<p class="ok">Alla är kopplade.</p>';
    okopplade.forEach(function (rad) {
      var b = betalareForRad(rad);
      var f = avgiftsforslagForRad(rad);
      html += '<div class="card bankrad"><div class="row" style="justify-content:space-between"><div><strong>' + esc(rad.datum) + '</strong> ' + esc(b.visning) +
        ' <button class="tag knapp-tag" data-action="oppna-ver" data-nr="' + rad.verifikation + '">Ver ' + rad.verifikation + '</button></div><div class="belopp ok">' + kr(rad.belopp) + '</div></div>' +
        swishText(swishInfo(rad));
      if (avgiftUtkast[rad.id]) html += avgiftPanel(rad, 'koppla');
      else {
        html += '<div class="row" style="margin-top:8px">';
        if (f.stammer && !f.tvetydig) {
          var namn = [];
          f.poster.forEach(function (p) { var m = medlemAv(p.medlem); if (m && namn.indexOf(m.namn) < 0) namn.push(m.namn); });
          html += '<span><strong>' + esc(f.termin) + ':</strong> ' + esc(namn.join(', ')) + '</span><button class="btn btn-small" data-action="avg-koppla-forslag" data-id="' + esc(rad.id) + '">Koppla</button>';
        }
        html += '<button class="btn btn-secondary btn-small" data-action="avg-oppna" data-id="' + esc(rad.id) + '">' + (f.stammer && !f.tvetydig ? 'Ändra…' : 'Välj medlemmar…') + '</button>' +
          '<button class="btn btn-secondary btn-small" data-action="avg-ignorera" data-id="' + esc(rad.id) + '">Inte en avgift</button></div>';
      }
      html += '</div>';
    });
    return html;
  }

  function vyMedlemLista() {
    var r = reg();
    var betalareFor = function (id) { return r.betalare.filter(function (b) { return b.medlemmar.indexOf(id) >= 0; }).map(function (b) { return b.namn || b.visning; }); };
    var senast = {};
    K.giltigaBetalningar(r, store.ar).forEach(function (b) { b.poster.forEach(function (p) { if (!senast[p.medlem] || K.terminSortering(b.termin) > K.terminSortering(senast[p.medlem])) senast[p.medlem] = b.termin; }); });
    var html = '<div class="card"><h2 style="margin-top:0">Ny medlem</h2><div class="row"><input id="nyMedlemNamn" placeholder="Namn" style="flex:1 1 180px;width:auto"><input id="nyMedlemApelido" placeholder="Apelido" style="flex:0 1 140px;width:auto">' +
      '<select id="nyMedlemKategori" style="width:auto">' + K.KATEGORIER.map(function (k) { return '<option value="' + k[0] + '">' + esc(k[1]) + '</option>'; }).join('') + '</select>' +
      '<button class="btn btn-small" data-action="medlem-ny">Lägg till</button></div>' +
      '<p class="faint">Medlemsregistret sparas för sig, skilt från bokföringen. Läs mer under Personuppgifter.</p></div>';
    var avforas = K.attAvfora(r, idag(), store.ar);
    if (avforas.length) {
      html += '<div class="card"><h2 style="margin-top:0">Ska avföras enligt stadgarna (' + avforas.length + ')' + hjalp('avforande') + '</h2>' +
        '<p class="faint" style="margin-top:0">Har inte betalat årsavgift ' + esc(avforas[0].ar.join(' eller ')) + '. Enligt stadgarna anses en medlem som inte betalat medlemsavgift ' +
        (r.avforEfterAr === 2 ? 'två' : r.avforEfterAr) + ' verksamhetsår i följd ha begärt sitt utträde, och avförs från medlemsförteckningen. ' +
        'När en medlem avförs tas namnet och kopplingen till betalarens nummer bort. Ta fram kvitton först om någon behöver dem.</p>' +
        '<div class="scroll"><table class="kortlista"><tbody>' + avforas.map(function (a) {
          return '<tr><td><strong>' + esc(K.visaNamn(medlemAv(a.medlem)) || a.namn) + '</strong> <span class="faint">' + esc(K.KATEGORI_KORT[a.kategori] || '') + '</span></td>' +
            '<td data-etikett="Senast betalt">' + esc(a.senastBetalt || 'aldrig registrerad') + '</td>' +
            '<td><button class="btn btn-secondary btn-small" data-action="kvitto-ny" data-id="' + esc(a.medlem) + '">Kvitto</button> ' +
            '<button class="btn btn-small" data-action="medlem-avfor" data-id="' + esc(a.medlem) + '">Avför</button></td></tr>';
        }).join('') + '</tbody></table></div>' +
        (avforas.length > 1 ? '<div class="row" style="margin-top:8px"><button class="btn btn-secondary btn-small" data-action="avfor-alla">Avför alla ' + avforas.length + '</button></div>' : '') + '</div>';
    }
    var aktiva = sorteradeMedlemmar();
    var avforda = r.medlemmar.length - aktiva.length;
    html += '<h2>Medlemmar (' + aktiva.length + ')</h2>';
    if (!aktiva.length) return html + '<p class="muted">Inga medlemmar ännu.</p>' + (avforda ? '<p class="faint">' + antal(avforda, 'tidigare medlem är avförd', 'tidigare medlemmar är avförda') + ' och anonymiserad' + (avforda === 1 ? '' : 'e') + '.</p>' : '');
    html += '<div class="scroll"><table class="kortlista"><thead><tr><th>Namn</th><th>Kategori</th><th>Betalare</th><th>Senast betalt</th><th></th></tr></thead><tbody>' +
      sorteradeMedlemmar().map(function (m) {
        return '<tr><td data-etikett="Namn"><button class="lank-text" data-action="medlem-visa" data-id="' + esc(m.id) + '">' + esc(K.visaNamn(m)) + '</button>' + (m.info ? ' <span class="faint" title="Har information för kvitto">✉</span>' : '') + '</td>' +
          '<td data-etikett="Kategori"><select data-medl="kategori" data-id="' + esc(m.id) + '" aria-label="Kategori">' + K.KATEGORIER.map(function (k) { return '<option value="' + k[0] + '"' + (k[0] === m.kategori ? ' selected' : '') + '>' + esc(K.KATEGORI_KORT[k[0]]) + '</option>'; }).join('') + '</select></td>' +
          '<td data-etikett="Betalare">' + esc(betalareFor(m.id).join(', ')) + '</td><td data-etikett="Senast betalt">' + esc(senast[m.id] || '') + '</td>' +
          '<td style="white-space:nowrap"><button class="btn btn-secondary btn-small" data-action="kvitto-ny" data-id="' + esc(m.id) + '">Kvitto</button> ' +
          '<button class="btn btn-secondary btn-small" data-action="medlem-uttrade" data-id="' + esc(m.id) + '">Utträde</button> ' +
          '<button class="btn btn-secondary btn-small" data-action="medlem-ta-bort" data-id="' + esc(m.id) + '" aria-label="Ta bort ' + esc(m.namn) + '" title="Ta bort (felregistrerad)">×</button></td></tr>';
      }).join('') + '</tbody></table></div>';
    if (avforda) html += '<p class="faint">' + antal(avforda, 'tidigare medlem är avförd', 'tidigare medlemmar är avförda') + ' och anonymiserad' + (avforda === 1 ? '' : 'e') + '. Deras betalningar räknas fortfarande i statistiken, utan namn.</p>';
    return html;
  }

  function vyBetalare() {
    var r = reg();
    var html = '<p class="muted">Ett Swish-nummer eller en bankgiroreferens som appen känner igen. Samma medlem kan ha flera betalare, till exempel båda föräldrarna, och en betalare kan betala för flera. Ge gärna betalaren ett namn, till exempel "Fritidskortet".</p>';
    if (!r.betalare.length) return html + '<p class="muted">Inga betalare ännu. De läggs till när du kopplar en betalning till en medlem.</p>';
    r.betalare.slice().sort(function (a, b) { return (a.namn || a.visning).localeCompare(b.namn || b.visning, 'sv'); }).forEach(function (b) {
      var n = esc(b.nyckel);
      var kvar = sorteradeMedlemmar().filter(function (m) { return b.medlemmar.indexOf(m.id) < 0; });
      html += '<div class="card"><div class="row" style="justify-content:space-between"><strong>' + esc(b.visning) + '</strong>' +
        '<button class="btn btn-secondary btn-small" data-action="betalare-ta-bort" data-nyckel="' + n + '">Ta bort betalaren</button></div>' +
        '<label>Namn (frivilligt)</label><input data-betn="1" data-nyckel="' + n + '" value="' + esc(b.namn || '') + '" placeholder="t.ex. förälder till …">' +
        '<details' + (b.info ? ' open' : '') + '><summary class="faint">Information för kvitto</summary>' + infoFalt('data-betinfo="' + n + '"', b.info) + '</details>' +
        '<div class="row" style="margin-top:8px">Betalar för: ' + (b.medlemmar.length ? b.medlemmar.map(function (id) {
          var m = medlemAv(id);
          return '<span class="tag">' + esc(m ? m.namn : '?') + ' <button class="knapp-tag" style="border:0;padding:0 2px" data-action="betalare-slapp" data-nyckel="' + n + '" data-id="' + esc(id) + '" aria-label="Ta bort koppling">×</button></span>';
        }).join(' ') : '<span class="faint">ingen</span>') +
        (kvar.length ? '<select data-betl="1" data-nyckel="' + n + '" style="width:auto"><option value="">Lägg till…</option>' + kvar.map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(K.visaNamn(m)) + '</option>'; }).join('') + '</select>' : '') + '</div></div>';
    });
    return html;
  }

  function kontoNamnIAr(nr) {
    var namn = '';
    Object.keys(store.ar).forEach(function (id) { var k = store.ar[id].kontoplan.find(function (x) { return x.nr === nr; }); if (k && !namn) namn = k.namn; });
    return namn;
  }

  // Lägger in kontot i alla öppna år där det saknas, så att avgifterna kan bokföras där.
  function sakerstallKonto(nr, standardnamn) {
    var namn = kontoNamnIAr(nr) || standardnamn;
    Object.keys(store.ar).forEach(function (id) {
      var a = store.ar[id];
      if (a.lastTom === a.slut || a.kontoplan.some(function (k) { return k.nr === nr; })) return;
      store.ar[id] = K.laggTillKonto(a, nr, namn);
    });
  }

  function vyAvgifter(ar) {
    var r = reg();
    var forslag = K.foreslaAvgiftskonton(ar);
    var kontoFalt = function (typ, rubrik, standard) {
      var nr = r.konton[typ];
      return '<div><label>' + rubrik + '</label><input list="intaktskonton" inputmode="numeric" data-mkonto="' + typ + '" value="' + esc(nr) + '" placeholder="' + esc(forslag[typ]) + '">' +
        '<div class="faint">' + (nr ? esc(kontoNamnIAr(nr) || standard) : 'Förslag: ' + esc(forslag[typ]) + ' ' + esc(kontoNamnIAr(forslag[typ]) || standard)) + '</div></div>';
    };
    var html = '<div class="card"><h2 style="margin-top:0">Konton</h2><datalist id="intaktskonton">' + ar.kontoplan.filter(function (k) { return k.nr[0] === '3'; }).map(function (k) { return '<option value="' + k.nr + '">' + esc(k.namn) + '</option>'; }).join('') + '</datalist>' +
      '<div class="grid2">' + kontoFalt('medlemsavgift', 'Medlemsavgifter (årsavgiften)', 'Medlemsavgifter') + kontoFalt('terminsavgift', 'Terminsavgifter', 'Terminsavgifter') + '</div>' +
      (kontonSaknas() ? '<div class="row" style="margin-top:8px"><button class="btn btn-small" data-action="avgiftskonton-forslag">Använd förslagen</button></div>' : '') +
      '<p class="faint">Finns kontot inte i kontoplanen läggs det till i alla år som inte är låsta.</p></div>';
    html += '<div class="card"><h2 style="margin-top:0">Årsavgift' + hjalp('avgifter') + '</h2><p class="faint" style="margin-top:0">Tas ut första gången under kalenderåret som en medlem betalar terminsavgift.</p>' +
      '<label style="font-weight:normal;display:flex;gap:8px;align-items:flex-start;margin:0 0 10px"><input type="checkbox" data-mars="ingar" style="width:auto;margin-top:3px"' + (r.arsavgift.ingar ? ' checked' : '') + '>' +
      '<span>Årsavgiften ingår i terminsavgiften<br><span class="faint">Första betalningen under året delas upp: årsavgiften räknas av från terminsavgiften, t.ex. 1 300 = 500 i årsavgift + 800 i terminsavgift. ' +
      'Senare terminer samma år blir hela beloppet terminsavgift.</span></span></label><div class="grid2">' +
      '<div><label>Aktiv medlem</label><input class="num" inputmode="decimal" data-mars="vanlig" value="' + (r.arsavgift.vanlig ? kr(r.arsavgift.vanlig) : '') + '" placeholder="0,00"></div>' +
      '<div><label>Funktionär, tränare eller stödmedlem</label><input class="num" inputmode="decimal" data-mars="funktionar" value="' + (r.arsavgift.funktionar ? kr(r.arsavgift.funktionar) : '') + '" placeholder="0,00"></div></div></div>';
    var kats = K.KATEGORIER.filter(function (k) { return k[0] !== 'funktionar'; });
    html += '<div class="card"><h2 style="margin-top:0">Terminsavgifter</h2>';
    if (r.terminer.length) {
      html += '<div class="scroll"><table class="kortlista"><thead><tr><th>Termin</th>' + kats.map(function (k) { return '<th class="num">' + esc(k[1]) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>' +
        r.terminer.slice().reverse().map(function (t) {
          return '<tr><td><strong>' + esc(t.id) + '</strong></td>' + kats.map(function (k) {
            var v = t.avgifter[k[0]];
            return '<td class="num" data-etikett="' + esc(k[1]) + '"><input class="num" style="width:100px" inputmode="decimal" data-mtermin="' + esc(t.id) + '" data-kat="' + k[0] + '" value="' + (v != null ? kr(v) : '') + '" aria-label="' + esc(k[1]) + ' ' + esc(t.id) + '"></td>';
          }).join('') + '<td><button class="btn btn-secondary btn-small" data-action="termin-ta-bort" data-id="' + esc(t.id) + '" aria-label="Ta bort ' + esc(t.id) + '">×</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    } else html += '<p class="muted">Inga terminer ännu. Lägg till den första och fyll i avgifterna, eller läs in dem från en fil med föreningsuppgifter under År och arkiv.</p>';
    html += '<div class="row" style="margin-top:8px"><input id="nyTermin" placeholder="' + esc(nyTerminForslag(ar)) + '" value="' + esc(nyTerminForslag(ar)) + '" style="width:100px"><button class="btn btn-secondary btn-small" data-action="termin-ny">Lägg till termin</button></div>' +
      '<p class="faint">Saknas en termin används avgifterna från den senaste terminen före. Om familjer: appen föreslår årsavgift för alla, och du ändrar från fall till fall.</p></div>';
    html += '<div class="card"><h2 style="margin-top:0">Avförande</h2><label>Avför medlemmar som inte betalat årsavgift så här många verksamhetsår i följd</label>' +
      '<input class="num" inputmode="numeric" data-mavfor="1" value="' + r.avforEfterAr + '" style="width:80px"><p class="faint">Som i stadgarna. Appen listar dem under Medlemmar när ett nytt år börjar.</p></div>';
    html += '<div class="card"><h2 style="margin-top:0">Säkerhetskopia av medlemsregistret</h2><p class="faint" style="margin-top:0">Registret har en egen säkerhetskopia, skild från bokföringens. Spara den på ett ställe som bara du kommer åt.</p>' +
      '<div class="row"><button class="btn btn-secondary btn-small" data-action="exportera-register">Spara säkerhetskopia</button>' +
      '<button class="btn btn-secondary btn-small" data-action="importera-register">Läs in säkerhetskopia</button></div></div>';
    html += '<div class="card"><h2 style="margin-top:0">Rensa medlemsregistret</h2><p class="faint" style="margin-top:0">Tar bort alla medlemmar, betalare och kopplade betalningar. Bokföringen påverkas inte. Avgifter och konton finns kvar.</p>' +
      '<button class="btn btn-secondary btn-small" data-action="register-rensa">Rensa medlemsregistret</button></div>';
    return html;
  }

  function nyTerminForslag(ar) {
    var r = reg();
    if (!r.terminer.length) return aktuellTermin(ar);
    return K.nastaTermin(r.terminer[r.terminer.length - 1].id);
  }

  // Kopplar en redan bokförd inbetalning till medlemmar, utan att ändra bokföringen.
  // En betalare utan namn får avsändarens namn från Swish-rapporten.
  function namngeBetalare(r, b, rad) {
    var sw = b && b.typ === 'swish' ? K.swishForRad(r, rad) : null;
    var finns = sw && sw.namn ? K.hittaBetalare(r, b.nyckel) : null;
    return finns && !finns.namn ? K.andraBetalare(r, b.nyckel, { namn: K.visningsnamn(sw.namn) }) : r;
  }

  function kopplaBokford(radId, termin, poster, komIhag) {
    var rad = aktivt().bankrader.find(function (r) { return r.id === radId; });
    var b = betalareForRad(rad);
    var r = K.registreraBetalning(reg(), { datum: rad.datum, belopp: rad.belopp, termin: termin, nyckel: b ? b.nyckel : '', arId: store.aktivt, ver: rad.verifikation, bankradId: rad.id, poster: poster });
    if (komIhag && b && b.typ !== 'fritidskort') { r = K.kopplaBetalare(r, b, poster.map(function (p) { return p.medlem; })); r = namngeBetalare(r, b, rad); }
    sparaReg(r);
    visa('Betalningen ' + rad.datum + ' är kopplad.');
  }

  function medlPdfKnappar(termin) {
    var stampel = datastampel(reg(), JSON.stringify(Object.keys(store.ar).map(function (id) { return store.ar[id].verifikationer.length; })) + (store.forening.namn || '') + (logoUrl ? logoUrl.length : 0));
    var nyckel = function (typ, namn) {
      var n = typ + '-' + termin + '-' + stampel + '|' + K.sakertNamn(namn);
      forbered(n, function () { return skapaRapportPdf(aktivt(), typ, termin); });
      return n;
    };
    var utan = nyckel('medl', 'Terminsavgifter ' + termin + '.pdf');
    var med = nyckel('medln', 'Terminsavgifter ' + termin + ' med namn.pdf');
    return '<p class="faint" style="margin:10px 0 0">Sammanställning utan namn, för styrelsen och årsmötet:</p>' +
      '<div class="row ej-utskrift" style="margin:4px 0 6px">' + pdfKnappar(utan, 'kvitto-skriv-ut') + '</div>' +
      '<details><summary>Lista med namn (innehåller personuppgifter)</summary><p class="faint">Bara för kassören. Dela den inte vidare.</p>' +
      '<div class="row ej-utskrift" style="margin:4px 0">' + pdfKnappar(med, 'kvitto-skriv-ut') + '</div></details>';
  }

  // Kvitto på betalda avgifter till en medlem som begär det. Övriga uppgifter (t.ex. personnummer) sparas inte.
  function nyttKvitto(medlemId) {
    var m = medlemAv(medlemId);
    var rader = K.kvittorader(reg(), medlemId, store.ar);
    var ar = rader.length ? rader[rader.length - 1].datum.slice(0, 4) : idag().slice(0, 4);
    kvittoUtkast = {
      medlem: medlemId, ar: ar, mottagare: m.namn, info: m.info || '', ovrigt: '', val: 'medlem',
      adressId: store.adresser[0] ? store.adresser[0].id : '', kontaktId: store.kontakter[0] ? store.kontakter[0].id : '',
      valda: null, skapat: null
    };
    // Betalade någon annan, t.ex. en förälder, föreslås den som mottagare.
    var senaste = rader.length ? K.hittaBetalare(reg(), rader[rader.length - 1].nyckel) : null;
    if (senaste && senaste.namn && K.namnNyckel(senaste.namn) !== K.namnNyckel(m.namn)) valjKvittomottagare('b:' + senaste.nyckel);
  }

  // Radens text på kvittot: det du skrivit, annars ett kort förslag med medlemmens namn om mottagaren är någon annan.
  function kvittoRadtext(r) {
    var u = kvittoUtkast;
    var nyckel = r.betalning + r.typ;
    if (u.texter && u.texter[nyckel] != null) return u.texter[nyckel];
    var namn = (medlemAv(u.medlem) || {}).namn || '';
    return r.text + (namn && K.namnNyckel(u.mottagare) !== K.namnNyckel(namn) ? ' – ' + namn : '');
  }

  function kvittomottagare(medlemId) {
    var m = medlemAv(medlemId);
    var lista = [{ val: 'medlem', namn: m.namn, info: m.info || '', text: m.namn + ' (medlemmen)' }];
    reg().betalare.filter(function (b) { return b.medlemmar.indexOf(medlemId) >= 0; }).forEach(function (b) {
      lista.push({ val: 'b:' + b.nyckel, namn: b.namn || '', info: b.info || '', text: (b.namn || b.visning) + ' (betalare)' });
    });
    lista.push({ val: 'annan', namn: '', info: '', text: 'Någon annan' });
    return lista;
  }

  function valjKvittomottagare(val) {
    var u = kvittoUtkast;
    var x = kvittomottagare(u.medlem).find(function (y) { return y.val === val; });
    if (!x) return;
    u.val = val; u.mottagare = x.namn; u.info = x.info;
  }

  function kvittoValdaRader() {
    var u = kvittoUtkast;
    var rader = K.kvittorader(reg(), u.medlem, store.ar, u.ar === 'alla' ? null : u.ar);
    return rader.filter(function (r, i) { return !u.valda || u.valda[r.betalning + r.typ] !== false; });
  }

  function vyKvitto() {
    var u = kvittoUtkast;
    var m = medlemAv(u.medlem) || { namn: '?' };
    var alla = K.kvittorader(reg(), u.medlem, store.ar);
    var arLista = [];
    alla.forEach(function (r) { var a = r.datum.slice(0, 4); if (arLista.indexOf(a) < 0) arLista.push(a); });
    var html = '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Kvitto till ' + esc(K.visaNamn(m)) + '</h2>' +
      '<button class="btn btn-secondary btn-small" data-action="kvitto-stang">Stäng</button></div>';
    if (!alla.length) return html + '<p class="muted">Det finns inga registrerade betalningar för ' + esc(m.namn) + '.</p></div>';
    if (u.skapat) {
      var c = u.skapat;
      html += '<p>Kvitto <strong>' + esc(c.nr) + '</strong> till ' + esc(c.mottagare) + ', ' + kr(c.summa) + ' kr.</p>' +
        '<div class="row ej-utskrift">' + pdfKnappar(c.nyckel, 'kvitto-skriv-ut') + '</div>' +
        '<p class="faint">Kvittonumret sparas när du delar, laddar ner eller skriver ut kvittot. Övriga uppgifter sparas inte.</p>' +
        '<div class="row"><button class="btn btn-secondary btn-small" data-action="kvitto-andra">Ändra</button></div></div>';
      return html;
    }
    html += '<div class="grid2"><div><label>Gäller</label><select data-kvitto="ar">' + arLista.map(function (a) { return '<option value="' + a + '"' + (u.ar === a ? ' selected' : '') + '>' + a + '</option>'; }).join('') +
      '<option value="alla"' + (u.ar === 'alla' ? ' selected' : '') + '>Alla betalningar</option></select></div>' +
      '<div><label>Mottagare</label><select data-kvitto="val">' + kvittomottagare(u.medlem).map(function (x) { return '<option value="' + esc(x.val) + '"' + (x.val === u.val ? ' selected' : '') + '>' + esc(x.text) + '</option>'; }).join('') + '</select>' +
      '<input data-kvitto="mottagare" value="' + esc(u.mottagare) + '" placeholder="Namn på mottagaren" style="margin-top:6px"></div></div>' +
      '<label>Information för kvitto</label>' + infoFalt('data-kvitto="info"', u.info) +
      '<p class="faint" style="margin-top:2px">' + (u.val === 'annan' ? 'Skriv mottagarens uppgifter.' : 'Hämtas från ' + (u.val === 'medlem' ? 'medlemmen' : 'betalaren') + '. Ändringar här gäller bara det här kvittot.') + '</p>';
    var rader = K.kvittorader(reg(), u.medlem, store.ar, u.ar === 'alla' ? null : u.ar);
    html += '<p class="faint" style="margin:10px 0 0">Texten på varje rad kan du skriva om. Ändringen gäller bara det här kvittot.</p>' +
      '<div class="scroll"><table class="kortlista"><thead><tr><th></th><th>Datum</th><th>Text på kvittot</th><th>Betalsätt</th><th class="num">Belopp</th></tr></thead><tbody>' +
      rader.map(function (r) {
        var nyckel = r.betalning + r.typ;
        return '<tr><td><input type="checkbox" style="width:auto" data-kvitto="rad" data-rad="' + esc(nyckel) + '"' + (u.valda && u.valda[nyckel] === false ? '' : ' checked') + ' aria-label="Ta med"></td>' +
          '<td data-etikett="Datum">' + esc(r.datum) + '</td><td data-etikett="Text"><input data-kvitto="text" data-rad="' + esc(nyckel) + '" maxlength="80" value="' + esc(kvittoRadtext(r)) + '" aria-label="Text på kvittot">' +
          (r.helaBetalningen ? '<div class="faint">Del av en betalning på ' + kr(r.helaBetalningen) + ' kr</div>' : '') + '</td>' +
          '<td data-etikett="Betalsätt">' + esc(r.betalsatt) + '</td><td class="num" data-etikett="Belopp">' + kr(r.belopp) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    html += '<label>Övriga uppgifter på kvittot (sparas inte)</label>' + infoFalt('data-kvitto="ovrigt"', u.ovrigt, 'T.ex. personnummer eller vad avgiften gäller');
    html += '<div class="grid2"><div><label>Avsändaradress</label><select data-kvitto="adressId"><option value="">Ingen</option>' + store.adresser.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === u.adressId ? ' selected' : '') + '>' + esc(a.etikett || rader0(a.text)) + '</option>'; }).join('') + '</select></div>' +
      '<div><label>Vår referens</label><select data-kvitto="kontaktId"><option value="">Ingen</option>' + store.kontakter.map(function (k) { return '<option value="' + esc(k.id) + '"' + (k.id === u.kontaktId ? ' selected' : '') + '>' + esc(k.namn) + '</option>'; }).join('') + '</select></div></div>';
    html += '<div class="row" style="margin-top:12px"><button class="btn" data-action="kvitto-skapa">Skapa kvitto</button></div></div>';
    return html;
  }

  // Ett kvitto som delats, laddats ner eller skrivits ut får sitt nummer sparat i registret.
  function kvittoAnvant(nyckel) {
    if (!/^kvitto-/.test(nyckel) || !kvittoUtkast || !kvittoUtkast.skapat || kvittoUtkast.skapat.nyckel !== nyckel) return;
    sparaReg(K.registreraKvitto(reg(), { nr: kvittoUtkast.skapat.nr, datum: idag(), medlem: kvittoUtkast.medlem }));
  }

  function rader0(text) { return String(text || '').split(/\r?\n/)[0]; }

  function vyPersonuppgifter() {
    var r = reg();
    var f = store.forening.namn || 'Föreningen';
    var ar = r.avforEfterAr === 2 ? 'två' : String(r.avforEfterAr);
    return '<div class="card"><h2 style="margin-top:0">Personuppgifter i medlemsregistret</h2>' +
      '<p>' + esc(f) + ' är personuppgiftsansvarig. Så här hanteras uppgifterna om medlemmar i appen.</p>' +
      '<h3>Vilka uppgifter</h3><ul><li>Namn, apelido och medlemskategori (barn, student, vuxen, familj eller funktionär).</li>' +
      '<li>Vilka Swish-nummer eller bankgiroreferenser som har betalat för vilken medlem.</li>' +
      '<li>Information för kvitto som du skriver in på en medlem eller betalare, till exempel adress, e-post och telefon.</li>' +
      '<li>Betalda avgifter: datum, termin, belopp och meddelandet från betalningen.</li><li>Nummer och datum för kvitton som lämnats ut. Övriga uppgifter på kvittot, till exempel personnummer, sparas inte.</li></ul>' +
      '<h3>Varför</h3><p>För att administrera medlemskap och avgifter enligt stadgarna, kunna lämna kvitto på betalda avgifter och ta fram statistik.</p>' +
      '<h3>Var</h3><p>I en egen fil, ' + esc(REGFIL) + (od.regMapp ? ', i mappen <strong>' + esc(od.regMapp.namn) + '</strong>' : '') + ' i föreningens OneDrive, och i webbläsaren på de enheter där kassören använder appen. ' +
      'Registret är skilt från bokföringen. Den som får läsa bokföringen, till exempel revisorn, ser inga namn. Verifikationerna innehåller inga namn, bara antal medlemmar. ' +
      'Kontoutdragen i bokföringen innehåller betalarens Swish-nummer, eftersom de är underlag till bokföringen.</p>' +
      '<h3>Hur länge</h3><p>Den som anmäler utträde avförs direkt. Den som inte har betalat årsavgift ' + esc(ar) + ' verksamhetsår i följd avförs enligt stadgarna. ' +
      'När en medlem avförs tas namnet, informationen för kvitto, meddelandena och kopplingen till betalarens nummer bort. Betalningarna finns kvar utan namn, för statistiken. ' +
      'Bokföringen, med kontoutdragen, sparas i sju år enligt bokföringslagen.</p>' +
      '<h3>Vem ser uppgifterna</h3><p>Kassören. Statistiken till styrelse och årsmöte tas fram utan namn.</p>' +
      '<h3>Medlemmens rättigheter</h3><p>En medlem kan be att få veta vilka uppgifter som finns om hen, få fel rättade och begära utträde. Kontakta föreningen' +
