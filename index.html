    var rad = function (antalTxt, knapp) { return '<li><span class="bock" aria-hidden="true">!</span><div><div>' + antalTxt + '</div>' + (knapp ? '<div class="row" style="margin-top:6px">' + knapp + '</div>' : '') + '</div></li>'; };
    // Revisorn
    if (odAnslutet() && odNu.roller && K.harRoll(odNu.roller, mig(), 'revisor') && !K.kanFaSkrivratt(odNu.roller, mig())) {
      html += '<div class="card"><h3 style="margin-top:0">Revisor</h3><p>Du läser föreningens bokföring. Börja gärna med guiden, och gå sedan till rapporterna och verifikationerna.</p>' +
        '<div class="row"><button class="btn btn-small" data-action="hjalp" data-nyckel="revisorn">Guide för revisorn</button><button class="btn btn-secondary btn-small" data-vy="rapporter">Rapporter</button><button class="btn btn-secondary btn-small" data-vy="verifikationer">Verifikationer</button></div></div>';
    }
    // Att göra
    if (!lasLage()) {
      var gor = '';
      if (ar.grovkopia) gor += rad(esc(K.arNamn(ar)) + ' är en arkivkopia. Välj ett vanligt år överst för att bokföra.');
      else {
        var bank = K.oppnaBankrader(ar).length;
        if (bank) gor += rad(antal(bank, 'banktransaktion', 'banktransaktioner') + ' att bokföra.', '<button class="btn btn-small" data-vy="inlasning">Läs in</button>');
        var vantarUt = (ar.utlagg || []).map(function (x) { return K.utlaggStatus(ar, x.id); }).filter(function (st) { return !st.klar; });
        if (vantarUt.length) gor += rad(antal(vantarUt.length, 'utläggsredovisning väntar', 'utläggsredovisningar väntar') + ' på utbetalning (' + kr(vantarUt.reduce(function (s, st) { return s + st.kvar; }, 0)) + ' kr): ' + esc(vantarUt.map(function (st) { return st.utlagg.person; }).join(', ')) + '.', '<button class="btn btn-secondary btn-small" data-vy="inlasning">Läs in</button>');
        var u = K.oppnaUnderlag(ar).length;
        if (u) gor += rad(antal(u, 'underlag väntar', 'underlag väntar') + ' på betalning.', '<button class="btn btn-secondary btn-small" data-vy="inlasning">Visa</button>');
        var fel = [].concat.apply([], K.bankkontonIAr(ar).map(function (k) { return K.bankavstamningPerManad(ar, k).filter(function (m) { return m.skillnad; }); }));
        if (fel.length) gor += rad('Banken och bokföringen skiljer sig i ' + antal(fel.length, 'månad', 'månader') + '.', '<button class="btn btn-secondary btn-small" data-action="till-bankavstamning">Bankavstämning</button>');
        var utan = K.kontroller(ar).filter(function (k) { return k.typ === 'saknarUnderlag'; }).length;
        if (utan) gor += rad(antal(utan, 'verifikation saknar', 'verifikationer saknar') + ' underlag.', '<button class="btn btn-secondary btn-small" data-vy="verifikationer">Verifikationer</button>');
        if (ar.slut < idag() && ar.lastTom !== ar.slut) gor += rad('Räkenskapsåret ' + esc(K.arNamn(ar)) + ' är slut men inte låst. Dags för bokslut.', '<button class="btn btn-secondary btn-small" data-vy="bokslut">Bokslut</button>');
        if (K.registerHarData(reg())) {
          var kop = K.okoppladeInbetalningar(reg(), ar, store.aktivt).length;
          if (kop) gor += rad(antal(kop, 'inbetalning', 'inbetalningar') + ' att koppla till medlemmar.', '<button class="btn btn-secondary btn-small" data-action="medl-vy" data-mvy="koppla">Att koppla</button>');
          var avf = K.attAvfora(reg(), idag(), store.ar).length;
          if (avf) gor += rad(antal(avf, 'medlem ska', 'medlemmar ska') + ' avföras enligt stadgarna.', '<button class="btn btn-secondary btn-small" data-action="medl-vy" data-mvy="lista">Medlemmar</button>');
        }
      }
      html += '<div class="card"><h3 style="margin-top:0">Att göra</h3>' + (gor ? '<ul class="checklista varningar">' + gor + '</ul>' : '<p class="ok" style="margin:0">Inget att göra just nu.</p>') + '</div>';
    }
    // Styrelsen
    if (styrBeh('styr')) {
      var sp = styrPaminnelser(rad);
      html += '<div class="card"><h3 style="margin-top:0">Styrelsen</h3>' + (sp ? '<ul class="checklista varningar">' + sp + '</ul>' : '<p class="ok" style="margin:0">Inget som väntar på dig.</p>') +
        '<div class="row" style="margin-top:8px"><button class="btn btn-secondary btn-small" data-vy="st-moten">Styrelsen</button></div></div>';
    }
    // Medlemmar
    var regSynligt = !lasLage() || (odNu.regLas && K.registerHarData(reg()));
    if (regSynligt && K.registerHarData(reg())) {
      var termin = K.terminForDatum(idag() >= ar.start && idag() <= ar.slut ? idag() : ar.slut);
      var st = K.terminsstatistik(reg(), termin, store.ar);
      html += '<div class="card"><h3 style="margin-top:0">Medlemmar ' + esc(termin) + '</h3><p style="margin:0"><strong>' + st.totalt.antal + '</strong> har betalat' +
        (st.totalt.antal ? ' (' + K.KATEGORIER.filter(function (k) { return st.perKategori[k[0]].antal; }).map(function (k) { return st.perKategori[k[0]].antal + ' ' + K.KATEGORI_KORT[k[0]].toLowerCase(); }).join(', ') + ')' : '') + '.' +
        (st.slutat.length ? ' ' + antal(st.slutat.length, 'betalade', 'betalade') + ' förra terminen men inte nu.' : '') + '</p>' +
        '<div class="row" style="margin-top:8px"><button class="btn btn-secondary btn-small" data-action="medl-vy" data-mvy="statistik">Statistik</button></div></div>';
    }
    // På gång
    var frister = nastaFrister();
    html += '<div class="card"><h3 style="margin-top:0">På gång</h3>' + (frister.length
      ? '<ul style="margin:0">' + frister.map(function (f) { return '<li><strong>' + esc(f.datum) + '</strong> ' + esc(f.text) + '</li>'; }).join('') + '</ul>'
      : '<p class="faint" style="margin:0">Inga frister inlagda. Ange datum för årsmötet under Styrelsen, Årsmötet, så visas fristerna här.</p>') +
      '<div class="row" style="margin-top:8px"><button class="btn btn-secondary btn-small" data-vy="arsmote">Årsmötet</button></div></div>';
    return html;
  }

  // ---------- Styrelsen ----------

  var STYRFLIKAR = [['moten', 'Möten och protokoll'], ['beslut', 'Beslut'], ['uppgifter', 'Uppgifter'], ['uppdrag', 'Förtroendeuppdrag'], ['arenden', 'Ärenden till årsmötet']];
  var UPPDRAGSROLLER = ['Ordförande', 'Vice ordförande', 'Kassör', 'Sekreterare', 'Ledamot', 'Suppleant', 'Revisor', 'Revisorssuppleant', 'Valberedning'];
  var ARENDETYPER = [['stadgar', 'Stadgeändring'], ['forslag', 'Styrelsens förslag'], ['motion', 'Motion']];
  var ARENDESTATUS = [['forslag', 'Förslag'], ['arsmote', 'Till årsmötet'], ['antaget', 'Antaget'], ['avslaget', 'Avslaget']];

  function motesNamn(m) { return (K.MOTESTYPER.find(function (t) { return t[0] === m.typ; }) || ['', 'Möte'])[1]; }
  function styrPersoner() {
    var f = odNu.roller;
    return f ? f.personer.map(function (p) { return { epost: p.epost, namn: K.visaPerson(f, p.epost), roller: p.roller }; }) : [];
  }
  function personMedRoll(r) { return styrPersoner().find(function (p) { return p.roller.indexOf(r) >= 0; }) || null; }
  // Kan personen skriva under elektroniskt? Hen måste kunna logga in och ändra styrelsens material.
  function kanLoggaIn(epost) {
    if (!odAnslutet()) return OVNING;
    return styrPersoner().some(function (p) { return p.epost === epost && K.behorighet(p.roller).styr === 'write'; });
  }
  function oppetMoteObj() { return styrData().moten.find(function (x) { return x.id === oppetMote; }) || null; }
  function arSekreterare() { return !odAnslutet() || (odNu.roller && K.harRoll(odNu.roller, mig(), 'sekreterare')); }

  async function sha256Bytes(buf) {
    var b = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
  }

  // Årsrapporten för underskrift. Kontrollsummor för bokföringen räknas i bakgrunden och sparas här per rapport.
  var arsrapportSummor = {}, arsrapportLokalaFiler = {};

  async function arsrapportSkicka() {
    var ar = aktivt(), arN = K.arNamn(ar);
    var valda = Array.from(document.querySelectorAll('[data-arsund]')).filter(function (x) { return x.checked; }).map(function (x) { return x.dataset.arsund; });
    if (!valda.length) throw new Error('Välj vilka som ska skriva under.');
    var personer = arsrapportPersoner();
    var undertecknare = valda.map(function (e) {
      var p = personer.find(function (x) { return x.epost === e; }) || { epost: e, namn: e, roller: [] };
      return { epost: e, namn: p.namn, roll: (p.roller || []).map(rollnamn).join(', ') };
    });
    visa('Skapar årsrapporten och sparar den…');
    var blob = await skapaArsrapportPdf(ar, { huvudbok: arsrapportHuvudbok, underskrifter: false });
    var kontrollsumma = await sha256Bytes(await blob.arrayBuffer());
    var bokforingSumma = await sha256(K.arsrapportKontrolltext(ar));
    var filnamn = K.motesfilnamn(idag(), 'Årsrapport ' + arN), mapp = K.motesmapp('arsmote', (Number(ar.slut.slice(0, 4)) + 1) + '-01-01'), fil;
    var id = 'ars' + Date.now().toString(36);
    if (odAnslutet()) {
      var post = await sparaIMotesmapp(mapp, filnamn, blob, false);
      fil = { namn: post.name, odId: post.id, driveId: (post.parentReference || {}).driveId || od.styrMapp.driveId, webUrl: post.webUrl || null };
    } else { arsrapportLokalaFiler[id] = blob; fil = { namn: filnamn, lokal: true }; }
    await styrOperation(function (d) {
      return K.skickaArsrapport(d, { id: id, arId: store.aktivt, titel: 'Årsrapport ' + arN, fil: fil, kontrollsumma: kontrollsumma, bokforingSumma: bokforingSumma,
        undertecknare: undertecknare, av: od.konto || '', tid: new Date().toISOString() });
    });
    arsrapportSummor[id] = bokforingSumma;
    visa('Årsrapporten är sparad som ' + fil.namn + (odAnslutet() ? ' i ' + mapp : '') + ' och skickad för underskrift till ' + undertecknare.length + ' personer. De skriver under under Styrelsen, Möten.');
  }

  async function arsrapportFil(r) {
    if (r.fil && r.fil.odId) {
      var res = await graf('/drives/' + r.fil.driveId + '/items/' + r.fil.odId + '/content', { ra: true });
      return new Blob([await res.arrayBuffer()], { type: 'application/pdf' });
    }
    if (arsrapportLokalaFiler[r.id]) return arsrapportLokalaFiler[r.id];
    throw new Error('Filen finns inte på den här enheten.');
  }

  async function arsrapportOppna(id) {
    var r = (styrData().rapporter || []).find(function (x) { return x.id === id; });
    if (r.fil && r.fil.webUrl) { window.open(r.fil.webUrl, '_blank'); return; }
    var blob = await arsrapportFil(r);
    if (!window.open(URL.createObjectURL(blob), '_blank')) laddaNer(r.fil.namn, blob, 'application/pdf');
  }

  // Den som skriver under hämtar filen och räknar kontrollsumman själv, så att underskriften gäller just den fil som skickades.
  async function arsrapportSignera(id, epostOvning) {
    if (!OVNING && !(document.getElementById('arsGodkann-' + id) || {}).checked) throw new Error('Kryssa i att du har läst årsrapporten och godkänner den.');
    var r = (styrData().rapporter || []).find(function (x) { return x.id === id; });
    var vem = OVNING ? epostOvning : mig();
    var u = r.undertecknare.find(function (x) { return x.epost === vem; }) || {};
    var summa = await sha256Bytes(await (await arsrapportFil(r)).arrayBuffer());
    await styrOperation(function (d) { return K.signeraArsrapport(d, id, vem, u.namn || vem, summa, new Date().toISOString()); });
    var st = K.arsrapportUnderskrifter((styrData().rapporter || []).find(function (x) { return x.id === id; }));
    visa('Du har skrivit under årsrapporten.' + (st.klar ? ' Alla har nu skrivit under.' : ''));
  }

  // Den undertecknade versionen: årsrapporten med en sista sida om underskrifterna, sparad bredvid originalet.
  async function arsrapportUndertecknad(id) {
    var r = (styrData().rapporter || []).find(function (x) { return x.id === id; });
    var ar = store.ar[r.arId];
    if (!ar) throw new Error('Räkenskapsåret finns inte i den här bokföringen.');
    if (await sha256(K.arsrapportKontrolltext(ar)) !== r.bokforingSumma) throw new Error('Bokföringen har ändrats sedan rapporten skickades. Skicka en ny version för underskrift.');
    var blob = await skapaArsrapportPdf(ar, { huvudbok: arsrapportHuvudbok, underskrifter: false, elektroniska: r });
    var namn = String((r.fil && r.fil.namn) || 'Årsrapport.pdf').replace(/\.pdf$/i, '') + ' undertecknad.pdf';
    if (odAnslutet()) {
      await sparaIMotesmapp(K.motesmapp('arsmote', (Number(ar.slut.slice(0, 4)) + 1) + '-01-01'), namn, blob, true);
      visa('Den undertecknade versionen är sparad som ' + namn + ' bredvid originalet.');
    } else laddaNer(namn, blob, 'application/pdf');
  }

  async function sha256(text) {
    var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
  }

  function statusTag(m) {
    if (m.status === 'utkast') return '<span class="tag">Utkast</span>';
    var u = m.underskrift;
    if (m.status === 'signerat') return '<span class="tag ok">' + (u.metod === 'papper' ? 'Undertecknat på papper' : 'Undertecknat elektroniskt') + '</span>';
    return '<span class="tag varning">' + (u.metod === 'papper' ? 'Väntar på det inskannade originalet' : 'Väntar på underskrift, ' + u.signaturer.length + ' av ' + u.undertecknare.length) + '</span>';
  }

  // Styrelsens flikar (st-moten, st-beslut …) ligger i undermenyn under Styrelsen.
  function vyStyrelsen(ar) {
    var bs = styrBeh('styr');
    styrVy = vy.slice(3);
    var html = '<h2>' + esc(STYRFLIKAR.find(function (f) { return f[0] === styrVy; })[1]) + hjalp(styrVy === 'uppdrag' ? 'uppdrag' : 'styrelsen') + '</h2>';
    if (bs === 'read') html += '<p class="faint">Du kan läsa styrelsens material men inte ändra det.</p>';
    else if (!bs) html += '<p class="faint">Du ser förtroendeuppdragen. Resten av styrelsens material är inte delat med dig.</p>';
    if (odNu.styrFel) html += '<p class="fel">' + esc(odNu.styrFel) + '</p>';
    html += '<div class="arsmote-form">' + { moten: vyMoten, beslut: vyBeslut, uppgifter: vyUppgifter, uppdrag: vyUppdrag, arenden: vyArenden }[styrVy](ar) + '</div>';
    if (odAnslutet() && od.styrMapp) html += '<p class="faint" style="font-size:.85em;margin-top:14px">Sparas i mappen ' + esc(od.styrMapp.namn) + ' i OneDrive. Alla i styrelsen kan ändra samtidigt; ändrar två personer samma sak visas det.</p>';
    return html;
  }

  // Årsrapporter som väntar på den inloggades underskrift (i övningsläget alla som väntar).
  function arsrapporterAttSkrivaUnder() {
    var jag = mig();
    return (styrData().rapporter || []).filter(function (r) { return !r.ersatt; }).map(function (r) {
      var st = K.arsrapportUnderskrifter(r);
      var mina = r.undertecknare.filter(function (u) { return (OVNING || u.epost === jag) && !st.signerade.some(function (x) { return x.epost === u.epost; }); });
      if (!mina.length) return '';
      return '<div class="card"><h3 style="margin-top:0">' + esc(r.titel) + ' att skriva under</h3>' +
        '<p style="margin-top:0">Skickad ' + esc(String(r.tid || '').slice(0, 10)) + '. ' + st.signerade.length + ' av ' + r.undertecknare.length + ' har skrivit under. Läs rapporten innan du skriver under.</p>' +
        '<div class="row"><button class="btn btn-secondary btn-small" data-action="arsrapport-oppna" data-id="' + esc(r.id) + '">Öppna årsrapporten</button></div>' +
        (OVNING ? '' : '<label style="font-weight:normal;display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="arsGodkann-' + esc(r.id) + '" style="width:auto"> Jag har läst årsrapporten och godkänner den</label>') +
        '<div class="row">' + mina.map(function (u) {
          return '<button class="btn btn-small" data-action="arsrapport-signera" data-id="' + esc(r.id) + '" data-epost="' + esc(u.epost) + '">Skriv under' + (OVNING ? ' som ' + esc(u.namn || u.epost) : '') + '</button>';
        }).join('') + '</div></div>';
    }).join('');
  }

  function vyMoten(ar) {
    var s = styrData(), skriv = styrBeh('styr') === 'write';
    var m0 = oppetMoteObj();
    if (m0) return vyMote(ar, m0);
    oppetMote = null;
    var html = arsrapporterAttSkrivaUnder();
    if (skriv) {
      var am = arsmoteData(ar);
      html += '<div class="card"><h3 style="margin-top:0">Nytt protokoll</h3><div class="row">' +
        '<select id="nyMotesTyp" style="width:auto" aria-label="Typ av möte">' + K.MOTESTYPER.map(function (t) { return '<option value="' + t[0] + '">' + esc(t[1]) + '</option>'; }).join('') + '</select>' +
        '<input id="nyMotesDatum" type="date" value="' + esc(idag()) + '" style="width:auto" aria-label="Datum">' +
        '<input id="nyMotesTid" type="time" style="width:auto" aria-label="Tid">' +
        '<input id="nyMotesPlats" placeholder="Plats" style="max-width:220px" aria-label="Plats">' +
        '<button class="btn btn-small" data-action="styr-nytt-mote">Skapa protokoll</button></div>' +
        '<p class="faint" style="margin-bottom:0">Protokollet får en mall med paragrafer som du ändrar fritt. Årsmötets protokoll följer föredragningslistan under Årsmötet' + (am.motesdatum ? ' (mötet ' + esc(am.motesdatum) + ')' : '') + '. ' +
        'Styrelsens sekreterare föreslås som protokollförare, men mötets funktionärer kan ändras för varje möte.</p></div>';
    }
    var lista = s.moten.slice().sort(function (a, b) { return a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : 0; });
    html += lista.length ? '<div class="scroll"><table class="kortlista"><thead><tr><th>Datum</th><th>Möte</th><th>Status</th><th></th></tr></thead><tbody>' + lista.map(function (m) {
      return '<tr><td>' + esc(m.datum) + '</td><td data-etikett="Möte">' + esc(motesNamn(m)) + '</td><td data-etikett="Status">' + statusTag(m) + '</td>' +
        '<td><button class="btn btn-secondary btn-small" data-action="styr-oppna" data-id="' + esc(m.id) + '">Öppna</button></td></tr>';
    }).join('') + '</tbody></table></div>' : '<p class="faint">Inga protokoll i appen ännu.</p>';
    return html + vyMotesHistorik();
  }

  var MAPPTYPER = { arsmote: 'Årsmöte', extra: 'Extra årsmöte', styrelse: 'Styrelsemöten', konstituerande: 'Konstituerande styrelsemöte', ar: 'Årsmapp' };
  // Delarna som hämtas från OneDrive ritas om för sig, så att det man skriver i formulären inte försvinner.
  function ritaOmDel(id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; }
  function vyMotesHistorik() { return '<div id="motesHistorik">' + motesHistorikInre() + '</div>'; }
  function motesHistorikInre() {
    if (!odAnslutet()) return '';
    if (!od.styrRot) return od.lage === 'agare' ? '<p class="faint" style="margin-top:14px">Samla appens mappar under Inställningar, År och arkiv, OneDrive, så sparas protokoll och handlingar i ' + esc(STYRARBETE + '/' + MOTEN) + ' och tidigare möten visas här.</p>' : '';
    var h = odNu.motesHistorik;
    var rubrik = '<h3 style="margin-top:18px">Mappar i ' + esc(STYRARBETE + '/' + MOTEN) + '</h3>';
    if (!h) {
      var rita = function () { ritaOmDel('motesHistorik', motesHistorikInre()); };
      hamtaMotesHistorik().then(rita, function (err) { odNu.motesHistorik = { status: 'fel', fel: err.message, mappar: [] }; rita(); });
      return rubrik + '<p class="faint">Hämtar mapparna…</p>';
    }
    if (h.status === 'hamtar') return rubrik + '<p class="faint">Hämtar mapparna…</p>';
    if (h.status === 'fel') return rubrik + '<p class="fel">' + esc(h.fel) + '</p><button class="btn btn-secondary btn-small" data-action="styr-historik-hamta">Försök igen</button>';
    var ordning = { arsmote: 0, extra: 1, konstituerande: 2, styrelse: 3, ar: 4 };
    var kanda = h.mappar.filter(function (m) { return m.tolkat; }).sort(function (a, b) { return b.tolkat.ar - a.tolkat.ar || ordning[a.tolkat.typ] - ordning[b.tolkat.typ]; });
    var ovriga = h.mappar.filter(function (m) { return !m.tolkat; });
    var mapp = function (m) {
      return '<details style="margin:4px 0"><summary><strong>' + esc(m.namn) + '</strong> <span class="faint">' + (m.tolkat ? esc(MAPPTYPER[m.tolkat.typ]) + ' · ' : '') + antal(m.filer.length, 'fil', 'filer') + '</span></summary>' +
        '<ul style="margin:4px 0">' + m.filer.map(function (f) { return '<li>' + (f.webUrl ? '<a href="' + esc(f.webUrl) + '" target="_blank" rel="noopener">' + esc(f.namn) + '</a>' : esc(f.namn)) + (f.mapp ? ' <span class="faint">(mapp)</span>' : '') + '</li>'; }).join('') + '</ul>' +
        (m.webUrl ? '<a href="' + esc(m.webUrl) + '" target="_blank" rel="noopener" class="faint">Öppna mappen i OneDrive</a>' : '') + '</details>';
    };
    return rubrik + '<p class="faint" style="margin-top:0">Tidigare möten och handlingar, direkt från mapparna. Inget kopieras; filerna öppnas i OneDrive.</p>' +
      (kanda.length ? kanda.map(mapp).join('') : '<p class="faint">Inga mötesmappar ännu.</p>') +

  // Årsmötets handlingar i ÅM-mappen, med uppladdning.

    if (!c) {
      var rita = function () { ritaOmDel('amHandlingar', arsmotesHandlingarInre(aktivt())); };
      hamtaAmHandlingar(mapp, a.motesdatum).then(rita, function (err) { odNu.amHandlingar[mapp] = { status: 'fel', fel: err.message }; rita(); });
      return html + '<p class="faint">Hämtar…</p></div>';
    }
    if (c.status === 'hamtar') return html + '<p class="faint">Hämtar…</p></div>';
    if (c.status === 'fel') return html + '<p class="fel">' + esc(c.fel) + '</p></div>';
    html += '<ul class="checklista" style="margin:0">' + c.handlingar.map(function (h) {
      return '<li><span class="bock" aria-hidden="true">' + (h.filer.length ? '✓' : '–') + '</span><div><div><strong>' + esc(h.namn) + '</strong> ' +
        (h.filer.length ? '<span class="faint">' + esc(h.filer.join(', ')) + '</span>' : '<span class="faint">saknas</span>') + '</div>' +
        (skriv ? '<div class="row" style="margin-top:4px"><button class="btn btn-secondary btn-small" data-action="styr-am-handling" data-nyckel="' + h.nyckel + '" data-mapp="' + esc(mapp) + '" data-datum="' + esc(a.motesdatum) + '">' + (h.filer.length ? 'Ladda upp en till' : 'Ladda upp') + '</button></div>' : '') + '</div></li>';
    }).join('') + '</ul>' +
      '<p class="faint">Appen känner igen handlingarna på filnamnet. Uppgifterna i checklistan under Styrelsen bockas av när handlingen finns i mappen.</p>' +

  }

  function personLista() {

    html += '<div class="card"><h3 style="margin-top:0">Paragrafer</h3>' + m.paragrafer.map(function (p, i) {

    }).join('') + (redigera ? '<button class="btn btn-secondary btn-small" data-action="styr-par-ny">Lägg till paragraf</button>' : '') + '</div>';
    // Beslut
    var verOpt = function (val) {

      if (val && !lista.some(function (x) { return x[0] === val; })) lista.unshift([val, 'Ver ' + val.split(':').pop() + ' (' + val.split(':')[0] + ')']);

        '<div class="row"><input data-bf="belopp" data-si="' + i + '" value="' + (b.belopp ? esc(kr(b.belopp)) : '') + '" placeholder="Belopp, kr (frivilligt)" style="max-width:180px" inputmode="decimal" aria-label="Belopp"' + dis + '>' +

    }).join('') + (redigera ? '<button class="btn btn-secondary btn-small" data-action="styr-bes-ny">Lägg till beslut</button>' : '') + '</div>';
    html += vyUnderskrift(m, skriv);
    return html;
  }

  function vyUnderskrift(m, skriv) {
    var html = '<div class="card"><h3 style="margin-top:0">Underskrift' + hjalp('underskrift') + '</h3>';
    var pdf = '<button class="btn btn-secondary btn-small" data-action="styr-pdf">Ladda ner PDF</button><button class="btn btn-secondary btn-small" data-action="styr-pdf-skriv-ut">Skriv ut</button>' +

        '<label style="display:flex;gap:8px;align-items:flex-start;font-weight:normal"><input type="radio" name="styrMetod" value="papper" style="width:auto"' + (fo.metod === 'papper' ? ' checked' : '') + '>' +

          fo.saknas.map(function (u) { return '<li>' + esc(u.roll) + ': ' + esc(u.namn || u.epost) + ' <span class="tag varning">kan bara skriva under på papper</span></li>'; }).join('') + '</ul>';
        if (fo.saknas.length) html += '<p class="faint">Den som inte har ett konto i appen med styrelsens behörighet kan inte skriva under elektroniskt, till exempel en mötesordförande utifrån. Välj papper, eller lägg till personen under Inställningar, Roller.</p>';
      } else html += '<p class="faint">Fyll i mötets funktionärer ovan, så föreslår appen vilka som ska skriva under.</p>';
      if (!odAnslutet() && !OVNING) html += '<p class="faint">Elektronisk underskrift kräver att appen är kopplad till föreningens OneDrive.</p>';
      html += '<div class="row"><button class="btn btn-small" data-action="styr-las">Lås för underskrift</button>' + pdf +
        '<button class="btn btn-secondary btn-small" data-action="styr-ta-bort">Ta bort protokollet</button></div></div>';
      return html;
    }
    var u = m.underskrift;
    if (u.metod === 'e') {
      html += '<p style="margin-top:0">Skrivs under elektroniskt. Låst ' + esc(klockslag(u.last)) + '.</p><ul>' + u.undertecknare.map(function (x) {
        var sig = u.signaturer.find(function (y) { return y.epost === x.epost; });
        return '<li>' + esc(x.roll) + ': ' + esc(x.namn || x.epost) + ' – ' + (sig ? '<span class="ok">underskrivet ' + esc(klockslag(sig.tid)) + '</span>' : '<span class="faint">väntar</span>') + '</li>';
      }).join('') + '</ul>';
      var vantar = u.undertecknare.filter(function (x) { return !u.signaturer.some(function (y) { return y.epost === x.epost; }); });
      if (skriv && OVNING) {
        html += vantar.map(function (x) { return '<button class="btn btn-small" data-action="styr-signera" data-epost="' + esc(x.epost) + '">Skriv under som ' + esc(x.namn || x.epost) + ' (övning)</button> '; }).join('');
      } else if (skriv && vantar.some(function (x) { return x.epost === mig(); })) {
        html += '<label style="display:flex;gap:8px;align-items:flex-start;font-weight:normal"><input type="checkbox" id="styrGodkann" style="width:auto"><span>Jag har läst protokollet och godkänner det.</span></label>' +
          '<div class="row"><button class="btn btn-small" data-action="styr-signera">Skriv under</button></div>';
      }
    } else {
      html += '<p style="margin-top:0">Skrivs under på papper. Låst ' + esc(klockslag(u.last)) + '.</p>';

    return html;

    }).join('') + '</tbody></table></div>';

  function vyUppgifter(ar) {

  // Årsmötenas datum som de står under Styrelsen, Årsmöte (per år då mötet hålls).
  function arsmotesdatum() {
    var ut = {};

  var uppdragAndras = null;
  // Val av mandat: årsmötet nästa år och åren efter, eller ett datum.

      '<input id="' + idPrefix + 'Datum" type="date" style="width:auto" value="' + esc(u && u.till ? u.till : '') + '" aria-label="Datum">';

  function uppdragTabell(skriv) {
    var upp = uppData(), nu0 = idag(), snart = K.laggTillManader(nu0, 3), am = arsmotesdatum();

  function styrInput(t) {

      if (t.dataset.mf) m[t.dataset.mf] = t.value;

      if (t.dataset.bf) {
        var b = m.beslut[i];
        if (t.dataset.bf === 'belopp') { try { b.belopp = t.value.trim() ? Math.abs(K.parseBelopp(t.value)) : 0; } catch (e) { /* ofullständigt belopp: behåll det förra */ } }
        else if (t.dataset.bf === 'verifikation') b.verifikation = t.value || null;
        else b.text = t.value;
      }
      if (t.dataset.ff) {
        m.funktionarer = K.normFunktionarer(m.funktionarer, true);
        var x = t.dataset.funk === 'justerare' ? m.funktionarer.justerare[i] : m.funktionarer[t.dataset.funk];
        x[t.dataset.ff] = t.value;
        // Väljs en person ur listan fylls namnet i.

          if (p) {

  // Protokollet som PDF. Elektroniskt underskrivet: en sida med underskrifterna och kontrollsumman. Annars: rader för underskrift.
  async function skapaProtokollPdf(m) {
    var doc = nyPdf(await laddaJsPdf());
    var summa = await sha256(K.protokolltext(m));
    var V = 20, H = 190, NED = 275, f = store.forening, fu = K.normFunktionarer(m.funktionarer);
    var y = 12 + (function () { var h = ritaLogo(doc, V, 12, 18, 16); return h ? h + 6 : 4; })();
    var skriv = function (t, stil, storlek, farg) {
      storlek = storlek || 10;
      doc.setFont('helvetica', stil || 'normal'); doc.setFontSize(storlek);
      if (farg) doc.setTextColor.apply(doc, farg);
      String(t == null ? '' : t).split('\n').forEach(function (stycke) {
        doc.splitTextToSize(pt(stycke), H - V).forEach(function (r) { if (y > NED) { doc.addPage(); y = 20; } doc.text(r, V, y); y += storlek * 0.45; });
      });
      doc.setTextColor(26, 26, 26);
    };
    skriv(f.namn || '', 'bold', 11);
    if (f.orgnr) skriv('Org.nr ' + f.orgnr, 'normal', 8.5, GRA);
    y += 5;
    if (m.status === 'utkast') { skriv('UTKAST', 'bold', 10, [170, 40, 40]); y += 3; }
    y += 3;
    skriv('Protokoll, ' + motesNamn(m).toLowerCase(), 'bold', 16, SKIFFER);
    y += 2;
    skriv('Datum: ' + m.datum + (m.tid ? ' kl. ' + m.tid : ''));
    if (m.plats) skriv('Plats: ' + m.plats);
    if (m.narvarande) skriv('Närvarande: ' + m.narvarande);
    if (fu.ordforande.namn) skriv('Mötesordförande: ' + fu.ordforande.namn);
    if (fu.sekreterare.namn) skriv('Mötessekreterare: ' + fu.sekreterare.namn);
    var just = fu.justerare.filter(function (j) { return j.namn; });
    if (just.length) skriv('Justerare: ' + just.map(function (j) { return j.namn; }).join(', '));
    y += 4;
    m.paragrafer.forEach(function (p, i) {
      if (y > NED - 12) { doc.addPage(); y = 20; }
      skriv('§ ' + (i + 1) + ' ' + p.rubrik, 'bold', 11);
      if (p.text) skriv(p.text);
      y += 3;
    });
    if (m.beslut.length) {
      skriv('Beslut', 'bold', 11);
      m.beslut.forEach(function (b, i) { skriv((i + 1) + '. ' + b.text + (b.belopp ? ' (' + kr(b.belopp) + ' kr)' : '') + (b.verifikation ? ', verifikation ' + b.verifikation.split(':').pop() : '')); });
      y += 3;
    }
    var u = m.underskrift;
    if (u && u.metod === 'e') {
      doc.addPage(); y = 22;
      skriv('Elektroniska underskrifter', 'bold', 14, SKIFFER);
      y += 2;
      u.undertecknare.forEach(function (x) {
        var sig = u.signaturer.find(function (z) { return z.epost === x.epost; });
        skriv(x.roll + ': ' + (x.namn || x.epost), 'bold', 10);
        skriv(sig ? 'Underskrivet ' + new Date(sig.tid).toLocaleString('sv-SE') + ' av ' + sig.epost + ' (inloggad med Microsoft-konto)' : 'Inte underskrivet ännu', 'normal', 9.5, sig ? null : GRA);
        y += 2;
      });
      y += 4;
      skriv('Kontrollsumma (SHA-256) för protokollets text när det låstes:', 'normal', 9);
      skriv(u.kontrollsumma, 'normal', 8.5);
      skriv(summa === u.kontrollsumma ? 'Texten i den här utskriften har samma kontrollsumma, alltså är den oförändrad.' : 'OBS: texten har ändrats efter att protokollet låstes.', 'normal', 9, summa === u.kontrollsumma ? null : [170, 40, 40]);
      y += 3;
      skriv('Protokollet har skrivits under i Föreningsbokföring. Varje person har loggat in med sitt Microsoft-konto och bekräftat att hen läst och godkänner protokollet. Underskrifterna kan kontrolleras i appen under Styrelsen, Möten och protokoll.', 'normal', 8.5, GRA);
    } else {
      // Rader för underskrift på papper.
      var namn = [];
      if (fu.sekreterare.namn || fu.sekreterare.epost) namn.push(['Mötessekreterare', fu.sekreterare.namn]);
      if (fu.ordforande.namn || fu.ordforande.epost) namn.push(['Mötesordförande', fu.ordforande.namn]);
      just.forEach(function (j) { namn.push(['Justerare', j.namn]); });
      if (!namn.length) namn = [['Mötessekreterare', ''], ['Mötesordförande', ''], ['Justerare', '']];
      y += 6;
      if (y + Math.ceil(namn.length / 2) * 24 > NED) { doc.addPage(); y = 30; }
      namn.forEach(function (n, i) {
        var x = i % 2 ? 110 : V, yy = y + Math.floor(i / 2) * 24 + 14;
        doc.setDrawColor(26, 26, 26); doc.setLineWidth(0.3); doc.line(x, yy, x + 70, yy);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
        doc.text(pt(n[1] || ''), x, yy + 4.5);
        doc.setTextColor.apply(doc, GRA); doc.setFontSize(8); doc.text(pt(n[0]), x, yy + 8.5); doc.setTextColor(26, 26, 26);
      });
    }
    var sidor = doc.getNumberOfPages();
    for (var i = 1; i <= sidor; i++) {
      doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor.apply(doc, GRA);
      doc.text(pt('Protokoll ' + m.datum + ' · version ' + summa.slice(0, 12) + ' · sida ' + i + ' av ' + sidor), V, 290);
      doc.setTextColor(26, 26, 26);
    }
    return doc.output('blob');
  }

  // Kopior i OneDrive: json-filer i mapparna Testdata i den samlade mappen.
  async function kopiorIOneDrive() {
    var bas = od.rot || od.mapp, ut = [];
    var mappar = (await allaBarn(bas.driveId, bas.id)).filter(function (x) { return x.folder && /^Testdata/i.test(x.name); });
    for (var i = 0; i < mappar.length; i++) {
      (await allaBarn(bas.driveId, mappar[i].id)).forEach(function (f) {
        if (!f.folder && /\.json$/i.test(f.name)) ut.push({ namn: f.name, mapp: mappar[i].name, id: f.id, driveId: bas.driveId });
      });
    }
    return ut.sort(function (a, b) { return a.namn < b.namn ? 1 : -1; });
  }
  // Lägger en helkopia (eller en vanlig säkerhetskopia av bokföringen) i övningsläget.
  function helkopiaTillOvning(d) {
    var bok = d && d.format === 'foreningsbokforing-helkopia' ? d.bokforing : d;

      if (d.styrelsen || d.uppdrag) {
        var x = tomSty();
        if (d.styrelsen) x.styr.data = K.normaliseraStyrelse(d.styrelsen);
        if (d.uppdrag) x.upp.data = K.normaliseraUppdrag(d.uppdrag);

      }

  }

  async function borjaOmNu(val, arkivId) {
    if (odAnslutet()) {
      sattStatus('Sparar innan…');
      await synkaUpp();
      await synkaStyrelsen().catch(function () { /* sparas igen efteråt */ });
      if (od.smutsig || od.regSmutsig || odNu.konflikt) throw new Error('Allt kunde inte sparas i OneDrive. Försök igen.');
    }
    var kopia = helkopia();
    var bas = od.rot || od.mapp, mapp = null, kopiaNamn = null;
    if (odAnslutet()) {
      // Kopian sparas i OneDrive innan något tas bort. Går det inte avbryts allt.
      sattStatus('Sparar en kopia av testdatat i OneDrive…');
      mapp = await sakerstallUndermapp(bas.driveId, bas.id, 'Testdata (borttaget ' + idag() + ')');
      var sparad = await graf('/drives/' + bas.driveId + '/items/' + mapp.id + ':/' + enc(helkopiaNamn('testdata')) + ':/content?@microsoft.graph.conflictBehavior=rename',
        { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(kopia) });
      kopiaNamn = (od.rot ? od.rot.namn : bas.namn) + '/' + mapp.name + '/' + sparad.name;
    }
    helkopiaTillOvning(kopia);
    var res = K.borjaOm({ bokforing: kopia.bokforing, register: kopia.medlemsregister, styrelse: kopia.styrelsen, uppdrag: kopia.uppdrag }, val);
    var flyttade = 0;
    if (odAnslutet() && res.filer.length) {
      sattStatus('Flyttar testfilerna…');
      var namn = [];
      for (var i = 0; i < res.filer.length; i++) {
        var f = res.filer[i];
        var nytt = K.ledigtNamn(namn, K.sakertNamn(f.namn || 'fil'));
        var ok = await graf('/drives/' + bas.driveId + '/items/' + f.odId, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: nytt, parentReference: { id: mapp.id } }), tillat: [403, 404] });
        if (typeof ok !== 'number') { namn.push(nytt); flyttade++; }
      }
    }
    var nyttAr = null;
    if (arkivId && res.bokforing.ar[arkivId]) {
      try { nyttAr = K.arFranArkiv(res.bokforing.ar[arkivId], res.kontoplan); }
      catch (e) { nyttAr = null; res.nyttArFel = e.fel ? e.fel.join(' ') : e.message; }
    }
    store = res.bokforing;
    LISTNYCKLAR.forEach(function (k) { if (!store[k]) store[k] = []; });
    store.medlemsregister = res.register;
    sty.styr = Object.assign(sty.styr, { data: res.styrelse, smutsig: true });
    sty.upp = Object.assign(sty.upp, { data: res.uppdrag, smutsig: true });
    sparaStyrLokalt();
    oppetMote = null; utkast = nyttUtkast(); kvittoUtkast = null; valdMedlem = null;
    if (nyttAr) laggTillAr(nyttAr); else spara();
    if (odAnslutet()) { await synkaUpp(); await synkaStyrelsen().catch(function () { /* nästa gång */ }); }
    sattStatus(odAnslutet() ? 'Synkad med OneDrive' : '');
    return { flyttade: flyttade, kopia: kopiaNamn, nyttAr: nyttAr ? K.arNamn(nyttAr) : null, nyttArFel: res.nyttArFel || null };
  }

  // ---------- Revisionspaket och delning med revisorn ----------

  async function skapaRevisionspaket(arId) {
    var JSZip = await laddaJsZip();
    var zip = new JSZip();
    var ar = store.ar[arId];
    var namn = K.arNamn(ar);
    var data = K.revisionspaketData(bokforingsdata(), arId, { skapad: idag(), version: VERSIONER[0].version });
    var steg = function (t) { paketStatus = t; var el = document.getElementById('paketStatus'); if (el) el.textContent = t; };
    zip.file('bokforing.json', JSON.stringify(data));
    var saknas = [];
    for (var i = 0; i < RAPPORTER.length; i++) {
      steg('Skapar ' + RAPPORTER[i][1].toLowerCase() + '…');
      zip.file('Rapporter/' + K.sakertNamn(RAPPORTTITLAR[RAPPORTER[i][0]] + ' ' + namn.replace('/', '-') + '.pdf'), await skapaRapportPdf(ar, RAPPORTER[i][0]));
    }
    if (!ar.grovkopia) {
      try { zip.file('Rapporter/' + arsmoteFilnamn(ar), await skapaArsmotePdf(ar)); } catch (e) { /* årsmöteshandlingarna är frivilliga */ }
      zip.file(K.sakertNamn('Bokföring ' + namn.replace('/', '-') + '.se'), K.tillCp437(K.sieExport(ar, { forening: store.forening, genererad: idag() })));
    }
    var lista = ar.underlag || [];
    for (var j = 0; j < lista.length; j++) {
      steg('Hämtar underlag ' + (j + 1) + ' av ' + lista.length + '…');
      var rec = await hamtaFil(lista[j].id).catch(function () { return null; });
      if (!rec) rec = await hamtaFilFranOneDrive(lista[j].id).catch(function () { return null; });
      if (rec) zip.file(data.filer[lista[j].id], rec.blob); else saknas.push(lista[j].filnamn);
    }
    if (logoUrl) { try { zip.file('logotyp', await (await fetch(logoUrl)).blob()); } catch (e) { /* frivilligt */ } }
    var adress = omdirigering();
    zip.file('Läs mig.txt', [
      'Revisionspaket för ' + (store.forening.namn || 'föreningen') + ', räkenskapsår ' + namn + '.',
      'Skapat ' + idag() + ' med Föreningsbokföring ' + VERSIONER[0].version + '.',
      '',
      'Så öppnar du paketet (inget konto behövs, och inget sparas):',
      '1. Gå till ' + adress,
      '2. Tryck på "Öppna revisionspaket" och välj den här zip-filen.',
      '3. Läs verifikationer, huvudbok och rapporter, och öppna underlagen genom att trycka på dem.',
      '',
      'Rapporterna finns också som PDF i mappen Rapporter, och underlagen i mappen Underlag.',
      ar.grovkopia ? '' : 'Filen med ändelsen .se är bokföringen i SIE-format, för den som har ett eget redovisningsprogram.',
      saknas.length ? '\nUnderlag som saknas i paketet: ' + saknas.join(', ') : '',
      '',
      revisorsguideText()
    ].join('\r\n'));
    steg('Packar…');
    var blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    paketStatus = null;
    return { blob: blob, saknas: saknas };

  function oppnaPaket() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.zip,application/zip';
    input.onchange = async function () {
      var fil = input.files[0];
      if (!fil) return;
      try {
        var JSZip = await laddaJsZip();
        var zip = await JSZip.loadAsync(fil);
        var j = zip.file('bokforing.json');
        if (!j) throw new Error('Zip-filen är inget revisionspaket från Föreningsbokföring.');
        var p = K.lasRevisionspaket(JSON.parse(await j.async('string')));
        revision = { zip: zip, filer: p.filer, skapad: p.skapad, version: p.version };
        clearTimeout(odNu.timer);
        store = { format: 1, forening: p.forening, ar: p.ar, aktivt: p.aktivt, regler: [], motpartsregler: [], medlemsregister: K.tomtRegister() };
        LISTNYCKLAR.forEach(function (k) { store[k] = []; });
        var logo = zip.file('logotyp');
        logoUrl = logo ? URL.createObjectURL(await logo.async('blob')) : null;
        vy = 'rapporter';
        visa('Revisionspaketet är öppnat.');
      } catch (err) { visa(err.fel ? err.fel.join(' ') : 'Paketet kunde inte öppnas: ' + err.message, true); }
    };
    input.click();
  }

  async function delaMedRevisor(epost) {
    epost = String(epost || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(epost)) throw new Error('Skriv revisorns e-postadress.');
    await graf('/drives/' + od.mapp.driveId + '/items/' + od.mapp.id + '/invite', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        recipients: [{ email: epost }], roles: ['read'], requireSignIn: true, sendInvitation: true,
        message: 'Du har fått läsbehörighet till bokföringen för ' + (store.forening.namn || 'föreningen') + '. Öppna den i appen med den här länken och logga in med ditt Microsoft-konto: ' + inbjudningslank()
