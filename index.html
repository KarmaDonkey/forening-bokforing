  }

  // ---------- Bankfiler (CSV, tabbseparerat, inklistrat från Excel) ----------

  function tolkaDatum(s) {
    s = String(s == null ? '' : s).trim();
    var m;
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) s = m[1] + '-' + m[2] + '-' + m[3];
    else if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) s = m[1] + '-' + m[2] + '-' + m[3];
    else if ((m = s.match(/^(\d{2})-(\d{2})-(\d{2})$/))) s = '20' + m[1] + '-' + m[2] + '-' + m[3];
    else if ((m = s.match(/^(\d{4})\/(\d{2})\/(\d{2})$/))) s = m[1] + '-' + m[2] + '-' + m[3];
    else return null;
    return arGiltigtDatum(s) ? s : null;
  }

  // Tål både "1 200,50", "-1200.50", "1.200,50" och "1,200.50".
  function tolkaBankbelopp(s) {
    var t = String(s == null ? '' : s).trim().replace(/[\s  ]/g, '').replace(/(kr|sek)$/i, '');
    if (!t) return null;
    var punkt = t.lastIndexOf('.'), komma = t.lastIndexOf(',');
    if (punkt >= 0 && komma >= 0) t = komma > punkt ? t.replace(/\./g, '') : t.replace(/,/g, '');
    try { return parseBelopp(t); } catch (e) { return null; }
  }

  function delaCsv(text, sep) {
    var rader = [], rad = [], cell = '', iCitat = false;
    text = String(text).replace(/^﻿/, '');
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (iCitat) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else iCitat = false; }
        else cell += c;
      } else if (c === '"' && cell.trim() === '') { iCitat = true; cell = ''; }
      else if (c === sep) { rad.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        rad.push(cell); rader.push(rad); rad = []; cell = '';
      } else cell += c;
    }
    if (cell !== '' || rad.length) { rad.push(cell); rader.push(rad); }
    return rader.filter(function (r) { return r.some(function (c) { return c.trim() !== ''; }); });
  }

  function gissaSeparator(text) {
    var antal = { '\t': 0, ';': 0, ',': 0 };
    String(text).split(/\r?\n/).slice(0, 15).forEach(function (l) {
      Object.keys(antal).forEach(function (k) { antal[k] = Math.max(antal[k], l.split(k).length - 1); });
    });
    if (antal['\t'] > 0) return '\t';
    return antal[';'] >= antal[','] && antal[';'] > 0 ? ';' : ',';
  }

  function rubrikNyckel(s) {
    return String(s).toLowerCase().replace(/[åä]/g, 'a').replace(/ö/g, 'o').replace(/é/g, 'e').replace(/[^a-z]/g, '');
  }

  var BANKKOLUMNER = {
    datum: ['bokforingsdag', 'bokforingsdatum', 'bokfdag', 'bokfdatum', 'bokfort', 'datum', 'transaktionsdag', 'transaktionsdatum', 'valutadag', 'date'],
    text: ['beskrivning', 'text', 'transaktion', 'transaktionstext', 'transaktionstyp', 'rubrik', 'specifikation', 'mottagare', 'avsandare', 'description'],
    referens: ['referens', 'meddelande', 'ref', 'reference'],
    belopp: ['belopp', 'beloppsek', 'beloppkr', 'summa', 'amount'],
    insattning: ['insattning', 'insattningar'],
    uttag: ['uttag'],
    saldo: ['bokfortsaldo', 'saldo', 'saldosek', 'behallning', 'balans', 'balance']
  };

  function hittaKolumner(rad) {
    var nycklar = rad.map(rubrikNyckel);
    var k = {};
    Object.keys(BANKKOLUMNER).forEach(function (falt) {
      for (var i = 0; i < BANKKOLUMNER[falt].length; i++) {
        var idx = nycklar.indexOf(BANKKOLUMNER[falt][i]);
        if (idx >= 0 && !Object.keys(k).some(function (f) { return k[f] === idx; })) { k[falt] = idx; return; }
      }
    });
    if (k.datum == null || (k.belopp == null && k.insattning == null && k.uttag == null)) return null;
    return k;
  }

  // Rad utan rubriker: datum först, de två sista talen är belopp och saldo.
  function tolkaRadUtanRubrik(celler) {
    var datum = null, tal = [], text = [];
    celler.forEach(function (c) {
      var d = datum ? null : tolkaDatum(c);
      if (d) { datum = d; return; }
      if (tolkaDatum(c)) return;
      var b = /\d/.test(c) && !/[a-zåäö]/i.test(c.replace(/(kr|sek)$/i, '')) ? tolkaBankbelopp(c) : null;
      if (b != null) tal.push(b);
      else if (c.trim()) text.push(c.trim());
    });
    if (!datum || !tal.length) return null;
    return {
      datum: datum, text: text.join(' '), referens: '',
      belopp: tal.length >= 2 ? tal[tal.length - 2] : tal[0],
      saldo: tal.length >= 2 ? tal[tal.length - 1] : null
    };
  }

  function parseBankfil(text) {
    var celler = delaCsv(text, gissaSeparator(text));
    var varningar = [];
    var rader = [];
    var k = null, start = 0;
    for (var i = 0; i < Math.min(celler.length, 15); i++) {
      k = hittaKolumner(celler[i]);
      if (k) { start = i + 1; break; }
    }
    celler.slice(k ? start : 0).forEach(function (c, j) {
      var radnr = (k ? start : 0) + j + 1;
      var r;
      if (k) {
        var datum = tolkaDatum(c[k.datum]);
        var belopp = k.belopp != null ? tolkaBankbelopp(c[k.belopp]) : (tolkaBankbelopp(c[k.insattning]) || 0) - Math.abs(tolkaBankbelopp(c[k.uttag]) || 0);
        if (!datum || belopp == null) { varningar.push('Rad ' + radnr + ' kunde inte tolkas och hoppades över.'); return; }
        var t = k.text != null ? String(c[k.text] || '').trim() : '';
        var ref = k.referens != null ? String(c[k.referens] || '').trim() : '';
        r = { datum: datum, text: t || ref, referens: t ? ref : '', belopp: belopp, saldo: k.saldo != null ? tolkaBankbelopp(c[k.saldo]) : null };
      } else {
        r = tolkaRadUtanRubrik(c);
        if (!r) { varningar.push('Rad ' + radnr + ' kunde inte tolkas och hoppades över.'); return; }
      }
      if (r.belopp === 0) return;
      rader.push(r);
    });
    // Banker listar ofta nyast först; vänd så att listan går framåt i tiden.
    if (rader.length > 1 && rader[0].datum > rader[rader.length - 1].datum) rader.reverse();
    return { rader: rader, varningar: varningar.concat(kontrolleraSaldon(rader)) };
  }

  function kontrolleraSaldon(rader) {
    var v = [];
    for (var i = 1; i < rader.length; i++) {
      var a = rader[i - 1], b = rader[i];
      if (a.saldo == null || b.saldo == null) continue;
      if (a.saldo + b.belopp !== b.saldo) {
        v.push('Saldot stämmer inte ' + b.datum + ' (' + b.text + '): ' + formatBelopp(a.saldo) + ' + ' + formatBelopp(b.belopp) + ' ≠ ' + formatBelopp(b.saldo) + '.');
      }
    }
    return v;
  }

  function normaliseraText(t) {
    return String(t || '').toLowerCase().replace(/[0-9]+/g, ' ').replace(/[^a-zåäöéü]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function bankradId(r, n) {
    return [r.datum, r.belopp, r.saldo == null ? '' : r.saldo, normaliseraText(r.text), r.referens || ''].join('|') + (n ? '#' + n : '');
  }

  // Lägger till bankrader i året. Rader som redan finns (samma fil inläst igen) hoppas över.
  function importeraBankrader(ar, rader, opt) {
    var konto = (opt && opt.konto) || '1930';
    if (!ar.kontoplan.some(function (k) { return k.nr === konto; })) throw BokforingsFel('Bankkontot ' + konto + ' finns inte i kontoplanen.');
    var befintliga = {};
    (ar.bankrader || []).forEach(function (r) { befintliga[r.id] = true; });
    var sedda = {}, kompletterade = {};
    var nya = [], dubbletter = 0, utanfor = 0;
    rader.forEach(function (r) {
      if (r.datum < ar.start || r.datum > ar.slut) { utanfor++; return; }
      var bas = bankradId(r);
      sedda[bas] = (sedda[bas] || 0) + 1;
      var id = bankradId(r, sedda[bas] - 1);
      if (befintliga[id]) { dubbletter++; return; }
      // Samma transaktion inläst tidigare utan betalarens nummer (t.ex. före version 1.12): komplettera texten.
      var mobil = hittaMobilnummer(r.text + ' ' + (r.referens || ''));
      if (mobil) {
        var tidigare = (ar.bankrader || []).find(function (x) {
          return !kompletterade[x.id] && x.konto === konto && x.datum === r.datum && x.belopp === r.belopp && x.saldo != null && x.saldo === r.saldo &&
            !hittaMobilnummer(x.text + ' ' + (x.referens || ''));
        });
        if (tidigare) { kompletterade[tidigare.id] = { text: r.text || '', referens: r.referens || '' }; dubbletter++; return; }
      }
      nya.push({ id: id, datum: r.datum, text: r.text || '', referens: r.referens || '', belopp: r.belopp, saldo: r.saldo == null ? null : r.saldo, konto: konto, verifikation: null });
    });
    var alla = (ar.bankrader || []).map(function (r) { return kompletterade[r.id] ? Object.assign({}, r, kompletterade[r.id]) : r; }).concat(nya).map(function (r, i) { return { r: r, i: i }; });
    alla.sort(function (a, b) { return a.r.datum < b.r.datum ? -1 : a.r.datum > b.r.datum ? 1 : a.i - b.i; });
    return { ar: Object.assign({}, ar, { bankrader: alla.map(function (x) { return x.r; }) }), nya: nya.length, dubbletter: dubbletter, utanfor: utanfor, kompletterade: Object.keys(kompletterade).length };
  }

  function oppnaBankrader(ar) {
    return (ar.bankrader || []).filter(function (r) { return r.verifikation == null; });
  }

  // Jämför bankens senaste saldo med bokfört saldo samma dag.
  function bankavstamning(ar, konto) {
    konto = konto || '1930';
    var rader = (ar.bankrader || []).filter(function (r) { return r.konto === konto && r.saldo != null; });
    if (!rader.length) return null;
    var sista = rader[rader.length - 1];
    var forsta = rader[0];
    var bokfort = saldon(ar, { tom: sista.datum })[konto] || 0;
    return {
      konto: konto, datum: sista.datum, bankSaldo: sista.saldo, bokfortSaldo: bokfort, skillnad: bokfort - sista.saldo,
      // Saldot före årets första banktransaktion, om den första raden i året har saldo.
      ingaendeEnligtBank: forsta === (ar.bankrader || []).filter(function (r) { return r.konto === konto; })[0] ? forsta.saldo - forsta.belopp : null,
      ingaendeBokfort: ar.ingaendeBalans[konto] || 0,
      obokforda: oppnaBankrader(ar).filter(function (r) { return r.konto === konto && r.datum <= sista.datum; }).length
    };
  }

  // Avstämning månad för månad: bankens sista saldo i varje månad mot bokfört saldo samma dag.
  function bankavstamningPerManad(ar, konto) {
    konto = konto || '1930';
    var rader = (ar.bankrader || []).filter(function (r) { return r.konto === konto; });
    var ut = [];
    var m = ar.start.slice(0, 7);
    var sista = ar.slut.slice(0, 7);
    while (m <= sista) {
      var iManad = rader.filter(function (r) { return r.datum.slice(0, 7) === m; });
      var medSaldo = iManad.filter(function (r) { return r.saldo != null; });
      var post = { manad: m, antal: iManad.length, obokforda: iManad.filter(function (r) { return r.verifikation == null; }).length };
      if (medSaldo.length) {
        var s = medSaldo[medSaldo.length - 1];
        post.datum = s.datum;
        post.bankSaldo = s.saldo;
        post.bokfortSaldo = saldon(ar, { tom: s.datum })[konto] || 0;
        post.skillnad = post.bokfortSaldo - s.saldo;
      }
      ut.push(post);
      var d = new Date(Date.UTC(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 1));
      m = d.toISOString().slice(0, 7);
    }
    return ut;
  }

  // Det som inte stämmer mellan bokföringen och kontoutdraget.
  function bankavvikelser(ar, konto) {
    konto = konto || '1930';
    var rader = (ar.bankrader || []).filter(function (r) { return r.konto === konto; });
    var lankade = {}, rattade = {};
    rader.forEach(function (r) { if (r.verifikation != null) lankade[r.verifikation] = true; });
    ar.verifikationer.forEach(function (v) { if (v.rattar != null) { rattade[v.rattar] = true; rattade[v.nr] = true; } });
    var fran = rader.length ? rader[0].datum : null;
    var till = rader.length ? rader[rader.length - 1].datum : null;
    var utanBank = !rader.length ? [] : ar.verifikationer.filter(function (v) {
      if (lankade[v.nr] || rattade[v.nr] || v.datum < fran || v.datum > till) return false;
      return v.rader.reduce(function (s, r) { return r.konto === konto ? s + r.belopp : s; }, 0) !== 0;
    }).map(function (v) {
      return { nr: v.nr, datum: v.datum, text: v.text, belopp: v.rader.reduce(function (s, r) { return r.konto === konto ? s + r.belopp : s; }, 0) };
    });
    return {
      obokforda: rader.filter(function (r) { return r.verifikation == null; }),
      utanBank: utanBank,
      saldofel: kontrolleraSaldon(rader),
      period: fran ? { fran: fran, till: till } : null
    };
  }

  // ---------- Regler: banktext -> konto ----------

  function riktningFor(belopp) { return belopp < 0 ? 'ut' : 'in'; }

  function hittaRegel(regler, text, belopp) {
    var n = ' ' + normaliseraText(text) + ' ';
    var riktning = riktningFor(belopp);
    var basta = null;
    (regler || []).forEach(function (r) {
      if (r.riktning && r.riktning !== riktning) return;
      if (n.indexOf(' ' + r.monster + ' ') >= 0 && (!basta || r.monster.length > basta.monster.length)) basta = r;
    });
    return basta;
  }

  function larRegel(regler, text, belopp, konto) {
    var monster = normaliseraText(text);
    regler = (regler || []).slice();
    if (!monster || !giltigtKontonummer(konto)) return regler;
    var riktning = riktningFor(belopp);
    var i = regler.findIndex(function (r) { return r.monster === monster && r.riktning === riktning; });
    if (i >= 0) regler[i] = { monster: monster, riktning: riktning, konto: konto };
    else regler.push({ monster: monster, riktning: riktning, konto: konto });
    return regler;
  }

  // ---------- Underlag (tolkade fakturor och kvitton) ----------

  // Underlag: { id, filnamn, dokumenttyp, motpart, datum, forfallodatum, belopp (ören, positivt),
  //   riktning ('utgift' | 'intakt'), beskrivning, fakturanummer, ocr, foreslagetKonto, verifikation, arkivnamn }
  function laggTillUnderlag(ar, u) {
    if (!u || !u.id) throw BokforingsFel('Underlaget saknar id.');
    if ((ar.underlag || []).some(function (x) { return x.id === u.id; })) throw BokforingsFel('Underlaget finns redan.');
    var nytt = Object.assign({ verifikation: null }, u);
    return Object.assign({}, ar, { underlag: (ar.underlag || []).concat([nytt]) });
  }

  function andraUnderlag(ar, id, andring) {
    return Object.assign({}, ar, {
      underlag: (ar.underlag || []).map(function (u) { return u.id === id ? Object.assign({}, u, andring) : u; })
    });
  }

  function taBortUnderlag(ar, id) {
    var u = (ar.underlag || []).find(function (x) { return x.id === id; });
    if (!u) throw BokforingsFel('Underlaget finns inte.');
    if (u.verifikation != null) throw BokforingsFel('Underlaget hör till verifikation ' + u.verifikation + ' och kan inte tas bort.');
    return Object.assign({}, ar, { underlag: ar.underlag.filter(function (x) { return x.id !== id; }) });
  }

  function arBetalbartUnderlag(u) { return u.dokumenttyp !== 'kontoutdrag' && u.belopp > 0; }

  function oppnaUnderlag(ar) {
    return (ar.underlag || []).filter(function (u) { return u.verifikation == null && arBetalbartUnderlag(u); });
  }

  function bankbelopp(u) { return u.riktning === 'intakt' ? u.belopp : -u.belopp; }

  function dagarMellan(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

  function inomFonster(u, bankrad) {
    var fran = u.datum || u.forfallodatum;
    if (!fran) return true;
    var till = u.forfallodatum && u.forfallodatum > fran ? u.forfallodatum : fran;
    return bankrad.datum >= laggTillDagar(fran, -7) && bankrad.datum <= laggTillDagar(till, 60);
  }

  function matchpoang(u, bankrad) {
    var p = 0;
    var bt = (bankrad.text + ' ' + bankrad.referens).replace(/\s/g, '');
    if (u.ocr && bt.indexOf(String(u.ocr).replace(/\s/g, '')) >= 0) p += 1000;
    if (u.fakturanummer && String(u.fakturanummer).length >= 4 && bt.indexOf(String(u.fakturanummer).replace(/\s/g, '')) >= 0) p += 500;
    var mal = u.forfallodatum || u.datum;
    if (mal) p -= Math.abs(dagarMellan(mal, bankrad.datum));
    return p;
  }

  // Returnerar id:n för de underlag som bäst förklarar en bankrad: ett med exakt belopp,
  // annars upp till fyra som tillsammans blir exakt beloppet (t.ex. en utläggsredovisning).
  function matchaUnderlag(ar, bankrad) {
    var kandidater = oppnaUnderlag(ar).filter(function (u) {
      return inomFonster(u, bankrad) && (bankbelopp(u) < 0) === (bankrad.belopp < 0);
    });
    var exakta = kandidater.filter(function (u) { return bankbelopp(u) === bankrad.belopp; })
      .sort(function (a, b) { return matchpoang(b, bankrad) - matchpoang(a, bankrad); });
    if (exakta.length) return [exakta[0].id];
    var narmast = kandidater.filter(function (u) { return Math.abs(u.belopp) < Math.abs(bankrad.belopp); })
      .sort(function (a, b) { return matchpoang(b, bankrad) - matchpoang(a, bankrad); }).slice(0, 12);
    for (var storlek = 2; storlek <= 4; storlek++) {
      var hit = sokKombination(narmast, storlek, bankrad.belopp);
      if (hit) return hit.map(function (u) { return u.id; });
    }
    return [];
  }

  function sokKombination(lista, storlek, mal) {
    var val = [];
    function steg(fran, summa) {
      if (val.length === storlek) return summa === mal ? val.slice() : null;
      for (var i = fran; i < lista.length; i++) {
        val.push(lista[i]);
        var r = steg(i + 1, summa + bankbelopp(lista[i]));
        if (r) return r;
        val.pop();
      }
      return null;
    }
    return steg(0, 0);
  }

  function slaIhopRader(rader) {
    var ut = [];
    rader.forEach(function (r) {
      var f = ut.find(function (x) { return x.konto === r.konto && r.konto; });
      if (f) f.belopp += r.belopp; else ut.push({ konto: r.konto, belopp: r.belopp });
    });
    return ut.filter(function (r) { return r.belopp !== 0; });
  }

  // Ett förslag på verifikation för en bankrad, från underlag eller inlärda regler.
  function forslagForBankrad(ar, bankrad, regler, opt) {
    var ids = opt && opt.underlagIds ? opt.underlagIds : matchaUnderlag(ar, bankrad);
    var us = ids.map(function (id) { return (ar.underlag || []).find(function (u) { return u.id === id; }); }).filter(Boolean);
    var regel = hittaRegel(regler, bankrad.text + ' ' + bankrad.referens, bankrad.belopp);
    var regelKonto = regel ? regel.konto : '';
    var giltigt = function (nr) { return nr && ar.kontoplan.some(function (k) { return k.nr === nr; }) ? nr : ''; };
    var rader = [{ konto: bankrad.konto, belopp: bankrad.belopp }];
    var text, kalla, kommentar = '';
    var summaUnderlag = us.reduce(function (s, u) { return s + bankbelopp(u); }, 0);
    if (us.length === 1 && opt && opt.ungefar && summaUnderlag !== bankrad.belopp) {
      // Ett underlag som troligen hör hit men vars belopp skiljer: banken avgör beloppet.
      rader.push({ konto: giltigt(us[0].foreslagetKonto) || giltigt(regelKonto), belopp: -bankrad.belopp });
      text = [us[0].motpart, us[0].beskrivning].filter(Boolean).join(': ');
      kalla = 'underlag';
    } else if (us.length && summaUnderlag === bankrad.belopp) {
      us.forEach(function (u) { rader.push({ konto: giltigt(u.foreslagetKonto) || giltigt(regelKonto), belopp: -bankbelopp(u) }); });
      text = us.length === 1
        ? [us[0].motpart, us[0].beskrivning].filter(Boolean).join(': ')
        : bankrad.text + ' (' + us.length + ' underlag)';
      kalla = 'underlag';
    } else {
      us = [];
      rader.push({ konto: giltigt(regelKonto), belopp: -bankrad.belopp });
      text = bankrad.text || bankrad.referens;
      kalla = regel ? 'regel' : null;
      if (bankrad.belopp > 0 || regelKonto === '6570') kommentar = 'Bankutdrag';
    }
    var forsta = rader[0];
    rader = [forsta].concat(slaIhopRader(rader.slice(1)));
    return {
      bankradId: bankrad.id,
      datum: bankrad.datum,
      text: text || 'Banktransaktion',
      rader: rader,
      underlagIds: us.map(function (u) { return u.id; }),
      underlagKommentar: kommentar,
      kalla: kalla,
      komplett: rader.every(function (r) { return !!giltigt(r.konto); })
    };
  }

  function arkivnamn(nr, filnamn) { return 'V' + String(nr).padStart(3, '0') + '_' + filnamn; }

  // Bokför en verifikation och kopplar den till en bankrad och/eller underlag.
  function bokforKopplat(ar, utkast, koppling) {
    koppling = koppling || {};
    var nr = nastaVerifikationsnummer(ar);
    var bankrad = null;
    if (koppling.bankradId) {
      bankrad = (ar.bankrader || []).find(function (r) { return r.id === koppling.bankradId; });
      if (!bankrad) throw BokforingsFel('Banktransaktionen finns inte.');
      if (bankrad.verifikation != null) throw BokforingsFel('Banktransaktionen är redan bokförd i verifikation ' + bankrad.verifikation + '.');
      var paBank = (utkast.rader || []).reduce(function (s, r) { return r.konto === bankrad.konto ? s + r.belopp : s; }, 0);
      if (paBank !== bankrad.belopp) {
        throw BokforingsFel('Verifikationen måste ha ' + formatBelopp(bankrad.belopp) + ' kr på konto ' + bankrad.konto + ' för att stämma med banken.');
      }
    }
    var us = (koppling.underlagIds || []).map(function (id) {
      var u = (ar.underlag || []).find(function (x) { return x.id === id; });
      if (!u) throw BokforingsFel('Underlaget finns inte.');
      if (u.verifikation != null) throw BokforingsFel('Underlaget ' + u.filnamn + ' hör redan till verifikation ' + u.verifikation + '.');
      return u;
    });
    var namn = us.map(function (u) { return arkivnamn(nr, u.filnamn); });
    var res = bokfor(ar, Object.assign({}, utkast, { underlag: (utkast.underlag || []).concat(namn) }));
    var nyttAr = res.ar;
    if (bankrad) {
      nyttAr = Object.assign({}, nyttAr, {
        bankrader: nyttAr.bankrader.map(function (r) { return r.id === bankrad.id ? Object.assign({}, r, { verifikation: nr }) : r; })
      });
    }
    us.forEach(function (u, i) { nyttAr = andraUnderlag(nyttAr, u.id, { verifikation: nr, arkivnamn: namn[i] }); });
    return { ar: nyttAr, verifikation: res.verifikation };
  }

  // ---------- Underlag i efterhand ----------

  // Kopplar ett underlag som väntar till en verifikation som redan är bokförd.
  // Beloppen i verifikationen ändras inte; underlaget kompletterar den.
  function kopplaUnderlagTillVerifikation(ar, nr, underlagId, tid) {
    var v = hittaVerifikation(ar, nr);
    if (!v) throw BokforingsFel('Verifikation ' + nr + ' finns inte.');
    var u = (ar.underlag || []).find(function (x) { return x.id === underlagId; });
    if (!u) throw BokforingsFel('Underlaget finns inte.');
    if (u.verifikation != null) throw BokforingsFel('Underlaget hör redan till verifikation ' + u.verifikation + '.');
    return andraUnderlag(ar, underlagId, { verifikation: nr, arkivnamn: arkivnamn(nr, u.filnamn), bifogad: tid || null });
  }

  function bifogaNyttUnderlag(ar, nr, fil) {
    if (!hittaVerifikation(ar, nr)) throw BokforingsFel('Verifikation ' + nr + ' finns inte.');
    if (!fil || !fil.id || !fil.filnamn) throw BokforingsFel('Filen saknas.');
    return laggTillUnderlag(ar, {
      id: fil.id, filnamn: fil.filnamn, dokumenttyp: 'bifogat', motpart: '', belopp: 0, riktning: 'utgift',
      verifikation: nr, arkivnamn: arkivnamn(nr, fil.filnamn), bifogad: fil.tid || null
    });
  }

  // Alla underlag som hör till en verifikation: de som angavs vid bokföringen och de som bifogats efteråt.
  function underlagForVerifikation(ar, nr) {
    var v = hittaVerifikation(ar, nr);
    if (!v) return [];
    var namn = (v.underlag || []).slice();
    (ar.underlag || []).forEach(function (u) {
      if (u.verifikation === nr && u.arkivnamn && namn.indexOf(u.arkivnamn) < 0) namn.push(u.arkivnamn);
    });
    return namn;
  }

  function flyttaUnderlag(franAr, tillAr, id) {
    var u = (franAr.underlag || []).find(function (x) { return x.id === id; });
    if (!u) throw BokforingsFel('Underlaget finns inte.');
    if (u.verifikation != null) throw BokforingsFel('Ett bokfört underlag kan inte flyttas till ett annat år.');
    return {
      fran: Object.assign({}, franAr, { underlag: franAr.underlag.filter(function (x) { return x.id !== id; }) }),
      till: Object.assign({}, tillAr, { underlag: (tillAr.underlag || []).concat([Object.assign({}, u)]) })
    };
  }

  // Underlag som troligen hör till en bankrad trots att belopp eller datum inte stämmer exakt,
  // t.ex. öresavrundning, sen betalning eller en faktura som ligger i ett annat räkenskapsår.
  // extra: väntande underlag från andra år, som [{ arId, underlag }].
  function trolligaUnderlag(ar, bankrad, extra) {
    var kandidater = oppnaUnderlag(ar).map(function (u) { return { arId: null, u: u }; })
      .concat((extra || []).filter(function (x) { return arBetalbartUnderlag(x.underlag) && x.underlag.verifikation == null; })
        .map(function (x) { return { arId: x.arId, u: x.underlag }; }));
    var ut = [];
    kandidater.forEach(function (k) {
      var u = k.u;
      if ((bankbelopp(u) < 0) !== (bankrad.belopp < 0)) return;
      var skillnad = Math.abs(bankbelopp(u) - bankrad.belopp);
      var grans = Math.max(5000, Math.round(Math.abs(bankrad.belopp) * 0.02));
      if (skillnad > grans) return;
      var mal = u.forfallodatum || u.datum;
      var dagar = mal ? dagarMellan(mal, bankrad.datum) : 0;
      if (dagar < -30 || dagar > 150) return;
      var exakt = skillnad === 0 && inomFonster(u, bankrad) && !k.arId;
      if (exakt) return;
      var skal = [];
      if (skillnad) skal.push('beloppet skiljer ' + formatBelopp(skillnad) + ' kr');
      if (!inomFonster(u, bankrad)) skal.push('betalningen ligger ' + Math.abs(dagar) + ' dagar ' + (dagar < 0 ? 'före' : 'efter') + ' ' + (u.forfallodatum ? 'förfallodagen' : 'fakturadatum'));
      if (k.arId) skal.push('underlaget ligger i räkenskapsåret ' + k.arId);
      ut.push({ underlag: u, arId: k.arId, skal: skal, poang: skillnad * 10 + Math.abs(dagar) - (matchpoang(u, bankrad) >= 500 ? 100000 : 0) });
    });
    return ut.sort(function (a, b) { return a.poang - b.poang; }).slice(0, 3);
  }

  // ---------- Tolkning av underlag med Claude ----------

  var TOLKNING_SCHEMA = {
    type: 'object',
    additionalProperties: false,
    required: ['dokumenttyp', 'motpart', 'datum', 'forfallodatum', 'belopp', 'valuta', 'belopp_sek', 'moms', 'fakturanummer', 'ocr', 'beskrivning', 'riktning', 'foreslaget_konto', 'stalld_till_foreningen', 'osakerhet', 'transaktioner'],
    properties: {
      dokumenttyp: { type: 'string', enum: ['faktura', 'kvitto', 'kreditnota', 'kontoutdrag', 'insattningsuppgift', 'annat'] },
      motpart: { type: 'string', description: 'Säljare, avsändare eller bidragsgivare.' },
      datum: { type: 'string', description: 'Fakturadatum, köpdatum eller dokumentets datum som ÅÅÅÅ-MM-DD. Tom sträng om det saknas.' },
      forfallodatum: { type: 'string', description: 'Förfallodatum som ÅÅÅÅ-MM-DD, annars tom sträng.' },
      belopp: { type: 'string', description: 'Totalbelopp att betala eller som betalats, inklusive moms, i dokumentets valuta, med punkt som decimaltecken, t.ex. "1617.79". Alltid positivt.' },
      valuta: { type: 'string', description: 'Valutakod, t.ex. SEK eller EUR.' },
      belopp_sek: { type: 'string', description: 'Beloppet i SEK om dokumentet anger det och valutan inte är SEK, annars tom sträng.' },
      moms: { type: 'string', description: 'Momsbelopp om det anges, annars tom sträng.' },
      fakturanummer: { type: 'string' },
      ocr: { type: 'string', description: 'OCR-nummer eller betalningsreferens, annars tom sträng.' },
      beskrivning: { type: 'string', description: 'Kort svensk text för verifikationen, t.ex. "Lokalhyra november".' },
      riktning: { type: 'string', enum: ['utgift', 'intakt'], description: 'utgift om föreningen betalar, intakt om föreningen får pengar (bidrag, kreditnota, insättning).' },
      foreslaget_konto: { type: 'string', description: 'Fyrsiffrigt konto ur kontoplanen för kostnaden eller intäkten.' },
      stalld_till_foreningen: { type: 'string', enum: ['ja', 'nej', 'oklart'] },
      osakerhet: { type: 'string', description: 'Vad som är oklart eller svårläst, annars tom sträng.' },
      transaktioner: {
        type: 'array',
        description: 'Endast för kontoutdrag: varje transaktion. Annars tom lista.',
        items: {
          type: 'object',
          additionalProperties: false,
          required: ['datum', 'text', 'belopp', 'saldo'],
          properties: {
            datum: { type: 'string' },
            text: { type: 'string' },
            belopp: { type: 'string', description: 'Negativt för uttag, med punkt som decimaltecken.' },
            saldo: { type: 'string', description: 'Saldo efter transaktionen, eller tom sträng.' }
          }
        }
      }
    }
  };

  // ---------- Motpartsregler: leverantör -> konto, inlärt från tidigare bokföringar ----------

  function hittaMotpartsregel(regler, motpart) {
    var n = normaliseraText(motpart);
    if (!n) return null;
    var basta = null, bastaPoang = -1;
    (regler || []).forEach(function (r) {
      var poang = r.monster === n ? 1000 + r.monster.length
        : (' ' + n + ' ').indexOf(' ' + r.monster + ' ') >= 0 || (' ' + r.monster + ' ').indexOf(' ' + n + ' ') >= 0 ? r.monster.length : -1;
      if (poang > bastaPoang) { basta = r; bastaPoang = poang; }
    });
    return basta;
  }

  function larMotpart(regler, motpart, konto) {
    var monster = normaliseraText(motpart);
    regler = (regler || []).slice();
    if (!monster || !giltigtKontonummer(konto)) return regler;
    var regel = { monster: monster, namn: String(motpart).trim(), konto: konto };
    var i = regler.findIndex(function (r) { return r.monster === monster; });
    if (i >= 0) regler[i] = regel; else regler.push(regel);
    return regler;
  }

  function arBetalkonto(nr) { return iIntervall(nr, 1900, 1999) || nr === '2440' || nr === '2890'; }

  // Kostnads- eller intäktskontot i en verifikation, om det finns exakt ett.
  function kontoAttLara(rader) {
    var ovriga = (rader || []).filter(function (r) { return !arBetalkonto(r.konto); });
    return ovriga.length === 1 ? ovriga[0].konto : null;
  }

  // Ger obokförda underlag kontot från inlärda regler, utom där användaren själv valt konto.
  function tillampaMotpartsregler(ar, regler) {
    return Object.assign({}, ar, {
      underlag: (ar.underlag || []).map(function (u) {
        if (u.verifikation != null || u.kontoKalla === 'manuell' || !arBetalbartUnderlag(u)) return u;
        var r = hittaMotpartsregel(regler, u.motpart);
        if (!r || r.konto === u.foreslagetKonto || !ar.kontoplan.some(function (k) { return k.nr === r.konto; })) return u;
        return Object.assign({}, u, { foreslagetKonto: r.konto, kontoKalla: 'inlart' });
      })
    });
  }

  // Kopplar obokförda bankrader till verifikationer som redan bokförts mot bankkontot
  // (t.ex. en faktura som bokfördes innan kontoutdraget lästes in), så att inget bokförs två gånger.
  function kopplaBokforda(ar) {
    var lankade = {}, rattade = {};
    (ar.bankrader || []).forEach(function (r) { if (r.verifikation != null) lankade[r.verifikation] = true; });
    ar.verifikationer.forEach(function (v) { if (v.rattar != null) { rattade[v.rattar] = true; rattade[v.nr] = true; } });
    var kopplade = [];
    var bankrader = (ar.bankrader || []).map(function (r) {
      if (r.verifikation != null) return r;
      var kandidater = ar.verifikationer.filter(function (v) {
        if (lankade[v.nr] || rattade[v.nr]) return false;
        var paBank = v.rader.reduce(function (s, x) { return x.konto === r.konto ? s + x.belopp : s; }, 0);
        return paBank === r.belopp && r.datum >= laggTillDagar(v.datum, -10) && r.datum <= laggTillDagar(v.datum, 60);
      }).sort(function (a, b) { return Math.abs(dagarMellan(a.datum, r.datum)) - Math.abs(dagarMellan(b.datum, r.datum)) || a.nr - b.nr; });
      if (!kandidater.length) return r;
      var v = kandidater[0];
      lankade[v.nr] = true;
      kopplade.push({ bankradId: r.id, nr: v.nr });
      return Object.assign({}, r, { verifikation: v.nr, kopplad: 'efterhand' });
    });
    return { ar: Object.assign({}, ar, { bankrader: bankrader }), kopplade: kopplade };
  }

  // ---------- Fakturor och kvitton som föreningen skriver ----------

  // Fakturor: ÅÅÅÅ-MM:NN (löpnummer per månad). Kvitton: KÅÅÅÅ-NNN (löpnummer per år).
  function nastaDokumentnummer(dokument, typ, datum) {
    var max = 0, prefix, m;
    if (typ === 'faktura') {
      prefix = datum.slice(0, 7) + ':';
      (dokument || []).forEach(function (d) {
        if (d.typ === 'faktura' && d.nummer.indexOf(prefix) === 0 && (m = d.nummer.slice(prefix.length).match(/^\d+$/))) max = Math.max(max, Number(m[0]));
      });
      return prefix + String(max + 1).padStart(2, '0');
    }
    prefix = 'K' + datum.slice(0, 4) + '-';
    (dokument || []).forEach(function (d) {
      if (d.typ === 'kvitto' && d.nummer.indexOf(prefix) === 0 && (m = d.nummer.slice(prefix.length).match(/^\d+$/))) max = Math.max(max, Number(m[0]));
    });
    return prefix + String(max + 1).padStart(3, '0');
  }

  // Antal får ha decimaler (t.ex. 1,5 timme); totalen avrundas till hela ören.
  function dokumentRadTotal(rad) { return Math.round(Number(rad.antal) * rad.pris); }

  function dokumentSumma(dok) {
    return (dok.rader || []).reduce(function (s, r) { return s + dokumentRadTotal(r); }, 0);
  }

  function valideraDokument(dok) {
    var fel = [];
    if (dok.typ !== 'faktura' && dok.typ !== 'kvitto') fel.push('Okänd dokumenttyp.');
    if (!dok.mottagare || !String(dok.mottagare.namn || '').trim()) fel.push('Mottagaren behöver ett namn.');
    if (!arGiltigtDatum(dok.datum)) fel.push('Datum saknas eller är ogiltigt.');
    if (dok.typ === 'faktura' && (!arGiltigtDatum(dok.forfallodatum) || dok.forfallodatum < dok.datum)) fel.push('Förfallodatum saknas eller ligger före fakturadatum.');
    if (dok.typ === 'kvitto') {
      if (!arGiltigtDatum(dok.betaldDatum)) fel.push('Ange när beloppet betalades.');
      else if (arGiltigtDatum(dok.datum) && dok.betaldDatum > dok.datum) fel.push('Betaldatum ligger efter utskrivningsdatum.');
      if (!String(dok.betalsatt || '').trim()) fel.push('Ange hur beloppet betalades.');
    }
    var rader = dok.rader || [];
    if (!rader.length) fel.push('Lägg till minst en rad.');
    rader.forEach(function (r, i) {
      if (!String(r.beskrivning || '').trim()) fel.push('Rad ' + (i + 1) + ': beskrivning saknas.');
      if (!(Number(r.antal) > 0) || !isFinite(Number(r.antal))) fel.push('Rad ' + (i + 1) + ': antalet måste vara större än noll.');
      if (!arHeltal(r.pris) || r.pris < 0) fel.push('Rad ' + (i + 1) + ': priset är ogiltigt.');
      if (r.konto && !giltigtKontonummer(r.konto)) fel.push('Rad ' + (i + 1) + ': kontot ' + r.konto + ' är ogiltigt.');
    });
    if (!fel.length && dokumentSumma(dok) <= 0) fel.push('Summan måste vara större än noll.');
    return fel;
  }

  // Kontot som förekommer med störst belopp på fakturans rader.
  function huvudkonto(dok) {
    var per = {};
    (dok.rader || []).forEach(function (r) { if (r.konto) per[r.konto] = (per[r.konto] || 0) + dokumentRadTotal(r); });
    return Object.keys(per).sort(function (a, b) { return per[b] - per[a] || (a < b ? -1 : 1); })[0] || '';
  }

  // En skickad faktura blir ett underlag som väntar på inbetalning.
  function fakturaTillUnderlag(dok, filnamn) {
    return {
      id: 'dok-' + dok.id,
      filnamn: filnamn,
      dokumenttyp: 'utgaende_faktura',
      dokumentId: dok.id,
      motpart: String(dok.mottagare.foretag || dok.mottagare.namn).trim(),
      datum: dok.datum,
      forfallodatum: dok.forfallodatum,
      belopp: dokumentSumma(dok),
      riktning: 'intakt',
      beskrivning: 'Faktura ' + dok.nummer + ': ' + dok.rader[0].beskrivning,
      fakturanummer: dok.nummer,
      ocr: '',
      foreslagetKonto: huvudkonto(dok),
      kontoKalla: 'faktura'
    };
  }

  // Läser in föreningsuppgifter från en fil. Ifyllda uppgifter behålls; poster som redan finns läggs inte till igen.
  var FORENINGSFAELT = ['namn', 'orgnr', 'bankgiro', 'webb', 'epost', 'swish'];

  function slaIhopForening(befintligt, fil, nyttId) {
    if (!fil || fil.format !== 'foreningsbokforing-forening') throw BokforingsFel('Filen innehåller inga föreningsuppgifter för appen.');
    var nyckel = function (t) { return String(t || '').toLowerCase().replace(/\s+/g, ' ').trim(); };
    var ut = { forening: Object.assign({}, befintligt.forening), adresser: (befintligt.adresser || []).slice(), kontakter: (befintligt.kontakter || []).slice(), artiklar: (befintligt.artiklar || []).slice() };
    var antal = { uppgifter: 0, adresser: 0, kontakter: 0, artiklar: 0 };
    FORENINGSFAELT.forEach(function (f) {
      var v = fil.forening && fil.forening[f] ? String(fil.forening[f]).trim() : '';
      if (v && !String(ut.forening[f] || '').trim()) { ut.forening[f] = v; antal.uppgifter++; }
    });
    (fil.adresser || []).forEach(function (a) {
      if (!a.text || ut.adresser.some(function (x) { return nyckel(x.text) === nyckel(a.text); })) return;
      ut.adresser.push({ id: nyttId(), etikett: String(a.etikett || ''), text: String(a.text) });
      antal.adresser++;
    });
    (fil.kontakter || []).forEach(function (k) {
      if (!k.namn || ut.kontakter.some(function (x) { return nyckel(x.namn) === nyckel(k.namn); })) return;
      ut.kontakter.push({ id: nyttId(), namn: String(k.namn), epost: String(k.epost || ''), mobil: String(k.mobil || '') });
      antal.kontakter++;
    });
    (fil.artiklar || []).forEach(function (a, i) {
      if (!a.beskrivning || !arHeltal(a.pris) || a.pris < 0) throw BokforingsFel('Artikel ' + (i + 1) + ' i filen har ogiltig beskrivning eller pris.');
      if (a.konto && !giltigtKontonummer(a.konto)) throw BokforingsFel('Artikel ' + (i + 1) + ' i filen har ett ogiltigt konto.');
      if (ut.artiklar.some(function (x) { return nyckel(x.beskrivning) === nyckel(a.beskrivning); })) return;
      ut.artiklar.push({ id: nyttId(), beskrivning: String(a.beskrivning), pris: a.pris, konto: a.konto || '' });
      antal.artiklar++;
    });
    // Avgifter för medlemmar: terminer som saknas läggs till, årsavgiften om den inte är angiven.
    if (fil.terminer || fil.arsavgift) {
      var reg = normaliseraRegister(befintligt.medlemsregister);
      antal.terminer = 0;
      (fil.terminer || []).forEach(function (t) {
        if (!t || reg.terminer.some(function (x) { return x.id === t.id; })) return;
        reg = sattTermin(reg, t.id, t.avgifter || {});
        antal.terminer++;
      });
      ['vanlig', 'funktionar'].forEach(function (k) {
        var v = fil.arsavgift && fil.arsavgift[k];
        if (arHeltal(v) && v > 0 && !reg.arsavgift[k]) { reg.arsavgift = Object.assign({}, reg.arsavgift); reg.arsavgift[k] = v; antal.terminer++; }
      });
      ut.medlemsregister = reg;
    }
    return { data: ut, antal: antal };
  }


  // ---------- Medlemmar och terminsavgifter ----------
  // Betalare (ett Swish-nummer, en bankgiroreferens) kopplas till en eller flera medlemmar.
  // Samma barn kan ha flera betalare, och en betalare kan betala för flera.

  var KATEGORIER = [['barn', 'Barn'], ['student', 'Student'], ['vuxen', 'Vuxen'], ['familj', 'Familj'], ['funktionar', 'Funktionär, tränare eller stödmedlem']];
  var KATEGORI_KORT = { barn: 'Barn', student: 'Student', vuxen: 'Vuxen', familj: 'Familj', funktionar: 'Funktionär' };

  function tomtRegister() {
    return { format: 'foreningsbokforing-medlemsregister', medlemmar: [], betalare: [], terminer: [], arsavgift: { vanlig: 0, funktionar: 0 }, konton: { medlemsavgift: '', terminsavgift: '' }, betalningar: [], ignorerade: [], kvitton: [], avforEfterAr: 2 };
  }

  function normaliseraRegister(r) {
    var t = tomtRegister();
    r = r && typeof r === 'object' ? r : {};
    Object.keys(t).forEach(function (k) {
      if (Array.isArray(t[k])) t[k] = Array.isArray(r[k]) ? r[k] : [];
      else if (typeof t[k] === 'object') t[k] = Object.assign(t[k], r[k] || {});
      else if (k === 'avforEfterAr') t[k] = Number.isInteger(r[k]) && r[k] > 0 ? r[k] : t[k];
    });
    return t;
  }

  function registerHarData(r) {
    return !!(r && (r.medlemmar.length || r.betalare.length || r.betalningar.length || r.terminer.length || r.konton.medlemsavgift || r.konton.terminsavgift));
  }

  function kategorinamn(k) {
    var x = KATEGORIER.find(function (y) { return y[0] === k; });
    return x ? x[1] : 'Okänd';
  }

  // Svenskt mobilnummer i en banktext, t.ex. "Swish +46701234567" eller "070-123 45 67".
  function hittaMobilnummer(t) {
    t = String(t || '');
    var re = /(\+46|0046|46|0)((?:[\s-]?\d){9})(?!\d)/g;
    var m;
    while ((m = re.exec(t))) {
      if (m.index > 0 && /[\d+]/.test(t[m.index - 1])) { re.lastIndex = m.index + 1; continue; }
      var d = m[2].replace(/\D/g, '');
      if (d.length === 9 && d[0] === '7') return '+46' + d;
      re.lastIndex = m.index + 1;
    }
    return null;
  }

  function visaMobilnummer(n) {
    var d = String(n).replace(/^\+46/, '');
    return '0' + d.slice(0, 2) + '-' + d.slice(2, 5) + ' ' + d.slice(5, 7) + ' ' + d.slice(7, 9);
  }

  // Vem som betalat, utifrån bankraden. Nyckeln används för att känna igen betalaren nästa gång.
  function tolkaBetalare(bankrad) {
    if (!bankrad) return null;
    var text = String(bankrad.text || ''), ref = String(bankrad.referens || '').trim();
    var mobil = hittaMobilnummer(text + ' ' + ref);
    if (mobil) return { nyckel: mobil, visning: visaMobilnummer(mobil), typ: 'swish' };
    if (ref && /\d/.test(ref)) return { nyckel: 'ref:' + ref.toLowerCase().replace(/\s+/g, ' '), visning: (/bankgiro/i.test(text) ? 'Bankgiro ' : 'Referens ') + ref, typ: 'referens' };
    var n = normaliseraText(text);
    if (n && !/^(swish|bankgiro|insattning|overforing|inbetalning)( |$)/.test(n.replace(/[åä]/g, 'a').replace(/ö/g, 'o'))) return { nyckel: 'text:' + n, visning: text.trim(), typ: 'text' };
    if (n && ref) return { nyckel: 'text:' + n + ' ' + ref.toLowerCase(), visning: text.trim() + ' ' + ref, typ: 'text' };
    return null;
  }

  // Terminer: VT = januari–juni, HT = juli–december. Id som på hemsidor: "HT-26".
  function terminForDatum(datum) {
    return (Number(datum.slice(5, 7)) <= 6 ? 'VT-' : 'HT-') + datum.slice(2, 4);
  }
  function terminSortering(id) { return '20' + id.slice(3, 5) + (id.slice(0, 2) === 'VT' ? '1' : '2'); }
  function terminNamn(id) { return (id.slice(0, 2) === 'VT' ? 'Vårterminen 20' : 'Höstterminen 20') + id.slice(3, 5); }
  function kalenderarForTermin(id) { return '20' + id.slice(3, 5); }
  function foregaendeTermin(id) {
    var ar = Number(id.slice(3, 5));
    return id.slice(0, 2) === 'HT' ? 'VT-' + String(ar).padStart(2, '0') : 'HT-' + String((ar + 99) % 100).padStart(2, '0');
  }
  function nastaTermin(id) {
    var ar = Number(id.slice(3, 5));
    return id.slice(0, 2) === 'VT' ? 'HT-' + String(ar).padStart(2, '0') : 'VT-' + String((ar + 1) % 100).padStart(2, '0');
  }
  function giltigtTerminId(id) { return /^(VT|HT)-\d{2}$/.test(String(id || '')); }

  // Avgifterna för en termin. Saknas terminen gäller den senaste tidigare terminens avgifter.
  function terminsavgifter(reg, id) {
    var t = reg.terminer.find(function (x) { return x.id === id; });
    if (t) return { avgifter: t.avgifter, fran: id };
    var tidigare = reg.terminer.filter(function (x) { return terminSortering(x.id) < terminSortering(id); })
      .sort(function (a, b) { return terminSortering(b.id) < terminSortering(a.id) ? -1 : 1; })[0];
    return tidigare ? { avgifter: tidigare.avgifter, fran: tidigare.id } : { avgifter: {}, fran: null };
  }

  function sattTermin(reg, id, avgifter) {
    if (!giltigtTerminId(id)) throw BokforingsFel('Terminen ska skrivas som VT-27 eller HT-26.');
    var a = {};
    KATEGORIER.forEach(function (k) {
      if (k[0] === 'funktionar') return;
      var v = avgifter && avgifter[k[0]];
      if (v != null && v !== '') { if (!arHeltal(v) || v < 0) throw BokforingsFel('Ogiltig avgift för ' + k[1].toLowerCase() + '.'); a[k[0]] = v; }
    });
    var terminer = reg.terminer.filter(function (t) { return t.id !== id; }).concat([{ id: id, avgifter: a }]);
    terminer.sort(function (x, y) { return terminSortering(x.id) < terminSortering(y.id) ? -1 : 1; });
    return Object.assign({}, reg, { terminer: terminer });
  }

  function taBortTermin(reg, id) {
    return Object.assign({}, reg, { terminer: reg.terminer.filter(function (t) { return t.id !== id; }) });
  }

  function nyttRegisterId(lista, prefix) {
    return prefix + (lista.reduce(function (m, x) { var n = Number(String(x.id).slice(prefix.length)); return n > m ? n : m; }, 0) + 1);
  }

  function laggTillMedlem(reg, uppgifter) {
    var namn = String((uppgifter && uppgifter.namn) || '').trim();
    var kategori = uppgifter && uppgifter.kategori;
    if (!namn) throw BokforingsFel('Medlemmen behöver ett namn.');
    if (!KATEGORIER.some(function (k) { return k[0] === kategori; })) throw BokforingsFel('Välj kategori för medlemmen.');
    var m = { id: nyttRegisterId(reg.medlemmar, 'm'), namn: namn, kategori: kategori };
    if (uppgifter.tillagd) m.tillagd = uppgifter.tillagd;
    return { reg: Object.assign({}, reg, { medlemmar: reg.medlemmar.concat([m]) }), medlem: m };
  }

  // "Information för kvitto": fritext som står under mottagaren, högst 40 tecken per rad och 5 rader.
  var KVITTOINFO = { tecken: 40, rader: 5 };
  function kontrolleraKvittoinfo(text) {
    var rader = String(text || '').replace(/\r/g, '').split('\n');
    while (rader.length && !rader[rader.length - 1].trim()) rader.pop();
    var fel = [];
    if (rader.length > KVITTOINFO.rader) fel.push('Högst ' + KVITTOINFO.rader + ' rader (nu ' + rader.length + ').');
    rader.forEach(function (r, i) { if (r.length > KVITTOINFO.tecken) fel.push('Rad ' + (i + 1) + ' har ' + r.length + ' tecken (högst ' + KVITTOINFO.tecken + ').'); });
    return { text: rader.map(function (r) { return r.replace(/\s+$/, ''); }).join('\n'), fel: fel };
  }

  function andraMedlem(reg, id, andring) {
    if (!reg.medlemmar.some(function (m) { return m.id === id; })) throw BokforingsFel('Medlemmen finns inte.');
    if (andring.info != null) { var ki = kontrolleraKvittoinfo(andring.info); if (ki.fel.length) throw BokforingsFel(ki.fel); andring = Object.assign({}, andring, { info: ki.text }); }
    if (andring.namn != null && !String(andring.namn).trim()) throw BokforingsFel('Medlemmen behöver ett namn.');
    if (andring.kategori != null && !KATEGORIER.some(function (k) { return k[0] === andring.kategori; })) throw BokforingsFel('Okänd kategori.');
    return Object.assign({}, reg, {
      medlemmar: reg.medlemmar.map(function (m) {
        if (m.id !== id) return m;
        var n = Object.assign({}, m);
        if (andring.namn != null) n.namn = String(andring.namn).trim();
        if (andring.kategori != null) n.kategori = andring.kategori;
        if (andring.info != null) { if (andring.info) n.info = andring.info; else delete n.info; }
        return n;
      })
    });
  }

  function taBortMedlem(reg, id) {
    if (reg.betalningar.some(function (b) { return b.poster.some(function (p) { return p.medlem === id; }); })) {
      throw BokforingsFel('Medlemmen har registrerade betalningar och kan inte tas bort.');
    }
    return Object.assign({}, reg, {
      medlemmar: reg.medlemmar.filter(function (m) { return m.id !== id; }),
      betalare: reg.betalare.map(function (b) { return Object.assign({}, b, { medlemmar: b.medlemmar.filter(function (x) { return x !== id; }) }); })
    });
  }

  // Slår ihop två medlemmar: betalningar, betalare och kvitton flyttas från "fran" till "till", och "fran" tas bort.
  function slaIhopMedlemmar(reg, fran, till) {
    if (fran === till) throw BokforingsFel('Välj en annan medlem.');
    var a = reg.medlemmar.find(function (m) { return m.id === fran; }), b = reg.medlemmar.find(function (m) { return m.id === till; });
    if (!a || !b) throw BokforingsFel('Medlemmen finns inte.');
    return Object.assign({}, reg, {
      medlemmar: reg.medlemmar.filter(function (m) { return m.id !== fran; }).map(function (m) {
        return m.id === till && !m.info && a.info ? Object.assign({}, m, { info: a.info }) : m;
      }),
      betalningar: reg.betalningar.map(function (x) {
        if (!x.poster.some(function (p) { return p.medlem === fran; })) return x;
        // Poster för samma medlem och typ läggs ihop.
        var poster = [];
        x.poster.forEach(function (p) {
          var q = Object.assign({}, p, { medlem: p.medlem === fran ? till : p.medlem });
          var finns = poster.find(function (y) { return y.medlem === q.medlem && y.typ === q.typ; });
          if (finns) finns.belopp += q.belopp; else poster.push(q);
        });
        return Object.assign({}, x, { poster: poster });
      }),
      betalare: reg.betalare.map(function (x) {
        if (x.medlemmar.indexOf(fran) < 0) return x;
        var ids = x.medlemmar.map(function (id) { return id === fran ? till : id; }).filter(function (id, i, l) { return l.indexOf(id) === i; });
        return Object.assign({}, x, { medlemmar: ids });
      }),
      kvitton: reg.kvitton.map(function (k) { return k.medlem === fran ? Object.assign({}, k, { medlem: till }) : k; })
    });
  }

  // Ny fördelning av en registrerad betalning på medlemmar, t.ex. när en förälder betalat för två barn.
  function andraFordelning(reg, betalningId, poster, termin) {
    var b = reg.betalningar.find(function (x) { return x.id === betalningId; });
    if (!b) throw BokforingsFel('Betalningen finns inte.');
    if (!poster || !poster.length) throw BokforingsFel('Välj minst en medlem.');
    poster.forEach(function (p) {
      if (!reg.medlemmar.some(function (m) { return m.id === p.medlem; })) throw BokforingsFel('Medlemmen finns inte.');
      if (!arHeltal(p.belopp) || p.belopp < 0) throw BokforingsFel('Ogiltigt belopp.');
    });
    if (summaPoster(poster) !== b.belopp) throw BokforingsFel('Fördelningen (' + formatBelopp(summaPoster(poster)) + ' kr) stämmer inte med beloppet ' + formatBelopp(b.belopp) + ' kr.');
    if (termin != null && !giltigtTerminId(termin)) throw BokforingsFel('Terminen ska skrivas som VT-27 eller HT-26.');
    return Object.assign({}, reg, {
      betalningar: reg.betalningar.map(function (x) {
        if (x.id !== betalningId) return x;
        return Object.assign({}, x, { termin: termin || x.termin, poster: poster.map(function (p) { return { medlem: p.medlem, typ: p.typ === 'arsavgift' ? 'arsavgift' : 'termin', belopp: p.belopp }; }) });
      })
    });
  }

  function hittaBetalare(reg, nyckel) {
    return reg.betalare.find(function (b) { return b.nyckel === nyckel; }) || null;
  }

  // Kopplar en betalare till medlemmar. Tidigare kopplingar finns kvar.
  function kopplaBetalare(reg, betalare, medlemIds) {
    if (!betalare || !betalare.nyckel) return reg;
    var finns = hittaBetalare(reg, betalare.nyckel);
    var ids = (finns ? finns.medlemmar : []).slice();
    (medlemIds || []).forEach(function (id) {
      if (!reg.medlemmar.some(function (m) { return m.id === id; })) throw BokforingsFel('Medlemmen finns inte.');
      if (ids.indexOf(id) < 0) ids.push(id);
    });
    var post = Object.assign({ nyckel: betalare.nyckel, visning: betalare.visning || betalare.nyckel, namn: '' }, finns || {}, { medlemmar: ids });
    return Object.assign({}, reg, { betalare: finns ? reg.betalare.map(function (b) { return b.nyckel === post.nyckel ? post : b; }) : reg.betalare.concat([post]) });
  }

  function andraBetalare(reg, nyckel, andring) {
    if (andring.info != null) { var ki = kontrolleraKvittoinfo(andring.info); if (ki.fel.length) throw BokforingsFel(ki.fel); andring = Object.assign({}, andring, { info: ki.text }); }
    return Object.assign({}, reg, {
      betalare: reg.betalare.map(function (b) {
        if (b.nyckel !== nyckel) return b;
        var n = Object.assign({}, b);
        if (andring.namn != null) n.namn = String(andring.namn).trim();
        if (andring.taBortMedlem) n.medlemmar = n.medlemmar.filter(function (x) { return x !== andring.taBortMedlem; });
        if (andring.info != null) { if (andring.info) n.info = andring.info; else delete n.info; }
        return n;
      })
    });
  }

  function taBortBetalare(reg, nyckel) {
    return Object.assign({}, reg, { betalare: reg.betalare.filter(function (b) { return b.nyckel !== nyckel; }) });
  }

  // Betalningar som gäller, dvs. inte bokförda i en verifikation som sedan rättats.
  function giltigaBetalningar(reg, arMap) {
    return reg.betalningar.filter(function (b) {
      if (b.ver == null || !arMap || !arMap[b.arId]) return true;
      return !rattadAv(arMap[b.arId], b.ver);
    });
  }

  function harBetaltArsavgift(reg, medlemId, kalenderar, arMap) {
    return giltigaBetalningar(reg, arMap).some(function (b) {

  // Poster för ett antal medlemmar en viss termin. Familjeavgiften tas en gång, på den första familjemedlemmen.
  // medArsavgift: true = alla som inte betalt i år, 'forsta' = bara den första (t.ex. en familj), false = ingen.
  function posterFor(reg, termin, medlemmar, medArsavgift, arMap) {
    var avg = terminsavgifter(reg, termin).avgifter;
    var poster = [], familjTagen = false;
    medlemmar.forEach(function (m) {

  function summaPoster(poster) { return poster.reduce(function (s, p) { return s + p.belopp; }, 0); }

  // Förslag på hur en inbetalning fördelas: vilka medlemmar, vilken termin och årsavgift eller inte.

  function avgiftsforslag(reg, inbetalning, arMap) {
    var termin = inbetalning.termin || terminForDatum(inbetalning.datum);

    var ut = { termin: termin, poster: [], summa: 0, stammer: false, tvetydig: false, kand: !!betalare, medlemIds: medlemmar.map(function (m) { return m.id; }) };
    if (!medlemmar.length) return ut;
    var delmangder = [];

  // Texten i verifikationen innehåller inga namn; vilka det gäller finns bara i medlemsregistret.
  function avgiftstext(reg, termin, poster) {

    var harArs = poster.some(function (p) { return p.typ === 'arsavgift' && p.belopp; });
    var harTermin = poster.some(function (p) { return p.typ === 'termin' && p.belopp; });

  // Verifikationsrader för en avgiftsbetalning: bankkontot mot terminsavgift och medlemsavgift.
  function avgiftsrader(reg, poster, bankkonto, belopp) {
    if (summaPoster(poster) !== belopp) throw BokforingsFel('Avgifterna (' + formatBelopp(summaPoster(poster)) + ' kr) stämmer inte med beloppet ' + formatBelopp(belopp) + ' kr.');
    var termin = 0, ars = 0;

  function registreraBetalning(reg, b) {

    if (b.bankradId && reg.betalningar.some(function (x) { return x.bankradId === b.bankradId && x.arId === b.arId; })) throw BokforingsFel('Betalningen är redan kopplad till medlemmar.');
    if (b.kalla && reg.betalningar.some(function (x) { return x.kalla === b.kalla; })) throw BokforingsFel('Betalningen är redan inläst.');
    var post = {
      id: nyttRegisterId(reg.betalningar, 'b'), datum: b.datum, belopp: b.belopp, termin: b.termin,
      nyckel: b.nyckel || '', arId: b.arId || null, ver: b.ver == null ? null : b.ver, bankradId: b.bankradId || null,

  function taBortBetalning(reg, id) {

  }

  // Bokförda inbetalningar med en känd sorts betalare som inte är kopplade till någon medlem.
  function okoppladeInbetalningar(reg, ar, arId) {
    var kopplade = {};

    return (ar.bankrader || []).filter(function (r) {

  function terminerMedData(reg) {

    reg.betalningar.forEach(function (b) { ids[b.termin] = true; });

  // Statistik för en termin: vilka som betalat, per kategori, och vilka som betalade förra terminen men inte nu.
  function terminsstatistik(reg, termin, arMap) {
    var giltiga = giltigaBetalningar(reg, arMap);
    var perMedlem = function (t) {
      var ut = {};
      giltiga.filter(function (b) { return b.termin === t; }).forEach(function (b) {
        b.poster.forEach(function (p) {
          var x = ut[p.medlem] || (ut[p.medlem] = { termin: 0, arsavgift: 0, datum: [] });
          if (p.typ === 'arsavgift') x.arsavgift += p.belopp; else x.termin += p.belopp;

  // ---------- Tidigare år från föreningens Excel-arbetsböcker ----------
  // Arbetsboken lämnas in som { flikar: { namn: [[cell, …], …] } } där datum redan är 'ÅÅÅÅ-MM-DD'.
  // Bokföringen blir en låst arkivkopia; avgifterna i bankfliken blir betalningar i medlemsregistret.

  function flik(bok, namn) {
    var n = Object.keys(bok.flikar || {}).find(function (k) { return k.trim().toLowerCase() === namn.toLowerCase(); });
    return n ? bok.flikar[n] : null;
  }

  function cellText(c) { return c == null ? '' : String(c).trim(); }

  // Rubrikraden: den första raden som innehåller alla rubrikerna. Ger { rad, kol: { rubrik: index } }.
  // Rubriker jämförs utan mellanslag och radbrytningar (i vissa år står "Verifikationsnummer" på flera rader).
  function nyck(t) { return cellText(t).toLowerCase().replace(/[\s\u00ad]+/g, ''); }

  function rubriker(rader, ord) {
    for (var i = 0; i < Math.min(rader.length, 40); i++) {
      var kol = {};
      (rader[i] || []).forEach(function (c, j) { var t = nyck(c); if (t && kol[t] == null) kol[t] = j; });
      if (ord.every(function (o) { return kol[nyck(o)] != null; })) return { rad: i, kol: kol };
    }
    return null;
  }

  function excelDatum(c) {
    var t = cellText(c);
    var m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m && arGiltigtDatum(m[1] + '-' + m[2] + '-' + m[3]) ? m[1] + '-' + m[2] + '-' + m[3] : null;
  }

  function excelBelopp(c) {

  }

  function namnNyckel(namn) {
    return cellText(namn).toLowerCase().replace(/[^a-zåäöéèüæøß\s,-]/g, ' ').replace(/[,-]/g, ' ').split(/\s+/).filter(Boolean).sort().join(' ');

  function tolkaArsbok(bok, filnamn) {
    var ut = { filnamn: filnamn || '', ar: null, kontoplan: [], ingaendeBalans: {}, verifikationer: [], swish: [], avgifter: [], avvikelser: [], saknas: [] };
    // Kontoplan: första heltalet 1000–8999 på raden och texten efter det.
    var kp = flik(bok, 'Kontoplan_lookup') || flik(bok, 'Kontoplan');
    var namn = {};
    (kp || []).forEach(function (r) {
      for (var j = 0; j < (r || []).length; j++) {

        if (/^\s*ingående balans/i.test(cellText(r[k['beskrivning']]))) { ibRader.push({ dk: dk, db: db, kk: kk, kb: kb }); return; }
        var nr = Number(vnr);
        if (!Number.isInteger(nr)) { ut.avvikelser.push('En rad i grundboken har ogiltigt verifikationsnummer (' + cellText(vnr) + ') och hoppades över.'); return; }
        var v = perNr[nr];

        if (kb) { if (!kk) ut.avvikelser.push('Verifikation ' + nr + ': kreditbelopp utan konto.'); v.rader.push({ konto: kk || '????', belopp: -kb }); if (kk && !namn[kk]) namn[kk] = cellText(r[k['kreditkonto']]); }

    var vanligast = Object.keys(ar).sort(function (a, b) { return ar[b] - ar[a]; })[0];
    var fn = String(filnamn || '').match(/(19|20)\d{2}/);
    ut.ar = vanligast || (fn ? fn[0] : null);
    if (ut.ar) {
      ver.forEach(function (v) {
        if (!v.datum) { ut.avvikelser.push('Verifikation ' + v.nr + ' saknar datum och fick ' + ut.ar + '-12-31.'); v.datum = ut.ar + '-12-31'; }
        else if (v.datum.slice(0, 4) !== ut.ar) ut.avvikelser.push('Verifikation ' + v.nr + ' har datum ' + v.datum + ', utanför året.');
        var s = v.rader.reduce(function (x, r) { return x + r.belopp; }, 0);
        if (s !== 0) ut.avvikelser.push('Verifikation ' + v.nr + ' går inte ihop: skillnaden är ' + formatBelopp(s) + ' kr.');
        v.text = avgiftstextUtanNamn(v.text) || 'Verifikation ' + v.nr;
      });
    }
    var ibSumma = Object.keys(ut.ingaendeBalans).reduce(function (x, nr) { return x + ut.ingaendeBalans[nr]; }, 0);
    if (ibSumma !== 0) ut.avvikelser.push('Ingående balans går inte ihop: skillnaden är ' + formatBelopp(ibSumma) + ' kr.');
    ut.verifikationer = ver;
    var anvanda = {};
    ver.forEach(function (v) { v.rader.forEach(function (r) { anvanda[r.konto] = true; }); });
    Object.keys(ut.ingaendeBalans).forEach(function (nr) { anvanda[nr] = true; });
    ut.kontoplan = sorteraKonton(Object.keys(namn).concat(Object.keys(anvanda)).filter(function (nr, i, a) { return a.indexOf(nr) === i; })
      .map(function (nr) { return { nr: nr, namn: namn[nr] || (nr === '????' ? 'Konto saknas i Excel' : 'Konto ' + nr) }; }));
    // Swish-fliken: nummer -> namn
    var sw = flik(bok, 'Swish');

    if (sr) {
      sw.slice(sr.rad + 1).forEach(function (r) {

  // Förhandsgranskning av avgifterna: vilka medlemmar som känns igen och vilka som blir nya.
  function historikForslag(reg, t) {
    var kanda = {};
    reg.medlemmar.forEach(function (m) { if (!m.avford) kanda[namnNyckel(m.namn)] = m.id; });
    var lasta = {};
    reg.betalningar.forEach(function (b) { if (b.kalla) lasta[b.kalla] = true; });
    var nya = {}, betalningar = [], redan = 0;
    t.avgifter.forEach(function (a) {
      if (lasta[a.kalla]) { redan++; return; }
      var nyckel = namnNyckel(a.namn);
      if (!nyckel) return;
      var medlem = kanda[nyckel] || null;
      if (!medlem) {
        var n = nya[nyckel] || (nya[nyckel] = { nyckel: nyckel, namn: visningsnamn(a.namn), antal: 0, kategori: gissaKategori(reg, a), meddelande: a.meddelande || '' });
        n.antal++;

      betalningar.push(Object.assign({}, a, { medlem: medlem, namnNyckel: nyckel }));

  }

  // Lägger in avgifterna och Swish-listan i registret. kategorier: { namnNyckel: kategori } för nya medlemmar.

  function lasInHistorik(reg, t, kategorier, opt) {
    opt = opt || {};

    var fore = reg.betalare.length;
    var id = {};
    reg.medlemmar.forEach(function (m) { if (!m.avford) id[namnNyckel(m.namn)] = m.id; });
    f.nyaMedlemmar.forEach(function (n) {
      var samma = opt.sammaSom && opt.sammaSom[n.nyckel];

      var namn = (opt.namn && String(opt.namn[n.nyckel] || '').trim()) || n.namn;
      var res = laggTillMedlem(reg, { namn: namn, kategori: (kategorier && kategorier[n.nyckel]) || n.kategori, tillagd: t.ar ? t.ar + '-01-01' : undefined });

    t.swish.forEach(function (s) {

  // ---------- Roller ----------
  // Rollerna sparas i roller.json i bokföringsmappen och knyts till Microsoft-inloggningen (e-postadressen).
  // Bara en person i taget har skrivrätten; övriga ser bokföringen i läsläge.

  var ROLLER = [['admin', 'Systemadministratör'], ['kassor', 'Kassör'], ['bokforare', 'Bokförare'], ['revisor', 'Revisor'], ['styrelse', 'Styrelse']];
  var ROLLFORMAT = 'foreningsbokforing-roller';

  function normEpost(e) { return String(e || '').trim().toLowerCase(); }

  function nyRollfil(epost) {
    epost = normEpost(epost);
    if (!epost) throw BokforingsFel('Inloggningen saknar e-postadress.');
    return { format: ROLLFORMAT, personer: [{ epost: epost, roller: ['admin'] }], skrivratt: epost, logg: [] };
  }

  function rollerFor(fil, epost) {
    var p = fil && fil.personer.find(function (x) { return x.epost === normEpost(epost); });
    return p ? p.roller.slice() : [];
  }

  function harRoll(fil, epost, roll) { return rollerFor(fil, epost).indexOf(roll) >= 0; }

  // Behörighet i OneDrive som rollerna ger: bokföringsmappen och medlemsregistrets mapp.
  function behorighet(roller) {
    var b = { data: null, reg: null };
    roller.forEach(function (r) {
      if (r === 'admin' || r === 'kassor' || r === 'bokforare') { b.data = 'write'; b.reg = 'write'; }
      if (r === 'styrelse') { if (!b.data) b.data = 'read'; if (!b.reg) b.reg = 'read'; }
      if (r === 'revisor') { if (!b.data) b.data = 'read'; }
    });
    return b;
  }

  function kanFaSkrivratt(fil, epost) { return rollerFor(fil, epost).some(function (r) { return r === 'admin' || r === 'kassor' || r === 'bokforare'; }); }
  function kanTaSkrivratt(fil, epost) { return rollerFor(fil, epost).some(function (r) { return r === 'admin' || r === 'kassor'; }); }

  function rollLogg(fil, av, text, tid) { return (fil.logg || []).concat([{ tid: tid || null, av: normEpost(av), text: text }]).slice(-100); }

  // Sätter en persons roller. Tomma roller tar bort personen. Det måste alltid finnas en systemadministratör.
  function sattRoller(fil, av, epost, roller, tid) {
    if (!harRoll(fil, av, 'admin')) throw BokforingsFel('Bara en systemadministratör kan ändra roller.');
    epost = normEpost(epost);
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(epost)) throw BokforingsFel('Skriv en giltig e-postadress.');
    roller = ROLLER.map(function (r) { return r[0]; }).filter(function (r) { return roller.indexOf(r) >= 0; });
    var personer = fil.personer.filter(function (x) { return x.epost !== epost; });
    if (roller.length) personer.push({ epost: epost, roller: roller });
    if (!personer.some(function (x) { return x.roller.indexOf('admin') >= 0; })) throw BokforingsFel('Det måste finnas minst en systemadministratör.');
    var ut = Object.assign({}, fil, { personer: personer, logg: rollLogg(fil, av, epost + ': ' + (roller.length ? roller.join(', ') : 'borttagen'), tid) });

    return ut;
  }

  // Skrivrätten lämnas över av den som har den, eller tas av en kassör eller systemadministratör.

  // ---------- Årsmötet ----------

    'Val av protokolljusterare och rösträknare.',

  function rostlangd(reg, motesdatum, arMap, andringar) {

  // ---------- Avförande och kvitton ----------

  // Avför en medlem (utträde eller enligt stadgarna) och tar bort personuppgifterna.
  // Betalningarna finns kvar för statistiken, men utan namn och utan koppling till betalarens nummer.
  function avforMedlem(reg, id, datum, orsak) {
    var m = reg.medlemmar.find(function (x) { return x.id === id; });
    if (!m) throw BokforingsFel('Medlemmen finns inte.');
    if (m.avford) throw BokforingsFel('Medlemmen är redan avförd.');

      .filter(function (b) { return b.medlemmar.length > 0; });

      medlemmar: reg.medlemmar.map(function (x) { return x.id === id ? { id: x.id, namn: 'Tidigare medlem', kategori: x.kategori, avford: datum, orsak: orsak || '' } : x; }),
      betalare: betalare,
      // Betalarens nummer sparas inte längre på betalningar som bara gällde den här medlemmen.
      betalningar: reg.betalningar.map(function (b) {

    var ar = {};
    giltigaBetalningar(reg, arMap).forEach(function (b) {

      if (b.poster.some(function (p) { return p.medlem === medlemId && ((p.typ === 'arsavgift' && p.belopp > 0) || b.historik); })) ar[kalenderarForTermin(b.termin)] = true;
    });

  // Medlemmar som inte betalat årsavgift de senaste hela verksamhetsåren (stadgarnas regel, normalt två år).
  function attAvfora(reg, datum, arMap) {
    var n = reg.avforEfterAr || 2;
    var iAr = Number(datum.slice(0, 4));
    var ar = [];
    for (var i = n; i >= 1; i--) ar.push(String(iAr - i));

      if (m.avford) return false;

  // ---------- Filer (sparas i webbläsarens IndexedDB tills OneDrive är på plats) ----------

  var FILDB = 'forening-bokforing-filer';
  function oppnaDb(namn) {
    return new Promise(function (ok, fel) {
      var r = indexedDB.open(namn || (OVNING ? FILDB + '-ovning' : FILDB), 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('filer'); };

    });
  }
  function dbAnrop(lage, fn) {
    return oppnaDb().then(function (db) {
      return new Promise(function (ok, fel) {
        var tx = db.transaction('filer', lage);
        var req = fn(tx.objectStore('filer'));
        tx.oncomplete = function () { ok(req && req.result); };
        tx.onerror = function () { fel(tx.error); };
      });
    });
  }
  function sparaFil(id, blob, namn) { return dbAnrop('readwrite', function (s) { return s.put({ blob: blob, namn: namn }, id); }); }
  // Ett underlag ur det öppnade revisionspaketet.
  async function filIPaket(id) {
    var vag = revision.filer[id];

  function hamtaFil(id) {

    if (!OVNING) return egen;
    // I övningsläget kan underlag från den riktiga bokföringen visas, men aldrig ändras.
    return egen.then(function (rec) {
      if (rec) return rec;
      return oppnaDb(FILDB).then(function (db) {
        return new Promise(function (ok) { var tx = db.transaction('filer', 'readonly'); var q = tx.objectStore('filer').get(id); tx.oncomplete = function () { ok(q.result); }; tx.onerror = function () { ok(null); }; });
      }).catch(function () { return null; });

  function blobTillBase64(blob) {
    return new Promise(function (ok, fel) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).split(',')[1]); };
      r.onerror = function () { fel(r.error); };
      r.readAsDataURL(blob);

  // Stora foton förminskas innan de skickas; originalet sparas.
  async function bildBlock(fil) {
    var bild;
    try { bild = await createImageBitmap(fil); }
    catch (e) { throw new Error(fil.name + ': bilden kunde inte öppnas. Spara den som JPEG eller PNG och försök igen.'); }
    var skala = Math.min(1, 2000 / Math.max(bild.width, bild.height));
    var canvas = document.createElement('canvas');
    canvas.width = Math.round(bild.width * skala);
    canvas.height = Math.round(bild.height * skala);
    canvas.getContext('2d').drawImage(bild, 0, 0, canvas.width, canvas.height);
    var blob = await new Promise(function (ok) { canvas.toBlob(ok, 'image/jpeg', 0.85); });
    return { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: await blobTillBase64(blob) } };
  }

  }

  async function claudeKlient() {
    var nyckel = lasNyckel();
    if (!nyckel) throw new Error('Lägg in en API-nyckel för Claude under "År och arkiv" först.');
    if (!sdkModul) sdkModul = await import(SDK_URL);
    return new sdkModul.default({ apiKey: nyckel, dangerouslyAllowBrowser: true });
  }

  function claudeFel(err) {
    if (sdkModul && err instanceof sdkModul.AuthenticationError) {
      nyckelAvvisad = true;
      return 'API-nyckeln fungerar inte längre (troligen har den gått ut). Se rutan högst upp för hur du skaffar en ny.';
    }
    if (sdkModul && err instanceof sdkModul.PermissionDeniedError) return 'API-nyckeln saknar behörighet. Skapa en ny nyckel i Default workspace på platform.claude.com.';
    if (sdkModul && err instanceof sdkModul.BadRequestError && /credit/i.test(err.message)) {
      return 'Kontot hos Anthropic har slut på krediter. Fyll på under Billing på platform.claude.com och läs in filen igen.';
    }
    if (sdkModul && err instanceof sdkModul.RateLimitError) return 'Claude har för många anrop just nu. Vänta en stund och försök igen.';
    if (sdkModul && err instanceof sdkModul.APIConnectionError) return 'Kunde inte nå Claude. Kontrollera internetanslutningen.';
    if (sdkModul && err instanceof sdkModul.APIError) return 'Claude svarade med ett fel: ' + err.message;
    return err.message;
  }

  async function tolkaMedClaude(ar, block) {
    var client = await claudeKlient();
    var svar = await client.beta.messages.create({
      model: MODELL,
      max_tokens: 16000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: K.TOLKNING_SCHEMA } },
      system: K.tolkningsInstruktion(ar, store.forening, store.motpartsregler),
      messages: [{ role: 'user', content: [block, { type: 'text', text: 'Tolka underlaget.' }] }]
    });
    if (svar.stop_reason === 'refusal') throw new Error('Claude avböjde att tolka underlaget.');
    if (svar.stop_reason === 'max_tokens') throw new Error('Svaret blev för långt. Dela upp kontoutdraget i mindre delar.');
    var text = svar.content.filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('');
    return JSON.parse(text);
  }

  // ---------- OneDrive ----------
  // Inloggning med Microsoft-konto (OAuth 2.0 med PKCE, ingen server behövs) och Microsoft Graph.
  // Bokföringen sparas som en fil i föreningens mapp; underlagen som vanliga filer i årsmapparna.

  var OD_NYCKEL = 'forening-bokforing:onedrive';
  var OD_AUTH = 'https://login.microsoftonline.com/consumers';
  // .All behövs för att läsa och skriva i mappar som någon annan har delat (revisor, styrelse, bokförare).

  var ROLLFIL = 'roller.json';
  var GRAF = 'https://graph.microsoft.com/v1.0';

  // det talar bara om vilken app som loggar in. Andra adresser anger sitt eget under År och arkiv.
  var STANDARD_KLIENTER = { 'karmadonkey.github.io': '0c0a38fc-1bb6-47a2-b690-e9e749dfb800' };
  var QR_URL = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
  var JSPDF_URL = 'https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js';
  var JSZIP_URL = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';

  var INBJUDAN = 'forening-bokforing:inbjudan';
  var od = { clientId: null, refreshToken: null, konto: null, mapp: null, lage: null, eTag: null, senast: null, smutsig: false };
  var odNu = { token: null, utgar: 0, status: '', fel: null, konflikt: false, synkar: false, igen: false, inloggningKravs: false, timer: null, senastHamtat: 0, mappar: {} };

  function laddaOd() {

  function sparaOd() { try { localStorage.setItem(OD_NYCKEL, JSON.stringify(od)); } catch (e) { /* tomt */ } }
  function odAnslutet() { return !revision && !OVNING && !!(od.clientId && od.refreshToken && od.mapp); }
  function mig() { return String(od.konto || '').trim().toLowerCase(); }

  // Skrivrätten: bara en person i taget. Utan rollfil gäller det gamla: den som äger mappen får skriva.
  function kanSkriva() {

  function b64url(buf) {
    var b = new Uint8Array(buf), s = '';
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function slumptext(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a.buffer).slice(0, n); }

  async function startaInloggning(tyst) {
    var verifierare = slumptext(64);
    var utmaning = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifierare)));
    var tillstand = slumptext(24);
    sessionStorage.setItem('forening-bokforing:inloggning', JSON.stringify({ verifierare: verifierare, tillstand: tillstand, tyst: !!tyst }));
    var p = new URLSearchParams({
      client_id: od.clientId, response_type: 'code', redirect_uri: omdirigering(), response_mode: 'query',
      scope: OD_OMFANG, code_challenge: utmaning, code_challenge_method: 'S256', state: tillstand
    });
    if (tyst) { p.set('prompt', 'none'); try { localStorage.setItem('forening-bokforing:tyst-inloggning', String(Date.now())); } catch (e) { /* tomt */ } }
    location.assign(OD_AUTH + '/oauth2/v2.0/authorize?' + p.toString());
  }

  async function tokenAnrop(param) {
    var kropp = new URLSearchParams(Object.assign({ client_id: od.clientId, scope: OD_OMFANG }, param));
    var res = await fetch(OD_AUTH + '/oauth2/v2.0/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: kropp.toString() });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) { var e = new Error(data.error_description || data.error || 'Inloggningen misslyckades.'); e.kod = data.error; throw e; }
    odNu.token = data.access_token;
    odNu.utgar = Date.now() + (data.expires_in || 3600) * 1000;
    if (data.refresh_token) od.refreshToken = data.refresh_token;
    odNu.inloggningKravs = false;
    sparaOd();
  }

  async function hamtaToken() {
    if (odNu.token && Date.now() < odNu.utgar - 60000) return odNu.token;
    if (!od.refreshToken) { odNu.inloggningKravs = true; throw new Error('Logga in med Microsoft för att synka med OneDrive.'); }
    try {
      await tokenAnrop({ grant_type: 'refresh_token', refresh_token: od.refreshToken });
    } catch (err) {
      if (err.kod === 'invalid_grant' || err.kod === 'interaction_required' || err.kod === 'consent_required' || err.kod === 'invalid_scope') {
        od.refreshToken = null;
        sparaOd();
        odNu.inloggningKravs = true;
        throw new Error('Inloggningen till OneDrive har gått ut. Logga in igen.');
      }
      throw err;
    }
    return odNu.token;
  }

  // Anrop till Microsoft Graph. opt.ra = returnera själva svaret, opt.tillat = statuskoder som inte är fel.
  async function graf(sokvag, opt) {
    opt = opt || {};
    var token = await hamtaToken();
    var res = await fetch(/^https:/.test(sokvag) ? sokvag : GRAF + sokvag, {
      method: opt.method || 'GET',
      headers: Object.assign({ Authorization: 'Bearer ' + token }, opt.headers || {}),
      body: opt.body
    });
    if ((opt.tillat || []).indexOf(res.status) >= 0) return opt.ra ? res : res.status;
    if (!res.ok) {
      var data = await res.json().catch(function () { return {}; });
      throw new Error((data.error && data.error.message) || ('OneDrive svarade med fel ' + res.status + '.'));
    }
    return opt.ra ? res : res.status === 204 ? null : res.json();
  }

  function enc(rel) { return rel.split('/').map(encodeURIComponent).join('/'); }
  function iMappen(rel) { return '/drives/' + od.mapp.driveId + '/items/' + od.mapp.id + ':/' + enc(rel) + ':'; }
  function katalog(rel) { return rel.slice(0, rel.lastIndexOf('/')); }

  // ---------- Inställningar i användarens egen appmapp (OneDrive: Appar/Föreningsbokföring) ----------
  // Här sparas vilken mapp appen ska använda, och API-nyckeln för Claude, så att en ny enhet
  // bara behöver logga in. Appmappen är privat och ligger inte i föreningens delade mapp.

  async function lasAppinstallningar() {
    var res = await graf('/me/drive/special/approot:/' + INSTALLNINGSFIL + ':/content', { tillat: [404], ra: true });
    if (res.status === 404) return {};
    return res.json().catch(function () { return {}; });

  // Skrivningar görs i tur och ordning, så att två ändringar nästan samtidigt inte skriver över varandra.
  var appinstallningsko = Promise.resolve();
  function sparaAppinstallningar(andring) {
    var steg = appinstallningsko.then(async function () {
      var nu = await lasAppinstallningar();
      await graf('/me/drive/special/approot:/' + INSTALLNINGSFIL + ':/content', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({}, nu, andring))
      });
    });
    appinstallningsko = steg.catch(function () { /* nästa ändring försöker igen */ });
    return steg;
  }

  function nyckelAndrad() { try { return Number(localStorage.getItem(NYCKEL_ANDRAD)) || 0; } catch (e) { return 0; } }

  // Skickar en ändrad API-nyckel till appmappen så att dina andra enheter får den.
  function delaNyckel() {
    try { localStorage.setItem(NYCKEL_ANDRAD, String(Date.now())); } catch (e) { /* tomt */ }
    if (!od.refreshToken) return;
    sparaAppinstallningar({ claude: { nyckel: lasNyckel() || null, utgar: nyckelUtgar() || null, andrad: nyckelAndrad() } })
      .catch(function () { /* nästa gång */ });
