    importeraBankrader: importeraBankrader,
    oppnaBankrader: oppnaBankrader,
    bankavstamning: bankavstamning,
    hittaRegel: hittaRegel,
    larRegel: larRegel,
    laggTillUnderlag: laggTillUnderlag,
    andraUnderlag: andraUnderlag,
    taBortUnderlag: taBortUnderlag,
    oppnaUnderlag: oppnaUnderlag,
    matchaUnderlag: matchaUnderlag,
    forslagForBankrad: forslagForBankrad,
    bokforKopplat: bokforKopplat,
    TOLKNING_SCHEMA: TOLKNING_SCHEMA,
    tolkningsInstruktion: tolkningsInstruktion,
    normaliseraTolkning: normaliseraTolkning
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<!-- Gränssnittet. Data sparas tills vidare i webbläsaren; OneDrive kommer i en senare fas. -->
<script>
(function () {
  'use strict';
  var K = window.Karna;
  var LAGRING = 'forening-bokforing:v1';

  var NYCKEL = 'forening-bokforing:claude-nyckel';
  var NYCKEL_UTGAR = 'forening-bokforing:claude-nyckel-utgar';
  var nyckelAvvisad = false;
  var visaNyckelForm = false;
  var SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.4.0/+esm';
  var MODELL = 'claude-opus-5-5';

  var store = { format: 1, forening: { namn: '', orgnr: '' }, ar: {}, aktivt: null, regler: [] };
  var vy = 'inlasning';
  var inkorgVal = {};
  var logg = [];
  var arbetar = null;
  var rapportVy = 'rr';
  var oppenVer = null;
  var valtKonto = '1930';
  var meddelande = null;
  var utkast = nyttUtkast();

  // ---------- Lagring ----------

  function ladda() {
    try {
      var rad = localStorage.getItem(LAGRING);
      if (rad) {
        var d = JSON.parse(rad);
        if (d && d.format === 1 && d.ar) store = d;
        if (!store.regler) store.regler = [];
      }
    } catch (e) { /* tom lagring är okej */ }
  }

  function spara() {
    try { localStorage.setItem(LAGRING, JSON.stringify(store)); }
    catch (e) { visa('Kunde inte spara i webbläsaren. Exportera en säkerhetskopia under Arkiv.', true); }
  }

  function aktivt() { return store.aktivt ? store.ar[store.aktivt] : null; }

  function setAktivt(ar) {
    store.ar[store.aktivt] = ar;
    spara();
  }

  function foregaende(ar) {
    var dagenFore = K.laggTillDagar(ar.start, -1);
    var id = Object.keys(store.ar).find(function (k) { return store.ar[k].slut === dagenFore; });
    return id ? store.ar[id] : null;
  }

  // ---------- Hjälp ----------

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function kr(ore) { return K.formatBelopp(ore); }
  function antal(n, en, flera) { return n + ' ' + (n === 1 ? en : flera); }
  function idag() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  // Förslag vid låsning: sista dagen i förra månaden, aldrig hela året i förväg.
  function forslagLasDatum(ar) {
    var d = idag().slice(0, 8) + '01';
    d = K.laggTillDagar(d, -1);
    if (d > ar.slut) d = ar.slut;
    if (d < ar.start) d = ar.start;
    return d;
  }
  function standardDatum(ar) {
    var d = idag();
    if (d < ar.start) return ar.start;
    if (d > ar.slut) return ar.slut;
    return d;
  }
  function visa(text, arFel) { meddelande = { text: text, fel: !!arFel }; render(); }

  function nyttUtkast() {
    return { datum: '', text: '', underlag: '', underlagKommentar: '', rader: [tomRad(), tomRad()] };
  }
  function tomRad() { return { konto: '', debet: '', kredit: '' }; }

  function laddaNer(namn, data, typ) {
    var blob = new Blob([data], { type: typ });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = namn;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // ---------- Filer (sparas i webbläsarens IndexedDB tills OneDrive är på plats) ----------

  function oppnaDb() {
    return new Promise(function (ok, fel) {
      var r = indexedDB.open('forening-bokforing-filer', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('filer'); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { fel(r.error); };
    });
  }
  function dbAnrop(lage, fn) {
    return oppnaDb().then(function (db) {
      return new Promise(function (ok, fel) {
        var tx = db.transaction('filer', lage);
        var req = fn(tx.objectStore('filer'));
        tx.oncomplete = function () { ok(req && req.result); };
        tx.onerror = function () { fel(tx.error); };
      });
    });
  }
  function sparaFil(id, blob, namn) { return dbAnrop('readwrite', function (s) { return s.put({ blob: blob, namn: namn }, id); }); }
  function hamtaFil(id) { return dbAnrop('readonly', function (s) { return s.get(id); }); }
  function taBortFil(id) { return dbAnrop('readwrite', function (s) { return s.delete(id); }); }

  function visaFil(id) {
    var fonster = window.open('', '_blank');
    hamtaFil(id).then(function (rec) {
      if (!rec) { if (fonster) fonster.close(); visa('Filen finns inte i den här webbläsaren.', true); return; }
      var url = URL.createObjectURL(rec.blob);
      if (fonster) fonster.location = url; else window.location = url;
    });
  }

  function blobTillBase64(blob) {
    return new Promise(function (ok, fel) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).split(',')[1]); };
      r.onerror = function () { fel(r.error); };
      r.readAsDataURL(blob);
    });
  }

  // Stora foton förminskas innan de skickas; originalet sparas.
  async function bildBlock(fil) {
    var bild;
    try { bild = await createImageBitmap(fil); }
    catch (e) { throw new Error(fil.name + ': bilden kunde inte öppnas. Spara den som JPEG eller PNG och försök igen.'); }
    var skala = Math.min(1, 2000 / Math.max(bild.width, bild.height));
    var canvas = document.createElement('canvas');
    canvas.width = Math.round(bild.width * skala);
    canvas.height = Math.round(bild.height * skala);
    canvas.getContext('2d').drawImage(bild, 0, 0, canvas.width, canvas.height);
    var blob = await new Promise(function (ok) { canvas.toBlob(ok, 'image/jpeg', 0.85); });
    return { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: await blobTillBase64(blob) } };
  }

  async function lasText(fil) {
    var buf = await fil.arrayBuffer();
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { return new TextDecoder('windows-1252').decode(buf); }
  }

  // ---------- Claude ----------

  function lasNyckel() { try { return localStorage.getItem(NYCKEL) || ''; } catch (e) { return ''; } }
  function nyckelUtgar() { try { return localStorage.getItem(NYCKEL_UTGAR) || ''; } catch (e) { return ''; } }
  function dagarKvar(datum) { return Math.round((new Date(datum + 'T00:00:00') - new Date(idag() + 'T00:00:00')) / 86400000); }
  var sdkModul = null;

  var NY_NYCKEL_STEG = '<ol>' +
    '<li>Gå till <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">platform.claude.com</a> och logga in.</li>' +
    '<li>Välj <strong>API keys</strong> och sedan <strong>Create key</strong>. Skriv namnet Föreningsbokföring och välj en lång giltighetstid, t.ex. 1 år.</li>' +
    '<li>Kopiera nyckeln (den visas bara en gång).</li>' +
    '<li>Klistra in den här under <strong>År och arkiv → Claude</strong>, skriv in när den går ut och tryck Spara.</li>' +
    '<li>Läs in de filer som inte gick igenom en gång till.</li></ol>';

  // Varning som syns överallt när nyckeln snart går ut, har gått ut eller avvisats.
  function nyckelBanner() {
    if (!lasNyckel()) return '';
    var utgar = nyckelUtgar();
    var kvar = utgar ? dagarKvar(utgar) : null;
    var rubrik = null, fel = true;
    if (nyckelAvvisad) rubrik = 'Claude godtar inte längre API-nyckeln. Den har troligen gått ut eller tagits bort.';
    else if (kvar != null && kvar < 0) rubrik = 'API-nyckeln för Claude gick ut ' + utgar + '. Fakturor och kvitton kan inte läsas in förrän du lagt in en ny.';
    else if (kvar != null && kvar <= 14) { rubrik = 'API-nyckeln för Claude går ut ' + utgar + (kvar === 0 ? ' (i dag)' : ' (om ' + kvar + (kvar === 1 ? ' dag)' : ' dagar)')) + '. Skaffa en ny i god tid.'; fel = kvar <= 3; }
    if (!rubrik) return '';
    return '<div class="card ' + (fel ? 'fel' : '') + '" role="alert"><strong>' + esc(rubrik) + '</strong>' +
      '<p style="margin-bottom:0">Så här gör du:</p>' + NY_NYCKEL_STEG +
      '<button class="btn btn-small" data-action="till-claude-installning">Gå till inställningen</button></div>';
  }

  async function claudeKlient() {
    var nyckel = lasNyckel();
    if (!nyckel) throw new Error('Lägg in en API-nyckel för Claude under "År och arkiv" först.');
    if (!sdkModul) sdkModul = await import(SDK_URL);
    return new sdkModul.default({ apiKey: nyckel, dangerouslyAllowBrowser: true });
  }

  function claudeFel(err) {
    if (sdkModul && err instanceof sdkModul.AuthenticationError) {
      nyckelAvvisad = true;
      return 'API-nyckeln fungerar inte längre (troligen har den gått ut). Se rutan högst upp för hur du skaffar en ny.';
    }
    if (sdkModul && err instanceof sdkModul.PermissionDeniedError) return 'API-nyckeln saknar behörighet. Skapa en ny nyckel i Default workspace på platform.claude.com.';
    if (sdkModul && err instanceof sdkModul.BadRequestError && /credit/i.test(err.message)) {
      return 'Kontot hos Anthropic har slut på krediter. Fyll på under Billing på platform.claude.com och läs in filen igen.';
    }
    if (sdkModul && err instanceof sdkModul.RateLimitError) return 'Claude har för många anrop just nu. Vänta en stund och försök igen.';
    if (sdkModul && err instanceof sdkModul.APIConnectionError) return 'Kunde inte nå Claude. Kontrollera internetanslutningen.';
    if (sdkModul && err instanceof sdkModul.APIError) return 'Claude svarade med ett fel: ' + err.message;
    return err.message;
  }

  async function tolkaMedClaude(ar, block) {
    var client = await claudeKlient();
    var svar = await client.beta.messages.create({
      model: MODELL,
      max_tokens: 16000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'medium', format: { type: 'json_schema', schema: K.TOLKNING_SCHEMA } },
      system: K.tolkningsInstruktion(ar, store.forening),
      messages: [{ role: 'user', content: [block, { type: 'text', text: 'Tolka underlaget.' }] }]
    });
    if (svar.stop_reason === 'refusal') throw new Error('Claude avböjde att tolka underlaget.');
    if (svar.stop_reason === 'max_tokens') throw new Error('Svaret blev för långt. Dela upp kontoutdraget i mindre delar.');
    var text = svar.content.filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('');
    return JSON.parse(text);
  }

  // ---------- Inläsning ----------

  function arForDatum(d) {
    if (!d) return null;
    return Object.keys(store.ar).find(function (id) { return store.ar[id].start <= d && d <= store.ar[id].slut; }) || null;
  }

  function logga(text, fel) { logg.unshift({ text: text, fel: !!fel }); logg = logg.slice(0, 12); }

  function importeraRader(rader) {
    var nya = 0, dubbletter = 0;
    Object.keys(store.ar).forEach(function (id) {
      var res = K.importeraBankrader(store.ar[id], rader);
      store.ar[id] = res.ar;
      nya += res.nya;
      dubbletter += res.dubbletter;
    });
    var utanfor = rader.filter(function (r) { return !arForDatum(r.datum); });
    spara();
    var text = antal(nya, 'ny banktransaktion', 'nya banktransaktioner') + (dubbletter ? ', ' + dubbletter + ' fanns redan' : '') + '.';
    if (utanfor.length) {
      var ar = Array.from(new Set(utanfor.map(function (r) { return r.datum.slice(0, 4); }))).join(', ');
      text += ' ' + antal(utanfor.length, 'rad gäller', 'rader gäller') + ' år som inte är upplagda (' + ar + ') och hoppades över.';
    }
    return text;
  }

  function importeraBanktext(text, namn) {
    var res = K.parseBankfil(text);
    if (!res.rader.length) throw new Error((namn ? namn + ': ' : '') + 'hittade inga transaktioner. ' + res.varningar.slice(0, 2).join(' '));
    logga((namn ? namn + ': ' : '') + importeraRader(res.rader));
    res.varningar.slice(0, 5).forEach(function (v) { logga(v, true); });
  }

  function sakertFilnamn(namn) { return String(namn).replace(/[\\/:*?"<>|]+/g, '_').slice(-120) || 'underlag'; }

  async function tolkaFil(fil) {
    var arNu = aktivt();
    var arPdf = fil.type === 'application/pdf' || /\.pdf$/i.test(fil.name);
    var block = arPdf
      ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: await blobTillBase64(fil) } }
      : await bildBlock(fil);
    var t = await tolkaMedClaude(arNu, block);
    var id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var n = K.normaliseraTolkning(t, { id: id, filnamn: sakertFilnamn(fil.name) });
    await sparaFil(id, fil, n.underlag.filnamn);
    if (n.bankrader) {
      setAktivt(K.laggTillUnderlag(aktivt(), n.underlag));
      logga(fil.name + ' (kontoutdrag): ' + importeraRader(n.bankrader));
    } else {
      var u = n.underlag;
      var arId = arForDatum(u.forfallodatum || u.datum) || store.aktivt;
      store.ar[arId] = K.laggTillUnderlag(store.ar[arId], u);
      spara();
      logga(fil.name + ': ' + (u.motpart || 'okänd motpart') + ', ' + kr(u.belopp) + ' kr' + (u.foreslagetKonto ? ', konto ' + u.foreslagetKonto : '') + (arId !== store.aktivt ? ' (lagt i ' + arId + ')' : '') + '.');
    }
    n.varningar.forEach(function (v) { logga(fil.name + ': ' + v, true); });
  }

  async function lasInFiler(filer) {
    for (var i = 0; i < filer.length; i++) {
      var fil = filer[i];
      arbetar = 'Läser ' + fil.name + (filer.length > 1 ? ' (' + (i + 1) + ' av ' + filer.length + ')' : '') + '…';
      render();
      try {
        if (/\.(csv|txt|tsv|skv)$/i.test(fil.name) || /^text\//.test(fil.type)) importeraBanktext(await lasText(fil), fil.name);
        else if (/\.xlsx?m?$/i.test(fil.name)) throw new Error('Excel-filer kan inte läsas direkt. Exportera kontoutdraget som CSV, eller markera raderna i Excel och klistra in dem här.');
        else if (fil.type === 'application/pdf' || /\.pdf$/i.test(fil.name) || /^image\//.test(fil.type)) await tolkaFil(fil);
        else throw new Error('okänd filtyp.');
      } catch (err) {
        logga(fil.name + ': ' + claudeFel(err), true);
      }
    }
    arbetar = null;
    render();
  }

  function forslagMedVal(ar, rad) {
    var val = inkorgVal[rad.id] || {};
    var f = K.forslagForBankrad(ar, rad, store.regler, val.underlagIds ? { underlagIds: val.underlagIds } : undefined);
    if (val.konto != null && f.rader.length === 2) f.rader[1].konto = val.konto.trim();
    if (val.text != null) f.text = val.text;
    // Inbetalningar och bankavgifter syns i bankutdraget och behöver inget eget underlag.
    if (!f.underlagIds.length && f.rader.length === 2 && (rad.belopp > 0 || f.rader[1].konto === '6570')) f.underlagKommentar = 'Bankutdrag';
    f.komplett = f.rader.every(function (r) { return ar.kontoplan.some(function (k) { return k.nr === r.konto; }); });
    return f;
  }

  function larAv(rad, rader) {
    if (rader.length === 2) store.regler = K.larRegel(store.regler, rad.text, rad.belopp, rader[1].konto);
  }

  function bokforBankrad(ar, rad) {
    var f = forslagMedVal(ar, rad);
    if (!f.komplett) throw new Error('Välj konto för ' + rad.datum + ' ' + rad.text + ' först.');
    var res = K.bokforKopplat(ar, {
      datum: f.datum, text: f.text, rader: f.rader, underlagKommentar: f.underlagKommentar, registrerad: new Date().toISOString()
    }, { bankradId: rad.id, underlagIds: f.underlagIds });
    larAv(rad, f.rader);
    delete inkorgVal[rad.id];
    return res;
  }

  function radTillUtkast(r) {
    return { konto: r.konto, debet: r.belopp > 0 ? K.formatBelopp(r.belopp) : '', kredit: r.belopp < 0 ? K.formatBelopp(-r.belopp) : '' };
  }

  // ---------- Rendering ----------

  var VYER = [
    ['inlasning', 'Läs in'],
    ['verifikationer', 'Verifikationer'],
    ['ny', 'Ny verifikation'],
    ['huvudbok', 'Huvudbok'],
    ['rapporter', 'Rapporter'],
    ['kontoplan', 'Kontoplan'],
    ['arkiv', 'År och arkiv'],
    ['om', 'Om appen']
  ];

  function render() {
    var ar = aktivt();
    document.getElementById('versionLank').textContent = 'Föreningsbokföring version ' + VERSIONER[0].version;
    document.getElementById('rubrik').textContent = store.forening.namn || 'Föreningsbokföring';
    renderArvaljare();
    var nav = document.getElementById('nav');
    var main = document.getElementById('main');
    var msg = nyckelBanner() + (meddelande ? '<div class="card ' + (meddelande.fel ? 'fel' : 'ok') + '" role="status">' + esc(meddelande.text) + '</div>' : '');
    if (!ar) {
      nav.innerHTML = '';
      main.innerHTML = msg + (vy === 'om' ? '<p><button class="btn btn-secondary btn-small" data-vy="inlasning">Tillbaka</button></p>' + vyOm() : vyStart());
      return;
    }
    nav.innerHTML = VYER.map(function (v) {
      return '<button type="button" data-vy="' + v[0] + '"' + (vy === v[0] ? ' aria-current="page"' : '') + '>' + v[1] + '</button>';
    }).join('');
    var html = {
      inlasning: vyInlasning,
      verifikationer: vyVerifikationer,
      ny: vyNy,
      huvudbok: vyHuvudbok,
      rapporter: vyRapporter,
      kontoplan: vyKontoplan,
      arkiv: vyArkiv,
      om: vyOm
    }[vy](ar);
    main.innerHTML = msg + html;
    if (vy === 'ny') uppdateraUtkastStatus();
  }

  function renderArvaljare() {
    var el = document.getElementById('arvaljare');
    var ids = Object.keys(store.ar).sort();
    if (!ids.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<label for="valjAr" style="margin:0">Räkenskapsår</label>' +
      '<select id="valjAr" style="width:auto">' + ids.map(function (id) {
        return '<option value="' + esc(id) + '"' + (id === store.aktivt ? ' selected' : '') + '>' + esc(id) +
          (store.ar[id].lastTom === store.ar[id].slut ? ' (låst)' : '') + '</option>';
      }).join('') + '</select>';
  }

  function vyStart() {
    var y = new Date().getFullYear();
    return '<div class="card"><h2 style="margin-top:0">Kom igång</h2>' +
      '<p>Skapa föreningens första räkenskapsår, eller läs in en säkerhetskopia.</p>' +
      '<div class="grid2">' +
      '<div><label for="forNamn">Föreningens namn</label><input id="forNamn" value="' + esc(store.forening.namn) + '"></div>' +
      '<div><label for="forOrgnr">Organisationsnummer (frivilligt)</label><input id="forOrgnr" value="' + esc(store.forening.orgnr) + '"></div>' +
      '<div><label for="nyStart">Räkenskapsåret börjar</label><input id="nyStart" type="date" value="' + y + '-01-01"></div>' +
      '<div><label for="nySlut">och slutar</label><input id="nySlut" type="date" value="' + y + '-12-31"></div>' +
      '</div>' +
      '<p class="faint">Ingående balanser kan du lägga in som en första verifikation, eller låta komma från föregående år.</p>' +
      '<div class="row"><button class="btn" data-action="skapa-forsta">Skapa räkenskapsår</button>' +
      '<button class="btn btn-secondary" data-action="importera">Läs in säkerhetskopia (JSON)</button></div></div>';
  }

  function underlagChip(u) {
    return '<button class="tag knapp-tag" data-action="visa-fil" data-id="' + esc(u.id) + '" title="Visa ' + esc(u.filnamn) + '">' + esc(u.filnamn) + '</button>';
  }

  function vyInlasning(ar) {
    var harNyckel = !!lasNyckel();
    var html = '<div class="card dropzon" id="dropzon">' +
      '<p style="margin-top:0"><strong>Släpp fakturor, kvitton eller kontoutdrag här</strong></p>' +
      '<p class="faint">PDF:er och bilder tolkas av Claude. Kontoutdrag som CSV läses direkt. Du kan också klistra in rader från Excel, eller en skärmbild, med Ctrl+V.</p>' +
      '<div class="row"><button class="btn" data-action="valj-filer">Välj filer</button></div>' +
      (harNyckel ? '' : '<p class="fel">Claude är inte inställt ännu. Lägg in en API-nyckel under "År och arkiv" för att kunna läsa PDF:er och bilder.</p>') +
      '</div>';
    if (arbetar) html += '<p class="muted" id="arbetar" role="status">' + esc(arbetar) + '</p>';
    if (logg.length) {
      html += '<ul class="logg">' + logg.map(function (l) { return '<li class="' + (l.fel ? 'fel' : '') + '">' + esc(l.text) + '</li>'; }).join('') + '</ul>' +
        '<button class="btn btn-secondary btn-small" data-action="rensa-logg">Dölj meddelanden</button>';
    }

    var rader = K.oppnaBankrader(ar);
    var forslag = rader.map(function (r) { return { rad: r, f: forslagMedVal(ar, r) }; });
    var kompletta = forslag.filter(function (x) { return x.f.komplett; }).length;
    var oppnaU = K.oppnaUnderlag(ar);
    html += '<datalist id="kontolista">' + ar.kontoplan.map(function (k) { return '<option value="' + k.nr + '">' + esc(k.namn) + '</option>'; }).join('') + '</datalist>';
    html += '<div class="row" style="justify-content:space-between"><h2>Banktransaktioner att bokföra (' + rader.length + ')</h2>' +
      (kompletta ? '<button class="btn" data-action="bokfor-alla">Bokför alla med förslag (' + kompletta + ')</button>' : '') + '</div>';
    if (!rader.length) html += '<p class="muted">Inga obokförda banktransaktioner. Läs in ett kontoutdrag för att komma igång.</p>';
    forslag.forEach(function (x) {
      var r = x.rad, f = x.f;
      var us = f.underlagIds.map(function (id) { return ar.underlag.find(function (u) { return u.id === id; }); });
      var kalla = f.kalla === 'underlag' ? '<span class="tag ok">från underlag</span>' : f.kalla === 'regel' ? '<span class="tag">som förra gången</span>' : '<span class="tag varning">välj konto</span>';
      html += '<div class="card bankrad">' +
        '<div class="row" style="justify-content:space-between"><div><strong>' + esc(r.datum) + '</strong> ' + esc(r.text) +
        (r.referens ? ' <span class="faint">' + esc(r.referens) + '</span>' : '') + '</div>' +
        '<div class="belopp ' + (r.belopp < 0 ? 'fel' : 'ok') + '">' + kr(r.belopp) + '</div></div>' +
        '<div class="grid2">' +
        '<div><label>Text</label><input data-inkorg="text" data-id="' + esc(r.id) + '" value="' + esc(f.text) + '"></div>';
      if (f.rader.length === 2) {
        html += '<div><label>Konto ' + kalla + '</label><input list="kontolista" data-inkorg="konto" data-id="' + esc(r.id) + '" value="' + esc(f.rader[1].konto) + '" placeholder="t.ex. 5010">' +
          '<div class="faint">' + (f.rader[1].konto ? esc(K.kontonamn(ar, f.rader[1].konto)) : '') + '</div></div>';
      } else {
        html += '<div><label>Konton ' + kalla + '</label>' + f.rader.slice(1).map(function (x) {
          return '<div class="faint">' + esc(x.konto || '?') + ' ' + esc(x.konto ? K.kontonamn(ar, x.konto) : 'konto saknas') + ': ' + kr(-x.belopp) + '</div>';
        }).join('') + '</div>';
      }
      html += '</div><div class="row" style="margin-top:8px">' +
        (us.length ? 'Underlag: ' + us.map(underlagChip).join(' ') : '<span class="faint">' + (f.underlagKommentar ? 'Inget underlag behövs (syns i bankutdraget).' : 'Inget underlag hittat.') + '</span>');
      var valbara = oppnaU.filter(function (u) { return f.underlagIds.indexOf(u.id) < 0; });
      if (valbara.length) {
        html += '<select data-action-change="koppla" data-id="' + esc(r.id) + '" style="width:auto;max-width:100%"><option value="">Koppla underlag…</option>' +
          valbara.map(function (u) { return '<option value="' + esc(u.id) + '">' + esc((u.datum || '') + ' ' + (u.motpart || u.filnamn)) + ' ' + kr(u.belopp) + '</option>'; }).join('') + '</select>';
      }
      if (inkorgVal[r.id] && inkorgVal[r.id].underlagIds) html += '<button class="btn btn-secondary btn-small" data-action="aterstall" data-id="' + esc(r.id) + '">Återställ</button>';
      html += '</div><div class="row" style="margin-top:8px">' +
        '<button class="btn btn-small" data-action="bokfor-rad" data-id="' + esc(r.id) + '"' + (f.komplett ? '' : ' disabled') + '>Bokför</button>' +
        '<button class="btn btn-secondary btn-small" data-action="redigera-rad" data-id="' + esc(r.id) + '">Dela upp eller ändra…</button></div></div>';
    });

    html += '<h2>Underlag som väntar på betalning (' + oppnaU.length + ')</h2>';
    if (!oppnaU.length) html += '<p class="muted">Inga. Fakturor och kvitton kopplas automatiskt när betalningen syns på banken.</p>';
    else {
      html += '<div class="scroll"><table><thead><tr><th>Datum</th><th>Underlag</th><th class="num">Belopp</th><th>Konto</th><th></th></tr></thead><tbody>';
      oppnaU.forEach(function (u) {
        html += '<tr><td>' + esc(u.datum || '') + (u.forfallodatum ? '<div class="faint">förfaller ' + esc(u.forfallodatum) + '</div>' : '') + '</td>' +
          '<td>' + esc(u.motpart) + (u.beskrivning ? '<div class="faint">' + esc(u.beskrivning) + '</div>' : '') + underlagChip(u) +
          (u.valuta ? '<div class="faint">' + esc(u.valuta) + ' ' + (u.originalbelopp != null ? kr(u.originalbelopp) : '') + '</div>' : '') + '</td>' +
          '<td class="num"><input class="num" style="width:110px" data-underlag="belopp" data-id="' + esc(u.id) + '" value="' + (u.belopp ? kr(u.belopp) : '') + '" aria-label="Belopp i kronor">' +
          '<div class="faint">' + (u.riktning === 'intakt' ? 'intäkt' : 'utgift') + '</div></td>' +
          '<td><input list="kontolista" style="width:90px" data-underlag="foreslagetKonto" data-id="' + esc(u.id) + '" value="' + esc(u.foreslagetKonto || '') + '" aria-label="Konto"></td>' +
          '<td style="white-space:nowrap"><button class="btn btn-secondary btn-small" data-action="bokfor-underlag" data-id="' + esc(u.id) + '">Bokför utan bank…</button> ' +
          '<button class="btn btn-secondary btn-small" data-action="ta-bort-underlag" data-id="' + esc(u.id) + '" aria-label="Ta bort underlag">×</button></td></tr>';
      });
      html += '</tbody></table></div>';
    }

    var avst = K.bankavstamning(ar);
    if (avst) {
      html += '<h2>Avstämning mot banken</h2><div class="card">Banken ' + esc(avst.datum) + ': <strong>' + kr(avst.bankSaldo) + '</strong> · Bokfört: <strong>' + kr(avst.bokfortSaldo) + '</strong> · ' +
        (avst.skillnad === 0 ? '<span class="ok">stämmer</span>' : '<span class="fel">skillnad ' + kr(avst.skillnad) + '</span>' + (avst.obokforda ? ' <span class="faint">(' + antal(avst.obokforda, 'transaktion är', 'transaktioner är') + ' inte bokförda ännu)</span>' : ''));
      if (avst.ingaendeEnligtBank != null && avst.ingaendeEnligtBank !== avst.ingaendeBokfort && !ar.lastTom) {
        html += '<p class="fel">Ingående balans på ' + avst.konto + ' är ' + kr(avst.ingaendeBokfort) + ' kr, men enligt banken fanns ' + kr(avst.ingaendeEnligtBank) + ' kr före årets första transaktion.</p>' +
          (foregaende(ar) ? '<p class="faint">Ingående balans kommer från föregående år. Kontrollera bokföringen där.</p>'
            : '<button class="btn btn-secondary btn-small" data-action="ib-fran-bank" data-belopp="' + avst.ingaendeEnligtBank + '">Sätt ingående balans till ' + kr(avst.ingaendeEnligtBank) + ' kr (mot 2067 Balanserad vinst eller förlust)</button>');
      }
      html += '</div>';
    }
    return html;
  }

  function verSumma(v) {
    return v.rader.reduce(function (s, r) { return r.belopp > 0 ? s + r.belopp : s; }, 0);
  }

  function vyVerifikationer(ar) {
    var varningar = K.kontroller(ar);
    var utanUnderlag = {};
    varningar.forEach(function (w) { if (w.typ === 'saknarUnderlag') utanUnderlag[w.nr] = true; });
    var lista = ar.verifikationer.slice().reverse();
    var html = '<div class="row" style="justify-content:space-between"><h2>Verifikationer ' + esc(K.arNamn(ar)) + '</h2>' +
      '<button class="btn" data-vy="ny">Ny verifikation</button></div>';
    if (ar.lastTom) html += '<p class="faint">Låst till och med ' + esc(ar.lastTom) + '.</p>';
    if (!lista.length) return html + '<p class="muted">Inga verifikationer ännu.</p>';
    html += '<div class="scroll"><table><thead><tr><th>Nr</th><th>Datum</th><th>Text</th><th class="num">Belopp</th></tr></thead><tbody>';
    lista.forEach(function (v) {
      var taggar = '';
      if (v.rattar != null) taggar += '<span class="tag">rättar ' + v.rattar + '</span>';
      var rattning = K.rattadAv(ar, v.nr);
      if (rattning) taggar += '<span class="tag">rättad av ' + rattning.nr + '</span>';
      if (utanUnderlag[v.nr]) taggar += '<span class="tag varning">underlag saknas</span>';
      html += '<tr class="klickbar" data-ver="' + v.nr + '"><td>' + v.nr + '</td><td>' + esc(v.datum) + '</td><td>' + esc(v.text) + taggar + '</td><td class="num">' + kr(verSumma(v)) + '</td></tr>';
      if (oppenVer === v.nr) html += detaljRad(ar, v, rattning);
    });
    return html + '</tbody></table></div>';
  }

  function detaljRad(ar, v, rattning) {
    var html = '<tr class="detalj"><td></td><td colspan="3"><table><tbody>';
    v.rader.forEach(function (r) {
      html += '<tr><td>' + esc(r.konto) + ' ' + esc(K.kontonamn(ar, r.konto)) + '</td>' +
        '<td class="num">' + (r.belopp > 0 ? kr(r.belopp) : '') + '</td><td class="num">' + (r.belopp < 0 ? kr(-r.belopp) : '') + '</td></tr>';
    });
    html += '</tbody></table>';
    if (v.underlag && v.underlag.length) {
      html += '<p class="faint">Underlag: ' + v.underlag.map(function (namn) {
        var u = (ar.underlag || []).find(function (x) { return x.arkivnamn === namn; });
        return u ? '<button class="tag knapp-tag" data-action="visa-fil" data-id="' + esc(u.id) + '">' + esc(namn) + '</button>' : esc(namn);
      }).join(' ') + '</p>';
    }
    if (v.underlagKommentar) html += '<p class="faint">' + esc(v.underlagKommentar) + '</p>';
    if (v.registrerad) html += '<p class="faint">Registrerad ' + esc(v.registrerad.slice(0, 16).replace('T', ' ')) + '</p>';
    var kanRattas = v.rattar == null && !rattning && !(ar.lastTom && ar.lastTom >= ar.slut);
    if (kanRattas) html += '<button class="btn btn-secondary btn-small ej-utskrift" data-action="ratta" data-nr="' + v.nr + '">Rätta (bokför omvänd verifikation)</button>';
    return html + '</td></tr>';
  }

  function vyNy(ar) {
    if (!utkast.datum) utkast.datum = standardDatum(ar);
    var html = '<h2>Ny verifikation</h2><div class="card">' + kopplingsInfo(ar) +
      (ar.lastTom ? '<p class="faint" style="margin-top:0">Perioden till och med ' + esc(ar.lastTom) + ' är låst. Den kan låsas upp under År och arkiv.</p>' : '') +
      '<div class="grid2"><div><label for="uDatum">Datum</label><input id="uDatum" type="date" data-u="datum" value="' + esc(utkast.datum) + '" min="' + ar.start + '" max="' + ar.slut + '"></div>' +
      '<div><label for="uText">Text</label><input id="uText" data-u="text" value="' + esc(utkast.text) + '" placeholder="t.ex. Lokalhyra oktober"></div>' +
      '<div><label for="uUnderlag">Underlag (filnamn, separera med komma)</label><input id="uUnderlag" data-u="underlag" value="' + esc(utkast.underlag) + '"></div>' +
      '<div><label for="uKommentar">Eller: varför inget underlag behövs</label><input id="uKommentar" data-u="underlagKommentar" value="' + esc(utkast.underlagKommentar) + '" placeholder="t.ex. Swish, syns i bankutdraget"></div></div>' +
      '<h3>Rader</h3><div class="scroll"><table class="rader-tabell"><thead><tr><th>Konto</th><th class="num">Debet</th><th class="num">Kredit</th><th></th></tr></thead><tbody>';
    utkast.rader.forEach(function (r, i) {
      html += '<tr><td><input list="kontolista" data-rad="' + i + '" data-f="konto" value="' + esc(r.konto) + '" placeholder="Konto" aria-label="Konto rad ' + (i + 1) + '"><div class="faint" id="kontonamn-' + i + '"></div></td>' +
        '<td><input class="num" inputmode="decimal" data-rad="' + i + '" data-f="debet" value="' + esc(r.debet) + '" aria-label="Debet rad ' + (i + 1) + '"></td>' +
        '<td><input class="num" inputmode="decimal" data-rad="' + i + '" data-f="kredit" value="' + esc(r.kredit) + '" aria-label="Kredit rad ' + (i + 1) + '"></td>' +
        '<td>' + (utkast.rader.length > 2 ? '<button class="btn btn-secondary btn-small" data-action="ta-bort-rad" data-rad="' + i + '" aria-label="Ta bort rad">×</button>' : '') + '</td></tr>';
    });
    html += '</tbody></table></div><datalist id="kontolista">' + ar.kontoplan.map(function (k) {
      return '<option value="' + k.nr + '">' + esc(k.namn) + '</option>';
    }).join('') + '</datalist>' +
      '<div class="row" style="margin-top:8px"><button class="btn btn-secondary btn-small" data-action="ny-rad">Lägg till rad</button></div>' +
      '<p id="utkastStatus"></p><ul class="fellista" id="utkastFel"></ul>' +
      '<div class="row"><button class="btn" id="bokforKnapp" data-action="bokfor">Bokför</button>' +
      '<button class="btn btn-secondary" data-action="rensa-utkast">Rensa</button></div></div>';
    return html;
  }

  function kopplingsInfo(ar) {
    var k = utkast.koppling;
    if (!k) return '';
    var delar = [];
    if (k.bankradId) {
      var r = (ar.bankrader || []).find(function (x) { return x.id === k.bankradId; });
      if (r) delar.push('banktransaktionen ' + esc(r.datum) + ' ' + esc(r.text) + ' (' + kr(r.belopp) + ' på ' + r.konto + ')');
    }
    (k.underlagIds || []).forEach(function (id) {
      var u = (ar.underlag || []).find(function (x) { return x.id === id; });
      if (u) delar.push(underlagChip(u));
    });
    return '<p class="muted" style="margin-top:0">Kopplas till ' + delar.join(', ') + '.' +
      (k.bankradId ? '' : ' Välj motkonto, t.ex. 1910 Kassa eller 2890 Övriga kortfristiga skulder om någon lagt ut och ska få pengarna tillbaka.') + '</p>';
  }

  function utkastTillVerifikation() {
    var fel = [];
    var rader = [];
    utkast.rader.forEach(function (r, i) {
      var tom = !r.konto && !r.debet && !r.kredit;
      if (tom) return;
      var d = 0, k = 0;
      try { d = r.debet ? K.parseBelopp(r.debet) : 0; } catch (e) { fel.push('Rad ' + (i + 1) + ': ' + e.message); }
      try { k = r.kredit ? K.parseBelopp(r.kredit) : 0; } catch (e) { fel.push('Rad ' + (i + 1) + ': ' + e.message); }
      if (d && k) fel.push('Rad ' + (i + 1) + ': fyll i antingen debet eller kredit.');
      rader.push({ konto: r.konto.trim(), belopp: d - k });
    });
    return {
      fel: fel,
      verifikation: {
        datum: utkast.datum,
        text: utkast.text,
        rader: rader,
        underlag: utkast.underlag.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
        underlagKommentar: utkast.underlagKommentar.trim(),
        registrerad: new Date().toISOString()
      }
    };
  }

  function uppdateraUtkastStatus() {
    var ar = aktivt();
    var res = utkastTillVerifikation();
    var debet = 0, kredit = 0;
    res.verifikation.rader.forEach(function (r) { if (r.belopp > 0) debet += r.belopp; else kredit -= r.belopp; });
    var status = document.getElementById('utkastStatus');
    var diff = debet - kredit;
    status.innerHTML = 'Debet ' + kr(debet) + ' · Kredit ' + kr(kredit) +
      (diff === 0 ? (debet ? ' · <span class="ok">går ihop</span>' : '') : ' · <span class="fel">skillnad ' + kr(diff) + '</span>');
    var fel = res.fel.concat(K.valideraVerifikation(ar, res.verifikation));
    document.getElementById('utkastFel').innerHTML = utkastRort() ? fel.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') : '';
    document.getElementById('bokforKnapp').disabled = fel.length > 0;
    utkast.rader.forEach(function (r, i) {
      var el = document.getElementById('kontonamn-' + i);
      if (el) el.textContent = r.konto ? K.kontonamn(ar, r.konto.trim()) : '';
    });
  }

  function utkastRort() {
    return utkast.text || utkast.rader.some(function (r) { return r.konto || r.debet || r.kredit; });
  }

  function vyHuvudbok(ar) {
    var hb = K.huvudbok(ar, valtKonto);
    var html = '<h2>Huvudbok</h2><label for="hbKonto">Konto</label><select id="hbKonto" style="max-width:420px">' +
      ar.kontoplan.map(function (k) {
        return '<option value="' + k.nr + '"' + (k.nr === valtKonto ? ' selected' : '') + '>' + k.nr + ' ' + esc(k.namn) + (K.kontoAnvands(ar, k.nr) ? '' : ' (oanvänt)') + '</option>';
      }).join('') + '</select>';
    html += '<div class="scroll"><table style="margin-top:12px"><thead><tr><th>Datum</th><th>Ver</th><th>Text</th><th class="num">Debet</th><th class="num">Kredit</th><th class="num">Saldo</th></tr></thead><tbody>' +
      '<tr><td>' + esc(ar.start) + '</td><td></td><td>Ingående balans</td><td></td><td></td><td class="num">' + kr(hb.ib) + '</td></tr>';
    hb.rader.forEach(function (r) {
      html += '<tr><td>' + esc(r.datum) + '</td><td>' + r.nr + '</td><td>' + esc(r.text) + '</td>' +
        '<td class="num">' + (r.belopp > 0 ? kr(r.belopp) : '') + '</td><td class="num">' + (r.belopp < 0 ? kr(-r.belopp) : '') + '</td><td class="num">' + kr(r.saldo) + '</td></tr>';
    });
    html += '<tr class="total"><td colspan="5">Utgående balans</td><td class="num">' + kr(hb.ub) + '</td></tr></tbody></table></div>';
    return html;
  }

  var RAPPORTER = [['rr', 'Resultaträkning'], ['br', 'Balansräkning'], ['sb', 'Saldobalans'], ['gb', 'Grundbok']];

  function vyRapporter(ar) {
    var html = '<div class="row ej-utskrift" style="margin-top:12px">' + RAPPORTER.map(function (r) {
      return '<button class="btn ' + (rapportVy === r[0] ? '' : 'btn-secondary') + ' btn-small" data-rapport="' + r[0] + '">' + r[1] + '</button>';
    }).join('') + '<button class="btn btn-secondary btn-small" data-action="skriv-ut">Skriv ut / PDF</button></div>';
    var rubrik = (store.forening.namn ? esc(store.forening.namn) + ' · ' : '') + 'Räkenskapsår ' + esc(ar.start) + ' – ' + esc(ar.slut);
    html += '<div class="card"><p class="faint">' + rubrik + (ar.lastTom === ar.slut ? '' : ' · preliminär') + '</p>';
    if (rapportVy === 'rr') html += rapportRR(ar);
    if (rapportVy === 'br') html += rapportBR(ar);
    if (rapportVy === 'sb') html += rapportSB(ar);
    if (rapportVy === 'gb') html += rapportGB(ar);
    return html + '</div>';
  }

  function rapportRR(ar) {
    var fg = foregaende(ar);
    var rr = K.resultatrakning(ar, { foregaende: fg });
    var jmf = !!fg;
    var kol = function (r, f) { return jmf ? '<td class="num">' + kr(r[f]) + '</td>' : ''; };
    var html = '<h2 style="margin-top:0">Resultaträkning</h2><div class="scroll"><table><thead><tr><th>Konto</th><th class="num">' + esc(K.arNamn(ar)) + '</th>' +
      (jmf ? '<th class="num">' + esc(K.arNamn(fg)) + '</th>' : '') + '</tr></thead><tbody>';
    rr.grupper.forEach(function (g) {
      html += '<tr><td colspan="3"><h3>' + esc(g.namn) + '</h3></td></tr>';
      g.konton.forEach(function (r) { html += '<tr><td>' + r.nr + ' ' + esc(r.namn) + '</td><td class="num">' + kr(r.belopp) + '</td>' + kol(r, 'jamforelse') + '</tr>'; });
      html += '<tr class="summa"><td>Summa ' + esc(g.namn.toLowerCase()) + '</td><td class="num">' + kr(g.summa) + '</td>' + kol(g, 'jamforelse') + '</tr>';
    });
    html += '<tr class="total"><td>Årets resultat</td><td class="num">' + kr(rr.aretsResultat) + '</td>' + (jmf ? '<td class="num">' + kr(rr.jamforelseResultat) + '</td>' : '') + '</tr>';
    return html + '</tbody></table></div>';
  }

  function rapportBR(ar) {
    var br = K.balansrakning(ar);
    var html = '<h2 style="margin-top:0">Balansräkning</h2><div class="scroll"><table><thead><tr><th>Konto</th><th class="num">Ingående</th><th class="num">Utgående</th></tr></thead><tbody>';
    var del = function (titel, d) {
      html += '<tr><td colspan="3"><h2>' + titel + '</h2></td></tr>';
      d.grupper.forEach(function (g) {
        html += '<tr><td colspan="3"><h3>' + esc(g.namn) + '</h3></td></tr>';
        g.konton.forEach(function (r) { html += '<tr><td>' + (r.nr ? r.nr + ' ' : '') + esc(r.namn) + '</td><td class="num">' + kr(r.jamforelse) + '</td><td class="num">' + kr(r.belopp) + '</td></tr>'; });
        html += '<tr class="summa"><td>Summa ' + esc(g.namn.toLowerCase()) + '</td><td class="num">' + kr(g.jamforelse) + '</td><td class="num">' + kr(g.summa) + '</td></tr>';
      });
      html += '<tr class="total"><td>Summa ' + titel.toLowerCase() + '</td><td class="num">' + kr(d.ingaende) + '</td><td class="num">' + kr(d.summa) + '</td></tr>';
    };
    del('Tillgångar', br.tillgangar);
    del('Eget kapital och skulder', br.egetKapitalOchSkulder);
    html += '</tbody></table></div>';
    html += br.balanserar ? '<p class="ok">Balansräkningen går ihop.</p>' : '<p class="fel">Balansräkningen går inte ihop. Kontrollera ingående balanser.</p>';
    return html;
  }

  function rapportSB(ar) {
    var sb = K.saldobalans(ar);
    var html = '<h2 style="margin-top:0">Saldobalans</h2><div class="scroll"><table><thead><tr><th>Konto</th><th class="num">Ingående</th><th class="num">Period</th><th class="num">Utgående</th></tr></thead><tbody>';
    var t = { ib: 0, rorelse: 0, ub: 0 };
    sb.forEach(function (r) {
      t.ib += r.ib; t.rorelse += r.rorelse; t.ub += r.ub;

  // ---------- Händelser ----------

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-vy],[data-action],[data-ver],[data-rapport]');
    if (!t) return;
    if (t.dataset.vy) { vy = t.dataset.vy; meddelande = null; render(); return; }
    if (t.dataset.rapport) { rapportVy = t.dataset.rapport; render(); return; }
    if (t.dataset.ver && !t.dataset.action) { var nr = Number(t.dataset.ver); oppenVer = oppenVer === nr ? null : nr; render(); return; }
    var handling = HANDLINGAR[t.dataset.action];
    if (handling) {
      try { handling(t); }
      catch (err) { visa(err.fel ? err.fel.join(' ') : err.message, true); }
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.u) { utkast[t.dataset.u] = t.value; uppdateraUtkastStatus(); }
    if (t.dataset.rad != null && t.dataset.f) { utkast.rader[Number(t.dataset.rad)][t.dataset.f] = t.value; uppdateraUtkastStatus(); }
    if (t.dataset.inkorg) {
      inkorgVal[t.dataset.id] = Object.assign({}, inkorgVal[t.dataset.id], { [t.dataset.inkorg]: t.value });
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'valjAr') { store.aktivt = e.target.value; spara(); meddelande = null; utkast = nyttUtkast(); render(); }
    if (e.target.id === 'hbKonto') { valtKonto = e.target.value; render(); }
    var t = e.target;
    if (t.dataset.inkorg === 'konto') render();
    if (t.dataset.actionChange === 'koppla' && t.value) {
      var ar = aktivt();
      var rad = ar.bankrader.find(function (r) { return r.id === t.dataset.id; });
      var nu = forslagMedVal(ar, rad).underlagIds;
      inkorgVal[t.dataset.id] = Object.assign({}, inkorgVal[t.dataset.id], { underlagIds: nu.concat([t.value]) });
      render();
    }
    if (t.dataset.underlag) {
      try {
        var andring = {};
        if (t.dataset.underlag === 'belopp') andring.belopp = Math.abs(K.parseBelopp(t.value));
        else andring.foreslagetKonto = t.value.trim();
        setAktivt(K.andraUnderlag(aktivt(), t.dataset.id, andring));
        render();
      } catch (err) { visa(err.message, true); }
    }
  });

  // Dra och släpp samt klistra in fungerar var som helst på sidan.
  document.addEventListener('dragover', function (e) { if (aktivt()) e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    if (!aktivt() || !e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault();
    vy = 'inlasning';
    lasInFiler(Array.from(e.dataTransfer.files));
  });
  document.addEventListener('paste', function (e) {
    if (!aktivt() || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var cd = e.clipboardData;
    if (cd.files && cd.files.length) {
      e.preventDefault();
      vy = 'inlasning';
      lasInFiler(Array.from(cd.files));
      return;
    }
    var text = cd.getData('text/plain');
    if (text && /\n/.test(text.trim()) || /\t/.test(text || '')) {
      e.preventDefault();
      vy = 'inlasning';
      try { importeraBanktext(text, 'Inklistrat'); } catch (err) { logga(err.message, true); }
      render();
    }
  });

  function varde(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

  function laggTillAr(ar) {
    var id = K.arNamn(ar);
    if (store.ar[id]) throw new Error('Räkenskapsåret ' + id + ' finns redan.');
    store.ar[id] = ar;
    store.aktivt = id;
    utkast = nyttUtkast();
    spara();
  }

  var HANDLINGAR = {
    'skapa-forsta': function () {
      store.forening = { namn: varde('forNamn'), orgnr: varde('forOrgnr') };
      laggTillAr(K.skapaAr({ start: varde('nyStart'), slut: varde('nySlut') }));
      vy = 'verifikationer';
      visa('Räkenskapsåret är skapat.');
    },
    'ny-rad': function () { utkast.rader.push(tomRad()); render(); },
    'ta-bort-rad': function (t) { utkast.rader.splice(Number(t.dataset.rad), 1); render(); },
    'rensa-utkast': function () { utkast = nyttUtkast(); render(); },
    'bokfor': function () {
      var res = utkastTillVerifikation();
      if (res.fel.length) throw new Error(res.fel.join(' '));
      var ut;
      if (utkast.koppling) {
        ut = K.bokforKopplat(aktivt(), res.verifikation, utkast.koppling);
        var bank = utkast.koppling.bankradId && aktivt().bankrader.find(function (x) { return x.id === utkast.koppling.bankradId; });
        if (bank) larAv(bank, res.verifikation.rader);
      } else {
        ut = K.bokfor(aktivt(), res.verifikation);
      }
      setAktivt(ut.ar);
      if (utkast.koppling) vy = 'inlasning';
      var datum = utkast.datum;
      utkast = nyttUtkast();
      utkast.datum = datum;
      visa('Verifikation ' + ut.verifikation.nr + ' är bokförd.');
    },
    'ratta': function (t) {
      var ar = aktivt();
      var nr = Number(t.dataset.nr);
      var datum = window.prompt('Datum för rättelsen (ÅÅÅÅ-MM-DD):', standardDatum(ar));
      if (!datum) return;
      var ut = K.rattelse(ar, nr, { datum: datum.trim(), registrerad: new Date().toISOString() });
      setAktivt(ut.ar);
      oppenVer = null;
      visa('Verifikation ' + nr + ' är rättad med verifikation ' + ut.verifikation.nr + '.');
    },
    'skriv-ut': function () { window.print(); },
    'valj-filer': function () {
      var input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      input.accept = 'application/pdf,image/*,.csv,.txt,.tsv,.skv,.xlsx,.xls';
      input.onchange = function () { lasInFiler(Array.from(input.files)); };
      input.click();
    },
    'rensa-logg': function () { logg = []; render(); },
    'visa-fil': function (t) { visaFil(t.dataset.id); },
    'bokfor-rad': function (t) {
      var ar = aktivt();
      var rad = ar.bankrader.find(function (r) { return r.id === t.dataset.id; });
      var res = bokforBankrad(ar, rad);
      setAktivt(res.ar);
      visa('Verifikation ' + res.verifikation.nr + ' är bokförd.');
    },
    'bokfor-alla': function () {
      var ar = aktivt();
      var klara = K.oppnaBankrader(ar).filter(function (r) { return forslagMedVal(ar, r).komplett; });
      if (!window.confirm('Bokföra ' + klara.length + ' transaktioner enligt förslagen?')) return;
      var forsta = null, sista = null;
      klara.forEach(function (r) {
        var res = bokforBankrad(ar, r);
        ar = res.ar;
        if (forsta == null) forsta = res.verifikation.nr;
        sista = res.verifikation.nr;
      });
      setAktivt(ar);
      visa('Verifikation ' + forsta + (sista !== forsta ? '–' + sista : '') + ' är bokförda.');
    },
    'redigera-rad': function (t) {
      var ar = aktivt();
      var rad = ar.bankrader.find(function (r) { return r.id === t.dataset.id; });
      var f = forslagMedVal(ar, rad);
      utkast = {
        datum: f.datum, text: f.text, underlag: '', underlagKommentar: f.underlagKommentar,
        rader: f.rader.map(radTillUtkast).concat([tomRad()]),
        koppling: { bankradId: rad.id, underlagIds: f.underlagIds }
      };
      vy = 'ny';
      meddelande = null;
      render();
    },
    'ib-fran-bank': function (t) {
      setAktivt(K.sattIngaendeSaldo(aktivt(), '1930', Number(t.dataset.belopp)));
      visa('Ingående balans på 1930 är satt till ' + kr(Number(t.dataset.belopp)) + ' kr.');
    },
    'aterstall': function (t) { delete inkorgVal[t.dataset.id]; render(); },
    'bokfor-underlag': function (t) {
      var ar = aktivt();
      var u = ar.underlag.find(function (x) { return x.id === t.dataset.id; });
      if (!u.belopp) throw new Error('Ange beloppet i kronor först.');
      var b = u.riktning === 'intakt' ? -u.belopp : u.belopp;
      var datum = u.datum && u.datum >= ar.start && u.datum <= ar.slut ? u.datum : standardDatum(ar);
      utkast = {
        datum: datum, text: [u.motpart, u.beskrivning].filter(Boolean).join(': '), underlag: '', underlagKommentar: '',
        rader: [radTillUtkast({ konto: u.foreslagetKonto || '', belopp: b }), radTillUtkast({ konto: '', belopp: -b })],
        koppling: { underlagIds: [u.id] }
      };
      vy = 'ny';
      meddelande = null;
      render();
    },
    'ta-bort-underlag': function (t) {
      if (!window.confirm('Ta bort underlaget? Filen raderas från den här webbläsaren.')) return;
      setAktivt(K.taBortUnderlag(aktivt(), t.dataset.id));
      taBortFil(t.dataset.id);
      render();
    },
    'spara-nyckel': function () {
      var v = varde('claudeNyckel');
      var utgar = varde('claudeUtgar');
      if (!v) throw new Error('Klistra in nyckeln först.');
      if (!/^sk-ant-/.test(v)) throw new Error('Det ser inte ut som en API-nyckel från Anthropic. Den börjar med sk-ant-.');
      localStorage.setItem(NYCKEL, v);
      if (utgar) localStorage.setItem(NYCKEL_UTGAR, utgar); else localStorage.removeItem(NYCKEL_UTGAR);
      nyckelAvvisad = false;
      visaNyckelForm = false;
      visa('API-nyckeln är sparad i den här webbläsaren.' + (utgar ? ' Appen påminner dig två veckor innan den går ut.' : ' Tips: ange när den går ut så påminner appen dig i tid.'));
      HANDLINGAR['testa-nyckel']();
    },
    'ta-bort-nyckel': function () {
      localStorage.removeItem(NYCKEL);
      localStorage.removeItem(NYCKEL_UTGAR);
      nyckelAvvisad = false;
      visa('API-nyckeln är borttagen från den här webbläsaren.');
    },
    'byt-nyckel': function () { visaNyckelForm = true; render(); },
    'avbryt-byt-nyckel': function () { visaNyckelForm = false; render(); },
    'testa-nyckel': function () {
      claudeKlient()
        .then(function (client) { return client.models.list({ limit: 1 }); })
        .then(function () { nyckelAvvisad = false; visa('Nyckeln fungerar.'); })
        .catch(function (err) { visa(claudeFel(err), true); });
    },
    'till-claude-installning': function () {
      vy = 'arkiv';
      visaNyckelForm = true;
      meddelande = null;
      render();
      var el = document.getElementById('claude-installning');
      if (el) el.scrollIntoView();
    },
    'nytt-konto': function () {
      setAktivt(K.laggTillKonto(aktivt(), varde('nyttNr'), varde('nyttNamn')));
      visa('Kontot är tillagt.');
    },
    'byt-namn': function (t) {
      var ar = aktivt();
      var namn = window.prompt('Nytt namn för konto ' + t.dataset.nr + ':', K.kontonamn(ar, t.dataset.nr));
      if (namn == null) return;
      setAktivt(K.bytNamnPaKonto(ar, t.dataset.nr, namn));
      render();
    },
    'ta-bort-konto': function (t) {
      setAktivt(K.taBortKonto(aktivt(), t.dataset.nr));
      render();
    },
    'las': function () {
      var datum = varde('lasDatum');
      if (!window.confirm('Lås allt till och med ' + datum + '? Därefter går det inte att bokföra eller ändra något med datum till och med ' + datum + '.')) return;
      setAktivt(K.lasPeriod(aktivt(), datum, new Date().toISOString()));
      visa('Perioden är låst till och med ' + datum + '.');
    },
    'las-upp': function () {
      var ar = aktivt();
      var orsak = window.prompt('Varför ska perioden till och med ' + ar.lastTom + ' låsas upp? Orsaken sparas i loggen.', 'Låst av misstag');
      if (orsak == null) return;
      setAktivt(K.lasUpp(ar, { tid: new Date().toISOString(), orsak: orsak.trim() }));
      visa('Perioden är upplåst. Upplåsningen är sparad i loggen.');
    },
    'nasta-ar': function () {
      var nytt = K.nastaAr(aktivt());
      laggTillAr(nytt);
      vy = 'verifikationer';
      visa('Räkenskapsåret ' + K.arNamn(nytt) + ' är skapat med ingående balanser.');
    },
    'spara-forening': function () {
      store.forening = { namn: varde('forNamn'), orgnr: varde('forOrgnr') };
      spara();
      visa('Föreningens uppgifter är sparade.');
    },
    'exportera': function () {
      laddaNer('foreningsbokforing-' + idag() + '.json', JSON.stringify(store, null, 2), 'application/json');
    },
    'sie': function () {
      var ar = aktivt();
      var text = K.sieExport(ar, { forening: store.forening, genererad: idag() });
      laddaNer('bokforing-' + K.arNamn(ar).replace('/', '-') + '.se', K.tillCp437(text), 'application/octet-stream');
    },
    'importera': function () {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = function () {
        var fil = input.files[0];
        if (!fil) return;
        fil.text().then(function (txt) {
          var d = JSON.parse(txt);
          if (!d || d.format !== 1 || !d.ar) throw new Error('Filen är ingen säkerhetskopia från Föreningsbokföring.');
          var fel = [];
          Object.keys(d.ar).forEach(function (id) { K.valideraAr(d.ar[id]).forEach(function (f) { fel.push(id + ': ' + f); }); });
          if (fel.length) throw new Error('Säkerhetskopian har fel: ' + fel.slice(0, 5).join(' '));
          if (Object.keys(store.ar).length && !window.confirm('Ersätta all bokföring i webbläsaren med säkerhetskopian?')) return;
          store = d;
          if (!store.ar[store.aktivt]) store.aktivt = Object.keys(store.ar).sort().pop() || null;
          spara();
          vy = 'verifikationer';
          visa('Säkerhetskopian är inläst.');
        }).catch(function (err) { visa(err.message, true); });
      };
      input.click();
    }
  };

  ladda();
  render();
})();
</script>
