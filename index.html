      var bank = (ar.bankrader || []).find(function (r) { return r.verifikation === nr; });
      var belopp = v.rader.filter(function (r) { return Number(r.konto) >= 1900 && Number(r.konto) <= 1999 && r.belopp > 0; }).reduce(function (s, r) { return s + r.belopp; }, 0);
      var namn = K.namnFranBanktext(bank ? bank.text : v.text);
      var mott = store.mottagare.find(function (x) { return x.namn.toLowerCase() === namn.toLowerCase(); });
      dokUtkast = nyttDokUtkast('kvitto');
      dokUtkast.verifikation = { ar: store.aktivt, nr: nr };
      dokUtkast.betaldDatum = v.datum;
      dokUtkast.mottagareId = mott ? mott.id : '';
      dokUtkast.mottagare = mott ? { namn: mott.namn, foretag: mott.foretag || '', adress: mott.adress || '', epost: mott.epost || '', telefon: mott.telefon || '' } : Object.assign(dokUtkast.mottagare, { namn: namn });
      dokUtkast.betalsatt = /swish/i.test(bank ? bank.text : v.text) ? 'Swish' : 'Bankgiro';
      // Föreslå den artikel som kostar exakt det betalda beloppet.
      var artikel = store.artiklar.find(function (a) { return a.pris === belopp; });
      dokUtkast.rader = [{ artikelId: artikel ? artikel.id : '', antal: '1', beskrivning: artikel ? artikel.beskrivning : '', pris: K.formatBelopp(belopp), konto: artikel ? artikel.konto || '' : '' }];
      vy = 'dokument';
      dokVisas = null;
      meddelande = null;
      render();
    },
    'till-forening': function () {
      vy = 'arkiv'; meddelande = null; render();
      var el = document.getElementById('forening-installning');
      if (el) el.scrollIntoView();
    },
    'ny-post': function (t) {
      var k = t.dataset.lista;
      var post = { id: nyttId() };
      LISTOR[k].falt.forEach(function (f) { post[f[0]] = f[2] === 'belopp' ? 0 : ''; });
      store[k].push(post);
      spara();
      render();
    },
    'ta-bort-post': function (t) {
      if (!window.confirm('Ta bort posten?')) return;
      store[t.dataset.lista].splice(Number(t.dataset.index), 1);
      spara();
      render();
    },
    'valj-logo': function () {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = function () {
        var fil = input.files[0];
        if (!fil) return;
        if (fil.size > 1500000) { visa('Bilden är för stor. Använd en logotyp under 1,5 MB.', true); return; }
        sparaFil('logotyp', fil, 'lokal').then(function () {
          store.forening.harLogotyp = true;
          store.forening.logoOdId = null;
          spara();
          return laddaLogo();
        }).then(function () { visa('Logotypen är sparad.'); });
      };
      input.click();
    },
    'od-spara-klient': function () {
      var m = varde('odKlient').match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
      if (!m) throw new Error('Det ser inte ut som ett Client ID. Det har formen xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx.');
      od.clientId = m[0].toLowerCase();
      sparaOd();
      render();
    },
    'od-glom-klient': function () { od.clientId = null; sparaOd(); render(); },
    'od-qr-enhet': function () { odNu.qr = 'enhet'; render(); },
    'od-qr-revisor': function () { odNu.qr = 'revisor'; render(); },
    'od-stang-qr': function () { odNu.qr = null; render(); },
    'od-kopiera-lank': function () {
      var el = document.getElementById('qrLank');
      var klart = function () { visa('Länken är kopierad.'); };
      if (navigator.clipboard) navigator.clipboard.writeText(el.value).then(klart, function () { el.select(); document.execCommand('copy'); klart(); });
      else { el.select(); document.execCommand('copy'); klart(); }
    },
    'od-logga-in': function () { startaInloggning(false); },
    'avbryt-inbjudan': function () { localStorage.removeItem(INBJUDAN); render(); },
    'od-visa-delade': function () {
      sattStatus('Hämtar delade mappar…');
      delaMappar().then(function (lista) { odNu.delade = lista; sattStatus(''); render(); }).catch(function (err) { visa(err.message, true); });
    },
    'od-flytta': function () {
      var sokvag = varde('odNyMapp');
      var opt = { styrelsearbete: (document.getElementById('odFlyttaSA') || {}).checked, aldre: (document.getElementById('odFlyttaAldre') || {}).checked };
      if (!window.confirm('Samla appens mappar i ' + sokvag + '? Inget tas bort.')) return;
      samlaIAdministration(sokvag, opt).then(function (res) {
        render();
        visa('Klart. Appens mappar ligger nu i ' + sokvag + '. ' + (res.gjort.length ? 'Flyttat: ' + res.gjort.join('; ') + '. ' : '') + (res.delat ? 'Styrelsearbete är delat med ' + antal(res.delat, 'person', 'personer') + '.' : ''));
      }).catch(function (err) { sattStatus('Flytten avbröts', true); visa('Flytten avbröts: ' + err.message + ' Inget är borttaget. Det som redan flyttats ligger i den nya mappen; försök igen så fortsätter appen.', true); });
    },
    'od-flytta-rot': function () {
      var sokvag = varde('odFlyttaRot');
      var opt = { styrelsearbete: (document.getElementById('odFlyttaSA') || {}).checked, aldre: (document.getElementById('odFlyttaAldre') || {}).checked };
      if (!window.confirm('Flytta den samlade mappen till ' + sokvag + '? Inget tas bort förutom tomma mappar som slagits ihop.')) return;
      flyttaSamladMapp(sokvag, opt).then(function (res) {
        render();
        visa('Klart. Den samlade mappen ligger nu i ' + sokvag + '. ' + res.gjort.join('; ') + '.');
      }).catch(function (err) { sattStatus('Flytten avbröts', true); visa('Flytten avbröts: ' + err.message + ' Inget är borttaget; försök igen så fortsätter appen.', true); });
    },
    'od-valj-mapp': function () {
      var sokvag = varde('odSokvag');
      sattStatus('Kopplar till OneDrive…');
      valjEgenMapp(sokvag).then(function () {
        visa(odNu.konflikt ? 'Mappen är kopplad. Välj vilken version av bokföringen som ska gälla.' : 'Appen är kopplad till OneDrive-mappen ' + od.mapp.sokvag + '.');
      }).catch(function (err) { if (!odNu.konflikt) { od.mapp = null; sparaOd(); } visa(err.message, true); });
    },
    'od-valj-delad': function (t) {
      var m = odNu.delade[Number(t.dataset.index)];
      sattStatus('Hämtar bokföringen…');
      valjDeladMapp(m).then(function () {
        vy = 'rapporter';
        visa('Mappen är öppnad för läsning. Du kan se rapporter, verifikationer och underlag men inte ändra något.');
      }).catch(function (err) { od.mapp = null; od.lage = null; sparaOd(); visa(err.message, true); });
    },
    'od-synka': function () {
      var steg = lasLage() || !od.smutsig ? hamtaFranOneDrive() : synkaUpp();
      steg.then(function () { render(); }).catch(function (err) { visa(err.message, true); });
    },
    'od-reg-onedrive': function () {
      if (!window.confirm('Ersätta medlemsregistret i den här webbläsaren med versionen i OneDrive?')) return;
      graf(iRegMappen()).then(function (meta) { return lasRegisterFil().then(function (r) { tillampaRegister(r, meta.eTag); }); })
        .then(function () { visa('Medlemsregistret från OneDrive används nu.'); }).catch(function (err) { visa(err.message, true); });
    },
    'od-reg-behall': function () {
      if (!window.confirm('Skriva över medlemsregistret i OneDrive med den här webbläsarens version?')) return;
      graf(iRegMappen(), { tillat: [404] }).then(function (meta) {
        od.regETag = meta === 404 ? null : meta.eTag;
        od.regSmutsig = true;
        odNu.regKonflikt = false;
        sparaOd();
        return synkaRegister();
      }).then(function () { visa('Den här webbläsarens medlemsregister är sparat i OneDrive.'); }).catch(function (err) { visa(err.message, true); });
    },
    'exportera-register': function () {
      laddaNer('medlemsregister-' + idag() + '.json', JSON.stringify(store.medlemsregister, null, 2), 'application/json');
    },
    'importera-register': function () {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = function () {
        var fil = input.files[0];
        if (!fil) return;
        fil.text().then(function (txt) {
          var d = JSON.parse(txt);
          var r = d && d.format === 'foreningsbokforing-medlemsregister' ? d : d && d.format === 1 && d.medlemsregister ? d.medlemsregister : null;
          if (!r) throw new Error('Filen innehåller inget medlemsregister.');
          if (K.registerHarData(reg()) && !window.confirm('Ersätta medlemsregistret med det i filen?')) return;
          sparaReg(K.normaliseraRegister(r));
          visa('Medlemsregistret är inläst.');
        }).catch(function (err) { visa('Filen kunde inte läsas: ' + err.message, true); });
      };
      input.click();
    },
    'od-anvand-onedrive': function () {
      if (!window.confirm('Ersätta bokföringen i den här webbläsaren med versionen i OneDrive?')) return;
      graf(iMappen(DATAFIL)).then(hamtaOchTillampa).then(function () { visa('Bokföringen från OneDrive används nu.'); }).catch(function (err) { visa(err.message, true); });
    },
    'od-behall-har': function () {
      if (!window.confirm('Skriva över bokföringen i OneDrive med den här webbläsarens version?')) return;
      graf(iMappen(DATAFIL), { tillat: [404] }).then(function (meta) {
        od.eTag = meta === 404 ? null : meta.eTag;
        od.smutsig = true;
        odNu.konflikt = false;
        odNu.konfliktForsta = false;
        sparaOd();
        return synkaUpp();
      }).then(function () { visa('Den här webbläsarens version är sparad i OneDrive.'); }).catch(function (err) { visa(err.message, true); });
    },
    'od-byt-mapp': function () {
      if (od.smutsig && !window.confirm('Det finns ändringar som inte sparats i OneDrive. Byta mapp ändå?')) return;
      sparaAppinstallningar({ mapp: null, rot: null, lage: null, regMapp: null }).catch(function () { /* frivilligt */ });
      od.rot = null;
      od.mapp = null; od.lage = null; od.eTag = null; od.senast = null; od.smutsig = false; odNu.mappar = {}; odNu.konflikt = false; odNu.delade = null;
      od.regMapp = null; od.regETag = null; odNu.regKonflikt = false;
      od.styrMapp = null; od.styrRot = null; od.uppdragLas = null; odNu.motesHistorik = null; odNu.amHandlingar = {};
      ['styr', 'upp'].forEach(function (k) { sty[k].eTag = null; });
      sparaStyrLokalt();
      sparaOd();
      sattStatus('');
      render();
    },
    'od-logga-ut': function () {
      if (od.smutsig && !window.confirm('Det finns ändringar som inte sparats i OneDrive. Logga ut ändå?')) return;
      kopplaFranOneDrive();
      visa('Du är utloggad från OneDrive. Bokföringen finns kvar i den här webbläsaren.');
    },
    'las-in-forening': function () {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = function () {
        var fil = input.files[0];
        if (!fil) return;
        fil.text().then(function (txt) {
          var data = JSON.parse(txt);
          var res = K.slaIhopForening(store, data, nyttId);
          Object.assign(store, res.data);
          // Logotypen återställs när den saknas på enheten, oavsett vad en säkerhetskopia säger.
          var logo = Promise.resolve(false);
          if (data.logotyp && data.logotyp.data && !logoUrl) {
            var bin = atob(data.logotyp.data);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            logo = sparaFil('logotyp', new Blob([bytes], { type: data.logotyp.typ || 'image/png' }), 'lokal').then(function () {
              store.forening.harLogotyp = true;
              store.forening.logoOdId = null;
              return laddaLogo().then(function () { return true; });
            });
          }
          return logo.then(function (medLogo) {
            spara();
            var a = res.antal;
            visa('Inläst: ' + a.uppgifter + ' uppgifter, ' + a.adresser + ' adresser, ' + a.kontakter + ' kontaktpersoner och ' + a.artiklar + ' artiklar' + (a.terminer ? ', ' + a.terminer + ' avgifter för medlemmar' : '') + (medLogo ? ' samt logotypen' : '') + '. Uppgifter som redan var ifyllda har behållits.');
          });
        }).catch(function (err) { visa(err.fel ? err.fel.join(' ') : 'Filen kunde inte läsas: ' + err.message, true); });
      };
      input.click();
    },
    'ta-bort-logo': function () {
      taBortFil('logotyp');
      store.forening.harLogotyp = false;
      store.forening.logoOdId = null;
      logoUrl = null;
      spara();
      visa('Logotypen är borttagen.');
    },
    'exportera': function () {
      laddaNer('foreningsbokforing-' + idag() + '.json', JSON.stringify(bokforingsdata(), null, 2), 'application/json');
    },
    'sie': function () {
      var ar = aktivt();
      var text = K.sieExport(ar, { forening: store.forening, genererad: idag() });
      laddaNer('bokforing-' + K.arNamn(ar).replace('/', '-') + '.se', K.tillCp437(text), 'application/octet-stream');
    },
    'importera': function () {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = function () {
        var fil = input.files[0];
        if (!fil) return;
        fil.text().then(function (txt) {
          var d = JSON.parse(txt);
          if (!d || d.format !== 1 || !d.ar) throw new Error('Filen är ingen säkerhetskopia från Föreningsbokföring.');
          var fel = [];
          Object.keys(d.ar).forEach(function (id) { K.valideraAr(d.ar[id]).forEach(function (f) { fel.push(id + ': ' + f); }); });
          if (fel.length) throw new Error('Säkerhetskopian har fel: ' + fel.slice(0, 5).join(' '));
          if (Object.keys(store.ar).length && !window.confirm('Ersätta all bokföring i webbläsaren med säkerhetskopian?')) return;
          var regNu = store.medlemsregister;
          var regI = d.medlemsregister;
          delete d.medlemsregister;
          store = d;
          // Säkerhetskopior från version 1.12 innehåller registret; det används bara om registret här är tomt.
          store.medlemsregister = regI && !K.registerHarData(regNu) ? K.normaliseraRegister(regI) : regNu;
          if (!store.regler) store.regler = [];
          if (!store.motpartsregler) store.motpartsregler = [];
          LISTNYCKLAR.forEach(function (k) { if (!store[k]) store[k] = []; });
          if (!store.ar[store.aktivt]) store.aktivt = Object.keys(store.ar).sort().pop() || null;
          spara();
          vy = 'verifikationer';
          visa('Säkerhetskopian är inläst.');
        }).catch(function (err) { visa(err.message, true); });
      };
      input.click();
    }
  };

  ladda();
  if (!OVNING) laddaOd();
  else document.title = 'Övning – ' + document.title;
  fangaInbjudan();
  laggTillManifest();
  LISTNYCKLAR.forEach(function (k) { if (!store[k]) store[k] = []; });
  if (lasLage()) vy = 'rapporter';
  render();
  laddaLogo().then(render);

  // Inloggning, och därefter senaste versionen från OneDrive.
  (OVNING ? Promise.resolve() : hanteraInloggningsretur()).then(function () {
    if (OVNING) return;
    if (od.clientId && od.refreshToken && !od.mapp) {
      sattStatus('Letar efter föreningens mapp…');
      return aterkoppla().then(function (res) {
        if (!res) sattStatus('');
        if (res === 'uppdrag') sattStatus('Förtroendeuppdragen är hämtade');
        if (res === 'inbjudan') { vy = 'rapporter'; visa('Bokföringen är öppnad för läsning. Du kan se rapporter, verifikationer och underlag men inte ändra något.'); }
        else if (res === 'mapp') visa(odNu.konflikt ? 'Mappen är kopplad. Välj vilken version av bokföringen som ska gälla.' : 'Klart! Den här enheten är kopplad till ' + (od.mapp.sokvag || od.mapp.namn) + '.');
      });
    }
    if (!od.clientId || !od.mapp) return;
    if (!od.refreshToken) { odNu.inloggningKravs = true; sattStatus('Inte inloggad i OneDrive', true); return; }
    sattStatus('Hämtar från OneDrive…');
    return hamtaFranOneDrive().then(function () {
      return lasAppinstallningar().then(function (inst) {
        synkaNyckel(inst);
        if (inst.bild !== undefined && (inst.bild || null) !== minBild()) { try { if (inst.bild) localStorage.setItem(MIN_BILD, inst.bild); else localStorage.removeItem(MIN_BILD); } catch (e) { /* tomt */ } }
        // Enheter som kopplades innan appmappen fanns (version 1.0) sparar mappen nu,
        // så att nya enheter hittar den när de loggar in.
        if (od.mapp && (!inst.mapp || inst.mapp.id !== od.mapp.id || inst.lage !== od.lage)) {
          return sparaAppinstallningar({ mapp: od.mapp, lage: od.lage });
        }
      }).catch(function () { /* frivilligt */ });
    });
  }).catch(function (err) {
    sattStatus(err.message, true);
    // Försök logga in tyst i bakgrunden högst en gång i timmen; annars visas en knapp.
    var senast = 0;
    try { senast = Number(localStorage.getItem('forening-bokforing:tyst-inloggning')) || 0; } catch (e) { /* tomt */ }
    if (odNu.inloggningKravs && od.clientId && od.mapp && Date.now() - senast > 3600000) startaInloggning(true);
  }).then(render);

  // En inbjudningslänk som öppnas i en flik där appen redan är öppen.
  window.addEventListener('hashchange', function () {
    if (!/#revisor=/.test(location.hash)) return;
    fangaInbjudan();
    if (od.refreshToken && !od.mapp) {
      aterkoppla().then(function (res) { if (res === 'inbjudan') { vy = 'rapporter'; visa('Bokföringen är öppnad för läsning.'); } }, function (err) { visa(err.message, true); });
    } else if (od.mapp) {
      localStorage.removeItem(INBJUDAN);
      visa('Den här webbläsaren är redan kopplad till en mapp. Logga ut under År och arkiv → OneDrive och öppna länken igen för att använda inbjudan.', true);
    } else render();
  });

  document.getElementById('nav').addEventListener('scroll', markeraNavSlut, { passive: true });
  // Mobilen: ett tryck på en cirkel visar informationen, ett tryck till (eller utanför) döljer den.
  document.addEventListener('click', function (e) {
    var a = e.target.closest('#narvaro .avatar');
    document.querySelectorAll('#narvaro .avatar.oppen').forEach(function (x) { if (x !== a) x.classList.remove('oppen'); });
    if (a) a.classList.toggle('oppen');
  });
  window.addEventListener('resize', function () { skalaForhandsvisningar(); markeraNavSlut(); });

  // Hämta igen när appen kommer tillbaka i fokus, så att ändringar från en annan enhet syns.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !odAnslutet() || Date.now() - odNu.senastHamtat < 60000) return;
    hamtaFranOneDrive().then(render, function () { render(); });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && hjalpOppen) { hjalpOppen = null; render(); } });
  setInterval(function () { if (odAnslutet() && !OVNING) uppdateraNarvaro().then(ritaNarvaro, function () { /* frivilligt */ }); }, 120000);
  setTimeout(function () { if (odAnslutet() && !OVNING) uppdateraNarvaro().then(render, function () { /* frivilligt */ }); }, 4000);
  window.addEventListener('beforeunload', function (e) {
    if (odAnslutet() && od.smutsig && !lasLage()) { e.preventDefault(); e.returnValue = ''; }
  });
})();
</script>
</body>
</html>
