<title>Föreningsbokföring</title>

<style>
  /* Färger och form från föreningens hemsida: ljust, skiffergrå text, kolgrå partier, guld från logotypen. */
  :root {
    --bg: #F4F4F4;
    --surface: #FFFFFF;
    --surface-2: #ECEDF0;
    --ink: #373F51;
    --ink-soft: #4E586E;
    --ink-faint: #7D8596;
    --accent: #2B2A27;
    --accent-text: #FFFFFF;
    --guld: #E5AE1F;
    --lank: #2F80C8;
    --good: #2E7D4F;
    --over: #C8372D;
    --hairline: rgba(55, 63, 81, 0.13);
    --kol: #2B2A27;
    --kol-text: #E9E7E2;
    --skugga: 0 1px 2px rgba(55, 63, 81, 0.06), 0 2px 8px rgba(55, 63, 81, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1F1E1C;
      --surface: #2B2A27;
      --surface-2: #353330;
      --ink: #F1EFEA;
      --ink-soft: #CBC7BE;
      --ink-faint: #948F85;
      --accent: #FFFFFF;
      --accent-text: #373F51;
      --guld: #F0BF3C;
      --lank: #6FB3EC;
      --good: #6FBF8E;
      --over: #E8705F;
      --hairline: rgba(241, 239, 234, 0.12);
      --kol: #161514;
      --kol-text: #E9E7E2;
      --skugga: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1F1E1C;
    --surface: #2B2A27;
    --surface-2: #353330;
    --ink: #F1EFEA;
    --ink-soft: #CBC7BE;
    --ink-faint: #948F85;
    --accent: #FFFFFF;
    --accent-text: #373F51;
    --guld: #F0BF3C;
    --lank: #6FB3EC;
    --good: #6FBF8E;
    --over: #E8705F;
    --hairline: rgba(241, 239, 234, 0.12);
    --kol: #161514;
    --kol-text: #E9E7E2;
    --skugga: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font: 15.5px/1.55 "Roboto Flex", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left)); }
  .nowrap { white-space: nowrap; }
  /* Safari på iPhone ger datumfält en egen minsta bredd och centrerad text; håll dem inom rutan. */
  @supports (-webkit-touch-callout: none) {
    input[type="date"] { -webkit-appearance: none; appearance: none; min-width: 0; display: block; min-height: 42px; text-align: left; }
    input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  }
  .wrap { flex: 1 0 auto; width: 100%; }
  .topp { position: relative; z-index: 40; background: var(--surface); padding-top: env(safe-area-inset-top); }
  header { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 16px 10px; text-align: center; }
  .logo-bricka { background: #fff; border-radius: 50%; padding: 6px; display: inline-flex; }
  .logo-bricka[hidden] { display: none; }
  #logo { height: 84px; width: auto; display: block; border-radius: 50%; }
  h1 { font: 700 26px/1.2 "Roboto Flex", system-ui, sans-serif; letter-spacing: -0.01em; margin: 0; color: var(--ink); }
  h2 { font: 500 21px/1.3 "Roboto Flex", system-ui, sans-serif; margin: 24px 0 10px; color: var(--ink); }
  h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); margin: 18px 0 6px; }
  #arvaljare { font-size: 13px; color: var(--ink-soft); }
  #arvaljare select { padding: 3px 8px; font-size: 13px; border-radius: 999px; }
  #synkstatus { font-size: 12px; color: var(--ink-faint); min-height: 1em; }
  /* Cirklar för dem som har appen öppen, som i Word. */
  /* Övre högra hörnet, som i Word och Teams, så att sidhuvudet inte blir högre. */
  .narvaro { position: absolute; top: 16px; right: 20px; display: flex; align-items: center; z-index: 20; }
  .narvaro:empty { display: none; }
  .avatar { position: relative; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--surface); color: #fff; font: 600 12px/1 "Roboto Flex", system-ui, sans-serif;
    display: inline-flex; align-items: center; justify-content: center; padding: 0; margin-left: -6px; cursor: default; }
  .avatar:first-child { margin-left: 0; }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .avatar.skrivratt { box-shadow: 0 0 0 2px var(--guld); }
  .avatar.fler { background: var(--surface-2); color: var(--ink); }
  .avatar.jag { opacity: 0.7; margin-right: 8px; }
  .avatar.jag:hover, .avatar.jag:focus, .avatar.jag.oppen { opacity: 1; }
  .avatar-info { display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; min-width: 190px; max-width: 80vw;
    background: var(--surface); color: var(--ink); border: 1px solid var(--hairline); border-radius: 10px; padding: 9px 11px; box-shadow: var(--skugga), 0 6px 18px rgba(0, 0, 0, 0.12);
    font: 400 12.5px/1.45 "Roboto Flex", system-ui, sans-serif; text-align: left; white-space: normal; }
  .avatar-info strong { display: block; font-size: 13.5px; }
  .avatar:hover .avatar-info, .avatar:focus .avatar-info, .avatar.oppen .avatar-info { display: block; }
  .min-bild { width: 48px; height: 48px; font-size: 16px; margin: 0; }
  #synkstatus.fel { color: var(--over); }
  #navbar { position: sticky; top: 0; z-index: 20; }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 18px; padding: 6px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    background: var(--surface); border-bottom: 1px solid var(--hairline); }
  #undernav { background: var(--surface-2); padding-top: 0; }
  #undernav:empty { display: none; }
  #undernav button { font-size: 13px; font-weight: 500; padding: 8px 2px 6px; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink); padding: 10px 2px 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  nav button:hover { border-bottom-color: var(--hairline); }
  nav button[aria-current="page"] { border-bottom-color: var(--guld); }
  .btn { background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); border-radius: 999px; padding: 9px 20px; font: inherit; font-weight: 500; cursor: pointer; }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: .4; cursor: default; filter: none; }
  .btn-secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--hairline); box-shadow: var(--skugga); }
  .btn-small { padding: 5px 14px; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 16px 18px; margin: 12px 0; box-shadow: var(--skugga); }
  label { display: block; font-size: 13px; color: var(--ink-soft); margin: 8px 0 4px; }
  input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid rgba(55, 63, 81, 0.25); border-radius: 8px; padding: 8px 10px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--guld); outline-offset: 1px; }
  input.num { text-align: right; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); font-weight: 500; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.summa td { font-weight: 600; border-top: 1px solid var(--ink-faint); }
  tr.total td { font-weight: 600; border-top: 2px solid var(--ink); }
  tr.klickbar { cursor: pointer; }
  tr.klickbar:hover td { background: var(--surface-2); }
  .scroll { overflow-x: auto; }
  .muted { color: var(--ink-soft); }
  .faint { color: var(--ink-faint); font-size: 13px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--hairline); color: var(--ink-soft); margin-left: 6px; }
  .tag.varning { color: var(--over); border-color: var(--over); }
  .ok { color: var(--good); }
  .fel { color: var(--over); }
  #toast { position: fixed; left: 16px; right: 16px; bottom: 16px; margin: 0 auto; width: fit-content; max-width: 560px; transform: translateY(20px); z-index: 100;
    background: var(--surface); color: var(--over); border: 1px solid var(--over); border-radius: 10px; padding: 12px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  #toast.visas { opacity: 1; transform: none; pointer-events: auto; cursor: pointer; }
  .fellista { color: var(--over); margin: 8px 0; padding-left: 18px; }
  .rader-tabell input { padding: 5px 7px; }
  .rader-tabell td { border-bottom: 0; padding: 3px 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  .detalj td { background: var(--surface-2); }
  .dropzon { text-align: center; }
  .dropzon .row { justify-content: center; }
  .bankrad .belopp { font-weight: 600; white-space: nowrap; font-size: 16px; }
  .knapp-tag { background: none; cursor: pointer; font: inherit; font-size: 11px; }
  .tag.ok { color: var(--good); border-color: var(--good); }
  .checklista { list-style: none; padding: 0; margin: 0; }
  .checklista li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
  .checklista li:last-child { border-bottom: 0; }
  .checklista .bock { flex: 0 0 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; border: 2px solid var(--ink-faint); color: var(--ink-faint); }
  .checklista .klar .bock { background: var(--good); border-color: var(--good); color: #fff; }
  .checklista .varning .bock { border-color: var(--guld); color: var(--guld); }
  .arsmote-form textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid rgba(55, 63, 81, 0.25); border-radius: 8px; padding: 8px 10px; width: 100%; }
  .dok-rapport { min-height: 0; }
  .dok-rapport p { margin: 0 0 6px; }
  .dok-rubrik { color: #373F51; font-size: 12pt; text-transform: none; letter-spacing: 0; margin: 18px 0 6px; border-bottom: 1.5px solid #373F51; padding-bottom: 3px; }
  .dok-summa-rad td { border-top: 1px solid #999; font-weight: 600; }
  .dok-total-rad td { border-top: 1.5px solid #1a1a1a; font-weight: 700; }
  .dok-underskrifter { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 32px; margin-top: 30px; }
  .dok-linje { border-bottom: 1px solid #1a1a1a; height: 34px; margin-bottom: 4px; }
  .trolig { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; justify-content: space-between; }
  .avgift-panel { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
  .avgift-panel table td { border-bottom: 0; padding: 3px 4px; vertical-align: middle; }
  .avgift-panel input.num { width: 110px; text-align: right; }
  .hjalp-knapp { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--ink-faint); background: none; color: var(--ink-soft); font: 700 13px/1 system-ui, sans-serif; cursor: pointer; vertical-align: middle; padding: 0; margin-left: 4px; }
  .hjalp-knapp:hover { border-color: var(--ink); color: var(--ink); }
  .hjalp-bakgrund { position: fixed; inset: 0; background: rgba(0, 0, 0, .25); z-index: 50; }
  .hjalp-panel { position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; margin: 0; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
  @media print { .hjalp-knapp, .hjalp-panel, .hjalp-bakgrund { display: none !important; } }
  .lank-text { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--lank); cursor: pointer; text-align: left; }
  .info-falt { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; width: 100%; max-width: 30em; }
  .nyckeltal { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 10px 0; }
  .nyckeltal div { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
  .nyckeltal strong { display: block; font-size: 22px; }
  .logg { margin: 8px 0; padding-left: 18px; font-size: 14px; }
  a { color: var(--lank); }
  footer { margin-top: 40px; background: var(--kol); color: var(--kol-text); text-align: center; padding: 22px 16px calc(22px + env(safe-area-inset-bottom)); font-size: 13px; }
  .lank-knapp { background: none; border: 0; color: var(--kol-text); font: inherit; cursor: pointer; text-decoration: underline; opacity: .8; }
  .dropzon { border: 2px dashed rgba(55, 63, 81, 0.3); border-radius: 12px; }
  .listpost { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) auto; gap: 6px; align-items: end; padding: 8px 0; border-bottom: 1px solid var(--hairline); }
  .listpost textarea, .dok-form textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid rgba(55, 63, 81, 0.25); border-radius: 8px; padding: 7px 9px; width: 100%; min-height: 60px; }
  .forhandsvisning { overflow: hidden; background: var(--surface-2); padding: 6px; border-radius: 8px; }
  #utskrift { display: none; }
  /* Fakturor och kvitton: alltid ljusa, oavsett tema, i A4-format. */
  .dok { background: #fff; color: #1a1a1a; width: 180mm; min-height: 250mm; margin: 0 auto; padding: 12mm; font: 10.5pt/1.45 "Roboto Flex", Arial, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; box-sizing: content-box; }
  .dok table { width: 100%; border-collapse: collapse; }
  .dok th, .dok td { border: 0; padding: 3px 6px; color: #1a1a1a; }
  .dok-huvud { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
  .dok-logo { max-height: 80px; max-width: 200px; display: block; margin-bottom: 6px; }
  .dok-forening { font-size: 13pt; font-weight: 600; }
  .dok-titel { font: 700 24pt/1.1 "Roboto Flex", Arial, sans-serif; color: #373F51; text-align: right; margin-bottom: 8px; }
  .dok-meta td:first-child { color: #555; padding-right: 12px; }
  .dok-meta td { padding: 1px 0; white-space: nowrap; }
  .dok-parter { display: flex; gap: 24px; margin: 18px 0 14px; }
  .dok-parter > div { flex: 1; }
  .dok-etikett { color: #555; font-size: 9pt; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .dok-rader th { text-align: left; border-bottom: 1.5px solid #1a1a1a; font-size: 9pt; text-transform: uppercase; letter-spacing: .04em; color: #555; }
  .dok-rader td { border-bottom: 1px solid #ddd; vertical-align: top; }
  .dok .num { text-align: right; white-space: nowrap; }
  .dok-summa { width: 50% !important; margin-left: auto; margin-top: 8px; }
  .dok-summa tr.total td { font-weight: 600; border-top: 1.5px solid #1a1a1a; font-size: 12pt; }
  .dok-info { margin-top: 14px; }
  .dok-moms { text-align: right; color: #555; font-size: 9pt; margin-top: 4px; }
  .dok-betalning { margin-top: 18px; border: 1.5px solid #373F51; border-radius: 6px; display: grid; grid-template-columns: repeat(auto-fit, minmax(28mm, 1fr)); }
  .dok-betalning > div { padding: 8px 10px; border-left: 1px solid #c9ccd3; }
  .dok-betalning > div:first-child { border-left: 0; background: #F4F4F4; }
  .dok-betalning .etikett { font-size: 8pt; text-transform: uppercase; letter-spacing: .05em; color: #555; }
  .dok-betalning .varde { font-size: 11.5pt; font-weight: 600; white-space: nowrap; }
  .dok-betalning > div:first-child .varde { font-size: 14pt; }
  .dok-stampel { display: inline-block; border: 2.5px solid #2E7D4F; color: #2E7D4F; border-radius: 6px; padding: 4px 16px; font-weight: 700; font-size: 18pt; letter-spacing: .12em; transform: rotate(-6deg); margin: 6px 0 0 6mm; }
  .dok-kvittoinfo { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-top: 18px; }
  .dok-fot { margin-top: auto; padding-top: 10px; border-top: 1px solid #bbb; display: flex; gap: 18px; font-size: 9pt; color: #333; }
  .dok-fot > div { flex: 1; }
  .bara-touch { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .bara-mus { display: none; }
    .bara-touch { display: inline; }
    .btn { min-height: 42px; }
    .btn-small { min-height: 36px; }
    nav button { padding: 12px 2px 10px; }
    .knapp-tag { padding: 4px 8px; font-size: 12px; }
  }
  /* Verifikationerna som grundbok: en verifikation per rad på bred skärm, kortare lista på smal. */
  table.grundbok td { vertical-align: top; }
  table.grundbok td.gb-sida { font-size: 13.5px; }
  table.grundbok td.gb-sida div + div { margin-top: 2px; }
  table.grundbok .gb-summa { display: none; }
  @media (max-width: 900px) {
    table.grundbok .gb-sida { display: none; }
    table.grundbok .gb-summa { display: table-cell; }
  }
  /* Telefon */
  @media (max-width: 700px) {
    header { padding: 12px 16px 6px; gap: 4px; }
    .narvaro { top: 10px; right: 10px; }
    /* Utan logotyp ligger namnet överst; då får cirklarna en egen liten plats ovanför. */
    header:has(#logoBricka[hidden]):has(.narvaro:not(:empty)) { padding-top: 44px; }
    .narvaro .avatar { width: 26px; height: 26px; font-size: 10.5px; margin-left: -7px; }
    .narvaro .avatar:first-child { margin-left: 0; }
    .narvaro .avatar.jag { margin-right: 6px; }
    #logo { height: 50px; }
    h1 { font-size: 19px; line-height: 1.25; }
    h2 { font-size: 19px; margin: 18px 0 8px; }
    nav { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; gap: 0 18px; padding-top: 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-padding: 0 16px; }
    nav::-webkit-scrollbar { display: none; }
    nav { -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); }
    nav.i-slutet { -webkit-mask-image: none; mask-image: none; }
    nav button { white-space: nowrap; flex: 0 0 auto; }
    .wrap { padding-top: 10px; }
    /* 16 px förhindrar att iPhone zoomar in när man trycker i ett fält. */
    input, select, textarea, .arsmote-form textarea, .listpost textarea, .dok-form textarea { font-size: 16px; }
    .card { padding: 14px; border-radius: 10px; }
    th, td { padding: 6px 5px; }
    .forhandsvisning { padding: 6px; }

    /* Tabeller med många kolumner visas som kort. */
    table.kortlista thead { display: none; }
    table.kortlista tr { display: block; padding: 10px 0; border-bottom: 1px solid var(--hairline); }
    table.kortlista td { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border: 0; padding: 3px 0; text-align: right; }
    table.kortlista td > * { text-align: right; }
    table.kortlista td[data-etikett]::before { content: attr(data-etikett); color: var(--ink-soft); font-size: 13px; text-align: left; flex: 0 0 auto; }
    table.kortlista td:not([data-etikett]) { display: block; text-align: left; }
    table.kortlista input { width: 140px !important; }
    table.kortlista tr.total td { border-top: 0; }
    /* Fakturarader: en rad per fält. */
    table.dokrader thead { display: none; }
    table.dokrader tr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; padding: 10px 0; border-bottom: 1px solid var(--hairline); }

    ['6110', 'Kontorsmateriel'],
    ['6230', 'Datakommunikation'],
    ['6310', 'Försäkringar'],
    ['6500', 'Övriga externa tjänster'],
    ['6570', 'Bankkostnader'],
    ['6980', 'Föreningsavgifter'],
    ['6990', 'Övriga externa kostnader'],
    ['7240', 'Styrelsearvoden'],
    ['7290', 'Övriga arvoden'],
    ['7510', 'Arbetsgivaravgifter'],
    ['7610', 'Utbildning'],
    ['8310', 'Ränteintäkter'],
    ['8410', 'Räntekostnader'],
    ['8999', 'Årets resultat']
  ];

  function standardKontoplan() {
    return STANDARDKONTOPLAN.map(function (k) { return { nr: k[0], namn: k[1] }; });
  }

  function giltigtKontonummer(nr) { return typeof nr === 'string' && /^[1-8]\d{3}$/.test(nr); }
  function arBalanskonto(nr) { return nr[0] === '1' || nr[0] === '2'; }
  function iIntervall(nr, fran, till) { var n = Number(nr); return n >= fran && n <= till; }

  function kontonamn(ar, nr) {
    var k = ar.kontoplan.find(function (x) { return x.nr === nr; });
    // Avrundningskontot läggs till automatiskt när det bokförs första gången.
    return k ? k.namn : nr === AVRUNDNINGSKONTO.nr ? AVRUNDNINGSKONTO.namn : '(okänt konto)';
  }

  function sorteraKonton(lista) {
    return lista.slice().sort(function (a, b) { return a.nr < b.nr ? -1 : a.nr > b.nr ? 1 : 0; });
  }

  function laggTillKonto(ar, nr, namn) {
    nr = String(nr || '').trim();
    namn = String(namn || '').trim();
    if (!giltigtKontonummer(nr)) throw BokforingsFel('Kontonumret ska vara fyra siffror mellan 1000 och 8999.');
    if (!namn) throw BokforingsFel('Kontot behöver ett namn.');
    if (ar.kontoplan.some(function (k) { return k.nr === nr; })) throw BokforingsFel('Konto ' + nr + ' finns redan.');
    return Object.assign({}, ar, { kontoplan: sorteraKonton(ar.kontoplan.concat([{ nr: nr, namn: namn }])) });
  }

  function bytNamnPaKonto(ar, nr, namn) {
    namn = String(namn || '').trim();
    if (!namn) throw BokforingsFel('Kontot behöver ett namn.');
    if (!ar.kontoplan.some(function (k) { return k.nr === nr; })) throw BokforingsFel('Konto ' + nr + ' finns inte.');
    return Object.assign({}, ar, {
      kontoplan: ar.kontoplan.map(function (k) { return k.nr === nr ? { nr: nr, namn: namn } : k; })
    });
  }

  function kontoAnvands(ar, nr) {
    return (ar.ingaendeBalans[nr] || 0) !== 0 || ar.verifikationer.some(function (v) {
      return v.rader.some(function (r) { return r.konto === nr; });
    });
  }

  function taBortKonto(ar, nr) {
    if (kontoAnvands(ar, nr)) throw BokforingsFel('Konto ' + nr + ' används och kan inte tas bort.');
    return Object.assign({}, ar, { kontoplan: ar.kontoplan.filter(function (k) { return k.nr !== nr; }) });
  }

  // ---------- Bokföringsår ----------

  function arNamn(ar) {
    var y = Number(ar.start.slice(0, 4));
    if (ar.start.slice(5) === '01-01' && ar.slut === y + '-12-31') return String(y);
    return y + '/' + String((y + 1) % 100).padStart(2, '0');
  }

  function rensaNollor(obj) {
    var ut = {};
    Object.keys(obj).sort().forEach(function (k) { if (obj[k] !== 0) ut[k] = obj[k]; });
    return ut;
  }

  function kontrolleraIngaendeBalans(kontoplan, ib) {
    var fel = [];
    var summa = 0;
    Object.keys(ib).forEach(function (nr) {
      if (!kontoplan.some(function (k) { return k.nr === nr; })) fel.push('Ingående balans: konto ' + nr + ' finns inte i kontoplanen.');
      else if (!arBalanskonto(nr)) fel.push('Ingående balans: konto ' + nr + ' är inget balanskonto.');
      if (!arHeltal(ib[nr])) fel.push('Ingående balans: beloppet på konto ' + nr + ' är inte ett heltal i ören.');
      else summa += ib[nr];
    });
    if (summa !== 0) fel.push('Ingående balans går inte ihop: skillnaden är ' + formatBelopp(summa) + ' kr.');
    return fel;
  }

  function skapaAr(opt) {
    opt = opt || {};
    var start = opt.start;
    if (!arGiltigtDatum(start)) throw BokforingsFel('Räkenskapsårets startdatum saknas eller är ogiltigt.');
    var slut = opt.slut || laggTillDagar(laggTillAr(start, 1), -1);
    if (!arGiltigtDatum(slut) || slut < start) throw BokforingsFel('Räkenskapsårets slutdatum är ogiltigt.');
    if (slut > laggTillDagar(laggTillAr(start, 1), 182)) throw BokforingsFel('Ett räkenskapsår får vara högst 18 månader.');
    var kontoplan = sorteraKonton((opt.kontoplan || standardKontoplan()).map(function (k) { return { nr: k.nr, namn: k.namn }; }));
    var ib = rensaNollor(Object.assign({}, opt.ingaendeBalans || {}));
    var fel = kontrolleraIngaendeBalans(kontoplan, ib);
    if (fel.length) throw BokforingsFel(fel);
    return {
      format: FORMAT, start: start, slut: slut, kontoplan: kontoplan, ingaendeBalans: ib, verifikationer: [], lastTom: null,
      bankrader: [], underlag: (opt.underlag || []).map(function (u) { return Object.assign({}, u); })
    };
  }

  // ---------- Verifikationer ----------

  function valideraVerifikation(ar, utkast) {
    var fel = [];
    utkast = utkast || {};
    if (!arGiltigtDatum(utkast.datum)) {
      fel.push('Datum saknas eller är ogiltigt.');
    } else {
      if (utkast.datum < ar.start || utkast.datum > ar.slut) {
        fel.push('Datumet ' + utkast.datum + ' ligger utanför räkenskapsåret ' + ar.start + ' – ' + ar.slut + '.');
      }
      if (ar.lastTom && utkast.datum <= ar.lastTom) {
        fel.push('Perioden till och med ' + ar.lastTom + ' är låst.');
      }
    }
    if (!utkast.text || !String(utkast.text).trim()) fel.push('Verifikationen behöver en text.');
    var rader = utkast.rader || [];
    if (rader.length < 2) fel.push('En verifikation behöver minst två rader.');
    var summa = 0;
    var beloppOk = true;
    rader.forEach(function (r, i) {
      if (!ar.kontoplan.some(function (k) { return k.nr === r.konto; })) {
        fel.push('Rad ' + (i + 1) + ': kontot ' + (r.konto || '(tomt)') + ' finns inte i kontoplanen.');
      }
      if (!arHeltal(r.belopp) || r.belopp === 0) {
        fel.push('Rad ' + (i + 1) + ': beloppet måste vara ett heltal i ören och inte noll.');
        beloppOk = false;
      } else {
        summa += r.belopp;
      }
    });
    if (beloppOk && summa !== 0) fel.push('Debet och kredit går inte ihop: skillnaden är ' + formatBelopp(summa) + ' kr.');
    return fel;
  }

  function nastaVerifikationsnummer(ar) {
    return ar.verifikationer.reduce(function (m, v) { return Math.max(m, v.nr); }, 0) + 1;
  }

  // Bokför ett utkast. Returnerar { ar, verifikation } och ändrar aldrig det gamla året.
  function bokfor(ar, utkast) {
    var fel = valideraVerifikation(ar, utkast);
    if (fel.length) throw BokforingsFel(fel);
    var v = {
      nr: nastaVerifikationsnummer(ar),
      datum: utkast.datum,
      text: String(utkast.text).trim(),
      rader: utkast.rader.map(function (r) {
        var rad = { konto: r.konto, belopp: r.belopp };
        if (r.text) rad.text = String(r.text);
        return rad;
      }),
      underlag: (utkast.underlag || []).map(String).filter(Boolean)
    };
    if (utkast.underlagKommentar) v.underlagKommentar = String(utkast.underlagKommentar);
    if (utkast.registrerad) v.registrerad = utkast.registrerad;
    if (utkast.rattar != null) v.rattar = utkast.rattar;
    return { ar: Object.assign({}, ar, { verifikationer: ar.verifikationer.concat([v]) }), verifikation: v };
  }

  function hittaVerifikation(ar, nr) {
    return ar.verifikationer.find(function (v) { return v.nr === nr; }) || null;
  }

  function rattadAv(ar, nr) {
    return ar.verifikationer.find(function (v) { return v.rattar === nr; }) || null;
  }

  // Rättelse = ny verifikation med omvända belopp. Inget raderas.
  function rattelse(ar, nr, opt) {
    opt = opt || {};
    var v = hittaVerifikation(ar, nr);
    if (!v) throw BokforingsFel('Verifikation ' + nr + ' finns inte.');
    if (v.rattar != null) throw BokforingsFel('Verifikation ' + nr + ' är själv en rättelse. Bokför en ny verifikation i stället.');
    if (rattadAv(ar, nr)) throw BokforingsFel('Verifikation ' + nr + ' är redan rättad.');
    // Bankrader och underlag släpps så att de kan bokföras på nytt.
    var slappt = Object.assign({}, ar, {
      bankrader: (ar.bankrader || []).map(function (r) { return r.verifikation === nr ? Object.assign({}, r, { verifikation: null }) : r; }),
      underlag: (ar.underlag || []).map(function (u) { return u.verifikation === nr ? Object.assign({}, u, { verifikation: null, arkivnamn: undefined }) : u; })
    });
    return bokfor(slappt, {
      datum: opt.datum,
      text: opt.text || ('Rättelse av verifikation ' + nr + ': ' + v.text),
      rader: v.rader.map(function (r) { return { konto: r.konto, belopp: -r.belopp }; }),
      underlagKommentar: 'Rättelse av verifikation ' + nr,
      registrerad: opt.registrerad,
      rattar: nr
    });
  }

  // Ändrar ett kontos ingående balans; skillnaden förs mot eget kapital (2067) så att balansen går ihop.
  function sattIngaendeSaldo(ar, konto, belopp, motkonto) {
    motkonto = motkonto || '2067';
    if (ar.lastTom) throw BokforingsFel('Året är låst. Ingående balans kan inte ändras.');
    if (!giltigtKontonummer(konto) || !arBalanskonto(konto) || !arHeltal(belopp)) throw BokforingsFel('Ogiltigt konto eller belopp.');
    if (!ar.kontoplan.some(function (k) { return k.nr === motkonto; })) throw BokforingsFel('Konto ' + motkonto + ' finns inte i kontoplanen.');
    var ib = Object.assign({}, ar.ingaendeBalans);
    var diff = belopp - (ib[konto] || 0);
    ib[konto] = belopp;
    ib[motkonto] = (ib[motkonto] || 0) - diff;
    ib = rensaNollor(ib);
    var fel = kontrolleraIngaendeBalans(ar.kontoplan, ib);
    if (fel.length) throw BokforingsFel(fel);
    return Object.assign({}, ar, { ingaendeBalans: ib });
  }

  function lasPeriod(ar, tom) {
    if (!arGiltigtDatum(tom) || tom < ar.start || tom > ar.slut) throw BokforingsFel('Datumet för låsning måste ligga inom räkenskapsåret.');
    if (ar.lastTom && tom < ar.lastTom) throw BokforingsFel('Perioden är redan låst till och med ' + ar.lastTom + '.');
    return Object.assign({}, ar, { lastTom: tom, laslogg: (ar.laslogg || []).concat([{ handling: 'låst', tom: tom, tid: arguments[2] || null }]) });
  }

  // Låser upp en låst period. Varje upplåsning sparas i årets logg så att den syns i efterhand.
  function lasUpp(ar, opt) {
    if (ar.grovkopia) throw BokforingsFel('En arkivkopia från Excel kan inte låsas upp.');
    if (!ar.lastTom) throw BokforingsFel('Inget är låst.');
    var post = { handling: 'upplåst', tom: ar.lastTom, tid: (opt && opt.tid) || null, orsak: (opt && opt.orsak) || '' };
    return Object.assign({}, ar, { lastTom: null, laslogg: (ar.laslogg || []).concat([post]) });
  }

  // ---------- Saldon ----------

  function rorelser(ar, opt) {
    opt = opt || {};
    var ut = {};
    ar.verifikationer.forEach(function (v) {
      if (opt.fran && v.datum < opt.fran) return;
      if (opt.tom && v.datum > opt.tom) return;
      v.rader.forEach(function (r) { ut[r.konto] = (ut[r.konto] || 0) + r.belopp; });
    });
    return ut;
  }

  function saldon(ar, opt) {
    var ut = Object.assign({}, ar.ingaendeBalans);
    var r = rorelser(ar, { tom: opt && opt.tom });
    Object.keys(r).forEach(function (k) { ut[k] = (ut[k] || 0) + r[k]; });
    return ut;
  }

  function summaIntervall(s, fran, till) {
    return Object.keys(s).reduce(function (sum, k) { return iIntervall(k, fran, till) ? sum + s[k] : sum; }, 0);
  }

  function saldobalans(ar, opt) {
    var r = rorelser(ar, { tom: opt && opt.tom });
    var konton = {};
    Object.keys(ar.ingaendeBalans).concat(Object.keys(r)).forEach(function (k) { konton[k] = true; });
    return Object.keys(konton).sort().map(function (nr) {
      var ib = ar.ingaendeBalans[nr] || 0;
      var rorelse = r[nr] || 0;
      return { nr: nr, namn: kontonamn(ar, nr), ib: ib, rorelse: rorelse, ub: ib + rorelse };
    });
  }

  function grundbok(ar) {
    return ar.verifikationer.slice().sort(function (a, b) {
      return a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : a.nr - b.nr;
    });
  }

  function huvudbok(ar, konto) {
    var ib = ar.ingaendeBalans[konto] || 0;
    var saldo = ib;
    var rader = [];
    grundbok(ar).forEach(function (v) {
      v.rader.forEach(function (r) {
        if (r.konto !== konto) return;
        saldo += r.belopp;
        rader.push({ datum: v.datum, nr: v.nr, text: r.text || v.text, belopp: r.belopp, saldo: saldo });
      });
    });
    return { konto: konto, namn: kontonamn(ar, konto), ib: ib, rader: rader, ub: saldo };
  }

  // ---------- Rapporter ----------

  var RR_GRUPPER = [
    { namn: 'Verksamhetens intäkter', fran: 3000, till: 3999 },
    { namn: 'Varor och material', fran: 4000, till: 4999 },
    { namn: 'Övriga externa kostnader', fran: 5000, till: 6999 },
    { namn: 'Personalkostnader', fran: 7000, till: 7699 },
    { namn: 'Avskrivningar', fran: 7700, till: 7899 },
    { namn: 'Övriga rörelsekostnader', fran: 7900, till: 7999 },
    { namn: 'Finansiella poster', fran: 8000, till: 8899 },
    { namn: 'Bokslutsdispositioner och skatt', fran: 8900, till: 8989 }
  ];

  var BR_TILLGANGAR = [
    { namn: 'Anläggningstillgångar', fran: 1000, till: 1399 },
    { namn: 'Varulager', fran: 1400, till: 1499 },
    { namn: 'Kortfristiga fordringar', fran: 1500, till: 1899 },
    { namn: 'Kassa och bank', fran: 1900, till: 1999 }
  ];

  var BR_EK_SKULDER = [
    { namn: 'Eget kapital', fran: 2000, till: 2099 },
    { namn: 'Avsättningar', fran: 2100, till: 2299 },
    { namn: 'Långfristiga skulder', fran: 2300, till: 2399 },
    { namn: 'Kortfristiga skulder', fran: 2400, till: 2999 }
  ];

  // Årets resultat: positivt = överskott. 8990–8999 (bokföring av resultatet) räknas inte.
  function aretsResultat(ar, opt) {
    return -summaIntervall(saldon(ar, opt), 3000, 8989);
  }

  function namnFranNagot(nr, ar, annat) {
    if (ar.kontoplan.some(function (k) { return k.nr === nr; })) return kontonamn(ar, nr);
    return annat ? kontonamn(annat, nr) : '(okänt konto)';
  }

  function grupperaKonton(grupper, nu, jmf, tecken, ar, annat) {
    return grupper.map(function (g) {
      var nr = {};
      Object.keys(nu).concat(Object.keys(jmf || {})).forEach(function (k) { if (iIntervall(k, g.fran, g.till)) nr[k] = true; });
      var konton = Object.keys(nr).sort().map(function (k) {
        var rad = { nr: k, namn: namnFranNagot(k, ar, annat), belopp: tecken * (nu[k] || 0) };
        if (jmf) rad.jamforelse = tecken * (jmf[k] || 0);
        return rad;
      }).filter(function (r) { return r.belopp !== 0 || (r.jamforelse || 0) !== 0; });
      var grupp = { namn: g.namn, konton: konton, summa: konton.reduce(function (s, r) { return s + r.belopp; }, 0) };
      if (jmf) grupp.jamforelse = konton.reduce(function (s, r) { return s + r.jamforelse; }, 0);
      return grupp;
    }).filter(function (g) { return g.konton.length > 0; });
  }

  function resultatrakning(ar, opt) {
    opt = opt || {};
    var nu = saldon(ar, { tom: opt.tom });
    var jmf = opt.foregaende ? saldon(opt.foregaende) : null;
    var grupper = grupperaKonton(RR_GRUPPER, nu, jmf, -1, ar, opt.foregaende);
    var ut = { grupper: grupper, aretsResultat: aretsResultat(ar, { tom: opt.tom }) };
    if (jmf) ut.jamforelseResultat = aretsResultat(opt.foregaende);
    return ut;
  }

  function balansrakning(ar, opt) {
    opt = opt || {};
    var nu = saldon(ar, { tom: opt.tom });
    var ib = ar.ingaendeBalans;
    var tillgangar = grupperaKonton(BR_TILLGANGAR, nu, ib, 1, ar);
    var ekSkulder = grupperaKonton(BR_EK_SKULDER, nu, ib, -1, ar);
    // Resultat som ännu inte förts över till eget kapital visas som en egen rad.
    var ejBokfort = -summaIntervall(nu, 3000, 8999);
    if (ejBokfort !== 0) {
      var ek = ekSkulder.find(function (g) { return g.namn === 'Eget kapital'; });
      if (!ek) {
        ek = { namn: 'Eget kapital', konton: [], summa: 0, jamforelse: 0 };
        ekSkulder.unshift(ek);
      }
      ek.konton.push({ nr: '', namn: 'Årets resultat', belopp: ejBokfort, jamforelse: 0 });
      ek.summa += ejBokfort;
    }
    var summa = function (gs, f) { return gs.reduce(function (s, g) { return s + g[f]; }, 0); };
    var ut = {
      tillgangar: { grupper: tillgangar, summa: summa(tillgangar, 'summa'), ingaende: summa(tillgangar, 'jamforelse') },
      egetKapitalOchSkulder: { grupper: ekSkulder, summa: summa(ekSkulder, 'summa'), ingaende: summa(ekSkulder, 'jamforelse') }
    };
    ut.balanserar = ut.tillgangar.summa === ut.egetKapitalOchSkulder.summa;
    return ut;
  }

  // ---------- Årsskifte ----------

  // Öppnar nästa år. Balanskontona förs över som ingående balans. Ett resultat som
  // inte redan bokförts mot eget kapital läggs på resultatkontot (2069).
  function nastaAr(ar, opt) {
    var resultatkonto = (opt && opt.resultatkonto) || '2069';
    if (!ar.kontoplan.some(function (k) { return k.nr === resultatkonto; })) {
      throw BokforingsFel('Konto ' + resultatkonto + ' för årets resultat finns inte i kontoplanen.');
    }
    var s = saldon(ar);
    var ib = {};
    var resultat = 0;
    Object.keys(s).forEach(function (nr) {
      if (arBalanskonto(nr)) ib[nr] = s[nr];
      else resultat += s[nr];
    });
    ib[resultatkonto] = (ib[resultatkonto] || 0) + resultat;
    var start = laggTillDagar(ar.slut, 1);
    return skapaAr({
      start: start,
      slut: laggTillDagar(laggTillAr(start, 1), -1),
      kontoplan: ar.kontoplan,
      ingaendeBalans: ib,
      // Obetalda fakturor och outlösta kvitton följer med till nästa år.
      underlag: oppnaUnderlag(ar)
    });
  }

  // Ett nytt räkenskapsår efter en arkivkopia från Excel: utgående saldon blir ingående balans,
  // årets resultat förs till 2069 och konton som saknas i kontoplanen läggs till.
  function arFranArkiv(arkiv, kontoplan) {
    var s = saldon(arkiv), ib = {}, resultat = 0;
    Object.keys(s).forEach(function (nr) {
      if (arBalanskonto(nr)) ib[nr] = s[nr];
      else resultat += s[nr];
    });
    var plan = (kontoplan || standardKontoplan()).map(function (k) { return { nr: k.nr, namn: k.namn }; });
    var finns = function (nr) { return plan.some(function (k) { return k.nr === nr; }); };
    if (!finns('2069')) plan.push({ nr: '2069', namn: 'Årets resultat' });
    ib['2069'] = (ib['2069'] || 0) + resultat;
    Object.keys(ib).forEach(function (nr) { if (!finns(nr)) plan.push({ nr: nr, namn: kontonamn(arkiv, nr) || ('Konto ' + nr) }); });
    var start = laggTillDagar(arkiv.slut, 1);
    return skapaAr({ start: start, slut: laggTillDagar(laggTillAr(start, 1), -1), kontoplan: plan, ingaendeBalans: ib });
  }

  // Börja om på riktigt: testdatat tas bort och det som valts behålls.
  // d = { bokforing, register, styrelse, uppdrag }. val: forening, kontoplan, regler, avgifter, uppdrag, arkivkopior (true/false)
  // och medlemmar ('behall', 'utan-betalningar' eller 'ta-bort'). filer = appens filer i OneDrive som ska flyttas undan.
  function borjaOm(d, val) {
    var b = d.bokforing, filer = [], arkiv = {};
    var vanliga = Object.keys(b.ar || {}).filter(function (id) { return !b.ar[id].grovkopia; }).sort();
    Object.keys(b.ar || {}).forEach(function (id) {
      var a = b.ar[id];
      if (a.grovkopia && val.arkivkopior) { arkiv[id] = a; return; }
      (a.underlag || []).forEach(function (u) { if (u.odId) filer.push({ odId: u.odId, namn: u.filnamn || u.namn || 'underlag' }); });
    });
    (b.dokument || []).forEach(function (x) { if (x.odId) filer.push({ odId: x.odId, namn: (x.typ === 'faktura' ? 'Faktura ' : 'Kvitto ') + (x.nummer || '') + '.pdf' }); });
    var behall = function (k) { return val.forening && Array.isArray(b[k]) ? b[k] : []; };
    var ny = {};
    // Övriga uppgifter i bokföringsfilen (inställningar för föreningen) följer med föreningens uppgifter.
    if (val.forening) Object.keys(b).forEach(function (k) { ny[k] = b[k]; });
    Object.assign(ny, {

  function valideraAr(ar) {

  function kontroller(ar) {

  // ---------- SIE 4 ----------

  // SIE-filer ska vara kodade i IBM PC 8-bitars teckentabell (CP437).

  function tolkaDatum(s) {

    else if ((m = s.match(/^(\d{2})-(\d{2})-(\d{2})$/))) s = '20' + m[1] + '-' + m[2] + '-' + m[3];
    else if ((m = s.match(/^(\d{4})\/(\d{2})\/(\d{2})$/))) s = m[1] + '-' + m[2] + '-' + m[3];

    return arGiltigtDatum(s) ? s : null;
  }

  // Tål både "1 200,50", "-1200.50", "1.200,50" och "1,200.50".
  function tolkaBankbelopp(s) {
    var t = String(s == null ? '' : s).trim().replace(/[\s  ]/g, '').replace(/(kr|sek)$/i, '');
    if (!t) return null;
    var punkt = t.lastIndexOf('.'), komma = t.lastIndexOf(',');
    if (punkt >= 0 && komma >= 0) t = komma > punkt ? t.replace(/\./g, '') : t.replace(/,/g, '');

  function delaCsv(text, sep) {
    var rader = [], rad = [], cell = '', iCitat = false;
    text = String(text).replace(/^﻿/, '');
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (iCitat) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else iCitat = false; }
        else cell += c;
      } else if (c === '"' && cell.trim() === '') { iCitat = true; cell = ''; }
      else if (c === sep) { rad.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;

      } else cell += c;

  var BANKKOLUMNER = {
    datum: ['bokforingsdag', 'bokforingsdatum', 'bokfdag', 'bokfdatum', 'bokfort', 'datum', 'transaktionsdag', 'transaktionsdatum', 'valutadag', 'date'],
    text: ['beskrivning', 'text', 'transaktion', 'transaktionstext', 'transaktionstyp', 'rubrik', 'specifikation', 'mottagare', 'avsandare', 'description'],
    referens: ['referens', 'meddelande', 'ref', 'reference'],

  function hittaKolumner(rad) {
    var nycklar = rad.map(rubrikNyckel);
    var k = {};
    Object.keys(BANKKOLUMNER).forEach(function (falt) {
      for (var i = 0; i < BANKKOLUMNER[falt].length; i++) {

  // Rad utan rubriker: datum först, de två sista talen är belopp och saldo.

  function parseBankfil(text) {

    var varningar = [];
    var rader = [];
    var k = null, start = 0;
    for (var i = 0; i < Math.min(celler.length, 15); i++) {

        var t = k.text != null ? String(c[k.text] || '').trim() : '';

  // ---------- Swish-rapporten: avsändare och meddelande för Swish-betalningarna ----------

  var SWISHKOLUMNER = {

  function swishKolumner(rad) {
    var nycklar = rad.map(rubrikNyckel), k = {};
    Object.keys(SWISHKOLUMNER).forEach(function (falt) {
      for (var i = 0; i < SWISHKOLUMNER[falt].length; i++) {
        var idx = nycklar.indexOf(SWISHKOLUMNER[falt][i]);
        if (idx >= 0) { k[falt] = idx; return; }

  // Är texten en Swish-rapport (och inte ett kontoutdrag)? Den har avsändarnummer och meddelande.
  function arSwishrapport(text) {
    var celler = delaCsv(text, gissaSeparator(text));
    for (var i = 0; i < Math.min(celler.length, 20); i++) if (swishKolumner(celler[i])) return true;
    return false;
  }

  // Ser texten ut som en Swish-rapport (avsändare och meddelande), även om alla kolumner inte känns igen?
  // Då ska den aldrig läsas in som kontoutdrag, eftersom det skulle ge dubbla Swish-rader.
  function liknarSwishrapport(text) {
    var celler = delaCsv(text, gissaSeparator(text));
    for (var i = 0; i < Math.min(celler.length, 20); i++) {
      var n = celler[i].map(rubrikNyckel);
      if (n.indexOf('meddelande') >= 0 && n.some(function (x) { return /^avsandar/.test(x); })) return true;
    }
    return false;
  }

  // Meddelandet utan sifferserier på sex siffror eller fler (personnummer, födelsedatum, kortnummer).
  function rensaMeddelande(t) { return String(t || '').replace(/\d[\d\s\-+]{4,}\d/g, ' ').replace(/\s+/g, ' ').trim(); }

  function parseSwishrapport(text) {
    var celler = delaCsv(text, gissaSeparator(text)), k = null, start = 0, rader = [], varningar = [];
    for (var i = 0; i < Math.min(celler.length, 20); i++) { k = swishKolumner(celler[i]); if (k) { start = i + 1; break; } }
    if (!k) return { rader: [], varningar: ['Hittade inte kolumnerna i Swish-rapporten.'] };
    celler.slice(start).forEach(function (c, j) {
      var datum = tolkaDatum(c[k.datum]), belopp = tolkaBankbelopp(c[k.belopp]);
      if (!datum || belopp == null) { if (c.join('').trim()) varningar.push('Rad ' + (start + j + 1) + ' kunde inte tolkas och hoppades över.'); return; }
      if (belopp <= 0) return;
      var nr = hittaMobilnummer(String(c[k.nummer] || '')) || String(c[k.nummer] || '').replace(/\D/g, '');
      rader.push({ datum: datum, nummer: nr, namn: k.namn != null ? String(c[k.namn] || '').trim() : '', meddelande: rensaMeddelande(c[k.meddelande]), belopp: belopp });
    });
    return { rader: rader, varningar: varningar };
  }

  // Lägger in Swish-raderna i medlemsregistret (där namn får finnas), utan dubbletter. Rader äldre än två år tas bort.
  function laggTillSwish(reg, rader, idag) {
    var nyckel = function (x) { return [x.datum, x.nummer, x.belopp, x.meddelande].join('|'); };
    var finns = {};
    (reg.swish || []).forEach(function (x) { finns[nyckel(x)] = true; });
    var nya = rader.filter(function (x) { return !finns[nyckel(x)]; });
    var grans = idag ? laggTillDagar(idag, -730) : '';
    return { reg: Object.assign({}, reg, { swish: (reg.swish || []).concat(nya).filter(function (x) { return x.datum >= grans; }) }), nya: nya.length };
  }

  // Tyder meddelandet på något annat än en medlemsavgift (kläder, workshop, instrument …)?
  var INTE_AVGIFT = /\b(byxor|byxa|abada|klader|kladerna|t-?shirt|tshirts?|troja|trojor|hoodie|workshop|workshopen|batizado|lager|helg|berimbau|pandeiro|atabaque|instrument|biljett|biljetter|resa|middag|fika|lan)\b/;
  function interAvgiftText(text) {
    var t = String(text || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    return INTE_AVGIFT.test(t);
  }

  // Swish-raden för en bankrad: samma avsändarnummer och belopp, högst tre dagar ifrån.
  function swishForRad(reg, bankrad) {
    var nr = hittaMobilnummer(String(bankrad.text || '') + ' ' + String(bankrad.referens || ''));
    if (!nr || bankrad.belopp <= 0) return null;
    return (reg.swish || []).filter(function (x) { return x.nummer === nr && x.belopp === bankrad.belopp && Math.abs(dagarMellan(x.datum, bankrad.datum)) <= 3; })
      .sort(function (a, b) { return Math.abs(dagarMellan(a.datum, bankrad.datum)) - Math.abs(dagarMellan(b.datum, bankrad.datum)); })[0] || null;
  }

  function kontrolleraSaldon(rader) {
    var v = [];
    for (var i = 1; i < rader.length; i++) {
      var a = rader[i - 1], b = rader[i];
      if (a.saldo == null || b.saldo == null) continue;
      if (a.saldo + b.belopp !== b.saldo) {
        v.push('Saldot stämmer inte ' + b.datum + ' (' + b.text + '): ' + formatBelopp(a.saldo) + ' + ' + formatBelopp(b.belopp) + ' ≠ ' + formatBelopp(b.saldo) + '.');
      }
    }
    return v;
  }

  function normaliseraText(t) {
    return String(t || '').toLowerCase().replace(/[0-9]+/g, ' ').replace(/[^a-zåäöéü]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function bankradId(r, n) {
    return [r.datum, r.belopp, r.saldo == null ? '' : r.saldo, normaliseraText(r.text), r.referens || ''].join('|') + (n ? '#' + n : '');
  }

  // Lägger till bankrader i året. Rader som redan finns (samma fil inläst igen) hoppas över.
  function importeraBankrader(ar, rader, opt) {
    var konto = (opt && opt.konto) || '1930';
    if (!ar.kontoplan.some(function (k) { return k.nr === konto; })) throw BokforingsFel('Bankkontot ' + konto + ' finns inte i kontoplanen.');
    var befintliga = {};
    (ar.bankrader || []).forEach(function (r) { befintliga[r.id] = true; });
    var sedda = {}, kompletterade = {};
    var nya = [], dubbletter = 0, utanfor = 0;
    rader.forEach(function (r) {
      if (r.datum < ar.start || r.datum > ar.slut) { utanfor++; return; }
      var bas = bankradId(r);
      sedda[bas] = (sedda[bas] || 0) + 1;
      var id = bankradId(r, sedda[bas] - 1);
      if (befintliga[id]) { dubbletter++; return; }
      // Samma transaktion inläst tidigare utan betalarens nummer (t.ex. före version 1.12): komplettera texten.
      var mobil = hittaMobilnummer(r.text + ' ' + (r.referens || ''));
      if (mobil) {
        var tidigare = (ar.bankrader || []).find(function (x) {
          return !kompletterade[x.id] && x.konto === konto && x.datum === r.datum && x.belopp === r.belopp && x.saldo != null && x.saldo === r.saldo &&
            !hittaMobilnummer(x.text + ' ' + (x.referens || ''));
        });
        if (tidigare) { kompletterade[tidigare.id] = { text: r.text || '', referens: r.referens || '' }; dubbletter++; return; }
      }
      nya.push({ id: id, datum: r.datum, text: r.text || '', referens: r.referens || '', belopp: r.belopp, saldo: r.saldo == null ? null : r.saldo, konto: konto, verifikation: null });
    });
    var alla = (ar.bankrader || []).map(function (r) { return kompletterade[r.id] ? Object.assign({}, r, kompletterade[r.id]) : r; }).concat(nya).map(function (r, i) { return { r: r, i: i }; });
    alla.sort(function (a, b) { return a.r.datum < b.r.datum ? -1 : a.r.datum > b.r.datum ? 1 : a.i - b.i; });
    return { ar: Object.assign({}, ar, { bankrader: alla.map(function (x) { return x.r; }) }), nya: nya.length, dubbletter: dubbletter, utanfor: utanfor, kompletterade: Object.keys(kompletterade).length };
  }

  function oppnaBankrader(ar) {
    return (ar.bankrader || []).filter(function (r) { return r.verifikation == null; });
  }

  // Jämför bankens senaste saldo med bokfört saldo samma dag.
  function bankavstamning(ar, konto) {
    konto = konto || '1930';
    var rader = (ar.bankrader || []).filter(function (r) { return r.konto === konto && r.saldo != null; });
    if (!rader.length) return null;
    var sista = rader[rader.length - 1];
    var forsta = rader[0];
    var bokfort = saldon(ar, { tom: sista.datum })[konto] || 0;
    return {
      konto: konto, datum: sista.datum, bankSaldo: sista.saldo, bokfortSaldo: bokfort, skillnad: bokfort - sista.saldo,
      // Saldot före årets första banktransaktion, om den första raden i året har saldo.
      ingaendeEnligtBank: forsta === (ar.bankrader || []).filter(function (r) { return r.konto === konto; })[0] ? forsta.saldo - forsta.belopp : null,
      ingaendeBokfort: ar.ingaendeBalans[konto] || 0,
      obokforda: oppnaBankrader(ar).filter(function (r) { return r.konto === konto && r.datum <= sista.datum; }).length
    };
  }

  // Avstämningen för alla bankkonton: skillnaden och de obokförda raderna läggs ihop. null om inget utdrag har saldo.
  function samladAvstamning(ar) {
    var lista = bankkontonIAr(ar).map(function (k) { return bankavstamning(ar, k); }).filter(Boolean);
    if (!lista.length) return null;
    var sista = lista.reduce(function (a, b) { return b.datum > a.datum ? b : a; });
    return {
      konto: lista.map(function (a) { return a.konto; }).join(', '), datum: sista.datum, konton: lista,
      bankSaldo: lista.reduce(function (s, a) { return s + a.bankSaldo; }, 0), bokfortSaldo: lista.reduce(function (s, a) { return s + a.bokfortSaldo; }, 0),
      skillnad: lista.reduce(function (s, a) { return s + Math.abs(a.skillnad); }, 0), obokforda: lista.reduce(function (s, a) { return s + a.obokforda; }, 0)
    };
  }

  // Avstämning månad för månad: bankens sista saldo i varje månad mot bokfört saldo samma dag.
  // Verifikationer som rättats och deras rättelser tar ut varandra. I avstämningen per månad räknas ingen av dem,
  // så att en rättelse som fått ett senare datum inte ger skillnad i månaderna däremellan.
  function rattadePar(ar) {
    var par = {};
    ar.verifikationer.forEach(function (v) { if (v.rattar != null) { par[v.rattar] = true; par[v.nr] = true; } });
    return par;
  }

  function bankavstamningPerManad(ar, konto) {
    konto = konto || '1930';
    var rader = (ar.bankrader || []).filter(function (r) { return r.konto === konto; });
    var par = rattadePar(ar);
    var utanPar = function (tom) {
      return ar.verifikationer.filter(function (v) { return par[v.nr] && v.datum <= tom; })
        .reduce(function (x, v) { return x + v.rader.reduce(function (y, r) { return r.konto === konto ? y + r.belopp : y; }, 0); }, 0);
    };
    var ut = [];
    var m = ar.start.slice(0, 7);
    var sista = ar.slut.slice(0, 7);
    while (m <= sista) {
      var iManad = rader.filter(function (r) { return r.datum.slice(0, 7) === m; });
      var medSaldo = iManad.filter(function (r) { return r.saldo != null; });
      var post = { manad: m, antal: iManad.length, obokforda: iManad.filter(function (r) { return r.verifikation == null; }).length };
      if (medSaldo.length) {
        var s = medSaldo[medSaldo.length - 1];
        post.datum = s.datum;
        post.bankSaldo = s.saldo;
        post.bokfortSaldo = (saldon(ar, { tom: s.datum })[konto] || 0) - utanPar(s.datum);
        post.skillnad = post.bokfortSaldo - s.saldo;
      }
      ut.push(post);
      var d = new Date(Date.UTC(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 1));
      m = d.toISOString().slice(0, 7);
    }
    return ut;
  }

  // Förvalt datum för en rättelse: samma dag som verifikationen som rättas, om den perioden inte är låst. Annars idag.
  function rattelseDatum(ar, nr, idag) {
    var v = ar.verifikationer.find(function (x) { return x.nr === nr; });
    if (!v) return idag;
    var last = ar.lastTom && v.datum <= ar.lastTom;
    var d = last ? idag : v.datum;
    return d < ar.start ? ar.start : d > ar.slut ? ar.slut : d;
  }

  // Det som inte stämmer mellan bokföringen och kontoutdraget.
  function bankavvikelser(ar, konto) {
    konto = konto || '1930';
    var rader = (ar.bankrader || []).filter(function (r) { return r.konto === konto; });
    var lankade = {}, rattade = {};
    rader.forEach(function (r) { if (r.verifikation != null) lankade[r.verifikation] = true; });
    ar.verifikationer.forEach(function (v) { if (v.rattar != null) { rattade[v.rattar] = true; rattade[v.nr] = true; } });
    var fran = rader.length ? rader[0].datum : null;
    var till = rader.length ? rader[rader.length - 1].datum : null;
    var utanBank = !rader.length ? [] : ar.verifikationer.filter(function (v) {
      if (lankade[v.nr] || rattade[v.nr] || v.datum < fran || v.datum > till) return false;
      return v.rader.reduce(function (s, r) { return r.konto === konto ? s + r.belopp : s; }, 0) !== 0;
    }).map(function (v) {
      return { nr: v.nr, datum: v.datum, text: v.text, belopp: v.rader.reduce(function (s, r) { return r.konto === konto ? s + r.belopp : s; }, 0) };
    });
    return {
      obokforda: rader.filter(function (r) { return r.verifikation == null; }),
      utanBank: utanBank,
      saldofel: kontrolleraSaldon(rader),
      period: fran ? { fran: fran, till: till } : null
    };
  }

  // ---------- Regler: banktext -> konto ----------

  function riktningFor(belopp) { return belopp < 0 ? 'ut' : 'in'; }

  function hittaRegel(regler, text, belopp) {
    var n = ' ' + normaliseraText(text) + ' ';
    var riktning = riktningFor(belopp);
    var basta = null;
    (regler || []).forEach(function (r) {
      if (r.riktning && r.riktning !== riktning) return;
      if (n.indexOf(' ' + r.monster + ' ') >= 0 && (!basta || r.monster.length > basta.monster.length)) basta = r;
    });
    return basta;
  }

  // Lär in bankens text och referens -> konto. Referensen tas med eftersom texten ofta är allmän
  // (t.ex. "Pg-bet. via internet") och mottagaren står i referensen.
  // Ord som står på många olika betalningar (t.ex. "Swish", "Bankgiro inbetalning", "Överföring via internet").
  // En regel av bara sådana ord skulle ge samma konto till alla Swish- eller bankgirobetalningar.
  var ALLMANNA_BANKORD = ['swish', 'bankgiro', 'bg', 'pg', 'plusgiro', 'inbetalning', 'inbetalningar', 'insattning', 'overforing', 'via', 'internet', 'bet', 'betalning',
    'kortkop', 'kort', 'autogiro', 'direktinsattning', 'lon', 'ovf', 'egen', 'ers', 'fran', 'till'];
  function allmanRegel(monster) {
    var ord = namnOrd(monster);
    return !ord.length || ord.every(function (w) { return ALLMANNA_BANKORD.indexOf(w) >= 0; });
  }
  function allmannaRegler(regler) { return (regler || []).filter(function (r) { return allmanRegel(r.monster); }); }

  function larRegel(regler, text, belopp, konto, referens) {
    var monster = normaliseraText(text + ' ' + (referens || ''));
    regler = (regler || []).slice();
    if (!monster || !giltigtKontonummer(konto) || allmanRegel(monster)) return regler;
    var riktning = riktningFor(belopp);
    var i = regler.findIndex(function (r) { return r.monster === monster && r.riktning === riktning; });
    if (i >= 0) regler[i] = { monster: monster, riktning: riktning, konto: konto };
    else regler.push({ monster: monster, riktning: riktning, konto: konto });
    return regler;
  }

  // Allmänna regler som gäller alla föreningar. Föreningens egna regler går före.
  var STANDARDREGLER = [
    { monster: 'pris banktjänster', riktning: 'ut', konto: '6570' },
    { monster: 'pris kontopaket', riktning: 'ut', konto: '6570' },
    { monster: 'årsavgift kort', riktning: 'ut', konto: '6570' }
  ];

  // Förslag på regler från tidigare år (arkivkopior och vanliga år): ord i verifikationstexten som nästan alltid
  // hör till samma kostnads- eller bidragskonto, t.ex. hyresvärdens namn. Ord som redan har en regel föreslås inte.
  var REGELSTOPP = ['utlägg', 'ersättning', 'betalning', 'internet', 'faktura', 'överföring', 'terminsavgift', 'medlemsavgift', 'swish', 'bankgiro', 'inbetalning', 'kvitto', 'enligt', 'avser'];
  // Skäl att avfärda ett förslag på konteringsregel. Visas som val i appen; ett eget skäl går också bra.
  var AVFARDA_SKAL = ['För allmänt ord', 'Personnamn, kontera för hand', 'Utlägg, kopplas till kvitton', 'Blandade kostnader, kontera för hand',
    'Täcks redan av en allmän regel', 'Engångshändelse'];

  // Avfärdade förslag: [{ monster, riktning, skal, av, tid }]. Samma ord och riktning ersätts.
  function avfardaForslag(lista, post) {
    var monster = normaliseraText(post && post.monster), skal = String((post && post.skal) || '').trim();
    if (!monster) throw BokforingsFel('Förslaget saknar ord.');
    if (!skal) throw BokforingsFel('Skriv varför förslaget avfärdas, så att andra bokförare förstår det senare.');
    var riktning = post.riktning === 'in' ? 'in' : 'ut';
    return (lista || []).filter(function (a) { return !(a.monster === monster && a.riktning === riktning); })
      .concat([{ monster: monster, riktning: riktning, skal: skal, av: post.av || '', tid: post.tid || '' }]);
  }

  function angraAvfardat(lista, monster, riktning) {
    return (lista || []).filter(function (a) { return !(a.monster === monster && a.riktning === riktning); });
  }

  function forslagRegler(arLista, regler, avfardade) {
    var ord = {};
    (arLista || []).forEach(function (ar) {
      (ar.verifikationer || []).forEach(function (v) {
        if (v.rattar != null) return;
        var motrader = v.rader.filter(function (r) { return !/^19/.test(r.konto); });
        var bank = v.rader.some(function (r) { return /^19/.test(r.konto); });
        if (!bank || motrader.length !== 1 || !/^(39|[4-8])/.test(motrader[0].konto)) return;
        var riktning = motrader[0].belopp > 0 ? 'ut' : 'in';
        normaliseraText(v.text).split(' ').filter(function (w, i, l) { return w.length >= 5 && REGELSTOPP.indexOf(w) < 0 && l.indexOf(w) === i; }).forEach(function (w) {
          var o = ord[w] = ord[w] || { totalt: 0, konton: {} };
          o.totalt++;
          var k = motrader[0].konto + '|' + riktning;
          o.konton[k] = (o.konton[k] || 0) + 1;
        });
      });
    });
    var finns = (regler || []).map(function (r) { return r.monster; });
    return Object.keys(ord).map(function (w) {
      var o = ord[w], bast = Object.keys(o.konton).sort(function (a, b) { return o.konton[b] - o.konton[a]; })[0];
      return { monster: w, konto: bast.split('|')[0], riktning: bast.split('|')[1], antal: o.konton[bast], totalt: o.totalt };
    }).filter(function (f) { return f.antal >= 2 && f.antal / f.totalt >= 0.8 && finns.indexOf(f.monster) < 0 &&
      !(avfardade || []).some(function (a) { return a.monster === f.monster && a.riktning === f.riktning; }); })
      .sort(function (a, b) { return b.antal - a.antal || (a.monster < b.monster ? -1 : 1); }).slice(0, 20);
  }

  // ---------- Underlag (tolkade fakturor och kvitton) ----------

  // Underlag: { id, filnamn, dokumenttyp, motpart, datum, forfallodatum, belopp (ören, positivt),
  //   riktning ('utgift' | 'intakt'), beskrivning, fakturanummer, ocr, foreslagetKonto, verifikation, arkivnamn }
  function laggTillUnderlag(ar, u) {
    if (!u || !u.id) throw BokforingsFel('Underlaget saknar id.');
    if ((ar.underlag || []).some(function (x) { return x.id === u.id; })) throw BokforingsFel('Underlaget finns redan.');
    var nytt = Object.assign({ verifikation: null }, u);
    return Object.assign({}, ar, { underlag: (ar.underlag || []).concat([nytt]) });
  }

  function andraUnderlag(ar, id, andring) {
    return Object.assign({}, ar, {
      underlag: (ar.underlag || []).map(function (u) { return u.id === id ? Object.assign({}, u, andring) : u; })
    });
  }

  // ---------- Utläggsredovisningar ----------
  // Kvitton som någon betalat själv och som föreningen ersätter. Varje kvitto får den ersättningsbara delen som belopp;
  // kvittots belopp och det som är privat sparas. ar.utlagg: [{ id, person, text, datum, poster: [underlagId] }].

  function skapaUtlagg(ar, uppgifter) {
    var person = String(uppgifter.person || '').trim();
    if (!person) throw BokforingsFel('Ange vem som har lagt ut.');
    var poster = uppgifter.poster || [];
    if (!poster.length) throw BokforingsFel('Välj minst ett kvitto.');
    var id = uppgifter.id || ('ut' + ((ar.utlagg || []).length + 1) + '-' + Date.now().toString(36));
    var andringar = utlaggAndringar(ar, poster, id, person);
    var utlagg = { id: id, person: person, text: String(uppgifter.text || '').trim(), datum: uppgifter.datum || null, poster: poster.map(function (p) { return p.underlagId; }) };
    return {
      ar: Object.assign({}, ar, {
        underlag: ar.underlag.map(function (u) { return andringar[u.id] ? Object.assign({}, u, andringar[u.id]) : u; }),
        utlagg: (ar.utlagg || []).concat([utlagg])
      }),
      utlagg: utlagg
    };
  }

  // Kontrollerar kvittona och räknar ut vad som ändras på varje underlag.
  function utlaggAndringar(ar, poster, id, person) {
    var andringar = {};
    poster.forEach(function (p) {
      var u = (ar.underlag || []).find(function (x) { return x.id === p.underlagId; });
      if (!u) throw BokforingsFel('Kvittot finns inte.');
      if (u.verifikation != null) throw BokforingsFel((u.motpart || u.filnamn) + ' är redan bokfört.');
      if (u.utlagg) throw BokforingsFel((u.motpart || u.filnamn) + ' finns redan i en utläggsredovisning.');
      if (u.riktning === 'intakt') throw BokforingsFel((u.motpart || u.filnamn) + ' är en intäkt, inte ett utlägg.');

  // Ändrar en redovisning: person, text och kvitton som inte är utbetalda. Utbetalda kvitton ligger kvar som de är.

      .concat(valda.filter(function (uid) { return x.poster.indexOf(uid) < 0; }));

    if (u.verifikation != null) throw BokforingsFel('Kvittot är redan utbetalt och bokfört i verifikation ' + u.verifikation + '.');

      underlag: ar.underlag.map(function (v) {

  // En verifikation som grundboksrad: debet- och kreditsidan, varje sida med konto och belopp (positivt).

  }

  // Verifikationerna i grundboksordning: datum, sedan nummer. omvand = senaste först.

    return omvand ? l.reverse() : l;
  }

  function utlaggStatus(ar, id) {
    var x = (ar.utlagg || []).find(function (a) { return a.id === id; });
    if (!x) return null;
    var poster = x.poster.map(function (uid) { return (ar.underlag || []).find(function (u) { return u.id === uid; }); }).filter(Boolean);
    var summa = poster.reduce(function (s, u) { return s + u.belopp; }, 0);
    var betalt = poster.filter(function (u) { return u.verifikation != null; }).reduce(function (s, u) { return s + u.belopp; }, 0);
    var verifikationer = poster.map(function (u) { return u.verifikation; }).filter(function (v, i, l) { return v != null && l.indexOf(v) === i; }).sort(function (a, b) { return a - b; });
    return { utlagg: x, poster: poster, summa: summa, kvittosumma: poster.reduce(function (s, u) { return s + (u.kvittobelopp != null ? u.kvittobelopp : u.belopp); }, 0),

  }

  function taBortUnderlag(ar, id) {
    var u = (ar.underlag || []).find(function (x) { return x.id === id; });
    if (!u) throw BokforingsFel('Underlaget finns inte.');
    if (u.verifikation != null) throw BokforingsFel('Underlaget hör till verifikation ' + u.verifikation + ' och kan inte tas bort.');
    if (u.utlagg) throw BokforingsFel('Kvittot ingår i utläggsredovisningen ' + utlaggNamn(ar, u.utlagg) + '. Ta först ur det ur redovisningen med knappen "Ta ur" under Utlägg, eller ta bort hela redovisningen. Sedan kan kvittot tas bort.');

  }

  // Ett underlag i utländsk valuta där beloppet i kronor inte är känt än (det avgörs av bankens belopp).
  function valutaUtanSek(u) { return !!(u && u.valuta && !u.belopp && u.originalbelopp > 0); }
  function arBetalbartUnderlag(u) { return u.dokumenttyp !== 'kontoutdrag' && (u.belopp > 0 || valutaUtanSek(u)); }

  // Kursen som framgår av kronbeloppet och originalbeloppet, t.ex. "354,45 EUR, kurs 11,10".
  function valutaText(u, sek) {
    if (!u || !u.valuta || !u.originalbelopp) return '';
    var kurs = sek ? Math.abs(sek) / u.originalbelopp : 0;
    return formatBelopp(u.originalbelopp) + ' ' + u.valuta + (kurs ? ', kurs ' + kurs.toFixed(kurs >= 1 ? 2 : 4).replace('.', ',') : '');
  }

  function oppnaUnderlag(ar) {
    return (ar.underlag || []).filter(function (u) { return u.verifikation == null && arBetalbartUnderlag(u); });
  }

  function bankbelopp(u) { return u.riktning === 'intakt' ? u.belopp : -u.belopp; }

    var fran = u.datum || u.forfallodatum;

    if (u.utlagg) return bankrad.datum >= laggTillDagar(fran, -7) && bankrad.datum <= laggTillDagar(fran, 366);
    var till = u.forfallodatum && u.forfallodatum > fran ? u.forfallodatum : fran;
    return bankrad.datum >= laggTillDagar(fran, -7) && bankrad.datum <= laggTillDagar(till, 60);
  }

  function matchpoang(u, bankrad) {
    var p = 0;
    var bt = (bankrad.text + ' ' + bankrad.referens).replace(/\s/g, '');
    if (u.ocr && bt.indexOf(String(u.ocr).replace(/\s/g, '')) >= 0) p += 1000;
    if (u.fakturanummer && String(u.fakturanummer).length >= 4 && bt.indexOf(String(u.fakturanummer).replace(/\s/g, '')) >= 0) p += 500;
    var mal = u.forfallodatum || u.datum;

    return p;
  }

  // Returnerar id:n för de underlag som bäst förklarar en bankrad: ett med exakt belopp,
  // annars upp till fyra som tillsammans blir exakt beloppet (t.ex. en utläggsredovisning).
  function matchaUnderlag(ar, bankrad) {
    var kandidater = oppnaUnderlag(ar).filter(function (u) {
      return inomFonster(u, bankrad) && (bankbelopp(u) < 0) === (bankrad.belopp < 0) && !osannoliktUnderlag(u, bankrad);

    var namngiven = utlaggSomMatchar(kandidater.filter(function (u) { return u.utlagg && namnIText(u.utlaggPerson, text); }), bankrad);
    if (namngiven) return namngiven;
    var exakta = kandidater.filter(function (u) { return bankbelopp(u) === bankrad.belopp; })
      .sort(function (a, b) { return matchpoang(b, bankrad) - matchpoang(a, bankrad); });

    var narmast = kandidater.filter(function (u) { return Math.abs(u.belopp) < Math.abs(bankrad.belopp); })
      .sort(function (a, b) { return matchpoang(b, bankrad) - matchpoang(a, bankrad); }).slice(0, 12);
    for (var storlek = 2; storlek <= 4; storlek++) {

    }
    // Till sist: flera kvitton i en utläggsredovisning där utbetalningen är avrundad (högst 1 kr).

  }

  // Avrundning när flera kvitton i samma utläggsredovisning betalats med ett något annat belopp (ören, 0 om ingen).
  function utlaggAvrundning(us, bankrad) {
    if (us.length < 2 || !us.every(function (u) { return u.utlagg; })) return 0;
    var diff = us.reduce(function (s, u) { return s + bankbelopp(u); }, 0) - bankrad.belopp;
    return diff && Math.abs(diff) <= AVRUNDNING_MAX ? diff : 0;
  }

  // Ett namn (t.ex. apelido) som eget ord i bankens text, utan hänsyn till skiftläge.
  function namnIText(namn, text) {
    var n = String(namn || '').trim().toLowerCase();

  }

  // Kvitton i samma utläggsredovisning som tillsammans blir exakt bankbeloppet: helst alla, annars så många som möjligt.
  // Redovisningar där personens namn står i bankens text provas först.
  // Största avrundning (ören) när en utbetalning gäller flera kvitton i en utläggsredovisning.
  var AVRUNDNING_MAX = 100;
  var AVRUNDNINGSKONTO = { nr: '3740', namn: 'Öres- och kronutjämning' };

  function utlaggSomMatchar(kandidater, bankrad, tolerans) {
    var grupper = {};
    kandidater.forEach(function (u) { if (u.utlagg) (grupper[u.utlagg] = grupper[u.utlagg] || []).push(u); });
    var ids = Object.keys(grupper).sort(function (a, b) {
      var na = namnIText(grupper[a][0].utlaggPerson, bankrad.text + ' ' + bankrad.referens) ? 1 : 0;
      var nb = namnIText(grupper[b][0].utlaggPerson, bankrad.text + ' ' + bankrad.referens) ? 1 : 0;

      var lista = grupper[ids[g]].slice(0, 16), bast = null, bastSpann = 0, bastDiff = 0;
      for (var mask = 1; mask < (1 << lista.length); mask++) {

        for (var i = 0; i < lista.length; i++) if (mask & (1 << i)) { summa += bankbelopp(lista[i]); val.push(lista[i].id); if (lista[i].datum) datum.push(lista[i].datum); }
        var diff = Math.abs(summa - bankrad.belopp);

        datum.sort();
        var spann = datum.length ? dagarMellan(datum[0], datum[datum.length - 1]) : 0;
        if (!bast || diff < bastDiff || (diff === bastDiff && (val.length > bast.length || (val.length === bast.length && spann < bastSpann)))) { bast = val; bastSpann = spann; bastDiff = diff; }
      }
      if (bast) return bast;
    }
    return null;
  }

  function sokKombination(lista, storlek, mal) {
    var val = [];
    function steg(fran, summa) {
      if (val.length === storlek) return summa === mal ? val.slice() : null;
      for (var i = fran; i < lista.length; i++) {
        val.push(lista[i]);
        var r = steg(i + 1, summa + bankbelopp(lista[i]));

        val.pop();
      }
      return null;
    }
    return steg(0, 0);
  }

  function slaIhopRader(rader) {
    var ut = [];
    rader.forEach(function (r) {
      var f = ut.find(function (x) { return x.konto === r.konto && r.konto; });
      if (f) f.belopp += r.belopp; else ut.push({ konto: r.konto, belopp: r.belopp });
    });
    return ut.filter(function (r) { return r.belopp !== 0; });

  // Ett förslag på verifikation för en bankrad, från underlag eller inlärda regler.
  function forslagForBankrad(ar, bankrad, regler, opt) {
    var ids = opt && opt.underlagIds ? opt.underlagIds : matchaUnderlag(ar, bankrad);
    var us = ids.map(function (id) { return (ar.underlag || []).find(function (u) { return u.id === id; }); }).filter(Boolean);
    var regel = hittaRegel(regler, bankrad.text + ' ' + bankrad.referens, bankrad.belopp) || hittaRegel(STANDARDREGLER, bankrad.text + ' ' + bankrad.referens, bankrad.belopp);
    var regelKonto = regel ? regel.konto : '';
    var giltigt = function (nr) { return nr && ar.kontoplan.some(function (k) { return k.nr === nr; }) ? nr : ''; };
    var rader = [{ konto: bankrad.konto, belopp: bankrad.belopp }];

    var summaUnderlag = us.reduce(function (s, u) { return s + bankbelopp(u); }, 0);

      // För utländsk valuta blir bankens belopp kronbeloppet, och kursen skrivs i texten.
      rader.push({ konto: giltigt(us[0].foreslagetKonto) || giltigt(regelKonto), belopp: -bankrad.belopp });
      text = [us[0].motpart, us[0].beskrivning].filter(Boolean).join(': ') + (us[0].valuta ? ' (' + valutaText(us[0], bankrad.belopp) + ')' : '');

      if (avrundning) rader.push({ konto: AVRUNDNINGSKONTO.nr, belopp: avrundning });
      var person = us[0].utlaggPerson && us.every(function (u) { return u.utlagg === us[0].utlagg; }) ? us[0].utlaggPerson : null;
      text = person ? 'Utlägg ' + person + ': ' + us.map(function (u) { return u.beskrivning || u.motpart; }).filter(function (t, i, l) { return t && l.indexOf(t) === i; }).join(', ')
        : us.length === 1
        ? [us[0].motpart, us[0].beskrivning].filter(Boolean).join(': ')
        : bankrad.text + ' (' + us.length + ' underlag)';
      if (avrundning) text += ' (avrundat ' + formatBelopp(Math.abs(avrundning)) + ' kr)';
      kalla = 'underlag';
    } else if (!us.length && (motrad = overforingFor(ar, bankrad))) {
      // Samma belopp med omvänt tecken på ett annat eget bankkonto: en överföring mellan kontona.
      rader.push({ konto: motrad.konto, belopp: -bankrad.belopp });
      text = 'Överföring ' + (bankrad.belopp < 0 ? 'till ' : 'från ') + motrad.konto;
      kalla = 'overforing';
      kommentar = 'Bankutdrag';

      us = [];
      rader.push({ konto: giltigt(regelKonto), belopp: -bankrad.belopp });

      if (bankrad.belopp > 0 || regelKonto === '6570') kommentar = 'Bankutdrag';

    rader = [forsta].concat(slaIhopRader(rader.slice(1)));

      bankradId: bankrad.id,
      datum: bankrad.datum,
